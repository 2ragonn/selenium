<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Abstract Server Room - Blinking LED Server Racks (4K, 15s Seamless Loop)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; width: 100%; height: 100%; }
  canvas { display: block; position: absolute; left: 0; top: 0; width: 3840px; height: 2160px; transform-origin: 0 0; }
</style>
</head>
<body>
<canvas id="c" width="3840" height="2160"></canvas>
<script>
/*
  ABSTRACT SERVER ROOM — blinking rows of high-tech servers, green & blue LEDs
  ---------------------------------------------------------------------------
  * 3840x2160, 15.000 s, perfectly seamless loop, autoplays on open.
  * The camera glides down a data-center aisle. It travels exactly NB bays in
    LOOP seconds, and every LED pattern is a function of (time - bayIndex*LOOP/NB),
    so frame(15 s) == frame(0 s) pixel for pixel.
  * Frame-exact rendering hooks for your renderer:
        window.renderAt(seconds)   -> draws that exact frame (0..15, wraps)
        window.LOOP_DURATION       -> 15
        ?t=3.5                     -> open the page frozen on one frame
        ?fps=60&manual=1           -> disable the internal clock (drive with renderAt)
*/
(() => {
'use strict';

/* ------------------------------------------------------------------ setup */
const W = 3840, H = 2160, LOOP = 15, TAU = Math.PI * 2;
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d', { alpha: false });

const F = 2700;                 // focal length in px (~71 deg horizontal FOV)
const CX = W / 2, CY = 1010;    // vanishing point
const AISLE = 1.22;             // half aisle width (m) to rack fronts
const CAMH = 1.32;              // camera height
const U = 0.05, RACK_Y0 = 0.05, RACK_UNITS = 41, RACK_Y1 = RACK_Y0 + RACK_UNITS * U;
const CEIL = 2.75;
const BAY = 0.8, NB = 10;       // rack width; bays travelled per loop (= layout period)
const SPB = LOOP / NB;          // seconds of LED-time offset between neighbouring bays
const CAM_SPEED = NB * BAY / LOOP;
const ZNEAR = 1.5, ZFAR = 36;
const BAYOFF = 1000 * NB * BAY; // keeps bay indices positive, multiple of layout period

const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const sstep = (a, b, x) => { x = clamp((x - a) / (b - a)); return x * x * (3 - 2 * x); };
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash1(n){n=Math.imul(n^(n>>>16),0x45d9f3b);n=Math.imul(n^(n>>>16),0x45d9f3b);n^=n>>>16;return(n>>>0)/4294967296;}
function h2(a,b){return hash1((Math.imul(a|0,0x27d4eb2d)+Math.imul(b|0,0x165667b1)+0x9e3779b9)|0);}
function vnoise(x,id){const i=Math.floor(x),f=x-i,a=h2(i,id),b=h2(i+1,id);return a+(b-a)*(f*f*(3-2*f));}

/* palette: green / blue / cyan-ice LEDs */
const COLS = [[40,255,140],[52,150,255],[50,232,255]];
const COLSTR = COLS.map(c => `rgb(${c[0]},${c[1]},${c[2]})`);
const FOG = [9,38,62], BODY = [5,9,15], UNIT_A = [9,15,24], UNIT_B = [12,20,31], SLOT = [15,25,39];
const mixc = (c, f, k) => { const a = 1 - k; return `rgb(${(c[0]*a+f[0]*k)|0},${(c[1]*a+f[1]*k)|0},${(c[2]*a+f[2]*k)|0})`; };
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

/* ------------------------------------------------------- glow layers/sprites */
function makeLayer(div){
  const c = document.createElement('canvas'); c.width = W / div; c.height = H / div;
  const x = c.getContext('2d'); x.globalCompositeOperation = 'lighter';
  x.setTransform(1 / div, 0, 0, 1 / div, 0, 0);       // draw in full-res coords
  return { c, x, div };
}
const L1 = makeLayer(4), L2 = makeLayer(8), L3 = makeLayer(4);
const g1 = L1.x, g2 = L2.x, g3 = L3.x;

function makeSprite(rgb, size, core){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d'), h = size / 2;
  const g = x.createRadialGradient(h, h, 0, h, h, h);
  const m = core ? 0.55 : 0.18;
  const cc = `${(rgb[0] + (255 - rgb[0]) * m) | 0},${(rgb[1] + (255 - rgb[1]) * m) | 0},${(rgb[2] + (255 - rgb[2]) * m) | 0}`;
  const r = `${rgb[0]},${rgb[1]},${rgb[2]}`;
  g.addColorStop(0,   `rgba(${cc},1)`);
  g.addColorStop(0.10,`rgba(${cc},0.78)`);
  g.addColorStop(0.24,`rgba(${r},0.36)`);
  g.addColorStop(0.46,`rgba(${r},0.11)`);
  g.addColorStop(0.72,`rgba(${r},0.03)`);
  g.addColorStop(1,   `rgba(${r},0)`);
  x.fillStyle = g; x.fillRect(0, 0, size, size);
  return c;
}
const SPR = COLS.map(c => makeSprite(c, 64, false));
const WHITE = makeSprite([255,255,255], 32, true);

/* ---------------------------------------------------------------- LED logic */
function ledLevel(mode, p1, p2, id, s){
  switch (mode) {
    case 0: return h2(Math.floor(s * 2), id) < 0.035 ? 0.3 : 1;               // steady, rare dropout
    case 1: { let ph = s / p1 + p2; ph -= Math.floor(ph);                       // periodic blink
              return sstep(0, 0.06, ph) * (1 - sstep(0.5, 0.58, ph)); }
    case 2: { const x = s / p1, i = Math.floor(x), f = x - i;                   // random activity
              const cur = h2(i, id) < p2 ? 1 : 0, prev = h2(i - 1, id) < p2 ? 1 : 0;
              return prev + (cur - prev) * sstep(0, 0.4, f); }
    case 3: { const lv = vnoise(s * 0.55, p2) * 0.65 + vnoise(s * 2.2, p2 + 11) * 0.35; // level meter
              return clamp((lv * 1.2 - p1) * 14 + 0.5); }
    case 4: { let ph = (s / 2.4 - p1) * 2; ph -= Math.floor(ph);                // chaser
              return ph < 0.2 ? 1 - ph / 0.2 : 0; }
    default: return 0.5 + 0.5 * Math.sin(TAU * (s / p1 + p2));                  // breathe
  }
}

/* ------------------------------------------------------------- rack layouts */
const racks = [];
function buildRack(v, side){
  const r = mulberry32(v * 7919 + side * 104729 + 13);
  const L = [], units = [], slots = [], disp = [], strips = [];
  const idBase = (v * 2 + side) * 8192; let lid = 0, barId = idBase + 5000;
  const add = (u, y, w, h, col, mode, p1, p2, gs) => L.push({ u, y, w, h, col, mode, p1, p2, gs: gs || 1, id: idBase + (lid++) });
  const pickCol = () => { const q = r(); return q < 0.48 ? 0 : q < 0.92 ? 1 : 2; };
  const sizes = { compute: 2, sw: 1, storage: 3, meter: 1, display: 2, blank: 1, psu: 2 };

  strips.push({ u0: 0.03, u1: 0.97, y: RACK_Y1 + 0.012, col: 1, ph: r(), per: 5 + r() * 3, base: 0.5, amp: 0.3 });
  strips.push({ u0: 0.03, u1: 0.97, y: 0.028, col: r() < 0.5 ? 2 : 1, ph: r(), per: 6, base: 0.55, amp: 0.2 });

  let pos = 0;
  while (pos < RACK_UNITS) {
    const q = r(); let type =
      q < .28 ? 'compute' : q < .46 ? 'sw' : q < .64 ? 'storage' : q < .76 ? 'meter' : q < .85 ? 'display' : q < .93 ? 'blank' : 'psu';
    let size = sizes[type]; if (size > RACK_UNITS - pos) { type = 'blank'; size = 1; }
    const y0 = RACK_Y0 + pos * U + 0.0035, y1 = RACK_Y0 + (pos + size) * U - 0.0035, yc = (y0 + y1) / 2;
    units.push({ y0, y1, alt: units.length & 1 });
    if (type === 'compute') {
      for (let i = 0; i < 8; i++) {
        const u0 = 0.10 + i * 0.078;
        slots.push({ u0, u1: u0 + 0.066, y0: y0 + 0.010, y1: y1 - 0.010 });
        add(u0 + 0.010, y1 - 0.022, 0.010, 0.007, pickCol(), 2, 0.08 + r() * 0.22, 0.22 + r() * 0.5, 1);
        if (r() < 0.5) add(u0 + 0.010, y1 - 0.036, 0.010, 0.007, 0, 0, 0, 0, 0.8);
      }
      add(0.80, yc, 0.012, 0.008, 0, 0, 0, 0, 1.1);
      add(0.86, yc + 0.014, 0.010, 0.007, 1, 1, 0.5 + r() * 1.2, r(), 0.9);
      add(0.90, yc + 0.014, 0.010, 0.007, 1, 1, 0.5 + r() * 1.2, r(), 0.9);
      add(0.90, yc - 0.016, 0.010, 0.007, 2, 5, 3 + r() * 3, r(), 0.9);
    } else if (type === 'sw') {
      slots.push({ u0: 0.09, u1: 0.89, y0: y0 + 0.008, y1: y1 - 0.008 });
      for (let row = 0; row < 2; row++) for (let c = 0; c < 20; c++)
        add(0.105 + c * 0.038, yc + (row ? -0.011 : 0.011), 0.011, 0.006, r() < 0.55 ? 0 : 1, 2, 0.10 + r() * 0.3, 0.25 + r() * 0.5, 0.55);
      add(0.93, yc, 0.012, 0.008, 1, 0, 0, 0, 1);
    } else if (type === 'storage') {
      for (let rw = 0; rw < 3; rw++) for (let c = 0; c < 12; c++) {
        const u0 = 0.09 + c * 0.068, ys = y0 + 0.008 + rw * 0.045;
        slots.push({ u0, u1: u0 + 0.056, y0: ys, y1: ys + 0.037 });
        add(u0 + 0.009, ys + 0.010, 0.010, 0.007, pickCol(), r() < 0.3 ? 1 : 2, r() < 0.3 ? 0.6 + r() * 1.6 : 0.09 + r() * 0.25, r() < 0.3 ? r() : 0.2 + r() * 0.5, 0.8);
      }
    } else if (type === 'meter') {
      slots.push({ u0: 0.09, u1: 0.91, y0: y0 + 0.008, y1: y1 - 0.008 });
      const n = 26, chase = r() < 0.4, cc = r() < 0.5 ? 0 : 1, bid = barId++;
      for (let k = 0; k < n; k++) {
        const u = 0.11 + k * 0.03;
        if (chase) add(u, yc, 0.016, 0.013, cc, 4, k / n, 0, 1);
        else add(u, yc, 0.016, 0.013, k < 15 ? 0 : k < 21 ? 2 : 1, 3, (k + 0.5) / n, bid, 1);
      }
    } else if (type === 'display') {
      disp.push({ u0: 0.13, u1: 0.87, y0: y0 + 0.012, y1: y1 - 0.012, id: idBase + 6000 + units.length, col: pickCol() });
      add(0.93, yc + 0.014, 0.010, 0.007, 0, 0, 0, 0, 0.9);
      add(0.93, yc - 0.014, 0.010, 0.007, 1, 1, 0.7 + r(), r(), 0.9);
      add(0.07, yc, 0.010, 0.007, 2, 5, 3 + r() * 2, r(), 0.9);
    } else if (type === 'blank') {
      strips.push({ u0: 0.08, u1: 0.92, y: yc, col: r() < 0.5 ? 2 : 0, ph: r(), per: 3 + r() * 4, base: 0.35, amp: 0.3 });
    } else { // psu
      slots.push({ u0: 0.10, u1: 0.45, y0: y0 + 0.010, y1: y1 - 0.010 });
      slots.push({ u0: 0.52, u1: 0.87, y0: y0 + 0.010, y1: y1 - 0.010 });
      add(0.92, yc + 0.016, 0.012, 0.008, 0, 0, 0, 0, 1.1);
      add(0.92, yc - 0.016, 0.012, 0.008, 0, 0, 0, 0, 1.1);
      add(0.48, yc, 0.010, 0.007, 1, 1, 1.4 + r(), r(), 0.9);
    }
    pos += size;
  }
  L.sort((a, b) => a.col - b.col);
  const n = L.length, R = {
    n, units, slots, disp, strips,
    u: new Float32Array(n), y: new Float32Array(n), w: new Float32Array(n), h: new Float32Array(n), gs: new Float32Array(n),
    col: new Uint8Array(n), mode: new Uint8Array(n), p1: new Float32Array(n), p2: new Float32Array(n), id: new Int32Array(n),
    grp: [0, 0, 0, n]
  };
  L.forEach((o, i) => { R.u[i]=o.u; R.y[i]=o.y; R.w[i]=o.w; R.h[i]=o.h; R.gs[i]=o.gs; R.col[i]=o.col; R.mode[i]=o.mode; R.p1[i]=o.p1; R.p2[i]=o.p2; R.id[i]=o.id; });
  R.grp[1] = L.filter(o => o.col === 0).length; R.grp[2] = R.grp[1] + L.filter(o => o.col === 1).length;
  return R;
}
for (let v = 0; v < NB; v++) for (let s = 0; s < 2; s++) racks.push(buildRack(v, s));

/* --------------------------------------------------------------- camera/proj */
let gCX = CX, gCY = CY, gCamX = 0, gCamY = CAMH;
let swPos = 0, swCol = 0;

function sweepAt(Z){ const d = Z - swPos; return d < 0 ? Math.exp(d / 2.6) : Math.exp(-d * d / 0.35); }

function qp(c, z0, Xr, u0, u1, y0, y1, uMin){
  if (u0 < uMin) u0 = uMin; if (u1 <= u0) return;
  const sA = F / (z0 + u0 * BAY), sB = F / (z0 + u1 * BAY);
  const xA = gCX + Xr * sA, xB = gCX + Xr * sB;
  c.moveTo(xA, gCY - (y0 - gCamY) * sA); c.lineTo(xB, gCY - (y0 - gCamY) * sB);
  c.lineTo(xB, gCY - (y1 - gCamY) * sB); c.lineTo(xA, gCY - (y1 - gCamY) * sA); c.closePath();
}
function glow(c, spr, x, y, rx, ry, a){ c.globalAlpha = a; c.drawImage(spr, x - rx, y - ry, rx * 2, ry * 2); }

/* ------------------------------------------------------------------- rack */
function drawRack(b, side, z0, t){
  const R = racks[(b % NB) * 2 + (side > 0 ? 1 : 0)];
  const Xr = side * AISLE - gCamX;
  const uMin = clamp((ZNEAR - z0) / BAY); if (uMin > 0.999) return;
  const zm = Math.max(z0, ZNEAR) + BAY * 0.5 * (1 - uMin);
  const fogT = sstep(4, ZFAR, zm), att = Math.exp(-zm * 0.042) * (1 - sstep(ZFAR - 9, ZFAR, zm));
  const s = t - SPB * b;
  const sw = sweepAt(zm), swc = COLS[swCol];

  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  // body
  ctx.fillStyle = mixc(BODY, FOG, fogT * 0.9);
  ctx.beginPath(); qp(ctx, z0, Xr, 0, 1, 0.02, RACK_Y1 + 0.03, uMin); ctx.fill();
  // unit faces
  ctx.fillStyle = mixc(UNIT_A, FOG, fogT * 0.85);
  ctx.beginPath(); for (const u of R.units) if (!u.alt) qp(ctx, z0, Xr, 0.02, 0.98, u.y0, u.y1, uMin); ctx.fill();
  ctx.fillStyle = mixc(UNIT_B, FOG, fogT * 0.85);
  ctx.beginPath(); for (const u of R.units) if (u.alt) qp(ctx, z0, Xr, 0.02, 0.98, u.y0, u.y1, uMin); ctx.fill();
  if (zm < 22) {
    ctx.fillStyle = mixc(SLOT, FOG, fogT * 0.85);
    ctx.beginPath(); for (const o of R.slots) qp(ctx, z0, Xr, o.u0, o.u1, o.y0, o.y1, uMin); ctx.fill();
  }
  // edge highlights + rack ears
  if (zm < 26) {
    const sa = F / (z0 + Math.max(0.02, uMin) * BAY), sb = F / (z0 + 0.98 * BAY);
    const sa2 = F / (z0 + 0.035 * BAY), sb2 = F / (z0 + 0.965 * BAY);
    ctx.lineWidth = Math.max(1, 3.2 / zm);
    ctx.strokeStyle = rgba([120,190,255], 0.10 * (1 - fogT)); ctx.beginPath();
    for (const u of R.units) {
      ctx.moveTo(gCX + Xr * sa, gCY - (u.y1 - gCamY) * sa); ctx.lineTo(gCX + Xr * sb, gCY - (u.y1 - gCamY) * sb);
    }
    ctx.stroke();
    ctx.strokeStyle = rgba([150,190,220], 0.11 * (1 - fogT)); ctx.beginPath();
    for (const u of R.units) {
      const a = gCX + Xr * sa2, c2 = gCX + Xr * sb2;
      ctx.moveTo(a, gCY - (u.y0 + 0.005 - gCamY) * sa2); ctx.lineTo(a, gCY - (u.y1 - 0.005 - gCamY) * sa2);
      ctx.moveTo(c2, gCY - (u.y0 + 0.005 - gCamY) * sb2); ctx.lineTo(c2, gCY - (u.y1 - 0.005 - gCamY) * sb2);
    }
    ctx.stroke();
  }
  // sweep wash across the whole face
  ctx.globalCompositeOperation = 'lighter';
  if (sw > 0.02) {
    ctx.fillStyle = rgba(swc, Math.min(0.07, sw * 0.07 * (1 - fogT * 0.5)));
    ctx.beginPath(); qp(ctx, z0, Xr, 0, 1, 0.02, RACK_Y1 + 0.03, uMin); ctx.fill();
  }

  // seam light strip at the bay boundary (+ floor reflection)
  if (z0 > ZNEAR) {
    const sc = F / z0, px = gCX + Xr * sc;
    const ya = gCY - (0.03 - gCamY) * sc, yb = gCY - (RACK_Y1 + 0.03 - gCamY) * sc;
    const a = (0.30 + sw * 0.7) * att * (0.85 + 0.15 * Math.sin(TAU * (t / LOOP * 2) + b * 0.5 * 0));
    const sc2 = swCol === 0 ? COLS[2] : COLS[2];
    const col = sw > 0.3 ? swc : sc2;
    const lw = Math.max(1.3, 0.010 * F * Math.abs(Xr) / (z0 * z0));
    ctx.strokeStyle = rgba(col, Math.min(1, a)); ctx.lineWidth = lw;
    ctx.beginPath(); ctx.moveTo(px, ya); ctx.lineTo(px, yb); ctx.stroke();
    g1.strokeStyle = rgba(col, Math.min(1, a * 0.34)); g1.lineWidth = lw * 3 + 8;
    g1.beginPath(); g1.moveTo(px, ya); g1.lineTo(px, yb); g1.stroke();
    const yra = gCY + (0.03 + gCamY) * sc, yrb = gCY + (RACK_Y1 * 0.55 + gCamY) * sc;
    g1.strokeStyle = rgba(col, Math.min(1, a * (0.10 + 0.22 * sstep(3, 16, z0)))); g1.lineWidth = lw * 3 + 10;
    g1.beginPath(); g1.moveTo(px, yra); g1.lineTo(px, yrb); g1.stroke();
  }

  // light strips (blank panels, rack cap, floor kick)
  for (const st of R.strips) {
    if (zm > 30) break;
    const a = clamp(st.base + st.amp * Math.sin(TAU * (s / st.per + st.ph)) + sw * 0.3) * att;
    const uA = Math.max(st.u0, uMin); if (uA >= st.u1) continue;
    const sA = F / (z0 + uA * BAY), sB = F / (z0 + st.u1 * BAY);
    const xA = gCX + Xr * sA, xB = gCX + Xr * sB;
    const yA = gCY - (st.y - gCamY) * sA, yB = gCY - (st.y - gCamY) * sB;
    const col = COLS[st.col], lw = Math.max(1.2, 0.006 * sA);
    ctx.strokeStyle = rgba(col, a * 0.9); ctx.lineWidth = lw;
    ctx.beginPath(); ctx.moveTo(xA, yA); ctx.lineTo(xB, yB); ctx.stroke();
    g1.strokeStyle = rgba(col, a * 0.30); g1.lineWidth = lw * 3.5 + 6;
    g1.beginPath(); g1.moveTo(xA, yA); g1.lineTo(xB, yB); g1.stroke();
    const yrA = gCY + (st.y + gCamY) * sA, yrB = gCY + (st.y + gCamY) * sB;
    g1.strokeStyle = rgba(col, a * 0.14 * (0.4 + sstep(3, 16, zm))); g1.lineWidth = lw * 3.5 + 8;
    g1.beginPath(); g1.moveTo(xA, yrA); g1.lineTo(xB, yrB); g1.stroke();
  }

  // mini displays: live waveforms
  if (zm < 16) for (const d of R.disp) {
    const col = COLS[d.col];
    ctx.fillStyle = rgba([20,90,150], 0.30 * (1 - fogT)); ctx.beginPath(); qp(ctx, z0, Xr, d.u0, d.u1, d.y0, d.y1, uMin); ctx.fill();
    const yc = (d.y0 + d.y1) / 2, hh = (d.y1 - d.y0) * 0.42, N = 30, p = new Path2D(); let first = true;
    for (let i = 0; i <= N; i++) {
      const u = d.u0 + 0.02 + (d.u1 - d.u0 - 0.04) * i / N; if (u < uMin) continue;
      const sc = F / (z0 + u * BAY);
      const yy = yc + hh * ((vnoise(s * 1.3 + i * 0.30, d.id) - 0.5) * 1.5 + (vnoise(s * 4.1 + i * 0.9, d.id + 5) - 0.5) * 0.6);
      const px = gCX + Xr * sc, py = gCY - (yy - gCamY) * sc;
      if (first) { p.moveTo(px, py); first = false; } else p.lineTo(px, py);
    }
    const lw = Math.max(1.3, 0.0035 * F / zm);
    ctx.strokeStyle = rgba(col, 0.95 * att * 1.5 > 1 ? 1 : 0.95 * att * 1.5); ctx.lineWidth = lw; ctx.stroke(p);
    g1.strokeStyle = rgba(col, 0.45 * att * 1.5); g1.lineWidth = lw * 4 + 6; g1.stroke(p);
  }

  // LEDs
  const foreshort = F * Math.abs(Xr);
  for (let g = 0; g < 3; g++) {
    const gc = COLS[g], spr = SPR[g];
    ctx.fillStyle = COLSTR[g];
    for (let i = R.grp[g]; i < R.grp[g + 1]; i++) {
      const Z = z0 + R.u[i] * BAY; if (Z < ZNEAR) continue;
      const sc = F / Z, px = gCX + Xr * sc, py = gCY - (R.y[i] - gCamY) * sc;
      if (px < -80 || px > W + 80 || py < -80 || py > H + 80) continue;
      let lv = ledLevel(R.mode[i], R.p1[i], R.p2[i], R.id[i], s);
      const swv = sw > 0.03 ? sw : 0; if (swv) lv = Math.max(lv, swv * 0.55);
      const hpx = R.h[i] * sc, wpx = R.w[i] * foreshort / (Z * Z);
      const w = Math.max(wpx, 1.4), h = Math.max(hpx, 1.4);
      const fa = 1 - 0.55 * fogT;
      ctx.globalAlpha = (0.10 + 0.90 * lv) * fa;
      ctx.fillRect(px - w / 2, py - h / 2, w, h);
      if (lv > 0.5 && hpx > 2.6) {
        const cw = Math.max(w * 1.6, 3), ch = Math.max(h * 1.6, 3);
        ctx.globalAlpha = (lv - 0.5) * 1.5 * fa;
        ctx.drawImage(WHITE, px - cw, py - ch, cw * 2, ch * 2);
      }
      if (lv > 0.05) {
        const gs = R.gs[i], dens = Z > 4.5 ? Math.pow(4.5 / Z, 1.5) : 1, rg = (3.5 + hpx * 3.2) * gs, a1 = lv * att * dens * (0.6 + swv * 0.22);
        glow(g1, spr, px, py, rg, rg, a1);
        if (lv > 0.45 && Z < 18) glow(g2, spr, px, py, rg * 3.4 + 6, rg * 3.4 + 6, a1 * 0.30 * gs);
        const pyr = gCY + (R.y[i] + gCamY) * sc;
        if (pyr < H + 120) glow(g1, spr, px, pyr, rg * 0.85, rg * 2.6, lv * att * dens * (0.14 + 0.36 * sstep(3, 12, Z)) * gs);
        if (lv > 0.9 && Z < 15 && g !== 0 && (i & 3) === 0 && gs > 0.7) glow(g3, spr, px, py, 190 * gs + 60 / Z * 10, rg * 0.30, a1 * 0.22);
      }
    }
  }
  ctx.globalAlpha = 1;
}

/* --------------------------------------------------- floor / ceiling / tray */
const DASHES = [
  // [X, y, halfwidth, period, duty, relative speed (period*speed*15 integer), colour, phaseOffset]
  { X: -0.62, y: 0.004, hw: 0.014, P: 3,   duty: 0.55, vr: 4, col: 0, off: 0.0 },
  { X:  0.62, y: 0.004, hw: 0.014, P: 3,   duty: 0.55, vr: 4, col: 1, off: 1.5 },
  { X: -0.50, y: CEIL,  hw: 0.014, P: 3,   duty: 0.55, vr: 4, col: 1, off: 0.7 },
  { X:  0.50, y: CEIL,  hw: 0.014, P: 3,   duty: 0.55, vr: 4, col: 0, off: 2.2 },
  { X: -1.03, y: 2.285, hw: 0.007, P: 1.5, duty: 0.6, vr: 6, col: 0, off: 0.2 },
  { X: -1.13, y: 2.285, hw: 0.007, P: 1.5, duty: 0.6, vr: 3, col: 1, off: 0.9 },
  { X: -1.23, y: 2.285, hw: 0.007, P: 1.5, duty: 0.6, vr: 4.5,col: 2, off: 0.4 },
  { X:  1.03, y: 2.285, hw: 0.007, P: 1.5, duty: 0.6, vr: 3, col: 1, off: 1.1 },
  { X:  1.13, y: 2.285, hw: 0.007, P: 1.5, duty: 0.6, vr: 6, col: 0, off: 0.5 },
  { X:  1.23, y: 2.285, hw: 0.007, P: 1.5, duty: 0.6, vr: 4.5,col: 2, off: 1.3 },
];
function stripPath(c, X, y, hw, za, zb){
  if (za < ZNEAR) za = ZNEAR; if (zb <= za) return false;
  const sa = F / za, sb = F / zb, yA = gCY - (y - gCamY) * sa, yB = gCY - (y - gCamY) * sb;
  c.moveTo(gCX + (X - hw - gCamX) * sa, yA); c.lineTo(gCX + (X + hw - gCamX) * sa, yA);
  c.lineTo(gCX + (X + hw - gCamX) * sb, yB); c.lineTo(gCX + (X - hw - gCamX) * sb, yB); c.closePath(); return true;
}

function drawEnvironment(t, zc){
  const ang = TAU * t / LOOP, breathe = 0.5 + 0.5 * Math.sin(TAU * t / 7.5);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  // base
  let g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#01030a'); g.addColorStop(0.42, '#030a15'); g.addColorStop(0.5, '#04101d'); g.addColorStop(1, '#010306');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // far-end atmosphere (aisle glow)
  ctx.globalCompositeOperation = 'lighter';
  ctx.save(); ctx.translate(gCX, gCY); ctx.scale(1.9, 0.85);
  g = ctx.createRadialGradient(0, 0, 0, 0, 0, 760);
  g.addColorStop(0, rgba([70,190,255], 0.55 + 0.10 * breathe)); g.addColorStop(0.18, rgba([30,130,200], 0.30));
  g.addColorStop(0.5, rgba([12,60,110], 0.12)); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(-1600, -1100, 3200, 2200); ctx.restore();
  // glossy floor sheen
  g = ctx.createLinearGradient(0, gCY, 0, H);
  g.addColorStop(0, 'rgba(18,80,120,0.30)'); g.addColorStop(0.35, 'rgba(6,28,48,0.20)'); g.addColorStop(1, 'rgba(2,10,20,0)');
  ctx.fillStyle = g; ctx.fillRect(0, gCY, W, H - gCY);

  // floor tile grid
  ctx.lineCap = 'butt';
  for (let i = -3; i <= 3; i++) {
    const X = i * 0.4; if (Math.abs(X) > AISLE) continue;
    const xa = gCX + (X - gCamX) * F / ZFAR, ya = gCY + gCamY * F / ZFAR, xb = gCX + (X - gCamX) * F / ZNEAR, yb = gCY + gCamY * F / ZNEAR;
    g = ctx.createLinearGradient(xa, ya, xb, yb);
    g.addColorStop(0, 'rgba(60,170,255,0)'); g.addColorStop(0.3, 'rgba(60,170,255,0.10)'); g.addColorStop(1, 'rgba(60,170,255,0.20)');
    ctx.strokeStyle = g; ctx.lineWidth = i === 0 ? 3 : 2; ctx.beginPath(); ctx.moveTo(xa, ya); ctx.lineTo(xb, yb); ctx.stroke();
  }
  const k0 = Math.floor((zc + ZNEAR) / BAY), k1 = Math.ceil((zc + ZFAR) / BAY);
  for (let k = k1; k >= k0; k--) {
    const Z = k * BAY - zc; if (Z < ZNEAR || Z > ZFAR) continue;
    const sc = F / Z, py = gCY + gCamY * sc, sw = sweepAt(Z);
    const a = (0.11 * Math.exp(-Z * 0.05) + sw * 0.32) * (1 - sstep(ZFAR - 9, ZFAR, Z));
    ctx.strokeStyle = rgba(sw > 0.25 ? COLS[swCol] : [70,170,255], Math.min(1, a)); ctx.lineWidth = Math.max(1, 1.5 * 6 / Z * 0.5 + 0.5);
    ctx.beginPath(); ctx.moveTo(gCX + (-AISLE - gCamX) * sc, py); ctx.lineTo(gCX + (AISLE - gCamX) * sc, py); ctx.stroke();
    if (sw > 0.1) { g1.strokeStyle = rgba(COLS[swCol], sw * 0.22 * Math.exp(-Z * 0.03)); g1.lineWidth = 12; g1.beginPath();
      g1.moveTo(gCX + (-AISLE - gCamX) * sc, py); g1.lineTo(gCX + (AISLE - gCamX) * sc, py); g1.stroke(); }
  }

  // ceiling ribs + light strips
  for (let k = k1; k >= k0; k--) {
    const Z = k * BAY - zc; if (Z < ZNEAR || Z > ZFAR) continue;
    if (k % 2) continue;
    const sc = F / Z, py = gCY - (CEIL - gCamY) * sc, sw = sweepAt(Z);
    const a = (0.13 * Math.exp(-Z * 0.05) + sw * 0.3) * (1 - sstep(ZFAR - 9, ZFAR, Z));
    ctx.strokeStyle = rgba(sw > 0.2 ? COLS[swCol] : [80,170,255], Math.min(1, a)); ctx.lineWidth = Math.max(1, 6 / Z);
    ctx.beginPath(); ctx.moveTo(gCX + (-AISLE - gCamX) * sc, py); ctx.lineTo(gCX + (AISLE - gCamX) * sc, py); ctx.stroke();
  }
  for (const X of [-0.5, 0.5]) {
    const xa = gCX + (X - gCamX) * F / ZFAR, ya = gCY - (CEIL - gCamY) * F / ZFAR, xb = gCX + (X - gCamX) * F / ZNEAR, yb = gCY - (CEIL - gCamY) * F / ZNEAR;
    g = ctx.createLinearGradient(xa, ya, xb, yb); g.addColorStop(0, 'rgba(90,200,255,0)'); g.addColorStop(0.4, 'rgba(90,200,255,0.30)'); g.addColorStop(1, 'rgba(160,230,255,0.75)');
    ctx.strokeStyle = g; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(xa, ya); ctx.lineTo(xb, yb); ctx.stroke();
    g1.strokeStyle = g; g1.lineWidth = 26; g1.globalAlpha = 0.35; g1.beginPath(); g1.moveTo(xa, ya); g1.lineTo(xb, yb); g1.stroke(); g1.globalAlpha = 1;
  }
  // overhead cable trays
  for (const sd of [-1, 1]) {
    const Xi = sd * 0.95, Xo = sd * 1.30, ya = 2.28;
    const xai = gCX + (Xi - gCamX) * F / ZFAR, xao = gCX + (Xo - gCamX) * F / ZFAR, yaf = gCY - (ya - gCamY) * F / ZFAR;
    const xbi = gCX + (Xi - gCamX) * F / ZNEAR, xbo = gCX + (Xo - gCamX) * F / ZNEAR, ybn = gCY - (ya - gCamY) * F / ZNEAR;
    g = ctx.createLinearGradient(0, yaf, 0, ybn);
    g.addColorStop(0, 'rgba(14,44,70,0.85)'); g.addColorStop(1, 'rgba(6,12,20,0.95)');
    ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(xai, yaf); ctx.lineTo(xao, yaf); ctx.lineTo(xbo, ybn); ctx.lineTo(xbi, ybn); ctx.closePath(); ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
  }

  // travelling data packets (comet trails) on floor guides, ceiling strips, cable trays
  for (const d of DASHES) {
    const col = COLS[d.col], ph = ((d.vr * t + d.off) % d.P + d.P) % d.P, len = d.P * d.duty, SEG = 5;
    for (let z = ph - d.P; z < ZFAR; z += d.P) {
      if (z + len < ZNEAR) continue;
      for (let q = 0; q < SEG; q++) {
        const za = z + len * q / SEG, zb = z + len * (q + 1) / SEG; if (zb < ZNEAR) continue;
        const zm = (Math.max(za, ZNEAR) + zb) / 2, sw = sweepAt(zm), ramp = Math.pow((q + 1) / SEG, 2.2);
        const a = Math.min(1, (0.9 + sw * 0.4) * ramp * Math.exp(-zm * 0.04) * (1 - sstep(ZFAR - 9, ZFAR, zm)));
        ctx.fillStyle = rgba(col, a); ctx.beginPath();
        if (!stripPath(ctx, d.X, d.y, d.hw, za, zb)) continue; ctx.fill();
        g1.fillStyle = rgba(col, a * 0.30); g1.beginPath(); stripPath(g1, d.X, d.y, d.hw * 4, za, zb); g1.fill();
        if (d.y < 0.1) { g1.fillStyle = rgba(col, a * 0.08); g1.beginPath(); stripPath(g1, d.X, d.y, d.hw * 6, za, zb); g1.fill(); }
      }
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ---------------------------------------------------------------- particles */
const PART = []; { const r = mulberry32(4242);
  for (let i = 0; i < 90; i++) PART.push({ x: (r() * 2 - 1) * (AISLE - 0.12), y: 0.15 + r() * 2.5, z: r() * 8, ph: r(), m: 1 + Math.floor(r() * 2), rad: 0.006 + r() * r() * 0.03, c: r() < 0.5 ? 0 : r() < 0.8 ? 1 : 2 }); }
const BOKEH = []; { const r = mulberry32(99);
  for (let i = 0; i < 16; i++) BOKEH.push({ x: r() * W, y: r() * H, rad: 70 + r() * 150, ph: r(), c: r() < 0.5 ? 0 : 1, a: 0.035 + r() * 0.05 }); }

function drawParticles(t, zc){
  ctx.globalCompositeOperation = 'lighter';
  for (const p of PART) for (let k = 0; k < 5; k++) {
    let Z = ((p.z + 8 * k - zc) % 40 + 40) % 40; if (Z < 1.7) continue;
    const a = TAU * t / LOOP * p.m + p.ph * TAU;
    const X = p.x + 0.07 * Math.sin(a), Y = p.y + 0.06 * Math.sin(a * 1.0 + 1.7);
    const sc = F / Z, px = gCX + (X - gCamX) * sc, py = gCY - (Y - gCamY) * sc;
    if (px < -50 || px > W + 50 || py < -50 || py > H + 50) continue;
    const tw = 0.55 + 0.45 * Math.sin(TAU * (t / 7.5 * p.m + p.ph));
    const al = tw * (0.5 * sstep(1.7, 3, Z)) * (1 - sstep(ZFAR - 14, ZFAR, Z)) * Math.exp(-Z * 0.03) * (Z < 5 ? 0.6 : 1);
    const r = Math.max(1.2, p.rad * sc);
    glow(ctx, SPR[p.c], px, py, r * 2.2, r * 2.2, al);
  }
  ctx.globalAlpha = 1;
}
function drawBokeh(t){
  for (const b of BOKEH) {
    const a = TAU * t / LOOP + b.ph * TAU;
    const x = b.x + 90 * Math.sin(a), y = b.y + 60 * Math.sin(a * 2 + 1);
    const al = b.a * (0.6 + 0.4 * Math.sin(TAU * t / 7.5 + b.ph * 9));
    glow(ctx, SPR[b.c], x, y, b.rad, b.rad, al);
  }
  ctx.globalAlpha = 1;
}

/* ---------------------------------------------------------- post-processing */
const grainC = document.createElement('canvas'); grainC.width = grainC.height = 512;
{ const x = grainC.getContext('2d'), d = x.createImageData(512, 512), r = mulberry32(7);
  for (let i = 0; i < d.data.length; i += 4) { const v = 96 + r() * 64 | 0; d.data[i] = d.data[i+1] = d.data[i+2] = v; d.data[i+3] = 255; }
  x.putImageData(d, 0, 0); }
const grainPat = ctx.createPattern(grainC, 'repeat');
let vignette = null;
function post(t){
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 1;    ctx.drawImage(L1.c, 0, 0, W, H);
  ctx.globalAlpha = 0.85; ctx.drawImage(L2.c, 0, 0, W, H);
  ctx.globalAlpha = 0.75; ctx.drawImage(L3.c, 0, 0, W, H);
  ctx.globalAlpha = 1;
  drawBokeh(t);
  // vignette
  ctx.globalCompositeOperation = 'source-over';
  if (!vignette) {
    vignette = ctx.createRadialGradient(W / 2, H * 0.48, H * 0.30, W / 2, H * 0.5, W * 0.62);
    vignette.addColorStop(0, 'rgba(0,4,10,0)'); vignette.addColorStop(0.6, 'rgba(0,3,8,0.28)'); vignette.addColorStop(1, 'rgba(0,2,5,0.82)');
  }
  ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);
  // grade: cool teal lift in the shadows + subtle film grain (also kills 8-bit banding)
  ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgba(2,9,16,1)'; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.06;
  const f = Math.floor(t * 30 + 1e-6) % 25, ox = (f * 97) % 512, oy = (f * 61) % 512;
  ctx.save(); ctx.translate(-ox, -oy); ctx.fillStyle = grainPat; ctx.fillRect(ox, oy, W, H); ctx.restore();
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

/* -------------------------------------------------------------------- frame */
function render(t){
  const ang = TAU * t / LOOP;
  gCamX = Math.sin(ang) * 0.11;
  gCamY = CAMH + Math.sin(ang * 2 + 0.7) * 0.02;
  gCX = CX + Math.sin(ang + 0.9) * 38;
  gCY = CY + Math.cos(ang * 2) * 8;
  const zc = BAYOFF + t * CAM_SPEED;
  const k = Math.floor(t / 7.5); swCol = k & 1; swPos = -3 + ((t % 7.5) / 7.5) * (ZFAR + 22);

  for (const L of [L1, L2, L3]) { L.x.globalAlpha = 1; L.x.clearRect(0, 0, W, H); }

  drawEnvironment(t, zc);

  const bFar = Math.floor((zc + ZFAR) / BAY), bNear = Math.floor((zc + ZNEAR) / BAY) - 1;
  for (let b = bFar; b >= bNear; b--) {
    const z0 = b * BAY - zc; if (z0 + BAY <= ZNEAR) continue;
    drawRack(b, -1, z0, t); drawRack(b, 1, z0, t);
  }
  ctx.globalCompositeOperation = 'lighter';
  // atmospheric haze at the end of the aisle, over the far racks
  ctx.save(); ctx.translate(gCX, gCY); ctx.scale(1.5, 0.9);
  const hg = ctx.createRadialGradient(0, 0, 0, 0, 0, 520);
  hg.addColorStop(0, rgba([60,170,240], 0.42)); hg.addColorStop(0.35, rgba([20,100,170], 0.14)); hg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = hg; ctx.fillRect(-900, -600, 1800, 1200); ctx.restore();

  drawParticles(t, zc);
  post(t);
}

/* ------------------------------------------------------------ clock / API */
const qs = new URLSearchParams(location.search);
window.LOOP_DURATION = LOOP;
window.renderAt = (t) => render(((t % LOOP) + LOOP) % LOOP);

function fit(){
  const s = Math.min(1, innerWidth / W, innerHeight / H);
  cvs.style.transform = s < 1 ? `scale(${s})` : 'none';
}
addEventListener('resize', fit); fit();

if (qs.has('t')) {
  window.renderAt(parseFloat(qs.get('t')) || 0);
} else if (!qs.has('manual')) {
  let t0 = null;
  const tick = (now) => {
    if (t0 === null) t0 = now;
    render(((now - t0) / 1000) % LOOP);
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
} else {
  window.renderAt(0);
}
})();
</script>
</body>
