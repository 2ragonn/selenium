/* metin */
function tx(s,x,y,size,c=white,o={}){
  g.font=`${o.w||700} ${size}px ${o.mono?MONO:UI}`;
  g.textAlign=o.al||'center';g.textBaseline=o.bl||'middle';
  g.letterSpacing=(o.ls||0)+'px';
  const ga=g.globalAlpha;if(o.a!==undefined)g.globalAlpha=ga*clamp(o.a);
  g.fillStyle=Array.isArray(c)?cs(c,1):c;
  if(o.stroke){g.lineWidth=o.sw||4;g.strokeStyle=o.stroke;g.lineJoin='round';g.strokeText(s,x,y);}
  g.fillText(s,x,y);g.globalAlpha=ga;g.letterSpacing='0px';
}
function mw(s,size,o={}){g.font=`${o.w||700} ${size}px ${o.mono?MONO:UI}`;g.letterSpacing=(o.ls||0)+'px';const w=g.measureText(s).width;g.letterSpacing='0px';return w;}
/* maskeli yükselen metin (kinetik tipografi) */
function reveal(s,x,y,size,c,p,o={}){

  const w=mw(s,size,o)+60,al=o.al||'center';

  g.save();g.beginPath();g.rect(x0,y-size*.75,w,size*1.5);g.clip();
  const e=eo5(clamp(p));
  tx(s,x,y+(1-e)*size*1.0,size,c,{...o,a:(o.a===undefined?1:o.a)*clamp(p*3)});
  g.restore();
}

function words(list,x,y,size,c,t0,step,o={}){
  const ws=list.map(w=>mw(w+' ',size,o)),tot=ws.reduce((a,b)=>a+b,0);
  let cx=x-tot/2;
  list.forEach((w,i)=>{

    if(p>0){g.save();const e=eob(p);tx(w,cx+ws[i]/2-mw(' ',size,o)/2,y+(1-eo(p))*size*.4,size,Array.isArray(c[0])||typeof c[0]==='object'?(c[i]||c[0]):c,{...o,a:clamp(p*2)});g.restore();}

  const R=.8,HM=.95,hz=d=>{const q=1-Math.min(d/R,1);return HM*Math.sqrt(1-q*q);};
  const r=rng(77),NC=15000;
  const X=[],Y=[],Z=[],BR=[],GR=[];
  let guard=0;
  while(X.length<NC&&guard++<200000){
    const x=-1.25+r()*2.5,y=-.75+r()*1.7;

    const gx=(hz(dist(x+e,y))-hz(dist(x-e,y)))/(2*e),gy=(hz(dist(x,y+e))-hz(dist(x,y-e)))/(2*e);

  const cY=Math.cos(ry),sY=Math.sin(ry),cX=Math.cos(rx),sX=Math.sin(rx),cZ=Math.cos(rz),sZ=Math.sin(rz);
  const {X,Y,Z,BR,GR,E}=BRN;
  PBC.fill(0);
  for(let i=0;i<BN;i++){
    const x=X[i],y=Y[i],z=Z[i];
    const x1=x*cY+z*sY,z1=-x*sY+z*cY;
    const y2=y*cX-z1*sX,z2=y*sX+z1*cX;
    const x3=x1*cZ-y2*sZ,y3=x1*sZ+y2*cZ;

    BPX[i]=px;BPY[i]=py;BPZ[i]=dz;

  for(let dl=0;dl<3;dl++)for(let bt=0;bt<3;bt++){
    const b=dl*3+bt,n=PBC[b];if(!n)continue;
    g.fillStyle=cs(bt===2?mix(col,white,.35):col,a*ALP[dl][bt]);
    const sz=ps*SZ[dl];
    g.beginPath();for(let q=0;q<n;q++){const i=PB[b][q];g.rect(BPX[i]-sz/2,BPY[i]-sz/2,sz,sz);}g.fill();
  }
  if(PBC[9]){
    const n=PBC[9],sz=ps*1.35;
    g.fillStyle=cs(mix(hc,white,.3),a);g.beginPath();
    for(let q=0;q<n;q++){const i=PB[9][q];g.rect(BPX[i]-sz/2,BPY[i]-sz/2,sz,sz);}g.fill();
    for(let q=0;q<n;q+=Math.max(1,(n/60)|0)){const i=PB[9][q];if(BPZ[i]>.35)glow(BPX[i],BPY[i],s*.1*(.6+BPH[i]),hc,a*.55*BPH[i]);}
  }

/* ---------- ortak: küre ---------- */
const GLB=(function(){const N=2600,X=[],Y=[],Z=[],L=[];const ga=Math.PI*(3-Math.sqrt(5));
  for(let i=0;i<N;i++){const y=1-2*(i+.5)/N,r=Math.sqrt(1-y*y),th=ga*i;const x=Math.cos(th)*r,z=Math.sin(th)*r;X.push(x);Y.push(y);Z.push(z);L.push(n3(x*2.1+4,y*2.1,z*2.1)>.5?1:0);}
  return{X,Y,Z,L,N};})();
function globe(cx,cy,R,lon,lat,c,a=1){
  // lon: ekrana bakan boylam (radyan), lat: ekrana bakan enlem (radyan)
  const cl=Math.cos(-lon),sl=Math.sin(-lon),cb=Math.cos(lat),sb=Math.sin(lat);
  glow(cx,cy,R*1.6,c,.16*a);
  strokeC(cx,cy,R,c,.25*a,3);
  const {X,Y,Z,L,N}=GLB;
  g.fillStyle=cs(c,a);
  for(let k=0;k<2;k++){
    g.beginPath();
    for(let i=0;i<N;i++){
      if(L[i]!==k)continue;
      let x=X[i]*cl+Z[i]*sl,z=-X[i]*sl+Z[i]*cl,y=Y[i];
      const y2=y*cb-z*sb,z2=y*sb+z*cb;
      if(z2<0)continue;
      const s=(k?5.2:2.8)*(.5+z2*.8);g.rect(cx+x*R-s/2,cy-y2*R-s/2,s,s);
    }
    g.fillStyle=cs(c,a*(k?.95:.38));g.fill();
  }
}
function globePt(cx,cy,R,lon0,lat0,lon,lat){
  const lo=lon-lon0,x=Math.cos(lat)*Math.sin(lo),y=Math.sin(lat),z=Math.cos(lat)*Math.cos(lo);
  const cb=Math.cos(lat0),sb=Math.sin(lat0);const y2=y*cb-z*sb,z2=y*sb+z*cb;
  return[cx+x*R,cy-y2*R,z2];
}

/* ---------- ortak: pleksus (nöron ağı) ---------- */
const _plx={};
function plexusData(seed,n,x0,y0,w,h,k=3){
  const key=seed+'_'+n;if(_plx[key])return _plx[key];
  const r=rng(seed),N=[];for(let i=0;i<n;i++)N.push([x0+r()*w,y0+r()*h]);
  const E=[];N.forEach((p,i)=>{const ds=N.map((q,j)=>[Math.hypot(p[0]-q[0],p[1]-q[1]),j]).filter(a=>a[1]!==i).sort((a,b)=>a[0]-b[0]).slice(0,k);ds.forEach(d=>{if(i<d[1]||!E.some(e=>e[0]===d[1]&&e[1]===i))E.push([i,d[1]]);});});
  return _plx[key]={N,E};
}
function plexus(seed,n,x0,y0,w,h,t,c,a=1,o={}){
  const {N,E}=plexusData(seed,n,x0,y0,w,h,o.k||3);
  g.save();g.globalAlpha*=a;
  g.beginPath();E.forEach(e=>{g.moveTo(N[e[0]][0],N[e[0]][1]);g.lineTo(N[e[1]][0],N[e[1]][1]);});g.strokeStyle=cs(c,.22);g.lineWidth=o.lw||2.5;g.stroke();
  N.forEach((p,i)=>{fillC(p[0],p[1],o.nr||9,c,.7);});
  const sp=o.speed||.5;
  E.forEach((e,i)=>{
    const ph=(t*sp*(.6+hash(i*3.1))+hash(i*7.7))%2;if(ph>1)return;
    const A=N[e[0]],B=N[e[1]];const x=lerp(A[0],B[0],ph),y=lerp(A[1],B[1],ph);
    packet(x,y,o.pc||white,o.pr||14,Math.sin(ph*Math.PI));
  });
  g.restore();
}

const STD=(function(){const D=[];for(let r=0;r<10;r++){const rx=720+r*62,ry=260+r*23,n=Math.floor(TAU*Math.sqrt((rx*rx+ry*ry)/2)/38);for(let i=0;i<n;i++){const a=i/n*TAU+(r%2)*.5/n*TAU;D.push([Math.cos(a)*rx,Math.sin(a)*ry,r,hash(r*91+i*1.7)]);}}return D;})();
function stadium(cx,cy,sc,a,t,tg,o={}){
  g.save();g.translate(cx,cy);g.scale(sc,sc);g.globalAlpha*=a;
  // dış hale
  glow(0,0,1700,blue,.12);
  // saha
  const pg=g.createLinearGradient(0,-260,0,260);pg.addColorStop(0,'rgba(16,70,90,.9)');pg.addColorStop(1,'rgba(10,40,70,.9)');
  g.beginPath();g.ellipse(0,0,660,236,0,0,TAU);g.fillStyle=pg;g.fill();

  ln(0,-196,0,196,white,.2,3);strokeC(0,0,70,white,.2,3);
  fillR(-640,-60,90,120,6,white,.08);fillR(550,-60,90,120,6,white,.08);

  g.beginPath();g.ellipse(0,0,1350,520,0,0,TAU);g.ellipse(0,0,690,246,0,0,TAU,true);g.fillStyle='rgba(10,18,44,.55)';g.fill();
  const D=STD,n=D.length;
  const w=tg>=0?(t-tg)*1.15:-1;
  g.fillStyle=cs(cyan,.4);g.beginPath();
  for(let i=0;i<n;i++){const d=D[i];if(tg>=0){const dd=Math.hypot(d[0]-640,d[1])/1700;const b=Math.exp(-Math.pow((dd-w)/.12,2));if(b>.08)continue;}
    g.rect(d[0]-4.5,d[1]-4.5,9,9);}
  g.fill();
  if(tg>=0){
    const bands=[[.08,.35,mix(cyan,white,.3),.8],[.35,.7,amber,.95],[.7,2,white,1]];
    bands.forEach(([lo,hi,c,al])=>{
      g.fillStyle=cs(c,al);g.beginPath();
      for(let i=0;i<n;i++){const d=D[i];const dd=Math.hypot(d[0]-640,d[1])/1700;
        let b=Math.exp(-Math.pow((dd-w)/.12,2));
        const age=(t-tg)-dd/1.15;if(age>0)b=Math.max(b,.45*Math.exp(-age*1.1));
        if(b>=lo&&b<hi){const s=9+b*4;g.rect(d[0]-s/2,d[1]-s/2,s,s);}}
      g.fill();
    });
    // genişleyen halkalar
    if(w>0&&w<1.4){strokeC(640,0,w*950,amber,Math.max(0,.45-w*.33),6);}
  }
  g.restore();
}

function halftonePortrait(x,y,w,h,c,t){
  const sp=20,cols=Math.floor(w/sp),rows=Math.floor(h/sp);
  g.beginPath();
  for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){
    const u=(i+.5)/cols*2-1,v=(j+.5)/rows*2-1;
    // baş
    const hx=u*1,hy=(v+.3)*1;
    const head=1-Math.pow(hx/.5,2)-Math.pow((hy)/.56,2);
    // omuz
    const sh=1-Math.pow(u/1.0,2)-Math.pow((v-.92)/.5,2);
    const neck=(Math.abs(u)<.2&&v>.2&&v<.55)?.6:0;
    let L=Math.max(head>0?.55+.5*head:0,sh>0?.4+.4*sh:0,neck);
    if(L<=0)continue;
    // yan ışık
    L*=.55+.45*(1-(u+1)/2);
    // gözlük / saç gölgesi
    if(head>0&&hy<-.22)L*=.55;
    const r=sp*.5*Math.sqrt(clamp(L));
    g.moveTo(x+(i+.5)*sp+r,y+(j+.5)*sp);g.arc(x+(i+.5)*sp,y+(j+.5)*sp,r,0,TAU);
  }
  g.fillStyle=cs(c,.95);g.fill();
}

function armIK(bx,by,L1,L2,tx,ty,flip=1){
  const dx=tx-bx,dy=ty-by;let d=Math.hypot(dx,dy);d=Math.min(d,L1+L2-2);d=Math.max(d,Math.abs(L1-L2)+2);
  const a=Math.atan2(dy,dx),ct=clamp((L1*L1+d*d-L2*L2)/(2*L1*d),-1,1),th=Math.acos(ct);
  const j=a-th*flip,ex=bx+Math.cos(j)*L1,ey=by+Math.sin(j)*L1;
  const wa=Math.atan2(ty-ey,tx-ex);
  return[ex,ey,ex+Math.cos(wa)*L2,ey+Math.sin(wa)*L2];
}

const SUBSZ=62,subCache=[];
function subLayout(i){
  if(subCache[i])return subCache[i];

  const ws=SC[i][2].split(' ').map(w=>({w,wd:g.measureText(w+' ').width}));
  const tot=ws.reduce((a,b)=>a+b.wd,0),maxW=3000;
  let n=Math.ceil(tot/maxW),lines=[];
  if(n<=1)lines=[ws.slice()];
  else if(n===2){let best=1,bv=1e9,acc=0;for(let k=0;k<ws.length-1;k++){acc+=ws[k].wd;const v=Math.max(acc,tot-acc);if(v<bv){bv=v;best=k+1;}}lines=[ws.slice(0,best),ws.slice(best)];}
  else{lines=[[]];let cur=0;ws.forEach(o=>{if(cur+o.wd>maxW&&lines[lines.length-1].length){lines.push([]);cur=0;}lines[lines.length-1].push(o);cur+=o.wd;});}
  let c=0;const total=SC[i][2].length;
  lines.forEach(L=>{L.w=L.reduce((a,b)=>a+b.wd,0);L.forEach(o=>{o.f=c/total;c+=o.w.length+1;});});

  // ilerleme çubuğu
  const x0=150,x1=W-150,y=2116,L=x1-x0;
  const firstS=[...CHAPTERS.map(c=>ss(c[0])),TOTAL];
  for(let k=0;k<CHAPTERS.length;k++){
    const a=x0+L*firstS[k]/TOTAL+(k?6:0),b=x0+L*firstS[k+1]/TOTAL-6;
    fillR(a,y-4,b-a,8,4,white,.12);
    const p=clamp((T-firstS[k])/(firstS[k+1]-firstS[k]));
    if(p>0){fillR(a,y-4,(b-a)*p,8,4,cyan,.95);}
  }
  const px=x0+L*T/TOTAL;glow(px,y,40,cyan,.9);fillC(px,y,8,white,1);
  g.restore();
}
/* --- kare --- */
let _fi=0;
function frame(T){
  TT=T;_fi++;
  const M=MAIN;
  let tr=-1;
  for(let k=1;k<ACTS.length;k++){if(T>=ACTS[k].s-.2&&T<ACTS[k].s+.3){tr=k;break;}}
  if(tr<0){let k=0;while(k+1<ACTS.length&&T>=ACTS[k+1].s)k++;runAct(ACTS[k],M,T);}
  else{
    const ain=seg(T,ACTS[tr].s-.2,ACTS[tr].s+.3);
    runAct(ACTS[tr-1],OA,T);runAct(ACTS[tr],OB,T);
    g=M;M.setTransform(1,0,0,1,0,0);M.globalAlpha=1;M.globalCompositeOperation='source-over';
    M.drawImage(OAc,0,0);
    const e=eio(ain),sc=1+.035*(1-e);
    M.globalAlpha=e;M.drawImage(OBc,MX-MX*sc,MY-MY*sc,W*sc,H*sc);M.globalAlpha=1;
  }
  g=M;M.setTransform(1,0,0,1,0,0);M.globalAlpha=1;M.globalCompositeOperation='source-over';
  // vinyet
  const vg=M.createRadialGradient(MX,MY,1200,MX,MY,2450);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.55)');
  M.fillStyle=vg;M.fillRect(0,0,W,H);
  // gren
  M.save();M.globalAlpha=.045;M.translate((_fi*97)%384,(_fi*53)%384);M.fillStyle=GRAIN;M.fillRect(-384,-384,W+768,H+768);M.restore();
  let si=0;{let lo=0,hi=SC.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(SC[m][0]<=T)lo=m;else hi=m-1;}si=lo;}
  if(HUD)drawHUD(T,si);
  if(SUBTITLES&&T<SC[SC.length-1][1]+.6)drawSubs(T,si);
  // açılış/kapanış karartma
  const fo=1-seg(T,0,.6)+seg(T,TOTAL-1.6,TOTAL);
  if(fo>0){M.globalAlpha=clamp(fo);M.fillStyle='#000';M.fillRect(0,0,W,H);M.globalAlpha=1;}
}

/* --- yürütme --- */
function fit(){
  const s=Math.min(innerWidth/W,innerHeight/H),st=document.getElementById('stage');
  st.style.transform=`translate(${(innerWidth-W*s)/2}px,${(innerHeight-H*s)/2}px) scale(${s})`;
}
addEventListener('resize',fit);fit();
const QS=new URLSearchParams(location.search);
let t0=null,paused=false,offset=parseFloat(QS.get('t')||'0')||0,done=false;
function loop(ts){
  if(paused){return;}
  if(t0===null)t0=ts-offset*1000;
  const T=Math.min(TOTAL,(ts-t0)/1000);
  frame(T);
  if(T<TOTAL)requestAnimationFrame(loop);else{done=true;window.__done=true;document.title+=' ✓';}
}
window.__r=t=>{paused=true;frame(t);};
window.__total=TOTAL;
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();if(paused){paused=false;t0=null;offset=TT;requestAnimationFrame(loop);}else{paused=true;}}
  if(e.code==='ArrowRight'){offset=TT+5;t0=null;if(paused)frame(Math.min(TOTAL,TT+5));}
  if(e.code==='ArrowLeft'){offset=Math.max(0,TT-5);t0=null;if(paused)frame(offset);}
});
if(QS.has('pause')){paused=true;frame(offset);}
else requestAnimationFrame(loop);
</script>
