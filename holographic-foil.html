<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=3840, height=2160">
<title>Holographic Foil — Iridescent 3D Metallic Ripple (4K, 15s seamless loop)</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 3840px; height: 2160px;
    overflow: hidden;
    background: #000;
  }
  canvas {
    display: block;
    position: fixed; left: 0; top: 0;
    width: 3840px; height: 2160px;
  }
</style>
</head>
<body>
<canvas id="c" width="3840" height="2160"></canvas>

<script id="vs" type="x-shader/x-vertex">#version 300 es
void main() {
  vec2 v = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  gl_Position = vec4(v * 2.0 - 1.0, 0.0, 1.0);
}
</script>

<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
precision highp int;
out vec4 fragColor;

uniform vec2  uRes;
uniform float uPhase;   // 0 .. 2*PI over the 15 s loop
uniform float uTime;

#define PI 3.14159265358979

/* ------------------------------------------------------------
   4D simplex noise (Ashima Arts / Stefan Gustavson, MIT)
   Time is fed in as a point moving on a circle in the 3rd/4th
   dimension, so every layer is perfectly seamless over the loop.
   ------------------------------------------------------------ */
vec4  mod289(vec4 x)  { return x - floor(x * (1.0 / 289.0)) * 289.0; }
float mod289(float x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4  permute(vec4 x) { return mod289(((x * 34.0) + 1.0) * x); }
float permute(float x){ return mod289(((x * 34.0) + 1.0) * x); }
vec4  taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
float taylorInvSqrt(float r){ return 1.79284291400159 - 0.85373472095314 * r; }

vec4 grad4(float j, vec4 ip) {
  const vec4 ones = vec4(1.0, 1.0, 1.0, -1.0);
  vec4 p, s;
  p.xyz = floor(fract(vec3(j) * ip.xyz) * 7.0) * ip.z - 1.0;
  p.w = 1.5 - dot(abs(p.xyz), ones.xyz);
  s = vec4(lessThan(p, vec4(0.0)));
  p.xyz = p.xyz + (s.xyz * 2.0 - 1.0) * s.www;
  return p;
}

float snoise(vec4 v) {
  const vec4 C = vec4(0.138196601125011, 0.276393202250021,
                      0.414589803375032, -0.447213595499958);
  const float F4 = 0.309016994374947451;
  vec4 i  = floor(v + dot(v, vec4(F4)));
  vec4 x0 = v - i + dot(i, C.xxxx);
  vec4 i0;
  vec3 isX  = step(x0.yzw, x0.xxx);
  vec3 isYZ = step(x0.zww, x0.yyz);
  i0.x = isX.x + isX.y + isX.z;
  i0.yzw = 1.0 - isX;
  i0.y += isYZ.x + isYZ.y;
  i0.zw += 1.0 - isYZ.xy;
  i0.z += isYZ.z;
  i0.w += 1.0 - isYZ.z;
  vec4 i3 = clamp(i0, 0.0, 1.0);
  vec4 i2 = clamp(i0 - 1.0, 0.0, 1.0);
  vec4 i1 = clamp(i0 - 2.0, 0.0, 1.0);
  vec4 x1 = x0 - i1 + C.xxxx;
  vec4 x2 = x0 - i2 + C.yyyy;
  vec4 x3 = x0 - i3 + C.zzzz;
  vec4 x4 = x0 + C.wwww;
  i = mod289(i);
  float j0 = permute(permute(permute(permute(i.w) + i.z) + i.y) + i.x);
  vec4 j1 = permute(permute(permute(permute(
             i.w + vec4(i1.w, i2.w, i3.w, 1.0))
           + i.z + vec4(i1.z, i2.z, i3.z, 1.0))
           + i.y + vec4(i1.y, i2.y, i3.y, 1.0))
           + i.x + vec4(i1.x, i2.x, i3.x, 1.0));
  vec4 ip = vec4(1.0 / 294.0, 1.0 / 49.0, 1.0 / 7.0, 0.0);
  vec4 p0 = grad4(j0,   ip);
  vec4 p1 = grad4(j1.x, ip);
  vec4 p2 = grad4(j1.y, ip);
  vec4 p3 = grad4(j1.z, ip);
  vec4 p4 = grad4(j1.w, ip);
  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  p4 *= taylorInvSqrt(dot(p4, p4));
  vec3 m0 = max(0.6 - vec3(dot(x0,x0), dot(x1,x1), dot(x2,x2)), 0.0);
  vec2 m1 = max(0.6 - vec2(dot(x3,x3), dot(x4,x4)), 0.0);
  m0 = m0 * m0; m1 = m1 * m1;
  return 49.0 * (dot(m0*m0, vec3(dot(p0,x0), dot(p1,x1), dot(p2,x2)))
               + dot(m1*m1, vec2(dot(p3,x3), dot(p4,x4))));
}

/* ---------------- helpers ---------------- */
vec2 circ(float k, float o) { float a = k * uPhase + o; return vec2(cos(a), sin(a)); }

float hash12(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
vec3 hash32(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
  p3 += dot(p3, p3.yxz + 33.33);
  return fract((p3.xxy + p3.yzz) * p3.zyx);
}

/* ---------------- foil height field ----------------
   Broad, slow sheet ripples + evolving crumple layers + creases.
   Every time term is an integer multiple of uPhase => seamless.  */
float foilHeight(vec2 p) {
  float h = 0.0;
  // slow travelling waves across the sheet
  h += 0.34 * sin(dot(p, vec2( 0.86, 0.51)) * 2.4 - uPhase);
  h += 0.20 * sin(dot(p, vec2(-0.42, 0.91)) * 3.1 + uPhase * 2.0 + 1.7);
  // evolving crumple layers
  h += 0.62 * snoise(vec4(p * 1.05,        1.10 * circ(1.0, 0.0)));
  h += 0.28 * snoise(vec4(p * 2.10 +  5.2, 0.85 * circ(1.0, 2.1)));
  h += 0.09 * snoise(vec4(p * 4.20 + 11.7, 0.65 * circ(2.0, 0.7)));
  h += 0.03 * snoise(vec4(p * 8.30 +  3.3, 0.50 * circ(2.0, 4.0)));
  // soft, rounded foil creases (smoothed ridged noise)
  float r = snoise(vec4(p * 2.6 + 20.0, 0.7 * circ(1.0, 3.5)));
  float ridge = 1.0 - sqrt(r * r + 0.06);
  h += 0.07 * ridge * ridge;
  return h;
}

/* ---------------- holographic spectrum ---------------- */
vec3 holo(float x) {
  vec3 c = 0.5 + 0.5 * cos(2.0 * PI * (x + vec3(0.00, 0.33, 0.67)));
  c = pow(c, vec3(1.6));             // punchier, more saturated bands
  return mix(c, vec3(1.0), 0.05);    // faint pastel foil lift
}

/* ---------------- studio environment ---------------- */
vec3 envLight(vec3 R) {
  float t = clamp(R.y * 0.5 + 0.5, 0.0, 1.0);
  vec3 col = mix(vec3(0.24, 0.23, 0.30), vec3(0.66, 0.68, 0.76), smoothstep(0.0, 1.0, t));
  // big soft top light
  col += vec3(1.00, 0.98, 0.95) * 1.7 * pow(max(dot(R, normalize(vec3( 0.15, 0.85, 0.50))), 0.0), 6.0);
  // cool and warm rim lights
  col += vec3(0.60, 0.80, 1.00) * 1.3 * pow(max(dot(R, normalize(vec3(-0.80,-0.20, 0.55))), 0.0), 14.0);
  col += vec3(1.00, 0.72, 0.92) * 1.1 * pow(max(dot(R, normalize(vec3( 0.85,-0.35, 0.45))), 0.0), 14.0);
  // horizontal softbox strip
  float sb = smoothstep(0.14, 0.0, abs(R.y - 0.38)) * smoothstep(0.98, 0.55, abs(R.x));
  col += vec3(1.0) * 2.2 * sb;
  return col;
}

float D_GGX(float NdotH, float a) {
  float a2 = a * a;
  float d = NdotH * NdotH * (a2 - 1.0) + 1.0;
  return a2 / (PI * d * d);
}
vec3 ggxLight(vec3 N, vec3 V, vec3 L, vec3 c, float rough) {
  vec3 H = normalize(L + V);
  float NdotH = max(dot(N, H), 0.0);
  float NdotL = max(dot(N, L), 0.0);
  float a = rough * rough;
  return c * D_GGX(NdotH, a) * NdotL * 0.03;
}

vec3 ACES(vec3 x) {
  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
}

void main() {
  vec2 frag = gl_FragCoord.xy;
  vec2 p = (frag - 0.5 * uRes) / uRes.y * 2.0;      // y in [-1, 1]

  // slow circular drift of the whole sheet (loops)
  vec2 q = p + 0.12 * circ(1.0, 0.9);

  // ---- surface normal from the height field ----
  const float amp = 1.15;
  float e   = 1.5 / uRes.y;
  float h   = foilHeight(q);
  float hx  = foilHeight(q + vec2(e, 0.0));
  float hy  = foilHeight(q + vec2(0.0, e));
  float hxm = foilHeight(q - vec2(e, 0.0));
  float hym = foilHeight(q - vec2(0.0, e));
  vec2 grad = vec2(hx - hxm, hy - hym) / (2.0 * e);
  vec3 N = normalize(vec3(-grad * amp, 1.0));

  vec3 V = normalize(vec3(-p * 0.10, 1.0));
  vec3 R = reflect(-V, N);
  float NdotV = clamp(dot(N, V), 0.0, 1.0);

  // ---- iridescent diffraction colour ----
  float macro = snoise(vec4(q * 0.75 + 40.0, 0.6 * circ(1.0, 1.3)));
  vec2 gdir = normalize(vec2(0.82, 0.57));
  float phaseA = 2.6 * (1.0 - NdotV) + 1.6 * dot(N.xy, gdir) + 0.55 * macro + 0.30 * h;
  float phaseB = 0.9 * dot(q, gdir) + 1.3 * N.x - 0.8 * N.y + 0.5 * macro;
  vec3 rainbow = mix(holo(phaseA), holo(phaseB), 0.45);

  // laser-engraved micro grating lines
  float lines = 0.5 + 0.5 * sin(dot(q, vec2(-gdir.y, gdir.x)) * 380.0 + N.x * 9.0 - N.y * 5.0 + macro * 4.0);
  lines *= lines;
  rainbow *= 0.90 + 0.18 * lines;

  // ---- metallic shading ----
  vec3 F0 = mix(vec3(0.92, 0.93, 0.95), rainbow, 0.88);
  float fres = pow(1.0 - NdotV, 5.0);
  vec3 F = F0 + (vec3(1.0) - F0) * fres;

  vec3 col = F * envLight(R);
  vec3 L1 = normalize(vec3( 0.35, 0.65, 0.65));
  col += F       * ggxLight(N, V, L1,                               vec3(1.00, 0.97, 0.93) * 2.2, 0.16);
  col += F       * ggxLight(N, V, normalize(vec3(-0.70,-0.35, 0.60)), vec3(0.75, 0.85, 1.00) * 1.4, 0.22);
  col += rainbow * ggxLight(N, V, normalize(vec3( 0.75,-0.55, 0.40)), vec3(1.00, 0.80, 0.95) * 1.2, 0.30);

  // ---- metallic micro-sparkle ----
  vec2 cellUV = frag / 5.0;
  vec2 cell = floor(cellUV);
  vec3 rnd = hash32(cell);
  vec3 Nj = normalize(N + (rnd - 0.5) * 0.9);
  vec3 Hk = normalize(L1 + V);
  float glint = pow(max(dot(Nj, Hk), 0.0), 900.0);
  float dot_ = smoothstep(0.38, 0.05, length(fract(cellUV) - (rnd.xy * 0.6 + 0.2)));
  col += vec3(1.0) * glint * dot_ * 3.0;

  // ---- finish ----
  col *= 0.85;
  col = ACES(col);
  col = pow(col, vec3(1.0 / 2.2));
  float vig = smoothstep(1.9, 0.35, length(p * vec2(0.8, 1.0)));
  col *= 0.86 + 0.14 * vig;
  col += (hash12(frag) - 0.5) / 255.0;   // static dither against banding
  fragColor = vec4(col, 1.0);
}
</script>

<script>
(function () {
  var DURATION = 15.0;                       // seconds, seamless loop
  var canvas = document.getElementById('c');
  var gl = canvas.getContext('webgl2', {
    antialias: false, alpha: false, depth: false, stencil: false,
    preserveDrawingBuffer: true, powerPreference: 'high-performance'
  });
  if (!gl) { document.body.style.background = '#111'; return; }

  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src.trim());
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(s));
    }
    return s;
  }
  var prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER,   document.getElementById('vs').textContent));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(prog));
  }
  gl.useProgram(prog);

  var uRes   = gl.getUniformLocation(prog, 'uRes');
  var uPhase = gl.getUniformLocation(prog, 'uPhase');
  var uTime  = gl.getUniformLocation(prog, 'uTime');

  var start = null;
  function frame(now) {
    if (start === null) start = now;
    var t = ((now - start) / 1000) % DURATION;
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uPhase, (t / DURATION) * Math.PI * 2.0);
    gl.uniform1f(uTime, t);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
