<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synthwave Grid Drive</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #c { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; display: block; background: #000; }
  #err { position: absolute; left: 24px; top: 24px; color: #f6c; font: 28px/1.4 monospace; display: none; white-space: pre; }
</style>
</head>
<body>
<canvas id="c" width="3840" height="2160"></canvas>
<div id="err"></div>
<script>
(function () {
'use strict';

/* ------------------------------------------------------------------
   Retro 80s Synthwave — endless drive over a neon wireframe grid
   3840x2160, 15 s seamless loop, WebGL2 + HDR bloom post-processing
   ------------------------------------------------------------------ */

const W = 3840, H = 2160;
const LOOP = 15.0;                 // seconds, seamless loop length
const PERIOD = 192.0;              // world units travelled per loop (terrain period)
const SPEED = PERIOD / LOOP;       // 12.8 units / second
const PYLON_SPACING = 24.0;        // must divide PERIOD
const NUM_PYLONS = 36;             // per side... actually total instances (2 sides interleaved)
const NUM_PARTICLES = 700;
const MESH_X = 280;                // half-width of terrain mesh (cells)
const MESH_Z_BACK = 2;             // cells behind camera
const MESH_Z_FWD = 420;            // cells ahead
const FOVY = 55 * Math.PI / 180;
const ASPECT = W / H;
const SUN_ELEV = 9.0 * Math.PI / 180;
const SUN_RADIUS_DEG = 10.0;

const canvas = document.getElementById('c');
const errBox = document.getElementById('err');


const gl = canvas.getContext('webgl2', {
  alpha: false, antialias: false, depth: false, stencil: false,
  preserveDrawingBuffer: true, powerPreference: 'high-performance',
  premultipliedAlpha: false
});
if (!gl) {
  errBox.style.display = 'block';
  errBox.textContent = 'WebGL2 is required for this animation.';
  return;
}

const extF = gl.getExtension('EXT_color_buffer_float');
const extHF = extF ? null : gl.getExtension('EXT_color_buffer_half_float');
const HDR = !!(extF || extHF);
const COLOR_FMT = HDR ? gl.RGBA16F : gl.RGBA8;
const COLOR_TYPE = HDR ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;
const MAX_SAMPLES = gl.getParameter(gl.MAX_SAMPLES) | 0;
let SAMPLES = Math.min(4, MAX_SAMPLES);

/* ---------------------------- shaders ---------------------------- */

const GLSL_COMMON = `
precision highp float;
precision highp int;
#define LOOP 15.0
#define PERIOD 192.0
#define TAU 6.28318530718
float hash11(float p){ p = fract(p*0.1031); p *= p + 33.33; p *= p + p; return fract(p); }
float hash21(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y)*p3.z); }
vec3 horizonColor(vec3 d, vec3 sun){
  vec3 hd = normalize(vec3(d.x, 0.0, d.z));
  vec3 hs = normalize(vec3(sun.x, 0.0, sun.z));
  float s = max(dot(hd, hs), 0.0);
  vec3 base = vec3(0.34, 0.07, 0.40);
  vec3 warm = vec3(1.00, 0.36, 0.34);
  return mix(base, warm, pow(s, 7.0)) + vec3(0.5, 0.12, 0.2) * pow(s, 30.0);
}
`;

const GLSL_NOISE = `
// value noise, periodic along z with period PERIOD (lattice wraps every PERIOD/cell cells)
float vnoise(vec2 p, float cell){
  float n = PERIOD / cell;
  vec2 q = p / cell;
  vec2 i = floor(q); vec2 f = fract(q);
  vec2 u = f*f*f*(f*(f*6.0 - 15.0) + 10.0);
  float z0 = mod(i.y, n), z1 = mod(i.y + 1.0, n);
  float a = hash21(vec2(i.x, z0)), b = hash21(vec2(i.x + 1.0, z0));
  float c = hash21(vec2(i.x, z1)), d = hash21(vec2(i.x + 1.0, z1));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
float ridged(vec2 p){
  float sum = 0.0, amp = 0.55, cell = 48.0, norm = 0.0;
  vec2 off = vec2(0.0);
  for (int i = 0; i < 5; i++){
    float v = vnoise(p + off, cell);
    v = 1.0 - abs(2.0*v - 1.0);
    v = v*v;
    sum += v*amp; norm += amp;
    amp *= 0.5; cell *= 0.5; off += vec2(17.3, 11.1);
  }
  return sum / norm;
}
float terrainH(vec2 p){
  float ax = abs(p.x);
  float rid = ridged(p);
  float base = vnoise(p + vec2(31.0, 7.0), 24.0);
  float base2 = vnoise(p + vec2(-13.0, 41.0), 48.0);
  float hills = smoothstep(6.0, 18.0, ax) * (1.2 + 3.2*vnoise(p + vec2(5.0, 2.0), 6.0)) * (0.35 + 0.65*base);
  float mtn = smoothstep(16.0, 62.0, ax);
  float far = smoothstep(60.0, 210.0, ax);
  float h = hills + mtn * (11.0 + 30.0*base) * rid + far * (18.0 + 22.0*base2) * rid;
  return h;
}
`;

const VS_FULL = `#version 300 es
out vec2 vUv;
void main(){
  vec2 p = vec2((gl_VertexID == 1) ? 3.0 : -1.0, (gl_VertexID == 2) ? 3.0 : -1.0);
  vUv = p*0.5 + 0.5;
  gl_Position = vec4(p, 0.99999, 1.0);
}`;

const FS_SKY = `#version 300 es
${GLSL_COMMON}
in vec2 vUv;
uniform vec3 uCamRight, uCamUp, uCamFwd;
uniform vec2 uTanFov;
uniform vec3 uSunDir, uSunRight, uSunUp;
uniform float uSunR;
uniform float uTime;
out vec4 o;

float vn2(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f*f*(3.0 - 2.0*f);
  return mix(mix(hash21(i), hash21(i + vec2(1,0)), u.x), mix(hash21(i + vec2(0,1)), hash21(i + vec2(1,1)), u.x), u.y);
}
float fbm(vec2 p){
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++){ s += a*vn2(p); p = p*2.03 + vec2(1.7, 9.2); a *= 0.5; }
  return s;
}

void main(){
  vec2 ndc = vUv*2.0 - 1.0;
  vec3 dir = normalize(uCamFwd + uCamRight*(ndc.x*uTanFov.x) + uCamUp*(ndc.y*uTanFov.y));
  float y = dir.y;
  float ty = clamp(y, 0.0, 1.0);
  float az = atan(dir.x, -dir.z);
  float el = asin(clamp(y, -1.0, 1.0));

  vec3 hc = horizonColor(dir, uSunDir);
  vec3 zenith = vec3(0.012, 0.006, 0.045);
  vec3 mid = vec3(0.13, 0.03, 0.27);
  vec3 sky = mix(hc, mid, smoothstep(0.0, 0.13, ty));
  sky = mix(sky, zenith, smoothstep(0.10, 0.65, ty));
  sky += hc * exp(-ty*28.0) * 0.55;               // horizon haze band

  // nebula / cosmic haze
  vec2 sc = vec2(az, el);
  float n = fbm(sc*vec2(2.4, 3.6) + vec2(3.1, 1.7));
  float n2 = fbm(sc*vec2(5.0, 7.0) + vec2(9.2, 4.4));
  vec3 nebCol = mix(vec3(0.42, 0.06, 0.70), vec3(0.08, 0.36, 0.75), n2);
  sky += nebCol * smoothstep(0.38, 0.85, n) * 0.5 * smoothstep(0.02, 0.28, ty);

  // stars
  vec3 stars = vec3(0.0);
  {
    float cell = 0.017;
    vec2 q = sc / cell;
    vec2 ci = floor(q); vec2 f = fract(q);
    float h = hash21(ci);
    if (h > 0.70){
      vec2 off = vec2(hash21(ci + 7.1), hash21(ci + 3.3))*0.6 + 0.2;
      vec2 dxy = (f - off) * cell;
      dxy.x *= cos(el);
      float dist = length(dxy);
      float size = 0.0007 + hash21(ci + 11.0)*0.0011;
      float b = exp(-dist*dist/(size*size)*1.6);
      float cyc = 3.0 + floor(hash21(ci + 5.5)*6.0);
      float tw = 0.62 + 0.38*sin(TAU*(uTime/LOOP*cyc + hash21(ci + 9.0)));
      float bright = (0.3 + hash21(ci + 2.2)*1.2)*tw;
      vec3 scol = mix(vec3(0.72, 0.82, 1.0), vec3(1.0, 0.78, 0.9), hash21(ci + 4.4));
      stars = scol * b * bright;
    }
  }
  stars *= smoothstep(0.0, 0.14, y);
  sky += stars;

  // sun
  vec3 sunCol = vec3(0.0);
  float dd = dot(dir, uSunDir);
  if (dd > 0.0){
    vec2 sp = vec2(dot(dir, uSunRight), dot(dir, uSunUp)) / dd;
    float R = uSunR;
    float r = length(sp);
    float q = sp.y / R;                         // -1 bottom .. +1 top
    float aaR = fwidth(r) * 1.2;
    float disc = 1.0 - smoothstep(R - aaR, R + aaR, r);
    float v = -q;                               // 0 center .. 1 bottom
    float phase = uTime / LOOP * 3.0;           // 3 full stripe cycles per loop
    float band = fract(v*9.0 - phase);
    float aaB = fwidth(v*8.0) * 1.2;
    float thick = smoothstep(0.0, 1.0, v) * 0.66;
    float cut = smoothstep(thick - aaB, thick + aaB, band);
    cut = mix(1.0, cut, smoothstep(0.03, 0.12, v));
    vec3 scol = mix(vec3(0.98, 0.12, 0.62), vec3(1.0, 0.50, 0.28), smoothstep(-1.0, 0.1, q));
    scol = mix(scol, vec3(1.0, 0.80, 0.22), smoothstep(0.1, 1.0, q));
    sunCol += scol * disc * cut * 1.38;
    float halo = exp(-max(r - R, 0.0)*8.0);
    sunCol += vec3(1.0, 0.35, 0.45) * halo * 0.40 + vec3(1.0, 0.5, 0.3) * exp(-r*2.2) * 0.35;
    float streak = exp(-abs(sp.y)*70.0) * exp(-abs(sp.x)*2.4);
    sunCol += vec3(1.0, 0.45, 0.75) * streak * 0.35;
    sunCol *= smoothstep(-0.003, 0.004, y);
  }
  sky += sunCol;

  o = vec4(sky, 1.0);
}`;

const VS_TERRAIN = `#version 300 es
${GLSL_COMMON}
${GLSL_NOISE}
in vec2 aPos;
uniform mat4 uViewProj;
uniform float uZBase;
out vec3 vWorld;
out float vH;
void main(){
  vec2 p = vec2(aPos.x, aPos.y + uZBase);
  float h = terrainH(p);
  vec3 w = vec3(p.x, h, p.y);
  vWorld = w; vH = h;
  gl_Position = uViewProj * vec4(w, 1.0);
}`;

const FS_TERRAIN = `#version 300 es
${GLSL_COMMON}
in vec3 vWorld;
in float vH;
uniform vec3 uCamPos;
uniform vec3 uSunDir;
uniform float uTime;
uniform float uLineW;
out vec4 o;
void main(){
  vec3 rel = vWorld - uCamPos;
  float dist = length(rel);
  vec3 vdir = rel / dist;

  // procedural anti-aliased grid lines on integer world coordinates
  vec2 g = vWorld.xz;
  vec2 fw = fwidth(g) + 1e-6;
  vec2 d = (0.5 - abs(fract(g) - 0.5)) / fw;         // pixel distance to nearest line
  float lw = uLineW;
  vec2 ln = 1.0 - smoothstep(lw - 0.8, lw + 0.8, d);
  vec2 avg = min(2.0*lw*fw, vec2(0.45));
  vec2 k = smoothstep(0.10, 0.45, fw);
  ln = mix(ln, avg, k);
  vec2 glow = exp(-d*0.16) * (1.0 - k);

  // road edge emphasis on the lines at x = +-6
  float xi = floor(g.x + 0.5);
  float edge = step(abs(abs(xi) - 6.0), 0.5);
  ln.x *= 1.0 + edge*0.9;

  float line = 1.0 - (1.0 - ln.x)*(1.0 - ln.y);
  float gw = max(glow.x, glow.y);

  float hm = smoothstep(0.6, 16.0, vH);
  vec3 magenta = vec3(1.0, 0.16, 0.66);
  vec3 cyan = vec3(0.22, 0.86, 1.0);
  vec3 cLine = mix(magenta, cyan, hm);
  cLine = mix(cLine, vec3(0.75, 0.55, 1.0), smoothstep(0.0, 0.6, hm) * (1.0 - smoothstep(0.6, 1.0, hm)) * 0.35);
  // road edge lines: white-hot pink
  cLine = mix(cLine, vec3(1.0, 0.55, 0.85), edge * (1.0 - hm) * 0.7);
  // warm sun lane on the flat grid towards the horizon
  float sunLane = exp(-pow(vWorld.x/16.0, 2.0)) * smoothstep(30.0, 240.0, dist) * (1.0 - hm);
  cLine += vec3(1.0, 0.55, 0.25) * sunLane * 1.3;

  // facet shading (low-poly fill)
  vec3 n = normalize(cross(dFdx(vWorld), dFdy(vWorld)));
  n *= sign(n.y + 1e-6);
  vec3 fill = vec3(0.020, 0.003, 0.055);
  fill += vec3(0.17, 0.03, 0.30) * hm * 0.55;
  float sunFacing = max(dot(n, uSunDir), 0.0);
  fill += vec3(0.95, 0.35, 0.32) * pow(sunFacing, 3.0) * 0.16 * smoothstep(0.5, 6.0, vH);
  fill += cLine * 0.07 * hm;
  fill += vec3(0.4, 0.1, 0.6) * (1.0 - n.y) * 0.12 * hm;

  float distFade = mix(1.0, 0.6, smoothstep(40.0, 320.0, dist)) * mix(1.0, 0.8, hm);
  vec3 col = fill + cLine * (line * 2.0 + gw * 0.30) * distFade;

  // fog to the horizon colour
  float fog = 1.0 - exp(-pow(dist/300.0, 1.7));
  fog = max(fog, smoothstep(280.0, 410.0, dist));
  vec3 fogCol = horizonColor(vdir, uSunDir);
  col = mix(col, fogCol, fog);
  o = vec4(col, 1.0);
}`;

const VS_PYLON = `#version 300 es
${GLSL_COMMON}
in vec2 aQuad;
uniform mat4 uViewProj;
uniform vec3 uCamPos;
uniform float uCamZ;
uniform float uSpacing;
out vec2 vUv;
out float vDist;
out float vSide;
void main(){
  int inst = gl_InstanceID;
  int side = inst - (inst/2)*2;
  float kk = float(inst/2);
  float m0 = ceil(-(uCamZ + 2.0)/uSpacing);
  float z = -uSpacing*(m0 + kk);
  float x = (side == 0) ? -7.6 : 7.6;
  vec3 base = vec3(x, -0.3, z);
  float hgt = 7.5;
  vec3 vd = base + vec3(0.0, hgt*0.5, 0.0) - uCamPos;
  vec3 right = normalize(cross(vec3(0.0, 1.0, 0.0), normalize(vd)));
  float halfW = 0.34;
  vec3 p = base + vec3(0.0, aQuad.y*hgt, 0.0) + right*(aQuad.x*halfW);
  vUv = aQuad;
  vDist = length(vd);
  vSide = float(side);
  gl_Position = uViewProj * vec4(p, 1.0);
}`;

const FS_PYLON = `#version 300 es
${GLSL_COMMON}
in vec2 vUv;
in float vDist;
in float vSide;
uniform float uTime;
out vec4 o;
void main(){
  float dx = vUv.x;
  float core = exp(-dx*dx*160.0);
  float glow = exp(-abs(dx)*6.0) * 0.12;
  float capFade = smoothstep(0.0, 0.04, vUv.y) * (1.0 - smoothstep(0.93, 1.0, vUv.y));
  vec3 cc = vec3(0.30, 0.90, 1.0);
  vec3 col = cc * (core*2.6 + glow) * capFade;
  float lamp = exp(-(dx*dx*40.0 + pow((vUv.y - 0.94)*16.0, 2.0)));
  col += vec3(1.0, 0.96, 0.92) * lamp * 2.4;
  float lampGlow = exp(-(dx*dx*5.0 + pow((vUv.y - 0.94)*5.0, 2.0)));
  col += vec3(0.5, 0.9, 1.0) * lampGlow * 0.18;
  float fog = 1.0 - exp(-pow(vDist/300.0, 1.7));
  col *= (1.0 - fog);
  o = vec4(col, 1.0);
}`;

const VS_PARTICLE = `#version 300 es
${GLSL_COMMON}
in vec2 aQuad;
uniform mat4 uViewProj;
uniform vec3 uCamPos;
uniform float uCamZ;
uniform float uTime;
out vec2 vUv;
out vec3 vCol;
out float vAlpha;
void main(){
  float id = float(gl_InstanceID);
  float r1 = hash11(id*1.37 + 0.13);
  float r2 = hash11(id*2.91 + 7.71);
  float r3 = hash11(id*0.77 + 3.31);
  float r4 = hash11(id*4.13 + 1.91);
  float r5 = hash11(id*5.57 + 9.17);
  float r6 = hash11(id*3.31 + 5.03);
  float x = (r1*2.0 - 1.0) * 48.0;
  float y = 0.5 + r2*r2*18.0;
  float z0 = -r3*PERIOD;
  float zmin = uCamZ - (PERIOD - 1.5);
  float z = z0 + PERIOD*ceil((zmin - z0)/PERIOD);
  float len = 0.7 + r4*1.8;
  float cyc = 2.0 + floor(r5*3.0);
  vec3 c = vec3(x, y + 0.35*sin(TAU*(uTime/LOOP*cyc + r6)), z);
  vec3 vd = c - uCamPos;
  float dist = length(vd);
  vec3 axis = vec3(0.0, 0.0, 1.0);
  vec3 side = normalize(cross(axis, vd/dist));
  float w = 0.025 + r5*0.04;
  vec3 p = c + axis*(aQuad.x*len*0.5) + side*(aQuad.y*w*3.0);
  vUv = aQuad;
  vec3 cA = vec3(0.35, 0.9, 1.0), cB = vec3(1.0, 0.35, 0.85), cW = vec3(1.0, 0.9, 1.0);
  vCol = mix(mix(cA, cB, step(0.5, r2)), cW, step(0.86, r4));
  vAlpha = smoothstep(1.5, 5.0, dist) * (1.0 - smoothstep(40.0, 130.0, dist)) * (0.3 + r3*0.7);
  gl_Position = uViewProj * vec4(p, 1.0);
}`;

const FS_PARTICLE = `#version 300 es
${GLSL_COMMON}
in vec2 vUv;
in vec3 vCol;
in float vAlpha;
out vec4 o;
void main(){
  float a = exp(-vUv.y*vUv.y*4.5) * (1.0 - vUv.x*vUv.x);
  a = a*a;
  o = vec4(vCol * a * vAlpha * 1.3, 1.0);
}`;

const FS_PREFILTER = `#version 300 es
${GLSL_COMMON}
in vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uTexel;
uniform float uThreshold, uKnee;
out vec4 o;
vec3 s(vec2 uv){ return texture(uTex, uv).rgb; }
vec3 pf(vec3 c){
  float br = max(c.r, max(c.g, c.b));
  float soft = clamp(br - uThreshold + uKnee, 0.0, 2.0*uKnee);
  soft = soft*soft/(4.0*uKnee + 1e-5);
  float contrib = max(soft, br - uThreshold) / max(br, 1e-5);
  return c * contrib;
}
void main(){
  vec2 t = uTexel;
  vec3 A = pf(s(vUv + t*vec2(-2,-2))), B = pf(s(vUv + t*vec2(0,-2))), C = pf(s(vUv + t*vec2(2,-2)));
  vec3 D = pf(s(vUv + t*vec2(-1,-1))), E = pf(s(vUv + t*vec2(1,-1)));
  vec3 F = pf(s(vUv + t*vec2(-2,0))), G = pf(s(vUv)), Hh = pf(s(vUv + t*vec2(2,0)));
  vec3 I = pf(s(vUv + t*vec2(-1,1))), J = pf(s(vUv + t*vec2(1,1)));
  vec3 K = pf(s(vUv + t*vec2(-2,2))), L = pf(s(vUv + t*vec2(0,2))), M = pf(s(vUv + t*vec2(2,2)));
  vec3 r = (D+E+I+J)*0.125 + (A+B+F+G)*0.03125 + (B+C+G+Hh)*0.03125 + (F+G+K+L)*0.03125 + (G+Hh+L+M)*0.03125;
  o = vec4(r, 1.0);
}`;

const FS_DOWN = `#version 300 es
${GLSL_COMMON}
in vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uTexel;
out vec4 o;
vec3 s(vec2 uv){ return texture(uTex, uv).rgb; }
void main(){
  vec2 t = uTexel;
  vec3 A = s(vUv + t*vec2(-2,-2)), B = s(vUv + t*vec2(0,-2)), C = s(vUv + t*vec2(2,-2));
  vec3 D = s(vUv + t*vec2(-1,-1)), E = s(vUv + t*vec2(1,-1));
  vec3 F = s(vUv + t*vec2(-2,0)), G = s(vUv), Hh = s(vUv + t*vec2(2,0));
  vec3 I = s(vUv + t*vec2(-1,1)), J = s(vUv + t*vec2(1,1));
  vec3 K = s(vUv + t*vec2(-2,2)), L = s(vUv + t*vec2(0,2)), M = s(vUv + t*vec2(2,2));
  vec3 r = (D+E+I+J)*0.125 + (A+B+F+G)*0.03125 + (B+C+G+Hh)*0.03125 + (F+G+K+L)*0.03125 + (G+Hh+L+M)*0.03125;
  o = vec4(r, 1.0);
}`;

const FS_UP = `#version 300 es
${GLSL_COMMON}
in vec2 vUv;
uniform sampler2D uTex;    // smaller level (to be upsampled)
uniform sampler2D uBase;   // same-size level to add to
uniform vec2 uTexel;       // texel of uTex * radius
out vec4 o;
vec3 s(vec2 uv){ return texture(uTex, uv).rgb; }
void main(){
  vec2 t = uTexel;
  vec3 c = s(vUv + t*vec2(-1,-1)) + 2.0*s(vUv + t*vec2(0,-1)) + s(vUv + t*vec2(1,-1))
         + 2.0*s(vUv + t*vec2(-1,0)) + 4.0*s(vUv) + 2.0*s(vUv + t*vec2(1,0))
         + s(vUv + t*vec2(-1,1)) + 2.0*s(vUv + t*vec2(0,1)) + s(vUv + t*vec2(1,1));
  o = vec4(texture(uBase, vUv).rgb + c/16.0, 1.0);
}`;

const FS_COMPOSITE = `#version 300 es
${GLSL_COMMON}
in vec2 vUv;
uniform sampler2D uScene, uBloom;
uniform float uBloomStr, uExposure, uFrame;
uniform vec2 uRes;
out vec4 o;
vec3 aces(vec3 x){ return clamp((x*(2.51*x + 0.03))/(x*(2.43*x + 0.59) + 0.14), 0.0, 1.0); }
void main(){
  vec2 c = vUv - 0.5;
  float r2 = dot(c, c);
  vec2 off = c * (0.0075 * r2);                  // radial chromatic aberration
  vec3 col;
  col.r = texture(uScene, vUv + off).r + texture(uBloom, vUv + off).r * uBloomStr;
  col.g = texture(uScene, vUv).g       + texture(uBloom, vUv).g       * uBloomStr;
  col.b = texture(uScene, vUv - off).b + texture(uBloom, vUv - off).b * uBloomStr;
  float vig = 1.0 - 0.36*smoothstep(0.10, 0.62, r2*1.35);
  col *= vig * uExposure;
  col = aces(col);
  float g = hash21(gl_FragCoord.xy + vec2(uFrame*7.31, uFrame*3.17)) - 0.5;
  col += g * 0.018;
  o = vec4(col, 1.0);
}`;

/* ----------------------------- helpers ---------------------------- */

function compile(type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(sh);
    throw new Error('Shader compile error:\n' + log + '\n' + src.split('\n').map((l, i) => (i + 1) + ': ' + l).join('\n'));
  }
  return sh;
}
function program(vs, fs, attribs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  if (attribs) attribs.forEach((a, i) => gl.bindAttribLocation(p, i, a));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('Link error: ' + gl.getProgramInfoLog(p));
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); u[info.name] = gl.getUniformLocation(p, info.name); }
  return { p, u };
}
function makeTex(w, h) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, COLOR_FMT, w, h, 0, gl.RGBA, COLOR_TYPE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
function makeFBO(w, h, withDepth) {
  const tex = makeTex(w, h);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  if (withDepth) {
    const rb = gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER, rb);
    gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, w, h);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, rb);
  }
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { fb, tex, w, h, ok };
}
function makeMSAA(w, h, samples) {
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  const cb = gl.createRenderbuffer();
  gl.bindRenderbuffer(gl.RENDERBUFFER, cb);
  gl.renderbufferStorageMultisample(gl.RENDERBUFFER, samples, COLOR_FMT, w, h);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, cb);
  const db = gl.createRenderbuffer();
  gl.bindRenderbuffer(gl.RENDERBUFFER, db);
  gl.renderbufferStorageMultisample(gl.RENDERBUFFER, samples, gl.DEPTH_COMPONENT24, w, h);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, db);
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE && gl.getError() === gl.NO_ERROR;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { fb, w, h, ok };
}

/* ------------------------------ math ------------------------------ */

function perspective(fovy, aspect, near, far) {
  const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
  return new Float32Array([f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) * nf, -1, 0, 0, 2 * far * near * nf, 0]);
}
function mul4(a, b) {
  const o = new Float32Array(16);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
    o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
  }
  return o;
}
function norm(v) { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; }
function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }

/* ---------------------------- resources --------------------------- */

let progSky, progTerrain, progPylon, progParticle, progPrefilter, progDown, progUp, progComposite;
try {
  progSky = program(VS_FULL, FS_SKY);
  progTerrain = program(VS_TERRAIN, FS_TERRAIN, ['aPos']);
  progPylon = program(VS_PYLON, FS_PYLON, ['aQuad']);
  progParticle = program(VS_PARTICLE, FS_PARTICLE, ['aQuad']);
  progPrefilter = program(VS_FULL, FS_PREFILTER);
  progDown = program(VS_FULL, FS_DOWN);
  progUp = program(VS_FULL, FS_UP);
  progComposite = program(VS_FULL, FS_COMPOSITE);
} catch (e) {
  errBox.style.display = 'block';
  errBox.textContent = String(e.message || e);
  return;
}

// terrain mesh: vertices on integer world coordinates
const NX = MESH_X * 2 + 1, NZ = MESH_Z_BACK + MESH_Z_FWD + 1;
const verts = new Float32Array(NX * NZ * 2);
{
  let k = 0;
  for (let j = 0; j < NZ; j++) {
    const z = MESH_Z_BACK - j;
    for (let i = 0; i < NX; i++) { verts[k++] = i - MESH_X; verts[k++] = z; }
  }
}
const idx = new Uint32Array((NX - 1) * (NZ - 1) * 6);
{
  let k = 0;
  for (let j = 0; j < NZ - 1; j++) for (let i = 0; i < NX - 1; i++) {
    const a = j * NX + i, b = a + 1, c = a + NX, d = c + 1;
    idx[k++] = a; idx[k++] = c; idx[k++] = b;
    idx[k++] = b; idx[k++] = c; idx[k++] = d;
  }
}
const terrainVAO = gl.createVertexArray();
gl.bindVertexArray(terrainVAO);
const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const ibo = gl.createBuffer();
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);
gl.bindVertexArray(null);

// billboard quad (pylons)
const quadVAO = gl.createVertexArray();
gl.bindVertexArray(quadVAO);
const qbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, qbo);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, 0, 1, 0, -1, 1, 1, 1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
gl.bindVertexArray(null);

// centred quad (particles)
const quad2VAO = gl.createVertexArray();
gl.bindVertexArray(quad2VAO);
const q2bo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, q2bo);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
gl.bindVertexArray(null);

const emptyVAO = gl.createVertexArray();

// framebuffers
let msaa = SAMPLES > 1 ? makeMSAA(W, H, SAMPLES) : null;
if (msaa && !msaa.ok) { msaa = null; SAMPLES = 0; }
const sceneFBO = makeFBO(W, H, !msaa);
const mips = [];
{
  let w = W >> 1, h = H >> 1;
  for (let i = 0; i < 6 && w >= 8 && h >= 8; i++) {
    mips.push({ down: makeFBO(w, h, false), up: makeFBO(w, h, false), w, h });
    w >>= 1; h >>= 1;
  }
}

/* ------------------------------ scene ----------------------------- */

const proj = perspective(FOVY, ASPECT, 0.1, 700);
const tanFovY = Math.tan(FOVY / 2), tanFovX = tanFovY * ASPECT;
const sunDir = norm([0, Math.sin(SUN_ELEV), -Math.cos(SUN_ELEV)]);
const sunRight = norm(cross(sunDir, [0, 1, 0]));
const sunUp = norm(cross(sunRight, sunDir));
const sunR = Math.tan(SUN_RADIUS_DEG * Math.PI / 180);

function camera(t) {
  const ph = t / LOOP;               // 0..1, all motion uses integer cycles per loop
  const w = 2 * Math.PI;
  const sx = 1.25 * Math.sin(w * ph) + 0.45 * Math.sin(w * 3 * ph + 1.3);
  const dsx = 1.25 * Math.cos(w * ph) * (w / LOOP) + 0.45 * Math.cos(w * 3 * ph + 1.3) * (3 * w / LOOP);
  const bob = 0.05 * Math.sin(w * 7 * ph) + 0.03 * Math.sin(w * 11 * ph + 0.7);
  const cz = -SPEED * t;
  const eye = [sx, 2.4 + bob, cz];
  const yaw = Math.atan2(dsx, SPEED) * 0.9 + 0.012 * Math.sin(w * 5 * ph + 2.1);
  const pitch = 0.020 + 0.006 * Math.sin(w * 3 * ph + 0.4);
  const roll = -dsx * 0.03 + 0.006 * Math.sin(w * 4 * ph + 1.0);
  let fwd = norm([Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch)]);
  let right = norm(cross(fwd, [0, 1, 0]));
  let up = cross(right, fwd);
  const cr = Math.cos(roll), sr = Math.sin(roll);
  const right2 = [right[0] * cr + up[0] * sr, right[1] * cr + up[1] * sr, right[2] * cr + up[2] * sr];
  const up2 = [-right[0] * sr + up[0] * cr, -right[1] * sr + up[1] * cr, -right[2] * sr + up[2] * cr];
  right = right2; up = up2;
  const view = new Float32Array([
    right[0], up[0], -fwd[0], 0,
    right[1], up[1], -fwd[1], 0,
    right[2], up[2], -fwd[2], 0,
    -dot(right, eye), -dot(up, eye), dot(fwd, eye), 1
  ]);
  return { eye, fwd, right, up, viewProj: mul4(proj, view), cz };
}

function drawFull() { gl.bindVertexArray(emptyVAO); gl.drawArrays(gl.TRIANGLES, 0, 3); }

function render(t) {
  const cam = camera(t);
  const frame = Math.floor(t * 60);

  // ---- scene pass ----
  gl.bindFramebuffer(gl.FRAMEBUFFER, msaa ? msaa.fb : sceneFBO.fb);
  gl.viewport(0, 0, W, H);
  gl.disable(gl.BLEND);
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);
  gl.depthMask(true);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  // sky
  gl.depthMask(false);
  gl.useProgram(progSky.p);
  gl.uniform3fv(progSky.u.uCamRight, cam.right);
  gl.uniform3fv(progSky.u.uCamUp, cam.up);
  gl.uniform3fv(progSky.u.uCamFwd, cam.fwd);
  gl.uniform2f(progSky.u.uTanFov, tanFovX, tanFovY);
  gl.uniform3fv(progSky.u.uSunDir, sunDir);
  gl.uniform3fv(progSky.u.uSunRight, sunRight);
  gl.uniform3fv(progSky.u.uSunUp, sunUp);
  gl.uniform1f(progSky.u.uSunR, sunR);
  gl.uniform1f(progSky.u.uTime, t);
  drawFull();
  gl.depthMask(true);

  // terrain
  gl.useProgram(progTerrain.p);
  gl.uniformMatrix4fv(progTerrain.u.uViewProj, false, cam.viewProj);
  gl.uniform1f(progTerrain.u.uZBase, Math.floor(cam.cz));
  gl.uniform3fv(progTerrain.u.uCamPos, cam.eye);
  gl.uniform3fv(progTerrain.u.uSunDir, sunDir);
  gl.uniform1f(progTerrain.u.uTime, t);
  gl.uniform1f(progTerrain.u.uLineW, 1.0 + H / 2160);
  gl.bindVertexArray(terrainVAO);
  gl.drawElements(gl.TRIANGLES, idx.length, gl.UNSIGNED_INT, 0);

  // emissive additive elements
  gl.depthMask(false);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);

  gl.useProgram(progPylon.p);
  gl.uniformMatrix4fv(progPylon.u.uViewProj, false, cam.viewProj);
  gl.uniform3fv(progPylon.u.uCamPos, cam.eye);
  gl.uniform1f(progPylon.u.uCamZ, cam.cz);
  gl.uniform1f(progPylon.u.uSpacing, PYLON_SPACING);
  gl.uniform1f(progPylon.u.uTime, t);
  gl.bindVertexArray(quadVAO);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, NUM_PYLONS);

  gl.useProgram(progParticle.p);
  gl.uniformMatrix4fv(progParticle.u.uViewProj, false, cam.viewProj);
  gl.uniform3fv(progParticle.u.uCamPos, cam.eye);
  gl.uniform1f(progParticle.u.uCamZ, cam.cz);
  gl.uniform1f(progParticle.u.uTime, t);
  gl.bindVertexArray(quad2VAO);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, NUM_PARTICLES);

  gl.disable(gl.BLEND);
  gl.disable(gl.DEPTH_TEST);
  gl.depthMask(true);

  // ---- resolve MSAA ----
  if (msaa) {
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, msaa.fb);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, sceneFBO.fb);
    gl.blitFramebuffer(0, 0, W, H, 0, 0, W, H, gl.COLOR_BUFFER_BIT, gl.NEAREST);
  }

  // ---- bloom: prefilter + downsample chain ----
  gl.activeTexture(gl.TEXTURE0);
  gl.useProgram(progPrefilter.p);
  gl.bindFramebuffer(gl.FRAMEBUFFER, mips[0].down.fb);
  gl.viewport(0, 0, mips[0].w, mips[0].h);
  gl.bindTexture(gl.TEXTURE_2D, sceneFBO.tex);
  gl.uniform1i(progPrefilter.u.uTex, 0);
  gl.uniform2f(progPrefilter.u.uTexel, 1 / W, 1 / H);
  gl.uniform1f(progPrefilter.u.uThreshold, HDR ? 1.0 : 0.6);
  gl.uniform1f(progPrefilter.u.uKnee, HDR ? 0.5 : 0.3);
  drawFull();

  gl.useProgram(progDown.p);
  gl.uniform1i(progDown.u.uTex, 0);
  for (let i = 1; i < mips.length; i++) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, mips[i].down.fb);
    gl.viewport(0, 0, mips[i].w, mips[i].h);
    gl.bindTexture(gl.TEXTURE_2D, mips[i - 1].down.tex);
    gl.uniform2f(progDown.u.uTexel, 1 / mips[i - 1].w, 1 / mips[i - 1].h);
    drawFull();
  }

  // ---- bloom: upsample chain ----
  gl.useProgram(progUp.p);
  gl.uniform1i(progUp.u.uTex, 0);
  gl.uniform1i(progUp.u.uBase, 1);
  let prev = mips[mips.length - 1].down;
  for (let i = mips.length - 2; i >= 0; i--) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, mips[i].up.fb);
    gl.viewport(0, 0, mips[i].w, mips[i].h);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, prev.tex);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, mips[i].down.tex);
    gl.uniform2f(progUp.u.uTexel, 1.4 / prev.w, 1.4 / prev.h);
    drawFull();
    prev = mips[i].up;
  }

  // ---- composite to screen ----
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.useProgram(progComposite.p);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, sceneFBO.tex);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, prev.tex);
  gl.uniform1i(progComposite.u.uScene, 0);
  gl.uniform1i(progComposite.u.uBloom, 1);
  gl.uniform1f(progComposite.u.uBloomStr, HDR ? 0.07 : 0.14);
  gl.uniform1f(progComposite.u.uExposure, 1.0);
  gl.uniform1f(progComposite.u.uFrame, frame);
  gl.uniform2f(progComposite.u.uRes, W, H);
  drawFull();
  gl.activeTexture(gl.TEXTURE0);
}

/* ------------------------------ loop ------------------------------ */

let t0 = -1;
function loopTime(now) {
  if (t0 < 0) t0 = now;
  const s = (now - t0) / 1000;
  return s - Math.floor(s / LOOP) * LOOP;
}
function frame(now) {
  render(loopTime(now));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
