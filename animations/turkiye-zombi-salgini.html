const W=1920,H=1080,SC=2,TAU=Math.PI*2,PI=Math.PI;
const cv=document.getElementById('c');
cv.width=W*SC;cv.height=H*SC;
const MAIN=cv.getContext('2d',{alpha:false});
let ctx=MAIN;
function fit(){const s=Math.min(innerWidth/(W*SC),innerHeight/(H*SC));cv.style.width=(W*SC*s)+'px';cv.style.height=(H*SC*s)+'px';}
addEventListener('resize',fit);fit();

// ---------- math ----------
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const inv=(a,b,v)=>clamp((v-a)/(b-a));
const E={
 o2:t=>1-(1-t)*(1-t), o3:t=>1-Math.pow(1-t,3), o5:t=>1-Math.pow(1-t,5),
 i2:t=>t*t, i3:t=>t*t*t,
 io2:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,
 io3:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
 ob:t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);},
 ob2:t=>{const c1=3,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);},
 el:t=>t<=0?0:t>=1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*(2*PI/3))+1
};
function hash(n){n=Math.sin(n*127.1+311.7)*43758.5453123;return n-Math.floor(n);}
function h2(a,b){return hash(a*57.13+b*113.77);}
function vn(x){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hash(i),hash(i+1),u)*2-1;}
const ap=(t,a,d=.35)=>clamp((t-a)/d);
const pulse=(t,f=1)=>.5+.5*Math.sin(t*TAU*f);
// impulse response: sum of decaying kicks at times arr
function kick(t,arr,dec=6){let v=0;if(!arr)return 0;for(const a of arr){if(t>=a)v+=Math.exp(-(t-a)*dec);}return Math.min(v,1.5);}
function lastHit(t,arr){let l=-1;if(arr)for(let i=0;i<arr.length;i++)if(t>=arr[i])l=i;return l;}

// ---------- drawing primitives ----------
function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function RR(x,y,w,h,r,c,st,sw){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(c){ctx.fillStyle=c;ctx.fill();}if(st){ctx.lineWidth=sw||2;ctx.strokeStyle=st;ctx.stroke();}}
function CI(x,y,r,c,st,sw){ctx.beginPath();ctx.arc(x,y,Math.max(r,0),0,TAU);if(c){ctx.fillStyle=c;ctx.fill();}if(st){ctx.lineWidth=sw||2;ctx.strokeStyle=st;ctx.stroke();}}
function EL(x,y,rx,ry,c,rot=0){ctx.beginPath();ctx.ellipse(x,y,Math.max(rx,0),Math.max(ry,0),rot,0,TAU);ctx.fillStyle=c;ctx.fill();}
function LN(x1,y1,x2,y2,c,w=2,cap='round'){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap=cap;ctx.stroke();}
function PL(pts,c,close=true,st,sw){ctx.beginPath();ctx.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)ctx.lineTo(pts[i],pts[i+1]);if(close)ctx.closePath();if(c){ctx.fillStyle=c;ctx.fill();}if(st){ctx.strokeStyle=st;ctx.lineWidth=sw||2;ctx.lineJoin='round';ctx.stroke();}}
function LG(x0,y0,x1,y1,st){const g=ctx.createLinearGradient(x0,y0,x1,y1);st.forEach((c,i)=>Array.isArray(c)?g.addColorStop(c[0],c[1]):g.addColorStop(i/(st.length-1),c));return g;}
function RG(x,y,r0,r1,st){const g=ctx.createRadialGradient(x,y,r0,x,y,r1);st.forEach((c,i)=>Array.isArray(c)?g.addColorStop(c[0],c[1]):g.addColorStop(i/(st.length-1),c));return g;}
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
function mix(h1,h2,t){const a=parseInt(h1.slice(1),16),b=parseInt(h2.slice(1),16);const r=Math.round(lerp(a>>16&255,b>>16&255,t)),g=Math.round(lerp(a>>8&255,b>>8&255,t)),bl=Math.round(lerp(a&255,b&255,t));return '#'+((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1);}
function glow(x,y,r,c,a=1){ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha*=a;ctx.fillStyle=RG(x,y,0,r,[rgba(c,1),rgba(c,.35),rgba(c,0)]);ctx.fillRect(x-r,y-r,r*2,r*2);ctx.restore();}
function bg(c1,c2,c3){ctx.fillStyle=c3?LG(0,0,0,H,[c1,c2,c3]):LG(0,0,0,H,[c1,c2||c1]);ctx.fillRect(-200,-200,W+400,H+400);}
function shadowOn(c,b,ox=0,oy=0){ctx.shadowColor=c;ctx.shadowBlur=b*SC;ctx.shadowOffsetX=ox*SC;ctx.shadowOffsetY=oy*SC;}
function shadowOff(){ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;}

// text
function T(str,x,y,size,col,o={}){
 ctx.save();ctx.font=(o.w||'')+' '+size+'px '+(o.f||FH);
 ctx.textAlign=o.a||'center';ctx.textBaseline=o.b||'middle';
 if(o.ls)ctx.letterSpacing=o.ls+'px';
 if(o.al!=null)ctx.globalAlpha*=o.al;
 if(o.rot){ctx.translate(x,y);ctx.rotate(o.rot);x=0;y=0;}
 if(o.glow)shadowOn(o.glow,o.gb||24);
 if(o.sw){ctx.lineJoin='round';ctx.lineWidth=o.sw;ctx.strokeStyle=o.sc||C.ink;ctx.strokeText(str,x,y);}
 if(o.ds){ctx.fillStyle=o.dsc||'rgba(0,0,0,.55)';ctx.fillText(str,x+o.ds,y+o.ds);}
 ctx.fillStyle=col;ctx.fillText(str,x,y);ctx.restore();
}
function TW(str,size,f=FH,w=''){ctx.save();ctx.font=w+' '+size+'px '+f;const m=ctx.measureText(str).width;ctx.restore();return m;}

// ---------- kinetic typography ----------
function parseRich(s){return s.split('\n').map(line=>{const out=[];let hl=false;line.split(' ').filter(Boolean).forEach(tok=>{let w=tok,st=hl;if(w.startsWith('*')){st=true;w=w.slice(1);}let end=false;if(w.endsWith('*')){end=true;w=w.slice(0,-1);}out.push({w,hl:st});hl=st&&!end;});return out;});}
// o: col, hl, box, style(pop|up|slam|type|wave), st(stagger), a(align), f, w, sw, lh, shake, boxc, rot
function kin(str,x,y,size,t,o={}){
 const lines=parseRich(str),f=o.f||FH,wt=o.w||'',st=o.st!=null?o.st:.07,lh=(o.lh||1.08)*size;
 ctx.save();ctx.font=wt+' '+size+'px '+f;ctx.textBaseline='middle';ctx.textAlign='center';
 if(o.ls)ctx.letterSpacing=o.ls+'px';
 const sp=size*.26;let idx=0;const tot=lines.reduce((a,l)=>a+l.length,0);
 const y0=y-(lines.length-1)*lh/2;
 lines.forEach((ln,li)=>{
  const ws=ln.map(k=>ctx.measureText(k.w).width);const lw=ws.reduce((a,b)=>a+b,0)+sp*(ln.length-1);
  let cx=o.a==='left'?x:o.a==='right'?x-lw:x-lw/2;const ly=y0+li*lh;
  ln.forEach((k,i)=>{
   const ww=ws[i],wx=cx+ww/2;cx+=ww+sp;const ti=(o.rev?tot-1-idx:idx)*st;idx++;
   let p=clamp((t-ti)/(o.dur||.32));if(p<=0)return;
   ctx.save();let sc=1,dy=0,al=1,rot=0;
   const sty=o.style||'pop';
   if(sty==='pop'){sc=lerp(.2,1,E.ob2(p));al=clamp(p*3);}
   else if(sty==='up'){dy=(1-E.o3(p))*size*.7;al=p;}
   else if(sty==='slam'){sc=lerp(2.6,1,E.o5(p));al=clamp(p*2.5);}
   else if(sty==='drop'){dy=-(1-E.ob(p))*size*1.2;al=clamp(p*3);rot=(1-p)*(hash(idx)-.5)*.6;}
   else if(sty==='type'){al=p>0?1:0;}
   if(o.wave)dy+=Math.sin(t*6+idx)*size*.04;
   if(o.jit){dy+=vn(t*20+idx*7)*o.jit;}
   ctx.translate(wx,ly+dy);ctx.rotate(rot+(o.rot||0));ctx.scale(sc,sc);ctx.globalAlpha*=al;
   if(k.hl&&o.box){const bh=size*1.08,pad=size*.16;ctx.save();ctx.rotate(-.02);RR(-ww/2-pad,-bh/2,ww+pad*2,bh,size*.12,o.boxc||o.hl||C.blood);ctx.restore();}
   const col=k.hl?(o.box?(o.boxt||C.white):(o.hl||C.blood)):(o.col||C.white);
   if(o.sw!==0&&!(k.hl&&o.box)){ctx.lineJoin='round';ctx.lineWidth=o.sw||size*.13;ctx.strokeStyle=o.sc||'rgba(4,5,10,.92)';ctx.strokeText(k.w,0,0);}
   if(o.glow&&k.hl){shadowOn(o.glow,o.gb||30);}
   ctx.fillStyle=col;ctx.fillText(k.w,0,0);
   ctx.restore();
  });
 });
 ctx.restore();
}

// ---------- camera ----------
// o: z0,z1,x0,x1,y0,y1,r0,r1,ease,sh (shake amp),shf
function cam(t,d,o={}){
 const p=(o.ease||E.io2)(clamp(t/Math.max(d,.01)));
 const z=lerp(o.z0??1,o.z1??1.07,p),x=lerp(o.x0||0,o.x1||0,p),y=lerp(o.y0||0,o.y1||0,p),r=lerp(o.r0||0,o.r1||0,p);
 let sx=0,sy=0;if(o.sh){sx=vn(t*(o.shf||14))*o.sh;sy=vn(t*(o.shf||14)+77)*o.sh;}
 ctx.save();ctx.translate(W/2+sx,H/2+sy);ctx.rotate(r);ctx.scale(z,z);ctx.translate(-W/2-x,-H/2-y);
}
const camEnd=()=>ctx.restore();

// ---------- particles (deterministic) ----------
function dust(t,n,col,o={}){ // floating motes
 const sp=o.sp||20,sz=o.sz||3,a=o.a||.5;ctx.save();ctx.globalCompositeOperation=o.add===false?'source-over':'lighter';
 for(let i=0;i<n;i++){const x=(hash(i*3.1+(o.seed||0))*W*1.2+vn(t*.2+i)*60+t*(o.vx||8))%(W*1.2)-W*.1;
  const y=(hash(i*7.7+(o.seed||0))*H*1.2-t*sp*(.5+hash(i))+H*50)%(H*1.2)-H*.1;
  const s=sz*(.4+hash(i*1.3)*1.2);ctx.globalAlpha=a*(.3+.7*pulse(t*.3+hash(i)));CI(x,y,s,col);}
 ctx.restore();
}
function rain(t,n,col,o={}){const ang=o.ang||.18,len=o.len||40,sp=o.sp||1400;ctx.save();ctx.strokeStyle=col;ctx.lineWidth=o.w||1.6;ctx.globalAlpha=o.a||.35;ctx.beginPath();
 for(let i=0;i<n;i++){const x=(hash(i*1.7)*W*1.3+t*sp*ang)%(W*1.3)-W*.15;const y=(hash(i*9.1)*H*1.3+t*sp*(.8+.4*hash(i)))%(H*1.3)-H*.15;ctx.moveTo(x,y);ctx.lineTo(x-len*ang,y-len);}ctx.stroke();ctx.restore();}
function embers(t,n,o={}){ctx.save();ctx.globalCompositeOperation='lighter';for(let i=0;i<n;i++){const life=(t*(o.sp||.25)+hash(i*5.3))%1;const x=hash(i*2.9)*W+Math.sin(t*2+i)*30+life*80;const y=H+20-life*H*(o.h||1.1);const c=i%3?C.ember:C.amber;ctx.globalAlpha=(1-life)*.9;CI(x,y,2+hash(i)*3,c);}ctx.restore();}
function stars(t,n,a=1,seed=0){ctx.save();for(let i=0;i<n;i++){const x=hash(i*4.1+seed)*W,y=hash(i*8.3+seed)*H*.7;ctx.globalAlpha=a*(.3+.7*pulse(t*.4+hash(i*2)))*(hash(i*1.9)>.9?1:.6);CI(x,y,hash(i)*1.8+.4,'#fff');}ctx.restore();}
function fog(t,y,h,col,a=.35,sp=20){ctx.save();ctx.globalAlpha=a;for(let i=0;i<5;i++){const x=((t*sp*(1+i*.3)+i*400)%(W+800))-400;ctx.fillStyle=RG(x,y+Math.sin(i)*h*.3,0,h*1.5,[rgba(col,.8),rgba(col,0)]);ctx.fillRect(x-h*1.5,y-h*1.5,h*3,h*3);}ctx.restore();}
function rays(cx,cy,t,col,n=14,a=.12,len=1600){ctx.save();ctx.globalCompositeOperation='lighter';ctx.translate(cx,cy);ctx.rotate(t*.15);for(let i=0;i<n;i++){ctx.rotate(TAU/n);ctx.globalAlpha=a*(.5+.5*Math.sin(t+i));ctx.fillStyle=LG(0,0,len,0,[rgba(col,.9),rgba(col,0)]);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(len,-len*.07);ctx.lineTo(len,len*.07);ctx.fill();}ctx.restore();}
function speedLines(t,col,a=.5,n=60,cx=W/2,cy=H/2){ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=col;for(let i=0;i<n;i++){const an=hash(i*3.3)*TAU,r0=300+((t*2.5+hash(i))%1)*900,l=80+hash(i*2)*200;ctx.lineWidth=1+hash(i*5)*3;LN(cx+Math.cos(an)*r0,cy+Math.sin(an)*r0,cx+Math.cos(an)*(r0+l),cy+Math.sin(an)*(r0+l),col,1+hash(i*5)*3);}ctx.restore();}
function scanBars(t,col,a=.06){ctx.save();ctx.globalAlpha=a;for(let y=(t*60)%8;y<H;y+=8)R(0,y,W,2,col);ctx.restore();}
function halftone(col,a=.12,step=22,cx=W/2,cy=H/2){ctx.save();ctx.globalAlpha=a;ctx.fillStyle=col;for(let y=0;y<H;y+=step)for(let x=(y/step%2)*step/2;x<W;x+=step){const d=Math.hypot(x-cx,y-cy)/1100;const r=step*.42*(1-clamp(d));if(r>.5){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}}ctx.restore();}

function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
const BUF=mk(W*SC,H*SC),BX=BUF.getContext('2d');
const VIG=(()=>{const c=mk(960,540),x=c.getContext('2d');const g=x.createRadialGradient(480,270,180,480,270,620);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.7,'rgba(0,0,0,.28)');g.addColorStop(1,'rgba(0,0,0,.82)');x.fillStyle=g;x.fillRect(0,0,960,540);return c;})();
const GRAIN=[0,1,2,3].map(k=>{const c=mk(640,360),x=c.getContext('2d'),id=x.createImageData(640,360);let s=k*999+1;for(let i=0;i<id.data.length;i+=4){s=(s*16807)%2147483647;const v=(s/2147483647)*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255;}x.putImageData(id,0,0);return c;});

// ---------- character label tag (lower third) ----------
function tag(x,y,t,title,sub,col=C.blood,o={}){
 const p=E.o3(clamp(t/.45));if(p<=0)return;ctx.save();ctx.globalAlpha*=clamp(p*2);
 const tw=Math.max(TW(title,o.s||54,FH)+title.length*1,sub?TW(sub,24,FU,'800')+sub.length*4.5:0)+70;
 ctx.beginPath();ctx.rect(x,y-50,tw*p+10,140);ctx.clip();

// ===================== WORD TIMELINE (char-rate alignment of the transcript) =====================
function nz(w){return w.toLocaleLowerCase('tr').replace(/[^a-zçğıöşü0-9]/g,'');}
const WD=[];
for(const [s,e,tx] of TR){const ws=tx.trim().split(/\s+/);const tot=tx.trim().length;let off=0;for(const w of ws){WD.push({w:nz(w),t:s+(off/tot)*(e-s)});off+=w.length+1;}}
function findP(ph,from){const ps=ph.split(/\s+/).map(nz).filter(Boolean);for(let i=from;i<WD.length;i++){let ok=true;for(let j=0;j<ps.length;j++){if(!WD[i+j]||WD[i+j].w!==ps[j]){ok=false;break;}}if(ok)return i;}return -1;}

// ===================== SHOT LIST (each cut anchored to a spoken phrase) =====================
const SH=[];let CUR=0;const MISS=[];
function S(ph,tpl,p={}){let t0,wi;if(typeof ph==='number'){t0=ph;wi=CUR;}else{const r=findP(ph,CUR);if(r<0){MISS.push(ph);t0=SH.length?SH[SH.length-1].t0+2:0;wi=CUR;}else{t0=Math.max(0,WD[r].t-.06+(p.dl||0));wi=r;CUR=r+1;}}SH.push({t0,tpl,p,wi});}

S('kenarları yıpranmış','note',{old:1,blood:1,lines:['Kaç buradan.','Hakkını helal et.'],cur:1,rate:60,sign:1,z0:1.3,z1:1.45,x0:200,x1:240,y0:-120,y1:-130,cap:'KAN LEKELERİ *KURUMUŞ*'});
S('kaç buradan hakkını','note',{old:1,blood:1,lines:['Kaç buradan.','Hakkını helal et.'],cur:1,rate:60,hl:[0,1],sign:1,tear:1,lb:1});
S('ve düşünüyorsun','face',{ch:'sen',expr:'sad',s:7,bgk:'indigo',cap:'VE *DÜŞÜNÜYORSUN*',hl:C.violet});
S('o sabah kapıyı açsaydın','alt',{m:'door',hud:false});
S('belki ona yardım','alt',{m:'help',cap:'ONA *YARDIM EDEBİLİRDİN*',hl:C.amber,boxt:C.ink,hud:false});
S('belki de şimdi','alt',{m:'zombie',cap:'BELKİ DE ŞİMDİ *ONUN YANINDA* OLURDUN',hl:C.toxic,boxt:C.ink,hud:false});
S('peki sen o sabah','poll',{hud:false});
S('cevabını yorumlara','comment',{hud:false,ph:'Cevabını yorumlara yaz...'});
S('bir de şunu yaz','title',{txt:'BİR DE *ŞUNU* YAZ:',bgk:'indigo',fx:'stripes',fxc:C.violet,hl:C.amber,box:true,boxt:C.ink,hud:false,sz:130});
S('sen hangi şehirde','tmap',{m:'pins',hud:false,cap:'SEN *HANGİ ŞEHİRDE* OLURDUN?'});
S('ve kaç gün dayanırdın','calendar',{rate:7,hud:false,cap:'KAÇ GÜN *DAYANIRDIN?*'});
S('bu hikaye seni','subscribe',{hud:false,k:['abone']});
S('çünkü bir sonraki','finale',{hud:false,txt:'BİR SONRAKİ SENARYO\n*ÇOK DAHA KARANLIK...*',tr:'black'});

// ===================== RUNTIME =====================
function finalize(){
 for(let i=0;i<SH.length;i++){const s=SH[i];s.t1=i<SH.length-1?SH[i+1].t0:END+3;const p=s.p;
  if(p.k){let c=s.wi;p._k=p.k.map((w,j)=>{if(typeof w==='number')return w;const r=findP(w,c);if(r<0||WD[r].t>s.t1+.3)return (s.t1-s.t0)*(j+1)/(p.k.length+1);c=r+1;return Math.max(0,WD[r].t-s.t0);});}}
 // day + location markers
 let c=0;for(const [ph,n,loc] of [['birinci gün',1,'ÜSKÜDAR · İSTANBUL'],['ikinci gün',2],['üçüncü gün',3],['birinci gün',4],['beşinci gün',5],['altıncı gün',6],['yedinci gün',7],['sekizinci gün',8,'BOLU DAĞI'],['dokuzuncu gün',9,'İÇ ANADOLU'],['onuncu gün',10,'KIRŞEHİR YOLU'],['on birinci gün',11,'KAPADOKYA'],['otuzuncu gün',30,'YERALTI ŞEHRİ']]){const r=findP(ph,c);if(r>=0){DAYS.push([WD[r].t+.9,n]);if(loc)LOCS.push([WD[r].t+.9,loc]);c=r+1;}}
 const r2=findP('karantina hattı',findP('garajdan çıkarken',0));if(r2>=0)LOCS.push([WD[r2].t,'İSTANBUL ÇIKIŞI']);LOCS.sort((a,b)=>a[0]-b[0]);
}
const DAYS=[],LOCS=[];
function dayAt(gt){let d=0;for(const [t,n] of DAYS)if(gt>=t)d=n;return d;}
function locAt(gt){let l='';for(const [t,n] of LOCS)if(gt>=t)l=n;return l;}
function shotAt(gt){let lo=0,hi=SH.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(SH[m].t0<=gt)lo=m;else hi=m-1;}return lo;}

// ---------- captions ----------
function caption(p,t,d){const s=p.cs||84,pos=p.cp||'b';let x=W/2,y=940,a='center';
 if(pos==='t')y=150;else if(pos==='c')y=H/2;else if(pos==='tl'){x=110;y=210;a='left';}else if(pos==='bl'){x=110;y=930;a='left';}else if(pos==='m')y=800;
 kin(p.cap,x,y,s,t-(p.cdl!=null?p.cdl:.1),{style:p.cst||'pop',hl:p.hl||C.blood,box:p.box!==false,boxc:p.hl||C.blood,boxt:p.boxt||C.white,a,st:p.cst2||.075,w:p.cw,f:p.cf});}

// ---------- HUD ----------
function hud(gt,p){if(p.hud===false)return;const dy=dayAt(gt);if(!dy)return;const loc=locAt(gt);
 ctx.save();const x=56,y=52;ctx.globalAlpha=.95;
 const lw=loc?TW(loc,22,FU,'800')+24:0;RR(x,y,200+lw+(loc?40:0),64,32,'rgba(6,8,16,.62)',rgba('#FFFFFF',.14),2);
 CI(x+34,y+32,9,C.blood);glow(x+34,y+32,26,C.blood,.5*pulse(gt,1));
 T('GÜN',x+58,y+33,34,C.white,{a:'left',ls:2});T(String(dy).padStart(2,'0'),x+124,y+33,34,C.amber,{a:'left'});
 if(loc){R(x+186,y+18,2,28,'rgba(255,255,255,.3)');T(loc,x+206,y+34,22,'#CBD3E6',{a:'left',f:FU,w:'800',ls:3});}
 ctx.restore();}

// ---------- grading per act (colour script) ----------
const GRADE=[[0,'#1E4D6B',.22],[86,'#2A2A6B',.18],[347,'#7A3E14',.2],[444,'#2E5A3A',.16],[568,'#6B4A1E',.18],[671,'#1E2E5A',.2],[838,'#8A5A1E',.18],[1026,'#7A3A1E',.2],[1128,'#3A1E4A',.2]];
function grade(gt,p){if(p.grade===false)return;let g=GRADE[0];for(const q of GRADE)if(gt>=q[0])g=q;ctx.save();ctx.globalCompositeOperation='soft-light';ctx.globalAlpha=g[2];R(0,0,W,H,p.gc||g[1]);ctx.restore();
 if(p.fb){ctx.save();ctx.globalCompositeOperation='color';ctx.globalAlpha=.55;R(0,0,W,H,'#B07A3A');ctx.globalCompositeOperation='soft-light';ctx.globalAlpha=.4;R(0,0,W,H,'#FFB060');ctx.restore();
  ctx.save();ctx.globalAlpha=.25;for(let i=0;i<5;i++){const sx=hash(Math.floor(gt*12)+i*7)*W;R(sx,0,1.5,H,'#fff');}ctx.restore();
  pill(W-150,64,'◷ GEÇMİŞ',rgba('#000000',.55),C.sand,24,{ls:3});}}

// ---------- transitions ----------
const TRS=['punch','glitch','flash','whip','punch','zoom','glitch','cut','punch','whip'];
function trans(type,t,i){const D=.32;if(t>D||type==='cut'||type==='none')return;const p=t/D;
 if(type==='flash'||type==='redflash'){ctx.save();ctx.globalAlpha=Math.pow(1-p,2)*.85;R(0,0,W,H,type==='flash'?'#FFFFFF':C.blood);ctx.restore();}
 else if(type==='black'){ctx.save();ctx.globalAlpha=1-E.o2(p);R(0,0,W,H,'#000');ctx.restore();}
 else if(type==='glitch'){BX.setTransform(1,0,0,1,0,0);BX.drawImage(cv,0,0);ctx.save();ctx.setTransform(1,0,0,1,0,0);const n=14,a=(1-p);
  for(let k=0;k<n;k++){const sy=Math.floor(h2(k,i)*cv.height),sh=Math.floor((20+h2(k*3,i)*160)*SC);const ox=(h2(k*7,i+1)-.5)*260*SC*a;ctx.drawImage(BUF,0,sy,cv.width,sh,ox,sy,cv.width,sh);}
  ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.35*a;ctx.drawImage(BUF,18*SC*a,0);ctx.restore();
  ctx.save();ctx.globalAlpha=.25*a;R(0,0,W,H,i%2?C.toxic:C.blood);ctx.restore();}
 else if(type==='whip'){BX.setTransform(1,0,0,1,0,0);BX.drawImage(cv,0,0);ctx.save();ctx.setTransform(1,0,0,1,0,0);const a=1-E.o3(p);for(let k=1;k<=6;k++){ctx.globalAlpha=.18*a;ctx.drawImage(BUF,k*60*SC*a*(i%2?1:-1),0);}ctx.restore();}
 if(type==='punch'||type==='zoom'){ctx.save();ctx.globalAlpha=.25*(1-p);R(0,0,W,H,'#fff');ctx.restore();}
}
// ---------- post ----------
function post(gt,p){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(VIG,0,0,cv.width,cv.height);
 ctx.globalCompositeOperation='overlay';ctx.globalAlpha=p.grain||.11;const g=GRAIN[Math.floor(gt*24)%4];ctx.imageSmoothingEnabled=false;ctx.drawImage(g,0,0,cv.width,cv.height);ctx.restore();
 if(p.lb){const k=E.o3(clamp((gt-p._t0)/.5))*(p.lb===true?110:p.lb);R(0,0,W,k,'#000');R(0,H-k,W,k,'#000');}}

// ---------- offscreen blur helper ----------
const OFF=mk(W*SC,H*SC),OX=OFF.getContext('2d');
function withBlur(px,fn){if(px<.3){fn();return;}const prev=ctx;ctx=OX;OX.setTransform(SC,0,0,SC,0,0);OX.fillStyle='#000';OX.fillRect(0,0,W,H);fn();ctx=prev;ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.filter=`blur(${px*SC}px)`;ctx.drawImage(OFF,0,0);ctx.filter='none';ctx.restore();}

// ---------- frame ----------
const LASTERR=new Set();
function renderAt(gt){
 gt=clamp(gt,0,END+2.99);ctx=MAIN;ctx.setTransform(SC,0,0,SC,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.filter='none';
 const i=shotAt(gt),sh=SH[i],t=gt-sh.t0,d=sh.t1-sh.t0,p=sh.p;p._t0=sh.t0;
 R(0,0,W,H,'#000');
 const tr=p.tr||TRS[Math.floor(hash(i*1.37)*TRS.length)];
 ctx.save();
 if(t<.3&&(tr==='punch'||tr==='zoom')){const z=tr==='punch'?1+.14*(1-E.o3(t/.3)):1-.1*(1-E.o3(t/.3));ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-W/2,-H/2);}
 try{(TPL[sh.tpl]||TPL.title)(t,d,p,gt);}catch(e){const k=sh.tpl+(sh.p.m||'');if(!LASTERR.has(k)){LASTERR.add(k);console.error('TPL',k,e);}}
 ctx.restore();ctx.setTransform(SC,0,0,SC,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';shadowOff();
 grade(gt,p);
 if(p.cap)caption(p,t,d);
 hud(gt,p);
 trans(tr,t,i);
 post(gt,p);
 if(gt>END+.2){ctx.save();ctx.setTransform(SC,0,0,SC,0,0);ctx.globalAlpha=clamp((gt-END-.2)/2.2);R(0,0,W,H,'#000');ctx.restore();}
}
finalize();
window.renderAt=renderAt;window.DURATION=END+3;window.SHOTS=SH;window.MISSING=MISS;
const QS=new URLSearchParams(location.search);const START=parseFloat(QS.get('t')||(location.hash.match(/t=([\d.]+)/)||[])[1]||0)||0;
let T0=null;
function loop(now){if(T0===null)T0=now;renderAt((now-T0)/1000+START);requestAnimationFrame(loop);}
if(!QS.has('manual'))requestAnimationFrame(loop);else renderAt(START);

</script>
