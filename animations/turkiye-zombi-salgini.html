<script>

'use strict';
/* =====================================================================

   Canvas 3840x2160 (drawn in 1920x1080 units, x2), autoplay, 1158 s
   ===================================================================== */
const cv = document.getElementById('c');
const c = cv.getContext('2d');
const W = 1920, H = 1080, SC = 2;
const PI = Math.PI, TAU = PI * 2;
const { sin, cos, tan, abs, min, max, sqrt, atan2, pow, hypot, round } = Math;
const flr = Math.floor;
const cl = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const pr = (t, a, b) => cl((t - a) / (b - a));
const eo = t => 1 - pow(1 - cl(t), 3);
const eo5 = t => 1 - pow(1 - cl(t), 5);
const ei = t => pow(cl(t), 3);
const eio = t => { t = cl(t); return t < .5 ? 4 * t * t * t : 1 - pow(-2 * t + 2, 3) / 2; };
const ss = (a, b, t) => { t = cl((t - a) / (b - a)); return t * t * (3 - 2 * t); };
const eob = (t, k = 1.70158) => { t = cl(t); const k3 = k + 1; return 1 + k3 * pow(t - 1, 3) + k * pow(t - 1, 2); };
const eel = t => { t = cl(t); return t === 0 ? 0 : t === 1 ? 1 : pow(2, -10 * t) * sin((t * 10 - .75) * TAU / 3) + 1; };

const pulse = (t, f = 1) => .5 + .5 * sin(t * TAU * f);
function RNG(seed) {
  let a = ((seed + 1) * 2654435761) >>> 0;
  return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
let TG = 0; // global time of current frame

/* ---------- colour ---------- */
const _cc = new Map();
function rgb(h) {
  let v = _cc.get(h); if (v) return v;
  let s = h[0] === '#' ? h.slice(1) : h; if (s.length === 3) s = s[0] + s[0] + s[1] + s[1] + s[2] + s[2];

  const r = x[0] + (y[0] - x[0]) * t | 0, g = x[1] + (y[1] - x[1]) * t | 0, bb = x[2] + (y[2] - x[2]) * t | 0;

/* Colour theory: dread teal-night base, toxic green (infection) vs. its complement blood/flag red (danger),
   and amber/ochre (home, candle, Anatolia, hope) as the complement of the cold teal. The film travels
   from cold teal/green (Istanbul) to warm amber/ochre (Cappadocia, underground). */

/* ---------- shapes ---------- */
function rr(x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, max(0, min(r, abs(w) / 2, abs(h) / 2))); }

function ln(x1, y1, x2, y2, col, w, cap = 'round') { c.strokeStyle = col; c.lineWidth = w; c.lineCap = cap; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); }

function LG(x1, y1, x2, y2, ...st) { const g = c.createLinearGradient(x1, y1, x2, y2); for (const s of st) g.addColorStop(s[0], s[1]); return g; }

const GLOW_N = 11;
function glow(x, y, r, col, a = 1, add = true) {
  if (r <= 0 || a <= 0) return; const o = c.globalCompositeOperation; if (add) c.globalCompositeOperation = 'lighter';
  c.fillStyle = RG(x, y, r, [0, rgba(col, a)], [.25, rgba(col, a * .5)], [1, rgba(col, 0)]); c.fillRect(x - r, y - r, r * 2, r * 2);
  c.globalCompositeOperation = o;
}
const _strips = new Map();
function gstrip(stops) {
  const key = stops.map(s => s[0] + s[1]).join('|'); let s = _strips.get(key);
  if (!s) { s = document.createElement('canvas'); s.width = 1; s.height = 1024; const x = s.getContext('2d'); const g = x.createLinearGradient(0, 0, 0, 1024); for (const st of stops) g.addColorStop(st[0], st[1]); x.fillStyle = g; x.fillRect(0, 0, 1, 1024); if (_strips.size > 300) _strips.clear(); _strips.set(key, s); }
  return s;
}
function gfill(x, y, w, h, ...stops) { c.drawImage(gstrip(stops), 0, 0, 1, 1024, x, y, w, h); }
const _bgc = new Map();
function cachedFull(key, draw) {
  let k = _bgc.get(key);
  if (!k) { k = document.createElement('canvas'); k.width = cv.width; k.height = cv.height; const x = k.getContext('2d'); x.setTransform(SC, 0, 0, SC, 0, 0); draw(x); if (_bgc.size >= 4) { const first = _bgc.keys().next().value; _bgc.delete(first); } _bgc.set(key, k); }
  c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.drawImage(k, 0, 0); c.restore();
}
function ellGlow(x, y, rx, ry, col, a = 1) { c.save(); c.translate(x, y); c.scale(1, ry / rx); glow(0, 0, rx, col, a); c.restore(); }
let BASE = null;
function screen(fn) { c.save(); if (BASE) c.setTransform(BASE); else c.setTransform(SC, 0, 0, SC, 0, 0); fn(); c.restore(); }
function fillScr(col, a = 1) { if (a <= 0) return; screen(() => { c.globalAlpha = cl(a); c.fillStyle = col; c.fillRect(-60, -60, W + 120, H + 120); }); }
function bgc(col) { screen(() => { c.fillStyle = col; c.fillRect(-60, -60, W + 120, H + 120); }); }
function vgrad(...st) { c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.drawImage(gstrip(st), 0, 0, 1, 1024, 0, 0, cv.width, cv.height); c.restore(); }
function cam(x, y, z = 1, r = 0) { c.translate(W / 2, H / 2); if (r) c.rotate(r); c.scale(z, z); c.translate(-x, -y); }
function camK(t, keys) { // keys: [[t,x,y,z,r],...]  eased camera path
  let k0 = keys[0], k1 = keys[keys.length - 1];
  for (let i = 0; i < keys.length - 1; i++) if (t >= keys[i][0] && t <= keys[i + 1][0]) { k0 = keys[i]; k1 = keys[i + 1]; break; }
  if (t < keys[0][0]) k1 = k0;
  const u = k1 === k0 ? 1 : eio(pr(t, k0[0], k1[0]));
  cam(lerp(k0[1], k1[1], u), lerp(k0[2], k1[2], u), lerp(k0[3], k1[3], u), lerp(k0[4] || 0, k1[4] || 0, u));

/* ---------- particles / atmosphere ---------- */
function motes(t, seed, n, col, a = .5, sz = 2.2, spd = 14, add = true) {
  const R = RNG(seed), o = c.globalCompositeOperation; if (add) c.globalCompositeOperation = 'lighter'; c.fillStyle = col;
  for (let i = 0; i < n; i++) {
    const bx = R() * W, by = R() * H, vx = (R() - .5) * spd, vy = (R() - .65) * spd, ph = R() * TAU, s = sz * (.35 + R() * .9);
    const x = (((bx + vx * t + sin(t * .6 + ph) * 14) % W) + W) % W, y = (((by + vy * t + cos(t * .5 + ph) * 10) % H) + H) % H;
    c.globalAlpha = a * (.3 + .7 * abs(sin(t * .9 + ph))); circ(x, y, s); c.fill();
  }
  c.globalAlpha = 1; c.globalCompositeOperation = o;
}
function rain(t, seed, n, col, a = .3, len = 46, spd = 1500, ang = .2) {
  const R = RNG(seed); c.strokeStyle = col; c.lineWidth = 1.7; c.globalAlpha = a; c.lineCap = 'round'; c.beginPath();
  const dx = sin(ang) * len, dy = cos(ang) * len;
  for (let i = 0; i < n; i++) {
    const bx = R() * (W + 500) - 250, by = R() * H, v = spd * (.7 + R() * .6);
    const y = (((by + v * t) % (H + 120)) + H + 120) % (H + 120) - 60, x = bx - y * tan(ang);
    c.moveTo(x, y); c.lineTo(x + dx, y + dy);
  }
  c.stroke(); c.globalAlpha = 1;
}
function embers(t, seed, n, col, a = .8, y0 = H + 20, spd = 90, sz = 2.6) {
  const R = RNG(seed), o = c.globalCompositeOperation; c.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const bx = R() * W, v = spd * (.5 + R()), life = H * (.6 + R() * .5), ph = R() * 100, s = sz * (.5 + R());
    const k = ((t * v + ph * 37) % life) / life, x = bx + sin(t * 1.3 + ph) * 30 + k * 60 * (R() - .5), y = y0 - k * life;
    c.globalAlpha = a * (1 - k) * (.5 + .5 * sin(t * 9 + ph)); dot(x, y, s, col);
  }
  c.globalAlpha = 1; c.globalCompositeOperation = o;
}
function fog(t, y, h, col, a = .22, seed = 3, n = 7, spd = 18) {
  const R = RNG(seed); c.fillStyle = col;
  for (let i = 0; i < n; i++) {
    const w = 420 + R() * 600, sp = spd * (.5 + R()), x = ((R() * (W + w * 2) + t * sp) % (W + w * 2)) - w, yy = y + (R() - .5) * h;
    for (let k = 0; k < 3; k++) { c.globalAlpha = a * .3; ell(x, yy, w * (1 - k * .28), w * .3 * (1 - k * .28)); c.fill(); }
  }
  c.globalAlpha = 1;
}
function beam(x1, y1, x2, y2, w1, w2, col, a = .3, add = true) {
  const dx = x2 - x1, dy = y2 - y1, L = hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L, o = c.globalCompositeOperation;
  if (add) c.globalCompositeOperation = 'lighter';
  pth([x1 + nx * w1, y1 + ny * w1, x2 + nx * w2, y2 + ny * w2, x2 - nx * w2, y2 - ny * w2, x1 - nx * w1, y1 - ny * w1]);
  c.fillStyle = LG(x1, y1, x2, y2, [0, rgba(col, a)], [1, rgba(col, 0)]); c.fill(); c.globalCompositeOperation = o;
}
function burst(x, y, r1, r2, n, col, rot = 0, seed = 1) {
  const R = RNG(seed); c.beginPath();
  for (let i = 0; i < n * 2; i++) { const a = rot + i / (n * 2) * TAU, r = i % 2 ? r1 * (.8 + R() * .3) : r2 * (.85 + R() * .3), px = x + cos(a) * r, py = y + sin(a) * r; i ? c.lineTo(px, py) : c.moveTo(px, py); }
  c.closePath(); c.fillStyle = col; c.fill();
}
function speedLines(t, cx, cy, col, a = .5, n = 70, seed = 5, r0 = 360) {
  const R = RNG(seed + flr(t * 18)); c.strokeStyle = col; c.globalAlpha = a; c.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const ang = R() * TAU, r1 = r0 + R() * 320, r2 = r1 + 200 + R() * 800; c.lineWidth = 1 + R() * 5;
    c.beginPath(); c.moveTo(cx + cos(ang) * r1, cy + sin(ang) * r1); c.lineTo(cx + cos(ang) * r2, cy + sin(ang) * r2); c.stroke();
  }

}
function hLines(t, col, a = .25, n = 30, seed = 2, spd = 2400, dir = -1) { // horizontal motion streaks
  const R = RNG(seed); c.fillStyle = col;
  for (let i = 0; i < n; i++) {
    const y = R() * H, w = 100 + R() * 500, v = spd * (.5 + R()), x = (((R() * W + dir * v * t) % (W + w)) + W + w) % (W + w) - w;
    c.globalAlpha = a * (.3 + R() * .7); c.fillRect(x, y, w, 1 + R() * 3);
  }
  c.globalAlpha = 1;
}
function stars(seed, n, a = .8, yMax = H * .6, t = 0) {
  const R = RNG(seed);
  for (let i = 0; i < n; i++) { const x = R() * W, y = R() * yMax, s = R() * 1.6 + .3, tw0 = .5 + .5 * sin(t * (1 + R() * 3) + R() * 9); c.globalAlpha = a * (.3 + .7 * tw0) * (1 - y / yMax * .6); dot(x, y, s, '#fff'); }

  c.save(); c.globalAlpha = a; c.fillStyle = col; c.translate(W / 2, H / 2); c.rotate(ang);
  const off = (t * spd) % (w * 2);

  for (let i = 0; i < n; i++) { const k = ((t * spd + i / n) % 1); ring(x, y, k * rmax, col, w * (1 - k) + .5, (1 - k) * .9); }

/* ---------- hits: shake + flashes ---------- */
const HIT = []; // [time, amp, flashColor]
function hit(t, a = 1, fl) { HIT.push([t, a, fl]); }
function shakeAt(T) { let s = 0; for (const h of HIT) { const d = T - h[0]; if (d >= 0 && d < 1.4) s += h[1] * Math.exp(-d * 6.5); } return s; }

/* ---------- grain ---------- */
const GRAIN = [];
for (let k = 0; k < 4; k++) {
  const g = document.createElement('canvas'); g.width = g.height = 256; const gx = g.getContext('2d');
  const id = gx.createImageData(256, 256); const R = RNG(77 + k);
  for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (R() - .5) * 190; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  gx.putImageData(id, 0, 0); GRAIN.push(c.createPattern(g, 'repeat'));
}

function face(r, fr, e, o) { // canonical coords (facing +x)

  const wide = (rad = r * .21, pp = r * .085, look = 0) => { for (const ex of [ex1, ex2]) { c.fillStyle = '#fff'; circ(ex, ey, rad); c.fill(); c.strokeStyle = OUT; c.lineWidth = r * .07; c.stroke(); dot(ex + (fr ? look * rad * .4 : rad * .3), ey, pp, OUT); } };
  const tears = () => { const tt = o.t || 0; for (const [i, ex] of [ex1, ex2].entries()) { const k = ((tt * .8 + i * .45) % 1); c.globalAlpha = 1 - k; dot(ex + r * .05, ey + r * .25 + k * r * .9, r * .09, '#7FD3FF'); c.globalAlpha = 1; } };

function drawHead(hx, hy, o, d, fr, angle = 0) {
