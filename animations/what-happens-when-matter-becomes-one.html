}
/* stage fit */
function fit() { const st = document.getElementById('stage'); const k = Math.min(innerWidth / 3840, innerHeight / 2160); st.style.transform = `scale(${k})`; st.style.left = ((innerWidth - 3840 * k) / 2) + 'px'; st.style.top = ((innerHeight - 2160 * k) / 2) + 'px'; }

window.DURATION = END;
function loop(now) { if (!MANUAL) { if (START === null) START = now; frame(T0 + (now - START) / 1000); } requestAnimationFrame(loop); }
frame(T0);
requestAnimationFrame(loop);
</script>
