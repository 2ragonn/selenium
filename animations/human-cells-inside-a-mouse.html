<!DOCTYPE html>
<html lang="en">

<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#03060E}
  #stage{position:absolute;left:0;top:0;width:3840px;height:2160px;transform-origin:0 0;overflow:hidden}
  canvas{display:block;width:3840px;height:2160px}
</style>

<body>
<div id="stage"><canvas id="c" width="3840" height="2160"></canvas></div>
<script>
/*
  HUMAN CELLS INSIDE A MOUSE — chimera explainer animation
  3840x2160 · autoplay · 568.34 s · synced to the voice-over timeline

  COLOR THEORY (built from the topic):
    The whole story is a contrast between two kinds of cells living in one body,
    so the palette is anchored on a COMPLEMENTARY pair:
      TEAL/CYAN  #2DE2E6  -> mouse / host tissue / lab science (cool, clinical)
      CORAL      #FF4D6D  -> human cells (warm, alive, "us")
    Split-complementary accents widen it without breaking harmony:
      AMBER      #FFB547  -> dates, discoveries, hybrids, highlights
      VIOLET     #8B5CFF  -> brain, consciousness, ethics (the "uneasy" line)
      MINT       #3DFFA2  -> stem cells, success, "it worked"
      RED        #FF2E4D  -> failure, warnings, disease
    All set on a deep blue-black (#03060E) so the bioluminescent hues glow.
*/
'use strict';

// ===== SETTINGS =====
// ALTYAZI / CAPTIONS: false = off (gizli), true = on (görünür)
const SHOW_CAPTIONS = false;

// ================================================================ CORE
const cv=document.getElementById('c'),g=cv.getContext('2d',{alpha:false});
const W=3840,H=2160,CX=1920,CY=1080,TAU=Math.PI*2,PI=Math.PI;
const FH='"Space Grotesk","Inter","Segoe UI",Roboto,system-ui,sans-serif';
const FB='"Inter","Segoe UI",Roboto,system-ui,sans-serif';
const FM='"JetBrains Mono","Cascadia Code",Consolas,ui-monospace,monospace';
const C={bg:'#03060E',ink:'#0A1226',cyan:'#2DE2E6',coral:'#FF4D6D',amber:'#FFB547',violet:'#8B5CFF',mint:'#3DFFA2',red:'#FF2E4D',blue:'#3D8BFF',white:'#F4F7FF',dim:'#7F8DB5',gold:'#E8C27A',rbc:'#C21838',pink:'#FF9EB0'};
let G=0; // global clock (s)

const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>{t=clamp(t);return t>=1?1:1-Math.pow(2,-10*t)};
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const eback=t=>{t=clamp(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const seg=(v,a,b)=>clamp((v-a)/(b-a));
const sin=Math.sin,cos=Math.cos,sq=Math.sqrt;
function rng(seed){let s=seed|0;return function(){s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(n){let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function hex2rgb(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
const _rc={};function rgba(h,a){const c=_rc[h]||(_rc[h]=hex2rgb(h));return`rgba(${c[0]},${c[1]},${c[2]},${a})`}
function mixc(h1,h2,t){const a=hex2rgb(h1),b=hex2rgb(h2);return'#'+[0,1,2].map(i=>Math.round(lerp(a[i],b[i],clamp(t))).toString(16).padStart(2,'0')).join('')}
const scratch=document.createElement('canvas').getContext('2d');

// ---------- glow sprites
const _gl={};
function glowSprite(col){if(_gl[col])return _gl[col];const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');const gr=x.createRadialGradient(128,128,0,128,128,128);gr.addColorStop(0,rgba(col,1));gr.addColorStop(.22,rgba(col,.5));gr.addColorStop(.55,rgba(col,.12));gr.addColorStop(1,rgba(col,0));x.fillStyle=gr;x.fillRect(0,0,256,256);return _gl[col]=c}
function glow(x,y,r,col,a=1){if(a<=0||r<=0)return;const p=g.globalCompositeOperation,pa=g.globalAlpha;g.globalCompositeOperation='lighter';g.globalAlpha=pa*a;g.drawImage(glowSprite(col),x-r,y-r,2*r,2*r);g.globalCompositeOperation=p;g.globalAlpha=pa}

// ---------- cell sprites
const _cs={};
function cellSprite(col,v,col2){const k=col+v+(col2||'');if(_cs[k])return _cs[k];
  const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');const R=rng(v*97+7);const r=96;x.translate(128,128);
  let gr=x.createRadialGradient(0,0,r*.7,0,0,r*1.32);gr.addColorStop(0,rgba(col,.28));gr.addColorStop(1,rgba(col,0));x.fillStyle=gr;x.fillRect(-128,-128,256,256);
  x.beginPath();for(let i=0;i<=60;i++){const a=i/60*TAU,w=1+.05*sin(a*3+v)+.035*sin(a*5+v*2.3);const px=cos(a)*r*w,py=sin(a)*r*w;i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath();
  gr=x.createRadialGradient(-r*.3,-r*.3,r*.1,0,0,r);gr.addColorStop(0,rgba(col,.38));gr.addColorStop(.75,rgba(col,.16));gr.addColorStop(1,rgba(col,.5));x.fillStyle=gr;x.fill();x.lineWidth=5;x.strokeStyle=rgba(col,.95);x.stroke();
  for(let i=0;i<8;i++){const a=R()*TAU,d=R()*r*.72;x.beginPath();x.ellipse(cos(a)*d,sin(a)*d,6+R()*10,4+R()*6,R()*3,0,TAU);x.fillStyle=rgba(col,.3+R()*.35);x.fill()}
  const nx=(R()-.5)*r*.3,ny=(R()-.5)*r*.3,nr=r*.4;
  if(col2){x.save();x.beginPath();x.arc(nx,ny,nr,0,TAU);x.clip();x.translate(nx,ny);x.rotate(.7);for(let i=-6;i<6;i++){x.fillStyle=i&1?col:col2;x.fillRect(i*nr*.3,-nr*2,nr*.3,nr*4)}x.restore()}
  else{gr=x.createRadialGradient(nx-nr*.3,ny-nr*.3,2,nx,ny,nr);gr.addColorStop(0,'#ffffff');gr.addColorStop(.35,col);gr.addColorStop(1,rgba(col,.65));x.fillStyle=gr;x.beginPath();x.arc(nx,ny,nr,0,TAU);x.fill()}
  x.beginPath();x.arc(nx,ny,nr,0,TAU);x.lineWidth=3;x.strokeStyle='rgba(255,255,255,.55)';x.stroke();
  return _cs[k]=c}
function cell(x,y,r,col,rot=0,a=1,v=0,col2=null){if(a<=0||r<=0)return;const s=cellSprite(col,v%6,col2);const pa=g.globalAlpha;g.globalAlpha=pa*a;g.save();g.translate(x,y);g.rotate(rot);g.drawImage(s,-r*1.333,-r*1.333,r*2.667,r*2.667);g.restore();g.globalAlpha=pa}
function dot(x,y,r,col,a=1){if(a<=0||r<=0)return;const pa=g.globalAlpha;g.globalAlpha=pa*a;g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();g.globalAlpha=pa}

// ---------- text
function font(sz,w=700,f=FH){g.font=`${w} ${sz}px ${f}`}
function T(s,x,y,sz,col=C.white,o={}){font(sz,o.w||700,o.f||FH);g.textAlign=o.al||'center';g.textBaseline=o.bl||'middle';g.letterSpacing=(o.ls!=null?o.ls:0)+'px';const pa=g.globalAlpha;g.globalAlpha=pa*(o.a??1);if(o.glow){g.shadowColor=o.glow===true?col:o.glow;g.shadowBlur=o.gb||sz*.3}if(o.stroke){g.lineWidth=o.stroke;g.strokeStyle=col;g.strokeText(s,x,y)}else{g.fillStyle=col;g.fillText(s,x,y)}g.shadowBlur=0;g.globalAlpha=pa;g.letterSpacing='0px'}
const MARK={'*':C.coral,'_':C.cyan,'~':C.amber,'^':C.violet,'+':C.mint,'!':C.red};
function parseLine(ln){const out=[];const re=/([*_~^+!])([^*_~^+!]+)\1|(\S+)/g;let m;while((m=re.exec(ln))){if(m[3])out.push({w:m[3],c:null});else m[2].trim().split(/\s+/).forEach(w=>out.push({w,c:MARK[m[1]]}))}return out}
// kinetic headline: words rise from a mask, staggered
function HL(str,x,y,sz,t,o={}){const lines=str.split('\n'),lh=sz*(o.lh||1.02);font(sz,o.w||700,o.f||FH);g.letterSpacing=(o.ls??-sz*.035)+'px';g.textBaseline='alphabetic';g.textAlign='left';
  const sp=sz*.26;let wi=0;const y0=y-(lines.length-1)*lh/2+sz*.36;
  for(let li=0;li<lines.length;li++){const ws=parseLine(lines[li]);const wd=ws.map(w=>g.measureText(w.w).width);const tw=wd.reduce((a,b)=>a+b,0)+sp*(ws.length-1);
    let cx=o.al==='left'?x:o.al==='right'?x-tw:x-tw/2;const ly=y0+li*lh;
    for(let i=0;i<ws.length;i++){const k=eo((t-(o.d||0)-wi*(o.st??.06))/.6);
      if(k>0){g.save();g.beginPath();g.rect(cx-sz*.3,ly-sz*1.08,wd[i]+sz*.6,sz*1.42);g.clip();const col=ws[i].c||o.col||C.white;g.globalAlpha*=(o.a??1);g.fillStyle=col;if(ws[i].c&&!o.noglow){g.shadowColor=col;g.shadowBlur=sz*.3}g.fillText(ws[i].w,cx,ly+(1-k)*sz*1.2);g.restore()}
      cx+=wd[i]+sp;wi++}}
  g.letterSpacing='0px'}
function TOP(t,str,sub,o={}){const y=o.y||300,sz=o.sz||150;HL(str,o.x||CX,y,sz,t,o);if(sub){const nl=str.split('\n').length;tag(o.x||CX,y+nl*sz*.55+90,sub,o.pc||C.cyan,{a:eo((t-.3)/.5),al:o.al})}}
function tag(x,y,s,col=C.cyan,o={}){const sz=o.sz||46;font(sz,700,FM);g.letterSpacing=(sz*.12)+'px';const tw=g.measureText(s).width;const h=sz*1.75,w=tw+h*1.35;const a=o.a??1;if(a<=0){g.letterSpacing='0px';return}
  const x0=o.al==='left'?x:o.al==='right'?x-w:x-w/2;g.save();g.globalAlpha*=a;g.beginPath();g.roundRect(x0,y-h/2,w,h,h/2);g.fillStyle='rgba(8,14,30,.78)';g.fill();g.lineWidth=3;g.strokeStyle=rgba(col,.9);g.stroke();
  g.beginPath();g.arc(x0+h*.52,y,h*.13,0,TAU);g.fillStyle=col;g.fill();glow(x0+h*.52,y,h*.6,col,.7);
  g.fillStyle=o.tc||C.white;g.textAlign='left';g.textBaseline='middle';g.fillText(s,x0+h*.9,y+sz*.05);g.restore();g.letterSpacing='0px'}
function stamp(s,x,y,sz,col,t,o={}){if(t<0)return;const k=clamp(t/.38);const sc=lerp(2.6,1,eback(k));g.save();g.translate(x,y);g.rotate(o.rot??-.05);g.scale(sc,sc);g.globalAlpha*=clamp(k*3);font(sz,800,FH);g.letterSpacing=(sz*.03)+'px';const w=g.measureText(s).width+sz*.9,h=sz*1.42;
  g.beginPath();g.roundRect(-w/2,-h/2,w,h,sz*.16);g.fillStyle=rgba(col,o.fill??.14);g.fill();g.lineWidth=sz*.08;g.strokeStyle=col;g.shadowColor=col;g.shadowBlur=sz*.4;g.stroke();g.shadowBlur=0;
  g.fillStyle=o.tc||col;g.textAlign='center';g.textBaseline='middle';g.fillText(s,0,sz*.05);g.restore();g.letterSpacing='0px';
  if(t<.7){const r=eo((t-.15)/.5);g.save();g.globalAlpha*=(1-r)*.8;g.strokeStyle=col;g.lineWidth=10;g.beginPath();g.ellipse(x,y,sz*4*r+10,sz*1.6*r+10,0,0,TAU);g.stroke();g.restore()}}

// ---------- strokes & marks
function polyPart(pts,k){let L=0;const ls=[];for(let i=1;i<pts.length;i++){const l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);ls.push(l);L+=l}let rem=L*clamp(k);g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length&&rem>0;i++){const l=ls[i-1],f=Math.min(1,rem/l);g.lineTo(lerp(pts[i-1][0],pts[i][0],f),lerp(pts[i-1][1],pts[i][1],f));rem-=l}g.stroke()}
function check(x,y,s,col,k){if(k<=0)return;g.save();g.translate(x,y);g.lineCap='round';g.lineJoin='round';g.lineWidth=s*.15;g.strokeStyle=col;g.shadowColor=col;g.shadowBlur=s*.25;polyPart([[-.45*s,0],[-.12*s,.32*s],[.5*s,-.38*s]],k);g.restore()}
function cross(x,y,s,col,k){if(k<=0)return;g.save();g.translate(x,y);g.lineCap='round';g.lineWidth=s*.15;g.strokeStyle=col;g.shadowColor=col;g.shadowBlur=s*.25;polyPart([[-.4*s,-.4*s],[.4*s,.4*s]],clamp(k*2));if(k>.5)polyPart([[.4*s,-.4*s],[-.4*s,.4*s]],clamp(k*2-1));g.restore()}
function badge(x,y,r,col,kind,k){if(k<=0)return;g.save();g.globalAlpha*=clamp(k*2);g.beginPath();g.arc(x,y,r*eback(k),0,TAU);g.fillStyle=rgba(col,.16);g.fill();g.lineWidth=r*.09;g.strokeStyle=col;g.stroke();g.restore();glow(x,y,r*2.2,col,.35*k);(kind==='x'?cross:check)(x,y,r*1.05,col,seg(k,.3,1))}
function ringHUD(x,y,r,col,a=.5){if(a<=0)return;g.save();g.translate(x,y);g.globalAlpha*=a;g.strokeStyle=col;g.lineWidth=3;g.setLineDash([2,22]);g.beginPath();g.arc(0,0,r,0,TAU);g.stroke();g.setLineDash([]);g.lineWidth=7;
  for(let i=0;i<3;i++){const s=G*(.22+i*.13)*(i%2?-1:1)+i*2;g.beginPath();g.arc(0,0,r*(.88+i*.07),s,s+.5+i*.35);g.stroke()}
  g.lineWidth=2.5;for(let i=0;i<90;i++){const a=i/90*TAU+G*.04;const l=i%5?12:36;g.beginPath();g.moveTo(cos(a)*r*1.1,sin(a)*r*1.1);g.lineTo(cos(a)*(r*1.1+l),sin(a)*(r*1.1+l));g.stroke()}g.restore()}
function rays(x,y,col,a=.08,n=20){g.save();g.translate(x,y);g.rotate(G*.08);g.globalCompositeOperation='lighter';for(let i=0;i<n;i++){const an=i/n*TAU;const gr=g.createLinearGradient(0,0,cos(an)*2600,sin(an)*2600);gr.addColorStop(0,rgba(col,a));gr.addColorStop(1,rgba(col,0));g.fillStyle=gr;g.beginPath();g.moveTo(0,0);g.arc(0,0,2600,an-.045,an+.045);g.closePath();g.fill()}g.restore()}
function floaters(seed,n,cols,a=.5,rmin=10,rmax=40){const R=rng(seed);for(let i=0;i<n;i++){const x=(R()*W+G*(20+R()*40)*(R()<.5?-1:1)+W*4)%W,y=(R()*H+sin(G*.4+i)*40);const r=rmin+R()*(rmax-rmin);cell(x,y,r,cols[i%cols.length],G*.3+i,a*(.3+R()*.7),i)}}
function speedLines(x,y,col,a,n=90){if(a<=0)return;const R=rng(77);g.save();g.strokeStyle=col;for(let i=0;i<n;i++){const an=R()*TAU,r0=500+R()*900,l=200+R()*700;g.globalAlpha=a*(.2+R()*.6);g.lineWidth=2+R()*5;g.beginPath();g.moveTo(x+cos(an)*r0,y+sin(an)*r0);g.lineTo(x+cos(an)*(r0+l),y+sin(an)*(r0+l));g.stroke()}g.restore()}
function along(pts,f){f=((f%1)+1)%1;let L=0;const ls=[];for(let i=1;i<pts.length;i++){const l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);ls.push(l);L+=l}let d=f*L;for(let i=1;i<pts.length;i++){if(d<=ls[i-1]){const u=d/ls[i-1];return[lerp(pts[i-1][0],pts[i][0],u),lerp(pts[i-1][1],pts[i][1],u)]}d-=ls[i-1]}return pts[pts.length-1]}
function bez(p0,p1,p2,p3,u){const v=1-u;return[v*v*v*p0[0]+3*v*v*u*p1[0]+3*v*u*u*p2[0]+u*u*u*p3[0],v*v*v*p0[1]+3*v*v*u*p1[1]+3*v*u*u*p2[1]+u*u*u*p3[1]]}
function panel(x,y,w,h,col,a=1,r=36){g.save();g.globalAlpha*=a;g.beginPath();g.roundRect(x,y,w,h,r);const gr=g.createLinearGradient(x,y,x+w,y+h);gr.addColorStop(0,'rgba(255,255,255,.07)');gr.addColorStop(1,'rgba(255,255,255,.02)');g.fillStyle=gr;g.fill();g.fillStyle='rgba(6,10,24,.55)';g.fill();g.lineWidth=3;g.strokeStyle=rgba(col,.75);g.stroke();
  g.beginPath();g.moveTo(x+r,y+1.5);g.lineTo(x+w*.4,y+1.5);g.lineWidth=6;g.strokeStyle=col;g.stroke();g.restore()}

// ---------- shapes (Path2D)
const MOUSE=new Path2D('M -430 60 C -470 -120 -250 -260 -20 -250 C 150 -245 260 -190 330 -110 C 380 -70 450 -40 520 10 C 548 28 545 48 512 56 C 440 80 360 95 300 112 C 260 150 220 175 160 182 C 60 200 -150 212 -300 192 C -380 180 -425 140 -430 60 Z');
const MEAR=(()=>{const p=new Path2D();p.ellipse(250,-205,95,108,-.3,0,TAU);return p})();
const MBODY=(()=>{const p=new Path2D(MOUSE);p.addPath(MEAR);return p})();
const MTAIL=new Path2D('M -425 95 C -560 175 -700 25 -820 75 C -920 117 -960 195 -1045 152');
function drawMouse(x,y,s,o={}){const col=o.col||C.cyan,dp=o.draw??1;const L=n=>n/s;
  g.save();g.translate(x,y);g.scale(o.flip?-s:s,s);g.globalAlpha*=(o.a??1);g.lineCap='round';g.lineJoin='round';
  if(dp<1)g.setLineDash([3000*dp,8000]);g.strokeStyle=rgba(col,.22);g.lineWidth=L(30);g.stroke(MTAIL);g.strokeStyle=rgba(col,.9);g.lineWidth=L(9);g.stroke(MTAIL);g.setLineDash([]);
  const fa=clamp(dp*1.6-.3);
  g.save();g.globalAlpha*=fa;g.fillStyle=o.fill||rgba(col,.07);g.fill(MBODY);if(o.inner){g.save();g.clip(MBODY);o.inner();g.restore()}g.restore();
  if(dp<1)g.setLineDash([4300*dp,9000]);if(o.dash)g.setLineDash([L(30),L(22)]);
  for(const[lw,al]of[[46,.1],[18,.32],[6,1]]){g.strokeStyle=rgba(col,al);g.lineWidth=L(lw);g.stroke(MOUSE);g.stroke(MEAR)}
  g.setLineDash([]);g.globalAlpha*=fa;
  g.fillStyle=C.white;g.beginPath();g.arc(405,-42,15,0,TAU);g.fill();glow(405,-42,45,col,.8);
  g.strokeStyle=rgba(col,.6);g.lineWidth=L(3);for(let i=-1;i<=1;i++){g.beginPath();g.moveTo(505,32);g.quadraticCurveTo(585,28+i*30,665,28+i*62);g.stroke()}
  g.beginPath();g.ellipse(250,-205,55,66,-.3,0,TAU);g.strokeStyle=rgba(col,.45);g.stroke();
  g.fillStyle=rgba(col,.55);g.beginPath();g.ellipse(170,192,48,20,0,0,TAU);g.fill();g.beginPath();g.ellipse(-250,200,55,22,0,0,TAU);g.fill();
  g.restore()}
let _mp=null;function mousePts(){if(_mp)return _mp;const R=rng(11);_mp=[];for(let y=-300;y<=230;y+=38)for(let x=-440;x<=550;x+=38){const px=x+(R()-.5)*20,py=y+(R()-.5)*20;if(scratch.isPointInPath(MBODY,px,py))_mp.push({x:px,y:py,h:R(),r:R()*TAU,v:(R()*6)|0,ph:R()*TAU})}return _mp}

const PIG=new Path2D('M -420 0 C -420 -200 -200 -262 50 -256 C 260 -250 380 -170 420 -60 C 440 -10 440 60 420 110 C 380 200 200 242 0 242 C -220 242 -420 190 -420 0 Z');
function drawPig(x,y,s,o={}){const col=o.col||C.amber;const L=n=>n/s;g.save();g.translate(x,y);g.scale(s,s);g.globalAlpha*=(o.a??1);g.lineCap='round';g.lineJoin='round';
  g.fillStyle=rgba(col,.35);for(const lx of[-290,-140,150,290]){g.beginPath();g.roundRect(lx-38,180,76,150,20);g.fill()}
  g.fillStyle=rgba(col,.07);g.fill(PIG);if(o.inner){g.save();g.clip(PIG);o.inner();g.restore()}
  const ear=new Path2D('M 220 -225 L 320 -345 L 365 -185 Z');const snout=new Path2D();snout.ellipse(455,25,58,78,0,0,TAU);
  for(const[lw,al]of[[42,.1],[16,.3],[6,1]]){g.strokeStyle=rgba(col,al);g.lineWidth=L(lw);g.stroke(PIG);g.stroke(ear);g.stroke(snout)}

[23.4,26.5,"Ahead: 4 surprising things",[['fourCards',{reveal:0}]]],
[26.5,29.38,"researchers do with mice like this, the one",[['fourCards',{reveal:1}]]],
[29.38,31.92,"word that separates a chimera from a hybrid,",[['versus']]],
[31.92,37.88,"and the line where the experiments start to make scientists uneasy. Let's start with that word.",[['theLine'],['decode',{word:'CHIMERA',sub:'THE WORD'}]]],
[37.88,43.98,"A hybrid is what you get when two species combine at the very beginning. A mule is a hybrid.",[['fusion'],['parents',{title:'A MULE IS A ~HYBRID~'}]]],
[43.98,50.02,"Its mother was a horse, its father was a donkey, and every cell in its body carries DNA from both.",[['parents',{title:'HORSE ♀ × DONKEY ♂'}],['everyCell']]],
[50.02,56.0,"The mixing is built into the first cell, and then it's copied again and again. A chimera is different.",[['divide',{w:1.3}],['chimeraCard']]],
[56.0,62.18,"The name comes from a Greek myth: a monster with a lion's head, a goat's body, and a snake",[['myth',{stage:0}],['myth',{stage:1}]]],
[62.18,68.32,"for a tail. The biology is far quieter. A chimera is one animal made of",[['myth',{stage:2,w:.7}],['quiet']]],
[68.32,74.4,"two sets of cells that began separate. Each cell has one genome or the other, never a blend.",[['twoSets'],['neverBlend']]],
[74.4,80.54,"Picture the difference. A hybrid is a bucket of mixed paint. A chimera is a",[['bigQ',{text:'PICTURE THE\n~DIFFERENCE~',q:0}],['paint',{w:1.4}],['mosaic']]],
[80.54,86.56,"mosaic, with tiles of two colors in a single picture. Chimeras aren't as exotic",[['mosaic',{full:1}],['notExotic']]],

[92.62,98.76,"while the rest of their body keeps its own. In 1984, researchers merged a goat embryo",[['marrow',{stage:2}],['year',{y:'1984',sub:'GOAT EMBRYO + SHEEP EMBRYO'}]]],
[98.76,104.88,"with a sheep embryo. The animal, nicknamed the geep, grew patches of wool next to patches of goat",[['embryoMerge'],['geep']]],
[104.88,105.34,"hair.",[['cont']]],
[105.34,111.38,"So when we say a mouse carries human cells, we don't mean a mouse that's partly human.",[['mouseCells'],['notPartHuman']]],
[111.38,116.92,"We mean a mouse with human cells living inside it, each one still completely human.",[['mouseCells',{title:'HUMAN CELLS ~LIVING INSIDE~'}],['zoomCell']]],
[116.92,122.98,"Where do those cells come from? Often from stem cells. These are cells that haven't yet decided",[['bigQ',{text:'WHERE DO THOSE\nCELLS ~COME FROM~?'}],['stem']]],
[122.98,128.78,"what to become. In 2007, scientists showed they could take an ordinary human skin cell and",[['stem',{stage:1}],['year',{y:'2007',sub:'CELL REPROGRAMMING',col:C.mint}],['skinCell']]],
[128.78,134.82,"reprogram it back into that flexible state. From there, it can be nudged into blood cells, liver cells",[['reprogram'],['differentiate',{lit:[0,1]}]]],

[140.84,146.66,"the real question: why not just use ordinary mice? Mice have taught us an enormous amount,",[['bigQ',{text:'WHY NOT JUST USE\n~ORDINARY MICE~?',sub:'THE REAL QUESTION'}],['miceTaught']]],
[146.66,152.74,"and we share most of our genes with them, but our family lines split tens of millions of years ago,",[['genes'],['phylo']]],
[152.74,158.94,"and the details drifted apart. HIV doesn't infect mice. Hepatitis B and C mostly",[['phylo',{drift:1}],['pathogen',{kind:'hiv'}],['pathogen',{kind:'hep'}]]],

[164.92,170.7,"systems fight threats differently from ours, and mouse livers break down drugs differently from ours.",[['splitDiff',{kind:'immune'}],['splitDiff',{kind:'liver'}]]],
[170.7,176.42,"The result is a painful pattern: a treatment cures a mouse, then it reaches",[['bigQ',{text:'A ~PAINFUL~\nPATTERN',q:0}],['pipeline',{stage:0}]]],
[176.42,182.12,"people, and does nothing, or does harm. Most drugs that enter human trials fail,",[['pipeline',{stage:1}],['trials']]],
[182.12,187.84,"and many of them looked promising in animals first. So researchers asked a different question:",[['promising',{w:1.3}],['bigQ',{text:'A ~DIFFERENT~\nQUESTION'}]]],
[187.84,193.68,"instead of building a better mouse, what if the mouse could host the one human part that matters?",[['strike',{word:'A BETTER MOUSE',sz:330,top:'INSTEAD OF BUILDING...'}],['hostPart']]],
[193.68,199.76,"That question leads to four uses, and the fourth is the boldest. The first is",[['fourCards',{reveal:1,hl:3,w:1.5}],['fourCards',{reveal:1,hl:0,title:'USE ~01~'}]]],
[199.76,205.56,"an immune system. Start with a mouse bred to have none of its own, so it can't reject foreign cells.",[['useTitle',{n:1,title:'IMMUNE\nSYSTEM',col:C.coral,icon:'immune'}],['blank',{mode:'fade'}]]],
[205.56,211.64,"A blank slate. Inject human blood stem cells, and over the following weeks they settle",[['blank',{mode:'slate'}],['inject',{label:'HUMAN BLOOD STEM CELLS',weeks:1,mouse:1}]]],
[211.64,217.3,"in the bone marrow and start producing human immune cells. These mice can be infected with HIV,",[['boneMarrow'],['hivMouse']]],
[217.3,223.42,"which an ordinary mouse can't catch. They're also used to test cancer immunotherapies: drugs that",[['hivMouse',{focus:1}],['immunotherapy',{stage:0}]]],

[229.2,235.36,"but it's human enough to answer questions an ordinary mouse can't. The second is",[['gauge',{title:"~HUMAN ENOUGH~",left:'MOUSE',right:'HUMAN',to:.7,label:'HUMAN ENOUGH',w:1.6}],['fourCards',{reveal:1,hl:1,title:'USE ~02~'}]]],
[235.36,241.3,"a liver. In certain mice, the animal's own liver cells are made to die off. Human liver cells are",[['useTitle',{n:2,title:'LIVER',col:C.amber,icon:'liver'}],['liver',{mode:'die'}]]],
[241.3,247.18,"transplanted in, and they take over. In the best cases, most of the liver ends up human. Hepatitis",[['liver',{mode:'fill',f0:0,f1:.55,title:'HUMAN CELLS ~TAKE OVER~'}],['liver',{mode:'fill',f0:.55,f1:.92,title:'MOSTLY *HUMAN*'}]]],
[247.18,252.76,"B and C can now be studied in the living animal, and so can the liver stage of the malaria parasite.",[['liver',{mode:'virus',title:'HEPATITIS ~B & C~'}],['liver',{mode:'malaria',title:'^MALARIA^'}]]],
[252.76,258.82,"And because the liver is the body's chemical processing plant, researchers can watch how a human liver handles",[['liver',{mode:'plant'}],['liver',{mode:'plant',stage:1}]]],

[355.1,361.1,"is too much? Ethics panels tend to worry about two places above all. The first is",[['gauge',{title:'...IS !TOO MUCH!?',left:'MOUSE',right:'HUMAN',from:.5,to:.84,zone:.66,label:'TOO MUCH?',w:.9}],['twoPlaces']]],

[372.78,378.54,"animal's experience comes from. Look at two real experiments. A team at the University",[['brainZone',{stage:1}],['twoExp']]],

[403.36,409.38,"But human cells had changed how a mouse brain performed. Then a team at",[['brainPerf'],['place',{name:'~STANFORD~',coord:'37.43°N · 122.17°W',sub:'HUMAN ORGANOIDS → NEWBORN RATS',col:C.violet}]]],
[409.38,414.64,"Stanford grew tiny clumps of human brain tissue from stem cells. These are called",[['organoid',{mode:'grow'}]]],

[432.68,438.82,"It was still a rat's brain, with human tissue doing a job inside it. Both",[['stillRat',{stage:0}],['stillRat',{stage:1}]]],
[438.82,444.44,"studies drew serious ethical discussion, including from the researchers themselves. Here's the difficulty:",[['debate',{w:2.4}],['bigQ',{text:"HERE'S THE\n~DIFFICULTY~",q:0}]]],
[444.44,450.28,"nobody has a test for what an animal like that experiences. Most researchers think",[['noTest',{stage:0}],['noTest',{stage:1}]]],

[462.3,468.2,"gets closer to us, like a monkey. So rules are forming. In 2015, the",[['hostScale',{hl:3}],['rules']]],
[468.2,474.3,"U.S. National Institutes of Health paused funding for experiments that put human stem cells into early animal",[['year',{y:'2015',sub:'U.S. NATIONAL INSTITUTES OF HEALTH'}],['nih']]],

[480.3,486.04,"embryos, and bar breeding animals that might carry human eggs or sperm. And there's one more question,",[['guidelines',{from:2,to:3,w:1.4}],['bigQ',{text:'ONE MORE\n~QUESTION~'}]]],
[486.04,492.2,"which is the welfare of the animals themselves. They can feel pain, and the case for using them rests",[['welfare',{stage:0}],['welfare',{stage:1}]]],

[498.14,503.96,"has: mice with partial human immune systems, mice whose livers are mostly human cells,",[['list',{kind:'yes',from:0,to:1}],['list',{kind:'yes',from:1,to:2}]]],

    g.save();g.translate(x+ww/2,y);g.scale(lerp(.6,1,pk)*(active?1.06:1),lerp(.6,1,pk)*(active?1.06:1));g.globalAlpha=clamp(k/.08);
    if(active){g.beginPath();g.roundRect(-ww/2-22,-sz*.62,ww+44,sz*1.2,22);g.fillStyle=kc||C.amber;g.shadowColor=kc||C.amber;g.shadowBlur=40;g.fill();g.shadowBlur=0}
    g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';if(!active){g.lineWidth=16;g.strokeStyle='rgba(3,6,14,.85)';g.strokeText(w.d,0,4)}g.fillStyle=active?'#05070F':(kc||C.white);g.fillText(w.d,0,4);g.restore();x+=ww+sp});
  g.letterSpacing='0px'}

// ---------- background / post
const BOKEH=(()=>{const R=rng(99);const a=[];for(let i=0;i<46;i++)a.push({x:R()*W,y:R()*H,r:40+R()*220,vx:(R()-.5)*30,vy:-8-R()*24,a:.04+R()*.1,k:R()<.5?0:1,ph:R()*TAU});return a})();
const GRAIN=(()=>{const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');const id=x.createImageData(512,512);const R=rng(5);for(let i=0;i<id.data.length;i+=4){const v=R()*255|0;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}x.putImageData(id,0,0);return c})();
let GRAINP=null;
const VIG=(()=>{const c=document.createElement('canvas');c.width=W/4;c.height=H/4;const x=c.getContext('2d');const gr=x.createRadialGradient(W/8,H/8,H/12,W/8,H/8,W/6.2);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.72)');x.fillStyle=gr;x.fillRect(0,0,W/4,H/4);return c})();
function chapterIdx(T){let i=0;for(let j=0;j<CH.length;j++)if(CH[j].s<=T)i=j;return i}
function drawBG(T){g.fillStyle=C.bg;g.fillRect(0,0,W,H);const ci=chapterIdx(T),ch=CH[ci],pv=CH[Math.max(0,ci-1)];const k=ci?clamp((T-ch.s)/1.5):1;
  const big=(x,y,r,c,a)=>{const pa=g.globalAlpha;g.globalCompositeOperation='lighter';g.globalAlpha=a;g.drawImage(glowSprite(c),x-r,y-r,2*r,2*r);g.globalAlpha=pa;g.globalCompositeOperation='source-over'};
  const x1=W*(.74+.06*sin(T*.11)),y1=H*(.22+.05*cos(T*.13)),x2=W*(.16+.05*cos(T*.09)),y2=H*(.86+.04*sin(T*.12));
  if(k<1){big(x1,y1,2300,pv.a,.16*(1-k));big(x2,y2,2000,pv.b,.13*(1-k))}big(x1,y1,2300,ch.a,.16*k);big(x2,y2,2000,ch.b,.13*k);
  g.fillStyle='rgba(150,175,255,.06)';const off=(T*14)%120;for(let y=-120;y<H+120;y+=120)for(let x=0;x<W;x+=120)g.fillRect(x+2,y+off,4,4);
  for(const b of BOKEH){const x=((b.x+T*b.vx)%W+W)%W,y=((b.y+T*b.vy)%H+H)%H;const c=b.k?ch.a:ch.b;const pa=g.globalAlpha;g.globalCompositeOperation='lighter';g.globalAlpha=b.a*(.6+.4*sin(T*.7+b.ph));g.drawImage(glowSprite(c),x-b.r,y-b.r,b.r*2,b.r*2);g.globalAlpha=pa;g.globalCompositeOperation='source-over'}}
function post(T){g.drawImage(VIG,0,0,W,H);if(!GRAINP)GRAINP=g.createPattern(GRAIN,'repeat');g.save();g.globalAlpha=.045;g.globalCompositeOperation='overlay';g.translate((hash(Math.floor(T*24))*512)|0,(hash(Math.floor(T*24)+7)*512)|0);g.fillStyle=GRAINP;g.fillRect(-512,-512,W+512,H+512);g.restore()}
function hud(T,sh){const ci=chapterIdx(T),ch=CH[ci];
  g.fillStyle='rgba(255,255,255,.08)';g.fillRect(0,0,W,10);const gr=g.createLinearGradient(0,0,W,0);gr.addColorStop(0,C.cyan);gr.addColorStop(.5,C.violet);gr.addColorStop(1,C.coral);g.fillStyle=gr;g.fillRect(0,0,W*clamp(T/END),10);
  for(const c of CH){g.fillStyle=C.bg;g.fillRect(W*c.s/END-3,0,6,10)}
  const k=eo((T-ch.s)/.6);g.save();g.globalAlpha=.9;g.fillStyle=ch.a;g.fillRect(120,96,14,52*k);T_(String(ci+1).padStart(2,'0'),160,124,40,ch.a);T_(ch.n,250,124,40,C.white,k);g.restore();
  if(ch.u){for(let i=0;i<4;i++){const x=W-140-(3-i)*86;g.beginPath();g.roundRect(x-64,108,64,30,15);g.fillStyle=i<ch.u?ch.a:'rgba(255,255,255,.14)';g.fill()}}
  else{const s=Math.floor(T);T_(`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`,W-120,124,40,C.dim,1,'right')}}
function T_(s,x,y,sz,col,a=1,al='left'){font(sz,700,FM);g.letterSpacing='5px';g.textAlign=al;g.textBaseline='middle';const pa=g.globalAlpha;g.globalAlpha=pa*a;g.fillStyle=col;g.fillText(s,x,y);g.globalAlpha=pa;g.letterSpacing='0px'}
function transition(sh,t,T){if(t>.6||sh.i===0&&t>.6)return;const col=CH[chapterIdx(T)].a;
  if(t<.12){g.save();g.globalCompositeOperation='lighter';g.globalAlpha=.32*(1-t/.12);g.drawImage(cv,16,0);g.globalAlpha=.22*(1-t/.12);g.drawImage(cv,-16,0);g.restore()}
  switch(sh.fx){
    case 0:if(t<.22){g.fillStyle=`rgba(255,255,255,${.5*(1-t/.22)})`;g.fillRect(0,0,W,H)}break;
    case 1:if(t<.26){const R=rng(sh.i*13+Math.floor(t*30));for(let i=0;i<11;i++){const y=R()*H,h=20+R()*160,dx=(R()-.5)*260*(1-t/.26);g.drawImage(cv,0,y,W,h,dx,y,W,h)}g.fillStyle=rgba(col,.18*(1-t/.26));g.fillRect(0,R()*H,W,40)}break;
    case 2:if(t<.45){const u=eio(t/.45);const x=lerp(-1400,W+600,u);g.save();g.fillStyle=col;g.globalAlpha=.9;g.beginPath();g.moveTo(x,0);g.lineTo(x+700,0);g.lineTo(x+200,H);g.lineTo(x-500,H);g.fill();g.globalAlpha=.4;g.beginPath();g.moveTo(x-260,0);g.lineTo(x-120,0);g.lineTo(x-620,H);g.lineTo(x-760,H);g.fill();g.restore()}break;
    case 3:if(t<.4)speedLines(CX,CY,C.white,.6*(1-t/.4),140);break}}

// ---------- main loop
let FORCE=null;const qs=new URLSearchParams(location.search);const START=parseFloat(qs.get('t')||'0')||0;if(qs.get('captions')==='0')CAPS=false;if(qs.get('captions')==='1')CAPS=true;
let shotIdx=0;function findShot(T){if(T<SHOTS[shotIdx].s)shotIdx=0;while(shotIdx<SHOTS.length-1&&T>=SHOTS[shotIdx].e)shotIdx++;return SHOTS[shotIdx]}
function render(T){T=clamp(T,0,END-.001);G=T;const sh=findShot(T);const t=T-sh.s,d=sh.e-sh.s,p=clamp(t/d);
  g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';drawBG(T);
  const punch=1+.14*(1-eo(t/.55)),drift=1+.05*p,z=punch*drift,rot=(sh.i%2?1:-1)*.014*(1-eo(t/.6));
  g.save();g.translate(CX+sin(T*.37)*14,CY+cos(T*.29)*10);g.rotate(rot);g.scale(z,z);g.translate(-CX,-CY);
  try{V[sh.fn](t,p,d,sh.o)}catch(e){render._e=render._e||{};if(!render._e[sh.fn]){console.error("VISERR",sh.fn,e.message,e.stack.split("\n")[1]);render._e[sh.fn]=1}}
  g.restore();g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';g.shadowBlur=0;g.setLineDash([]);g.letterSpacing='0px';
  transition(sh,t,T);captions(T);hud(T,sh);post(T);
  if(T<.25){g.fillStyle=`rgba(0,0,0,${1-T/.25})`;g.fillRect(0,0,W,H)}}
let T0=null;function loop(now){if(T0===null)T0=now;render(FORCE!=null?FORCE:START+(now-T0)/1000);requestAnimationFrame(loop)}
window.__seek=t=>{FORCE=t;render(t)};window.__play=()=>{FORCE=null;T0=null};window.__duration=END;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);const st=document.getElementById('stage');st.style.transform=`translate(${(innerWidth-W*s)/2}px,${(innerHeight-H*s)/2}px) scale(${s})`}
addEventListener('resize',fit);fit();requestAnimationFrame(loop);
</script>
