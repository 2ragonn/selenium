  io2: x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2,

  sine: x => .5 - .5 * Math.cos(Math.PI * x),
  expo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),

/* deterministik rastgele */
function rng(seed) { let a = seed >>> 0; return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function hex2rgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }

function lerpHex(a, b, t) { const A_ = hex2rgb(a), B_ = hex2rgb(b); return `rgb(${A_.map((v, i) => Math.round(lerp(v, B_[i], t))).join(',')})`; }

function ramp(stops, t) { /* stops: [[pos,'#hex'],...] */ t = clamp(t); for (let i = 1; i < stops.length; i++) { if (t <= stops[i][0]) { const a = stops[i - 1], b = stops[i]; const k = (t - a[0]) / (b[0] - a[0] || 1); const A_ = hex2rgb(a[1]), B_ = hex2rgb(b[1]); return [lerp(A_[0], B_[0], k), lerp(A_[1], B_[1], k), lerp(A_[2], B_[2], k)]; } } return hex2rgb(stops[stops.length - 1][1]); }

function spacetimeMesh(cx, cy, depth, t, op = 1, flat = 0) {
  const N = 26, M = 44, SX = 640, SZ = 160, SY = 330;
  const P = (x, z) => { const r = Math.hypot(x, z), y = -depth * .12 / Math.sqrt(r * r + .035) * (1 - flat), pers = 1 / (1 - z * .26); return [cx + x * SX * pers, cy + (z * SZ - y * SY) * pers, r]; };
  ctx.save(); ctx.globalAlpha *= op; ctx.lineWidth = 1.8;
  const trace = (cond) => { ctx.beginPath(); for (let d = 0; d < 2; d++) for (let i = 0; i <= N; i++) { const a = i / N * 2 - 1; let pr = null; for (let j = 0; j <= M; j++) { const b = j / M * 2 - 1, p = d ? P(b, a) : P(a, b); if (pr && cond(pr, p)) { ctx.moveTo(pr[0], pr[1]); ctx.lineTo(p[0], p[1]); } pr = p; } } };
  trace(() => true); ctx.strokeStyle = rgba(C.cyan, .5); ctx.stroke();
  if (depth > .1) { trace((a, b) => a[2] < .5 && b[2] < .5); ctx.strokeStyle = rgba(C.amber, .8 * depth); ctx.lineWidth = 2.2; ctx.stroke(); }
  const c0 = P(0, 0); if (depth > .05) { glow(c0[0], c0[1] - 6, 110, '#ffb347', .7 * depth); planet(c0[0], c0[1] - 8, 36 * (.5 + .5 * depth), '#ffe0a0', '#ff7a2a'); }

  ctx.restore();
}

function wlRGB(w) {
  let r = 0, g = 0, b = 0;

  const f = w < 420 ? .3 + .7 * (w - 380) / 40 : w > 700 ? .3 + .7 * (780 - w) / 80 : 1;
  return [r, g, b].map(v => Math.round(255 * Math.pow(Math.max(0, v * f), .8)));

/* =====================  OYNATICI  =====================
   • Sayfa açılır açılmaz kendiliğinden oynar, bir kez çalışır, son karede durur.
   • ?t=120        → 120. saniyeden başlat
   • ?captions=0   → altyazıları gizle      ?ui=0 → üst şerit/ilerleme çubuğunu gizle
   • ?manual=1     → otomatik oynatma yok; kayıt aracı window.renderFrame(t) çağırabilir
   • Klavye: Boşluk duraklat/devam · ←/→ ±5 sn · R baştan
   ===================================================== */
(function () {
  const q = new URLSearchParams(location.search);
  UI.caps = q.get('captions') !== '0'; UI.chrome = q.get('ui') !== '0';
  const manual = q.get('manual') === '1';
  let startAt = parseFloat(q.get('t') || '0') || 0, t0 = null, paused = false, curT = 0;
  function fit() { const s = Math.min(innerWidth / 3840, innerHeight / 2160); cv.style.transform = 'translate(' + (innerWidth - 3840 * s) / 2 + 'px,' + (innerHeight - 2160 * s) / 2 + 'px) scale(' + s + ')'; }
  addEventListener('resize', fit); fit();
  window.renderFrame = function (t) { render(t); return t; };
  window.ANIMATION_DURATION = DUR; window.__done = false;
  window.seek = function (t) { startAt = t; t0 = null; curT = t; if (paused) render(t); };

    if (!paused) {
      if (t0 === null) t0 = ts - startAt * 1000;
      curT = Math.min((ts - t0) / 1000, DUR);

      if (curT >= DUR) { window.__done = true; return; }
