<body>
<div id="stage"><canvas id="c" width="3840" height="2160"></canvas></div>
<script>
'use strict';
/* =====================================================================
   TWO HEARTS, SAME AGE  |  Daily Wellness
   3840 x 2160 canvas animation. Fully time-driven & deterministic:
   every frame is a pure function of t (seconds).  Autoplays once.
   Debug / render hooks:  ?t=12.5 (static frame)  ?cc=1 (captions)
   window.__render(t) draws any frame synchronously.
   ===================================================================== */
const W = 3840, H = 2160, CX = W / 2, CY = H / 2, TAU = Math.PI * 2, DUR = 534.1;
const cv = document.getElementById('c');
let ctx = cv.getContext('2d', { alpha: false });
const MAINCTX = ctx;
// soft background layer is rendered at 1/3 resolution and upscaled (identical look, ~9x cheaper)
const BGS = 3, bgCv = document.createElement('canvas'); bgCv.width = 3840 / BGS; bgCv.height = 2160 / BGS;
const bgCtx = bgCv.getContext('2d', { alpha: false });
let GA = 1; // per-segment alpha multiplier

/* ---------- math / easing ---------- */
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const SS = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const EO = x => 1 - Math.pow(1 - clamp(x), 3);
const EO5 = x => 1 - Math.pow(1 - clamp(x), 5);
const EI = x => { x = clamp(x); return x * x * x; };
const EIO = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const EB = x => { x = clamp(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const EB2 = x => { x = clamp(x); const c1 = 2.6, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const EE = x => { x = clamp(x); return x === 0 ? 0 : x === 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * (TAU / 3)) + 1; };
const pS = (t, a, b) => SS(P(t, a, b));
const pO = (t, a, b) => EO(P(t, a, b));
const pIO = (t, a, b) => EIO(P(t, a, b));
const pB = (t, a, b) => EB(P(t, a, b));
const pB2 = (t, a, b) => EB2(P(t, a, b));
const pE = (t, a, b) => EE(P(t, a, b));
const fr = x => x - Math.floor(x);
const rnd = n => { n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - Math.floor(n); };
const mod = (a, n) => ((a % n) + n) % n;
// window: 1 between a..b, ramps of length f at both ends
// window with tight cross-fade: widened by .15s each side so adjacent scenes overlap instead of dipping to black
const win = (t, a, b, f = .4) => { const e = Math.min(f, .5) * .5; return SS((t - (a - .15)) / e) * SS(((b + .15) - t) / e); };

/* ---------- colours ---------- */
const C = {
  ember: [255, 112, 72], crimson: [238, 48, 96], amber: [255, 178, 74], mint: [56, 226, 196],
  azure: [58, 164, 255], violet: [150, 128, 255], gold: [255, 208, 100], blood: [255, 72, 108],
  oxy: [120, 214, 255], pink: [255, 128, 196], white: [255, 255, 255], ink: [238, 242, 251],
  mute: [139, 151, 179], dim: [72, 84, 114], green: [90, 235, 150], red: [255, 82, 96], night: [10, 14, 28]
};
const HC = { // heart palettes
  L: { c1: [255, 132, 86], c2: [216, 34, 84] },
  R: { c1: [78, 238, 210], c2: [28, 124, 214] },
  N: { c1: [255, 124, 132], c2: [206, 40, 92] },
  L2: { c1: [255, 188, 118], c2: [238, 84, 112] } // the same left heart, relaxed
};
const rgb = (c, a = 1) => 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + (a < 0 ? 0 : a > 1 ? 1 : +a.toFixed(3)) + ')';
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const mixPal = (a, b, t) => ({ c1: mix(a.c1, b.c1, t), c2: mix(a.c2, b.c2, t) });
const LG = (x0, y0, x1, y1, st) => { const g = ctx.createLinearGradient(x0, y0, x1, y1); for (const s of st) g.addColorStop(s[0], s[1]); return g; };
const RG = (x, y, r0, r1, st) => { const g = ctx.createRadialGradient(x, y, r0, x, y, r1); for (const s of st) g.addColorStop(s[0], s[1]); return g; };

/* ---------- alpha-aware drawing primitives ---------- */
const al = a => { ctx.globalAlpha = clamp(GA * a); };
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); }
function fillS(style, a = 1) { al(a); ctx.fillStyle = style; ctx.fill(); }
function strokeS(style, w, a = 1) { al(a); ctx.strokeStyle = style; ctx.lineWidth = w; ctx.stroke(); }
function line(x0, y0, x1, y1, style, w, a = 1, cap = 'round') { ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.lineCap = cap; strokeS(style, w, a); }
function dot(x, y, r, style, a = 1) { circ(x, y, r); fillS(style, a); }
function poly(pts, close = true) { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); if (close) ctx.closePath(); }
function smoothPath(pts, tension = .5) { // catmull-rom through points
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    ctx.bezierCurveTo(p1[0] + (p2[0] - p0[0]) * tension / 3 * 2 / 2 * 1, p1[1] + (p2[1] - p0[1]) * tension / 3 * 2 / 2 * 1,
      p2[0] - (p3[0] - p1[0]) * tension / 3 * 2 / 2 * 1, p2[1] - (p3[1] - p1[1]) * tension / 3 * 2 / 2 * 1, p2[0], p2[1]);
  }
}

/* ---------- glow sprites (cheap soft light) ---------- */
const _gs = {}; let _gsN = 0;

[0,2.54,"These two hearts are the same age."],[2.54,6.54,"One of them works significantly harder just to keep you alive."],[6.54,9.84,"On screen, two illustrated hearts float side by side."],[9.84,14.2,"Each one carries the same label, 45 years old, as an example."],[14.2,17.9,"Same birthday, same quiet evening on the same kind of couch."],[17.9,20.12,"But watch the small counters above them."],[20.12,23.28,"The heart on the left ticks quickly, beat after beat."],[23.28,25.92,"The heart on the right ticks slower and calmer."],[25.92,29.58,"And yet, both are keeping the same body alive."],[29.58,33.1,"Over the next few minutes, you will see why that gap exists."],[33.1,35.04,"You will see how scientists measure it."],[35.04,37.12,"You will see why the American Heart Association"],[37.12,39.44,"wants it checked like a vital sign."],[39.44,40.88,"And you will see how fast"],[40.88,43.12,"the harder-working heart can change."],[43.12,46.32,"This matters because one of those hearts belongs to you."],[46.32,47.8,"So here's the question."],[47.8,49.62,"Which one does your heart resemble?"],[49.62,51.26,"And is that locked in?"],[51.26,52.6,"The answer depends on a number"],[52.6,55.1,"most people have never had measured."],[55.1,56.22,"Start with the counters."],[56.22,57.64,"They show resting heart rate,"],[57.64,61.16,"the number of beats per minute while your body sits still."],[61.16,62.92,"Every beat is a squeeze."],[62.92,66.22,"Every squeeze pushes a wave of blood into your arteries."],[66.22,67.4,"Here is the catch."],[67.4,70.5,"Beats alone do not tell you how much blood moves."],[70.5,74.04,"What matters is how much leaves the heart with each squeeze."],[74.04,76.24,"Doctors call that stroke volume."],[76.24,77.68,"Look at this simple example,"],[77.68,79.54,"built with round, made-up numbers."],[79.54,81.42,"The left heart beats 80 times a minute"],[81.42,83.6,"and pushes a small cup each time."],[83.6,86.4,"The right heart beats 60 times and pushes a bigger cup  a British physiologist"],[169.32,171.48,"named Archibald Hill started measuring it."],[171.48,174.18,"On screen is an illustrated portrait of Hill"],[174.18,175.9,"beside a running figure."],[175.9,179.16,"He tied oxygen use to how hard the body works."],[179.16,182.16,"As exercise gets harder, oxygen use climbs."],[182.16,184.26,"But it cannot climb forever."],[184.26,187.6,"Hill gave that ceiling a name, VO2 max."],[187.6,189.82,"It means the most oxygen your body can use"],[189.82,193.44,"per kilogram of body mass every minute at full effort."],[193.44,195.12,"That ceiling depends on your heart"],[195.12,196.96,"and lungs working together."],[196.96,199.7,"Since the 1960s, it has been the most accepted measure"],[199.7,201.5,"of this kind of fitness."],[201.5,203.8,"So how do you find someone's ceiling?"],[203.8,207.34,"The gold standard is a cardiopulmonary exercise test."],[207.34,210.54,"You walk or run on a treadmill or pedal a stationary bike."],[210.54,213.76,"A mask measures every breath in and out."],[213.76,216.36,"Sticky sensors record the heart's electrical activity,"],[216.36,218.7,"a test called electrocardiography."],[218.7,220.24,"The effort usually keeps rising"],[220.24,221.96,"until you reach your maximum."],[221.96,225.2,"But the machine you choose can change your score."],[225.2,227.24,"Notice the two bars on screen."],[227.24,228.56,"For people not used to cycling,"],[228.56,232.26,"a bike test sometimes reads 10 to 20% lower."],[232.26,233.24,"Their legs tire out"],[233.24,235.72,"before their heart and lungs reach the limit."],[235.72,237.88,"Bikes are still often the better choice for older adults"],[237.88,241.26,"because cycling is generally less taxing on the body."],[241.26,242.62,"Many children and older people"],[242.62,244.9,"skip the maximal test entirely."],[244.9,247.56,"Instead, they walk or jog a set distance fast"],[247.56,250.12,"or run back and forth in timed laps."],[250.12,251.16,"In American schools,"],[251.16,253.5,"that shuttle run is called the pacer test."],[253.5,255.54,"There is even a way to estimate fitness"],[255.54,257.48,"with no exercise at all."],[257.48,261.34,"Formulas combine your age, sex, body mass index,"],[261.34,263.54,"activity level, and other health conditions."],[263.54,266.16,"In 2016, researchers Nauman and Ness"],[266.16,269.64,"showed this estimate still helps predict heart disease risk,"],[269.64,272.82,"which brings us back to our two hearts at full effort."],[272.82,274.54,"Follow the two lines on this chart,"],[274.54,276.74,"an illustration rather than real data."],[276.74,278.36,"As exercise gets harder,"],[278.36,281.4,"both hearts beat faster and push more blood per beat."],[281.4,283.7,"The left line hits its ceiling early."],[283.7,286.12,"The right line keeps climbing."],[286.12,289.9,"So here is the question that matters most for your own day."],[289.9,292.0,"If your heart looks more like the left one,"],[292.0,293.18,"is it stuck there?"],[293.18,296.18,"Or can a heart that works hard learn to work easier?"],[296.18,297.74,"And how fast?"],[297.74,300.4,"First, why the speed matters."],[300.4,301.82,"Low cardiorespiratory fitness"],[301.82,304.84,"is linked to higher risk of cardiovascular disease,"],[304.84,307.08,"meaning disease of the heart and blood vessels."],[307.08,309.86,"It is also linked to higher all-cause mortality,"],[309.86,311.98,"the risk of dying from any cause."],[311.98,314.78,"That link grew strong enough to change official advice."],[314.78,316.6,"Watch this timeline."],[316.6,319.1,"Hill names the ceiling in the 1920s."],[319.1,321.78,"It becomes the standard measure in the 1960s."],[321.78,324.6,"Then, in 2016, the American Heart Association"],[324.6,327.3,"publishes an official scientific statement."],[327.3,330.82,"It argues fitness should be treated as a clinical vital sign,"],[330.82,332.82,"checked routinely, like blood pressure."],[332.82,335.72,"Now, the good news about the left heart."],[335.72,337.36,"A 2005 Cochrane review"],[337.36,340.66,"pulled together trials of physical activity programs."],[340.66,342.18,"Cochrane reviews pool many studies"],[342.18,343.98,"to test whether a result holds up."],[343.98,346.42,"The verdict was clear."],[346.42,350.0,"Physical activity programs raised cardiorespiratory fitness."],[350.0,352.4,"And the change does not take a lifetime."],[352.4,353.84,"Many training programs in this research"],[353.84,356.94,"run for weeks or months, not decades."],[356.94,359.32,"Look at the before and after split on screen,"],[359.32,362.2,"an illustration of one heart across a training period."],[362.2,364.74,"At rest, the counter often slows a little."],[364.74,367.52,"Each squeeze grows a little stronger."],[367.52,368.84,"Here is the twist."],[368.84,370.14,"The approach that stands out"],[370.14,371.98,"is not always the longest workout."],[371.98,373.86,"High-intensity interval training"],[373.86,377.38,"alternates short bursts of hard effort with recovery."],[377.38,378.56,"Studies find it highly effective"],[378.56,381.32,"for raising fitness in people of all ages."],[381.32,383.98,"That includes people well past middle age."],[383.98,385.64,"A 2020 review led by Wu"],[385.64,388.28,"looked at older adults doing interval training."],[388.28,390.32,"It linked this training to better fitness,"],[390.32,393.38,"more muscle power, and stronger heart contractions."],[393.38,397.08,"Blood triglycerides, a type of fat in the blood, also dropped."],[397.08,399.06,"Other activities count, too."],[399.06,400.84,"Running, lifting weights, and playing sports"],[400.84,403.14,"all generally benefit health."],[403.14,405.62,"How much any one person improves varies,"],[405.62,407.76,"and researchers cannot fully predict it."],[407.76,410.74,"A doctor can look at what makes sense for your own heart."],[410.74,412.06,"But the most surprising part"],[412.06,414.38,"is not how fast fitness can change."],[414.38,416.1,"It is how much this one number"],[416.1,418.36,"may reveal about the years ahead."],[418.36,420.32,"Some researchers rank it above risk factors"],[420.32,422.2,"you hear about constantly."],[422.2,425.38,"On screen, five cards line up in a row."],[425.38,428.06,"Smoking, high blood pressure, high cholesterol,"],[428.06,429.9,"type 2 diabetes, and fitness."],[429.9,433.2,"Some medical researchers claim fitness predicts mortality"],[433.2,435.74,"even more strongly than the other four."],[435.74,437.9,"That is a claim from some researchers,"],[437.9,439.44,"not a settled verdict."],[439.44,441.6,"Fitness also overlaps with many other habits,"],[441.6,443.08,"which makes it hard to separate."],[443.08,445.96,"But even as a contender, it is striking."],[445.96,448.76,"Blood pressure gets checked at almost every visit."],[448.76,452.06,"Fitness, the possible heavyweight, often goes unmeasured."],[452.06,453.5,"That gap is exactly what"],[453.5,455.92,"the American Heart Association wanted to close."],[455.92,459.48,"A number that powerful should not stay invisible."],[459.48,461.58,"Many people treat fitness as a look,"],[461.58,463.84,"a body shape, or a number on a scale."],[463.84,466.86,"But cardiorespiratory fitness is about delivery."],[466.86,469.5,"It asks how well your lungs, heart, and vessels"],[469.5,471.72,"move oxygen to working muscle."],[471.72,473.04,"Two people with similar bodies"],[473.04,475.24,"can have very different ceilings."],[475.24,476.24,"Why the confusion?"],[476.24,479.68,"Because shape is visible and oxygen is not."],[479.68,482.18,"Nobody can see VO2 max in a mirror."],[482.18,484.38,"One more myth worth flipping."],[484.38,487.4,"A faster resting beat does not mean a more powerful heart."],[487.4,489.9,"In a trained heart, power tends to show up"],[489.9,493.02,"as more blood per squeeze, not more squeezes."],[493.02,495.96,"So, back to the two hearts with the same birthday."],[495.96,497.52,"Which one does yours resemble?"],[497.52,500.86,"The honest answer is that age alone did not decide it."],[500.86,502.78,"The way your heart, lungs, and muscles"],[502.78,504.8,"have been used matters too."],[504.8,506.74,"Watch the left heart one last time."],[506.74,509.58,"In this illustration, its counter starts to slow."],[509.58,511.54,"Its squeezes grow fuller."],[511.54,514.82,"Same age, same body, but a lighter workload,"],[514.82,515.72,"beat after beat."],[515.72,518.5,"Your heart is not a fixed verdict."],[518.5,521.52,"It is a system that keeps responding to what you ask of it."],[521.52,524.44,"And the bigger question is what your own ceiling looks like"],[524.44,527.24,"and what that single number could tell your doctor."],[527.24,529.66,"We compare real bodies, real habits,"],[529.66,531.62,"every week on Daily Wellness."],[531.62,534.1,"This is general education, not medical advice."]
];

/* ---------- boot / playback ---------- */
(function boot() {
  const stage = document.getElementById('stage');
  function fit() { const s = Math.min(innerWidth / W, innerHeight / H); stage.style.transform = `translate(${(innerWidth - W * s) / 2}px,${(innerHeight - H * s) / 2}px) scale(${s})`; }
  addEventListener('resize', fit); fit();
  const q = new URLSearchParams(location.search);
  CAPTIONS = q.has('cc');
  PHL = buildPhase(bpmL); PHR = buildPhase(bpmR);
  window.__render = t => { render(t); return true; };
  window.__duration = DUR;
  let t0 = null, raf = 0, paused = false, off = 0;
  function frame(now) {
    if (t0 === null) t0 = now - off * 1000;
    const t = (now - t0) / 1000;
    render(Math.min(t, DUR));
    if (t < DUR) raf = requestAnimationFrame(frame); else window.__done = true;
  }
  const ready = Promise.all([document.fonts.load('700 100px Inter'), document.fonts.load('400 100px Inter'), document.fonts.load('600 100px Inter'), document.fonts.load('italic 400 100px "Instrument Serif"')]).catch(() => { });
  Promise.race([ready, new Promise(r => setTimeout(r, 2500))]).then(() => {
    if (q.has('t')) { render(parseFloat(q.get('t')) || 0); window.__ready = true; return; }
    window.__ready = true; render(0); raf = requestAnimationFrame(frame);
    // dev conveniences: space = pause/resume, arrows = seek 5s
    addEventListener('keydown', e => {
      if (e.code === 'Space') { paused = !paused; if (paused) { cancelAnimationFrame(raf); off = (performance.now() - t0) / 1000; } else { t0 = null; raf = requestAnimationFrame(frame); } }
      if (e.code === 'ArrowRight') { off = ((performance.now() - t0) / 1000) + 5; t0 = performance.now() - off * 1000; }
      if (e.code === 'ArrowLeft') { off = Math.max(0, ((performance.now() - t0) / 1000) - 5); t0 = performance.now() - off * 1000; }
    });
  });
})();
