<canvas id="stage" width="3840" height="2160"></canvas>
<script>
'use strict';
/* ============================================================
   CORE: canvas, time, easing, color, text, camera helpers
   ============================================================ */
const W=3840,H=2160,CX=1920,CY=1080,TAU=Math.PI*2,PI=Math.PI;
const cv=document.getElementById('stage');
const mctx=cv.getContext('2d');
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
const buf=mkCanvas(W,H),bctx=buf.getContext('2d');
const blm=mkCanvas(960,540),blctx=blm.getContext('2d');
let ctx=mctx,T=0,CUR=null,BASE=null;

const RGB={n:[7,13,31],g:[61,255,143],w:[234,241,250],a:[255,176,32],r:[255,77,94],s:[91,107,140],k:[3,6,15],v:[150,110,255],p:[13,24,52],m:[212,162,76],c:[232,220,196]};
const HEX={n:'#070D1F',g:'#3DFF8F',w:'#EAF1FA',a:'#FFB020',r:'#FF4D5E',s:'#5B6B8C',k:'#03060F',v:'#966EFF',p:'#0D1834',m:'#D4A24C',c:'#E8DCC4'};
function C(k,a){if(a===undefined||a>=1)return HEX[k]||k;const c=RGB[k];if(!c)return k;return 'rgba('+c[0]+','+c[1]+','+c[2]+','+(a<0?0:a).toFixed(3)+')';}

/* ---------- math / easing ---------- */
const cl=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const Eo=t=>1-Math.pow(1-t,3);
const Ei=t=>t*t*t;
const Eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const Eb=t=>{const c1=2.1,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const Eexp=t=>t>=1?1:1-Math.pow(2,-10*t);
const P=(t0,d=.4)=>d<=0?(T>=t0?1:0):cl((T-t0)/d);
const eo=(t0,d=.5)=>Eo(P(t0,d));
const eio=(t0,d=.6)=>Eio(P(t0,d));
const ex=(t0,d=.5)=>Eexp(P(t0,d));
const pop=(t0,d=.28)=>T<t0?0:Eb(P(t0,d));
const tt=(m,s)=>m*60+s;
const hash=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);};
const on=t0=>T>=t0;
function lt(){return T-CUR.s;}
function sdur(){return CUR.e-CUR.s;}
function su(){return cl((T-CUR.s)/(CUR.e-CUR.s));}
function seg(arr){let v=arr[0][1];for(const [t,x] of arr){if(T>=t)v=x;}return v;}
function bump(t0,d=.35){const p=(T-t0)/d;return p<0||p>1?0:Math.sin(p*PI);}
function pulse(t0,d=.6){const p=(T-t0)/d;return p<0||p>1?0:Math.exp(-p*4)*(1-p);}

/* ---------- draw primitives ---------- */
function glow(c,b){ctx.shadowColor=C(c);ctx.shadowBlur=b;}
function ng(){ctx.shadowBlur=0;ctx.shadowColor='rgba(0,0,0,0)';}
function sv(){ctx.save();} function rs(){ctx.restore();}
function line(x1,y1,x2,y2,c,lw){ctx.strokeStyle=C(c);ctx.lineWidth=lw||4;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function circ(x,y,r,f,s,lw){ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,TAU);if(f){ctx.fillStyle=C(f);ctx.fill();}if(s){ctx.strokeStyle=C(s);ctx.lineWidth=lw||4;ctx.stroke();}}
function rr(x,y,w,h,r,f,s,lw){ctx.beginPath();ctx.roundRect(x,y,w,h,Math.max(0,Math.min(r,Math.abs(w)/2,Math.abs(h)/2)));if(f){ctx.fillStyle=C(f);ctx.fill();}if(s){ctx.strokeStyle=C(s);ctx.lineWidth=lw||4;ctx.stroke();}}
function poly(pts,close,f,s,lw){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);if(close)ctx.closePath();if(f){ctx.fillStyle=C(f);ctx.fill();}if(s){ctx.strokeStyle=C(s);ctx.lineWidth=lw||4;ctx.stroke();}}
function ell(x,y,rx,ry,f,s,lw,rot){ctx.beginPath();ctx.ellipse(x,y,Math.max(0,rx),Math.max(0,ry),rot||0,0,TAU);if(f){ctx.fillStyle=C(f);ctx.fill();}if(s){ctx.strokeStyle=C(s);ctx.lineWidth=lw||4;ctx.stroke();}}
function A(a,fn){if(a<=0.001)return;ctx.save();ctx.globalAlpha*=Math.min(1,a);fn();ctx.restore();}
function at(x,y,s,r,fn){ctx.save();ctx.translate(x,y);if(r)ctx.rotate(r);if(s!==1)ctx.scale(s,s);fn();ctx.restore();}
function atp(x,y,t0,fn,d){if(T<t0)return;const k=pop(t0,d||.28);ctx.save();ctx.translate(x,y);ctx.scale(k,k);ctx.globalAlpha*=cl((T-t0)/.09);fn();ctx.restore();}
/* partial polyline, returns tip */
function partial(pts,k){
  if(k<=0||pts.length<2)return pts[0];
  let L=0;const sg=[];for(let i=1;i<pts.length;i++){const l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);sg.push(l);L+=l;}
  let rem=L*cl(k);ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);let tip=pts[0];
  for(let i=1;i<pts.length;i++){const l=sg[i-1];if(rem>=l){ctx.lineTo(pts[i][0],pts[i][1]);rem-=l;tip=pts[i];}else{const f=l?rem/l:0;tip=[lerp(pts[i-1][0],pts[i][0],f),lerp(pts[i-1][1],pts[i][1],f)];ctx.lineTo(tip[0],tip[1]);break;}}
  ctx.stroke();return tip;
}
function blob(x,y,r,c,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,C(c,a));g.addColorStop(1,C(c,0));ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);}
function dashed(x1,y1,x2,y2,c,lw,d,off){ctx.save();ctx.setLineDash(d||[20,16]);ctx.lineDashOffset=off||0;line(x1,y1,x2,y2,c,lw);ctx.restore();}
function arrowHead(x,y,ang,z,c){ctx.beginPath();ctx.moveTo(x+Math.cos(ang)*z,y+Math.sin(ang)*z);ctx.lineTo(x+Math.cos(ang+2.5)*z,y+Math.sin(ang+2.5)*z);ctx.lineTo(x+Math.cos(ang-2.5)*z,y+Math.sin(ang-2.5)*z);ctx.closePath();ctx.fillStyle=C(c);ctx.fill();}
function arrow(x1,y1,x2,y2,k,c,lw,hz){c=c||'w';lw=lw||8;ctx.strokeStyle=C(c);ctx.lineWidth=lw;ctx.lineCap='round';const tip=partial([[x1,y1],[x2,y2]],k);if(k>0)arrowHead(tip[0],tip[1],Math.atan2(y2-y1,x2-x1),hz||lw*3.2,c);}

/* ---------- text ---------- */
const FH=px=>'700 '+px+'px "Space Grotesk","Segoe UI",Arial,sans-serif';
const FHm=px=>'500 '+px+'px "Space Grotesk","Segoe UI",Arial,sans-serif';
const FM=(px,w)=>(w||600)+' '+px+'px "JetBrains Mono",Consolas,monospace';
function setFont(o,z){ctx.font=o.mono?FM(z,o.w):(o.light?FHm(z):FH(z));ctx.letterSpacing=(o.ls!=null?o.ls:(o.mono?0:z*0.025))+'px';}
function text(s,x,y,o={}){
  const z=o.size||80;ctx.save();setFont(o,z);
  ctx.textAlign=o.align||'center';ctx.textBaseline=o.base||'middle';
  if(o.alpha!=null)ctx.globalAlpha*=o.alpha;
  const c=C(o.color||'w');
  if(o.glow){ctx.shadowColor=C(o.gc||o.color||'w');ctx.shadowBlur=o.glow;}
  if(o.outline){ctx.strokeStyle=C(o.outline);ctx.lineWidth=o.olw||z*0.1;ctx.lineJoin='round';ctx.strokeText(s,x,y);}
  ctx.fillStyle=c;ctx.fillText(s,x,y);ctx.restore();
}
function tw(s,z,o={}){ctx.save();setFont(o,z);const w=ctx.measureText(s).width;ctx.restore();return w;}
/* pop text with overshoot */
function ptext(s,x,y,t0,o={}){if(T<t0)return;const k=pop(t0,o.d||.28);ctx.save();ctx.translate(x,y);ctx.scale(k,k);ctx.globalAlpha*=cl((T-t0)/.08);text(s,0,0,o);ctx.restore();}
/* slam text: from big to normal */
function slam(s,x,y,t0,o={}){if(T<t0)return;const k=P(t0,.16);const sc=k<1?lerp(o.from||2.6,1,Ei(k)):1+0.05*Math.sin((T-t0-.16)*34)*Math.exp(-(T-t0-.16)*12);ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);ctx.globalAlpha*=cl(k*2.2);text(s,0,0,o);ctx.restore();}
/* mask-slide reveal */
function stext(s,x,y,t0,o={}){
  if(T<t0)return;const k=eo(t0,o.d||.45),z=o.size||80;const w=tw(s,z,o)+z;
  const x0=o.align==='left'?x-z*.5:o.align==='right'?x-w+z*.5:x-w/2;
  ctx.save();ctx.beginPath();ctx.rect(x0,y-z*.85,w,z*1.7);ctx.clip();text(s,x,y+(1-k)*z*1.3,o);ctx.restore();
}
/* wipe reveal left->right */
function wtext(s,x,y,t0,o={}){
