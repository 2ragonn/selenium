<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matter Becomes One</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#070B1F}
  #wrap{position:absolute;left:0;top:0;width:3840px;height:2160px;overflow:hidden;transform-origin:0 0}
  canvas{display:block;width:3840px;height:2160px;background:#070B1F}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="3840" height="2160"></canvas></div>
<script>
'use strict';
/* =========================================================
   WHAT HAPPENS WHEN MATTER BECOMES ONE?  — Bose–Einstein condensate
   3840x2160 canvas engine. Design space is 1920x1080 (scaled x2).
   ========================================================= */
const W=3840,H=2160,cv=document.getElementById('c');let X=cv.getContext('2d');
const C={bg:'#070B1F',cy:'#33E1FF',am:'#FFB020',wh:'#F4F7FF',hot:'#FF5A3C',nv:'#14204A',nv2:'#22346E',grey:'#5B6690',n2:'#5A8BFF',gold:'#FFD266',grn:'#3DDC97'};
const HF='"Space Grotesk","Inter",sans-serif',BF='"Inter",sans-serif';
const PI=Math.PI,TAU=PI*2;
let T=0,ZS=2;
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const E={lin:t=>t,out:t=>1-(1-t)**3,in:t=>t*t*t,io:t=>t<.5?4*t*t*t:1-(-2*t+2)**3/2,
  back:t=>{const c=1.9;return 1+(c+1)*(t-1)**3+c*(t-1)**2},
  el:t=>t<=0?0:t>=1?1:2**(-10*t)*Math.sin((t*10-.75)*2.0944)+1};
const R=(t0,d=.5)=>clamp((T-t0)/d),P=(t0,d=.5,e=E.out)=>e(R(t0,d));
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const tri=(v,L)=>{v=((v%(2*L))+2*L)%(2*L);return v>L?2*L-v:v};
const hexA=(h,a)=>{const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`};
function mix(h1,h2,t){t=Math.round(clamp(t)*16)/16;const a=parseInt(h1.slice(1),16),b=parseInt(h2.slice(1),16);
  const r=Math.round(lerp(a>>16,b>>16,t)),g=Math.round(lerp((a>>8)&255,(b>>8)&255,t)),bl=Math.round(lerp(a&255,b&255,t));
  return '#'+((1<<24)|(r<<16)|(g<<8)|bl).toString(16).slice(1)}
const HITS=new Map();
function hit(t0,s=1){if(!HITS.has(t0))HITS.set(t0,s)}

/* ---------- primitives ---------- */
function rr(x,y,w,h,r){X.beginPath();X.roundRect(x,y,w,h,r)}
function circ(x,y,r){X.beginPath();X.arc(x,y,Math.max(0,r),0,TAU)}
function glowOn(col,b){X.shadowColor=col;X.shadowBlur=b*ZS}
function line(x1,y1,x2,y2,col,lw,a=1){X.save();X.globalAlpha*=a;X.strokeStyle=col;X.lineWidth=lw;X.lineCap='round';X.beginPath();X.moveTo(x1,y1);X.lineTo(x2,y2);X.stroke();X.restore()}
function font(sz,f,w){return f==='b'?`${w||500} ${sz}px ${BF}`:`${w||700} ${sz}px ${HF}`}
function txt(s,x,y,o={}){const sz=o.size||48;X.save();if(o.a!==undefined)X.globalAlpha*=o.a;X.font=font(sz,o.f,o.w);
  X.textAlign=o.align||'center';X.textBaseline=o.base||'middle';X.letterSpacing=(o.ls??sz*.03)+'px';
  if(o.glow)glowOn(o.gc||o.color||C.wh,o.glow);X.fillStyle=o.color||C.wh;X.fillText(s,x,y);X.restore()}
function tw(s,sz,f,w){X.save();X.font=font(sz,f,w);X.letterSpacing=(sz*.03)+'px';const v=X.measureText(s).width;X.restore();return v}
function txt2(parts,x,y,o={}){const sz=o.size||48;let tot=0;for(const p of parts)tot+=tw(p[0],sz,o.f);let cx=x-tot/2;
  for(const p of parts){txt(p[0],cx,y,{...o,align:'left',color:p[1],gc:p[1]});cx+=tw(p[0],sz,o.f)}}
/* label: pops in at t0 (optional fade out at t1) */
function lab(s,x,y,t0,o={}){if(T<t0)return;if(o.t1!==undefined&&T>o.t1+.35)return;const p=R(t0,.45);
  let a=clamp(p*2.5);if(o.t1!==undefined)a*=1-R(o.t1,.35);const sc=lerp(.6,1,E.back(p)),sz=o.size||44;
  X.save();X.translate(x,y+(1-E.out(p))*26);X.scale(sc,sc);X.globalAlpha*=a;
  if(o.panel){const w=(o.parts?o.parts.reduce((s2,q)=>s2+tw(q[0],sz,o.f),0):tw(s,sz,o.f))+sz*1.2,h=sz*1.7;
    X.fillStyle=hexA(o.pc||C.nv,.92);rr(-w/2,-h/2,w,h,h*.22);X.fill();
    X.strokeStyle=hexA(o.acc||C.am,.9);X.lineWidth=3;X.stroke();
    X.fillStyle=o.acc||C.am;rr(-w/2,-h/2,10,h,[h*.22,0,0,h*.22]);X.fill()}
  if(o.parts)txt2(o.parts,0,0,{...o,size:sz});else txt(s,0,0,{...o,size:sz,glow:o.glow??(o.color&&o.color!==C.wh?14:0)});
  X.restore();if(!o.nok)hit(t0,.22)}
/* stamp: slams in with bounce */
function stamp(s,x,y,t0,o={}){if(T<t0)return;if(o.t1!==undefined&&T>o.t1+.3)return;const p=R(t0,.34),sz=o.size||120,col=o.color||C.am;
  let sc=p<.5?lerp(1.9,.96,E.out(p/.5)):lerp(.96,1,E.out((p-.5)/.5));if(o.pulse)sc*=1+.03*Math.sin(T*6);
  let a=clamp(p*4);if(o.t1!==undefined)a*=1-R(o.t1,.3);
  X.save();X.translate(x+(o.dx||0),y);X.rotate((o.rot||0)*PI/180);X.scale(sc,sc);X.globalAlpha*=a;
  const w=tw(s,sz,o.f)+sz*.7,h=sz*1.3;
  if(o.box!==false){X.save();glowOn(col,18);X.strokeStyle=col;X.lineWidth=sz*.06;rr(-w/2,-h/2,w,h,sz*.12);X.stroke();X.lineWidth=sz*.018;rr(-w/2+sz*.1,-h/2+sz*.1,w-sz*.2,h-sz*.2,sz*.08);X.stroke();X.restore()}
  txt(s,0,sz*.04,{size:sz,color:col,glow:22,f:o.f});
  if(p<1&&p>.3){const q=(p-.3)/.7;X.strokeStyle=hexA(col,(1-q)*.7);X.lineWidth=6*(1-q)+1;rr(-w/2-q*120,-h/2-q*80,w+q*240,h+q*160,30);X.stroke()}
  X.restore();hit(t0,o.hs??1)}
function qmark(x,y,sz,col=C.grey,a=1){txt('?',x,y,{size:sz,color:col,a,glow:col===C.grey?0:16})}

/* ---------- sprites ---------- */
const SPR={},SPH={};
function spr(col){let c=SPR[col];if(c)return c;c=document.createElement('canvas');c.width=c.height=96;const g=c.getContext('2d'),gr=g.createRadialGradient(48,48,0,48,48,48);
  gr.addColorStop(0,'#ffffff');gr.addColorStop(.15,col);gr.addColorStop(.3,hexA(col,.5));gr.addColorStop(.6,hexA(col,.12));gr.addColorStop(1,hexA(col,0));g.fillStyle=gr;g.fillRect(0,0,96,96);return SPR[col]=c}
function dot(x,y,r,col=C.cy,a=1){if(a<=0||r<=0)return;const s=spr(col);if(a<1){const o=X.globalAlpha;X.globalAlpha=o*a;X.drawImage(s,x-r*3,y-r*3,r*6,r*6);X.globalAlpha=o}else X.drawImage(s,x-r*3,y-r*3,r*6,r*6)}
function sph(col){let c=SPH[col];if(c)return c;c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),gr=g.createRadialGradient(46,42,4,64,64,62);
  gr.addColorStop(0,'#ffffff');gr.addColorStop(.25,mix(col,'#ffffff',.35));gr.addColorStop(.7,col);gr.addColorStop(1,mix(col,'#000000',.55));g.fillStyle=gr;g.beginPath();g.arc(64,64,62,0,TAU);g.fill();return SPH[col]=c}
function ball(x,y,r,col,a=1){if(a<=0)return;const o=X.globalAlpha;X.globalAlpha=o*a;X.drawImage(sph(col),x-r,y-r,r*2,r*2);X.globalAlpha=o}
function streak(x,y,tx,ty,r,col,a=1){X.save();X.globalAlpha*=a;const g=X.createLinearGradient(tx,ty,x,y);g.addColorStop(0,hexA(col,0));g.addColorStop(1,hexA(col,.8));
  X.strokeStyle=g;X.lineWidth=r*1.5;X.lineCap='round';X.beginPath();X.moveTo(tx,ty);X.lineTo(x,y);X.stroke();X.restore();dot(x,y,r,col,a)}
function ring(x,y,r,col,a=1,lw=3){if(a<=0||r<=0)return;X.save();X.globalAlpha*=a;X.strokeStyle=col;X.lineWidth=lw;circ(x,y,r);X.stroke();X.restore()}
function ripple(x,y,t0,maxR,col=C.cy,d=1,lw=8){if(T<t0||T>t0+d)return;const p=R(t0,d);ring(x,y,maxR*E.out(p),col,1-p,lw*(1-p)+1)}
/* gas particle reflected inside a box; dist = travelled distance parameter */
function gas(i,dist,bx,by,bw,bh,sx,sy){const a=rnd(i*3+1)*TAU,s=.45+rnd(i*3+2);const x0=sx??(bx+rnd(i*7+3)*bw),y0=sy??(by+rnd(i*11+5)*bh);
  return [bx+tri(x0-bx+Math.cos(a)*s*dist,bw),by+tri(y0-by+Math.sin(a)*s*dist,bh)]}
const NOISE=(()=>{const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');const d=g.createImageData(256,256);
  for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}g.putImageData(d,0,0);return c})();
const SMEAR=(()=>{const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');g.fillStyle='#0d1a44';g.fillRect(0,0,256,256);g.filter='blur(22px)';
  for(let i=0;i<9;i++){g.fillStyle=i%3?hexA(C.cy,.55):hexA('#1e3a8a',.9);g.beginPath();g.ellipse(rnd(i+40)*256,rnd(i+60)*256,30+rnd(i+80)*60,18+rnd(i+90)*40,rnd(i)*3,0,TAU);g.fill()}
  g.filter='none';return c})();
</script>
<script>
'use strict';
/* ================= RECURRING DEVICES ================= */
function orb(x,y,r,o={}){const a=o.a??1;if(a<=0||r<=0)return;X.save();X.globalAlpha*=a;
  X.globalCompositeOperation='lighter';let g=X.createRadialGradient(x,y,r*.5,x,y,r*2.7);
  g.addColorStop(0,'rgba(51,225,255,.40)');g.addColorStop(.35,'rgba(51,225,255,.13)');g.addColorStop(1,'rgba(51,225,255,0)');X.fillStyle=g;circ(x,y,r*2.7);X.fill();
  X.globalCompositeOperation='source-over';
  g=X.createRadialGradient(x-r*.22,y-r*.26,r*.04,x,y,r);g.addColorStop(0,'#F0FEFF');g.addColorStop(.35,'#86EDFF');g.addColorStop(.75,'#1FB8E6');g.addColorStop(1,'#0A4F80');
  X.fillStyle=g;circ(x,y,r);X.fill();
  X.save();circ(x,y,r);X.clip();X.globalCompositeOperation='lighter';
  for(let k=0;k<5;k++){const ph=T*(.35+k*.12)+k*1.7;X.strokeStyle=`rgba(200,250,255,${.09+.05*Math.sin(T*2+k)})`;X.lineWidth=r*(k%2?.08:.045);
    X.beginPath();X.ellipse(x,y,r*(.95-k*.12),Math.abs(r*(.3+.12*Math.sin(ph))),ph*.5+k,0,TAU);X.stroke()}
  g=X.createRadialGradient(x,y,0,x,y,r*.6);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.35,'rgba(255,255,255,.6)');g.addColorStop(1,'rgba(255,255,255,0)');
  X.fillStyle=g;X.fillRect(x-r,y-r,2*r,2*r);X.restore();
  X.strokeStyle='rgba(225,252,255,.8)';X.lineWidth=Math.max(1.5,r*.014);circ(x,y,r);X.stroke();
  const n=o.rings??3;for(let k=0;k<n;k++){const ph=((T*.45)+k/n)%1;X.strokeStyle=hexA(C.cy,(1-ph)*.6);X.lineWidth=Math.max(1,r*.02*(1-ph)+1);circ(x,y,r*(1.08+ph*.95));X.stroke()}
  X.restore()}
function thermo(x,y,h,lvl,o={}){const tw=o.tw||h*.075,br=tw*1.18,bulbY=y+h-br,floorY=bulbY-br-h*.05,top=y+tw*.6,span=floorY-top,mY=floorY-clamp(lvl,-.03,1)*span,mc=o.col||C.hot,lw=Math.max(2,tw*.08);
  X.save();if(o.a!==undefined)X.globalAlpha*=o.a;
  X.strokeStyle=o.frost?'#CFF6FF':C.wh;X.lineWidth=lw*2;rr(x-tw/2,y,tw,bulbY-y,tw/2);X.stroke();circ(x,bulbY,br);X.stroke();
  X.fillStyle='#0E1840';rr(x-tw/2,y,tw,bulbY-y,tw/2);X.fill();circ(x,bulbY,br);X.fill();
  for(let i=0;i<=10;i++){const yy=floorY-span*i/10;line(x+tw*.62,yy,x+tw*(i%5?0.9:1.15),yy,hexA(C.wh,.55),lw*.6)}
  X.save();glowOn(mc,16);X.fillStyle=mc;const iw=tw*.46;rr(x-iw/2,mY,iw,bulbY-mY,iw/2);X.fill();circ(x,bulbY,br*.72);X.fill();X.restore();
  X.fillStyle='rgba(255,255,255,.14)';rr(x-tw*.3,y+tw*.4,tw*.12,Math.max(0,bulbY-y-br*1.7),tw*.06);X.fill();
  if(o.floor!==false){const fl=o.flash||0;X.save();glowOn(C.am,10+fl*30);line(x-tw*1.9,floorY,x+tw*1.9,floorY,C.am,lw*(1.2+fl));X.restore();
    if(o.floorLabel)txt(o.floorLabel,o.flSide==='r'?x+tw*2.2:x-tw*2.2,floorY,{size:o.fls||Math.max(20,tw*.55),color:C.am,align:o.flSide==='r'?'left':'right',glow:10+fl*14})}
  if(o.mark!==undefined){const my=floorY-o.mark*span;line(x-tw*1.2,my,x+tw*1.2,my,o.markCol||C.am,lw);}
  X.restore();return {floorY,mY,top,tw,bulbY,span,x}}
function building(x,y,w,h,o={}){const n=o.n||6,fh=h/n;X.save();if(o.a!==undefined)X.globalAlpha*=o.a;
  X.fillStyle=hexA(C.nv,.8);X.fillRect(x,y,w,h);
  for(let i=0;i<n;i++)for(let j=0;j<6;j++){X.fillStyle=hexA(C.cy,.05);X.fillRect(x+w*.06+j*w*.155,y+h-(i+1)*fh+fh*.22,w*.1,fh*.4)}
  if(o.hl!==undefined&&o.hla>0){X.save();X.globalAlpha*=o.hla;glowOn(C.am,30);X.fillStyle=hexA(C.am,.32);X.fillRect(x,y+h-(o.hl+1)*fh,w,fh);X.restore()}
  for(let i=0;i<=n;i++){const yy=y+h-i*fh;line(x-(i?0:20),yy,x+w+(i?0:20),yy,i?hexA(C.cy,.5):C.cy,i?3:9)}
  X.strokeStyle=hexA(C.cy,.6);X.lineWidth=3;X.strokeRect(x,y,w,h);
  X.beginPath();X.moveTo(x-10,y);X.lineTo(x+w/2,y-fh*.6);X.lineTo(x+w+10,y);X.stroke();
  X.restore();return {fy:i=>y+h-i*fh-Math.min(16,fh*.25),fh,x,y,w,h}}
function slot(x,y,w,h,num,o={}){X.save();if(o.a!==undefined)X.globalAlpha*=o.a;
  X.fillStyle=hexA(C.nv,.78);rr(x-w/2,y-h/2,w,h,22);X.fill();
  X.setLineDash([16,12]);X.lineDashOffset=-T*24;X.lineWidth=4;X.strokeStyle=o.hl?C.am:'#33489A';if(o.hl)glowOn(C.am,16*o.hl);rr(x-w/2,y-h/2,w,h,22);X.stroke();X.setLineDash([]);X.shadowBlur=0;
  const bs=Math.min(w,h)*.075+14;circ(x-w/2+bs+14,y-h/2+bs+14,bs);X.fillStyle=C.am;X.fill();txt(String(num),x-w/2+bs+14,y-h/2+bs+16,{size:bs*1.25,color:C.bg});
  if(!o.filled)qmark(x,y,h*.38,C.grey,.6+.3*Math.sin(T*3+num));
  if(o.label)txt(o.label,x,y+h/2-h*.13,{size:o.ls||Math.min(40,w*.085),color:o.hl?C.am:C.wh});
  X.restore()}
function tracker(cx,cy,sc,labels,fills,hl){X.save();X.translate(cx,cy);X.scale(sc,sc);
  for(let i=0;i<3;i++){const f=fills[i]!==undefined&&T>=fills[i];slot((i-1)*380,0,350,150,i+1,{filled:f,hl:hl===i||hl===-1?1:0,label:null});
    if(f){const p=P(fills[i],.4,E.back);txt(labels[i],(i-1)*380+20,4,{size:34*clamp(p,0,1.2),color:hl===i||hl===-1?C.am:C.wh,glow:10})}}
  X.restore()}
const SHARDS=(()=>{const a=[],nx=6,ny=4,j=(i,k)=>[i/nx+(i>0&&i<nx?(rnd(i*13+k*7)-.5)*.09:0),k/ny+(k>0&&k<ny?(rnd(i*5+k*17)-.5)*.12:0)];
  for(let i=0;i<nx;i++)for(let k=0;k<ny;k++){const p00=j(i,k),p10=j(i+1,k),p01=j(i,k+1),p11=j(i+1,k+1);a.push([p00,p10,p11],[p00,p11,p01])}return a})();
function shatter(x,y,w,h,p,fill){SHARDS.forEach((s,i)=>{const cxn=(s[0][0]+s[1][0]+s[2][0])/3,cyn=(s[0][1]+s[1][1]+s[2][1])/3,dx=cxn-.5,dy=cyn-.5,dl=Math.hypot(dx,dy)+.001;
  const d=E.out(p)*(500+rnd(i)*500),rot=p*(rnd(i+9)-.5)*4;const px=x-w/2+cxn*w,py=y-h/2+cyn*h;
  X.save();X.globalAlpha*=1-p;X.translate(px+dx/dl*d,py+dy/dl*d+p*p*300);X.rotate(rot);X.translate(-px,-py);
  X.beginPath();s.forEach((q,k)=>{const qx=x-w/2+q[0]*w,qy=y-h/2+q[1]*h;k?X.lineTo(qx,qy):X.moveTo(qx,qy)});X.closePath();X.save();X.clip();fill();X.restore();
  X.strokeStyle='rgba(230,245,255,.7)';X.lineWidth=2;X.stroke();X.restore()})}
function frostFill(x,y,w,h){X.fillStyle='rgba(150,185,240,.16)';X.fillRect(x-w/2,y-h/2,w,h);X.save();X.globalAlpha*=.1;X.fillStyle=X.createPattern(NOISE,'repeat');X.fillRect(x-w/2,y-h/2,w,h);X.restore();
  const g=X.createLinearGradient(x-w/2,y-h/2,x+w/2,y+h/2);g.addColorStop(0,'rgba(255,255,255,.12)');g.addColorStop(.45,'rgba(255,255,255,.02)');g.addColorStop(.5,'rgba(255,255,255,.10)');g.addColorStop(1,'rgba(255,255,255,0)');X.fillStyle=g;X.fillRect(x-w/2,y-h/2,w,h)}
const PB=document.createElement('canvas'),PG=PB.getContext('2d');
function paneBehind(x,y,w,h,o,al,clump){X.fillStyle=hexA(C.nv,.65);X.fillRect(x-w/2,y-h/2,w,h);
  for(let k=0;k<5;k++){const ph=lerp(T*(1.2+k*.3)+k*1.3,T*1.6,al),amp=34*(o.wb??1)*(1+al*.6);X.strokeStyle=hexA(C.cy,.7*(o.wb??1));X.lineWidth=9;X.beginPath();
    for(let px=-w/2;px<=w/2;px+=12){const yy=lerp(y-h/2+h*(k+1)/6,y,al)+amp*Math.sin(px/90+ph);px===-w/2?X.moveTo(x+px,yy):X.lineTo(x+px,yy)}X.stroke();
    if(o.trace){X.strokeStyle=hexA(C.am,o.trace*.8);X.lineWidth=3;X.stroke()}}
  for(let k=0;k<5;k++){const bx=x+Math.sin(T*.5+k*2)*w*.32,by=y+Math.cos(T*.4+k*1.3)*h*.25;X.fillStyle=hexA(C.cy,.3*(1-al));circ(bx,by,40+k*10);X.fill()}
  if(clump>0)for(let i=0;i<60;i++){const sx=x+(rnd(i)-.5)*w*1.6,sy=y+(rnd(i+3)-.5)*h*1.4,ang=rnd(i+7)*TAU,r2=rnd(i+9)*60;
    dot(lerp(sx,x+Math.cos(ang)*r2,E.io(clump)),lerp(sy,y+Math.sin(ang)*r2,E.io(clump)),8,o.dcol||C.cy,clamp(clump*2))}}
