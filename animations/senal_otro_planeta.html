  if (t > 262) { m.save(); m.globalAlpha = .8 * cl((t - 262) / .6); m.font = `700 30px ${FM}`; m.textAlign = 'right'; m.textBaseline = 'middle'; m.fillStyle = '#5B6B8C'; m.fillText('FILTROS', W - 470, 2046); for (let i = 0; i < 5; i++) { const on = t >= FUNLOCK[i]; const x = W - 420 + i * 62; m.beginPath(); m.arc(x, 2046, 18, 0, TAU); if (on) { m.fillStyle = GRN; m.shadowColor = GRN; m.shadowBlur = 20; m.fill(); m.shadowBlur = 0; } else { m.strokeStyle = '#5B6B8C'; m.lineWidth = 4; m.stroke(); } } m.restore(); }
}

/* ============================ ARRANQUE ============================ */
function fit() { const s = Math.min(window.innerWidth / W, window.innerHeight / H); const st = document.getElementById('stage'); st.style.transform = `scale(${s})`; st.style.left = ((window.innerWidth - W * s) / 2) + 'px'; st.style.top = ((window.innerHeight - H * s) / 2) + 'px'; }
window.addEventListener('resize', fit); fit();
initTex();
window.renderAt = t => render(t);
window.DURATION = TOTAL;
const QS = new URLSearchParams(location.search); const START = parseFloat(QS.get('t') || '0') || 0; const MANUAL = QS.has('manual');
let t0 = null;
function loop(now) { if (t0 === null) t0 = now; const t = START + (now - t0) / 1000; render(Math.min(t, TOTAL + 2)); if (t < TOTAL + 2) requestAnimationFrame(loop); }
function start() { render(START); if (!MANUAL) requestAnimationFrame(loop); }
const fontsReady = (document.fonts && document.fonts.load) ? Promise.all([document.fonts.load(`700 100px "Space Grotesk"`), document.fonts.load(`700 100px "JetBrains Mono"`), document.fonts.load(`800 100px "JetBrains Mono"`), document.fonts.load(`700 100px "Caveat"`)]) : Promise.resolve();
render(START);
Promise.race([fontsReady, new Promise(r => setTimeout(r, 2500))]).then(() => { for (const k in stampC) delete stampC[k]; for (const k in pixC) delete pixC[k]; start(); });
</script>
