<canvas id="cv" width="3840" height="2160"></canvas>
<script>
/* ===== 01_core.js ===== */
'use strict';
/* Reverend Insanity — "Gökyüzünün İradesi"  ·  3840x2160 canvas animation
   Everything is a pure function of time (deterministic), so it can be played live
   (autoplay) or rendered frame-by-frame:  window.__seek(seconds)  /  window.__duration  */
const W=1920,H=1080;                       // logical design space (drawn 2x on the 3840x2160 canvas)
const PRM=new URLSearchParams(location.search);
const Q=parseFloat(PRM.get('q')||'1')||1;  // internal resolution multiplier (1 = true 4K)
const cv=document.getElementById('cv');
cv.width=Math.round(3840*Q);cv.height=Math.round(2160*Q);
const ctx=cv.getContext('2d',{alpha:false});
let c=ctx;
const K=cv.width/W;
let NOW=0,LT=0,LP=0,SC=null,CAM={z:1,fx:960,fy:540};

const COL={bg:'#0B0F1A',gold:'#E8B93C',goldL:'#FFE9A6',goldD:'#9A7120',red:'#C8302E',redL:'#FF6A5C',redD:'#6E1417',
 text:'#EDE8DA',ink:'#05070D',navy:'#111830',navy2:'#1A2444',navy3:'#2A3866',jade:'#58C79B',white:'#FFFFFF'};

/* ---------- math / easing ---------- */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const E={lin:x=>x,in2:x=>x*x,in3:x=>x*x*x,out2:x=>1-(1-x)*(1-x),out3:x=>1-Math.pow(1-x,3),out4:x=>1-Math.pow(1-x,4),
 io2:x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2,io3:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
 expo:x=>x>=1?1:1-Math.pow(2,-10*x),back:x=>1+2.70158*Math.pow(x-1,3)+1.70158*Math.pow(x-1,2),
 elastic:x=>x<=0?0:x>=1?1:Math.pow(2,-10*x)*Math.sin((x*10-.75)*(2*Math.PI)/3)+1,
 bounce:x=>{const n=7.5625,d=2.75;if(x<1/d)return n*x*x;if(x<2/d)return n*(x-=1.5/d)*x+.75;if(x<2.5/d)return n*(x-=2.25/d)*x+.9375;return n*(x-=2.625/d)*x+.984375;}};
const A=(x,d=.6,e=E.out3)=>e(clamp(x/d));                 // eased progress of a beat that began `x` seconds ago
const seg=(x,a,b,e=E.io3)=>e(clamp((x-a)/(b-a)));          // eased progress between two times
const R=n=>{const s=Math.sin(n*127.1+n*n*1e-4+311.7)*43758.5453;return s-Math.floor(s);};   // deterministic hash 0..1
const vnoise=x=>{const i=Math.floor(x),f=x-i,a=R(i*1.7+.3),b=R((i+1)*1.7+.3),u=f*f*(3-2*f);return a+(b-a)*u;};
const fbm=(x,s=0)=>vnoise(x+s*17.3)*.55+vnoise(x*2.1+s*7.7)*.3+vnoise(x*4.3+s*3.1)*.15;
const sec=s=>{const m=String(s).match(/^(\d+):(\d+(?:\.\d+)?)$/);return m?(+m[1]*60+ +m[2]):+s;};
const B=s=>NOW-sec(s);                                     // seconds elapsed since a beat time (negative = not yet)
const pulse=(f,ph=0)=>.5+.5*Math.sin(NOW*f*6.2832+ph);
const mk=(w,h)=>{const e=document.createElement('canvas');e.width=w;e.height=h;return e;};

/* ---------- colour ---------- */
const _rgb={};
const rgb=h=>{let v=_rgb[h];if(!v){const n=parseInt(h.slice(1),16);v=_rgb[h]=[n>>16&255,n>>8&255,n&255];}return v;};
const rgba=(h,a)=>{const v=rgb(h);return 'rgba('+v[0]+','+v[1]+','+v[2]+','+a+')';};
const mixc=(a,b,t)=>{const x=rgb(a),y=rgb(b);return '#'+[0,1,2].map(i=>Math.round(x[i]+(y[i]-x[i])*t).toString(16).padStart(2,'0')).join('');};

/* ---------- glow sprites (cheap bloom) ---------- */
const _spr={};
function sprite(hex){let s=_spr[hex];if(!s){s=mk(128,128);const x=s.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);
 g.addColorStop(0,rgba(hex,1));g.addColorStop(.16,rgba(hex,.6));g.addColorStop(.42,rgba(hex,.2));g.addColorStop(.74,rgba(hex,.045));g.addColorStop(1,rgba(hex,0));
 x.fillStyle=g;x.fillRect(0,0,128,128);_spr[hex]=s;}return s;}
function glow(x,y,r,hex,a=1,sy=1){const g0=c.globalAlpha,o=c.globalCompositeOperation;c.globalAlpha=g0*a;c.globalCompositeOperation='lighter';
 c.drawImage(sprite(hex),x-r,y-r*sy,r*2,r*2*sy);c.globalCompositeOperation=o;c.globalAlpha=g0;}

/* ---------- basic shapes ---------- */
const rr=(x,y,w,h,r)=>{c.beginPath();c.roundRect(x,y,w,h,r);};
const poly=(p,close=true)=>{c.beginPath();p.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));if(close)c.closePath();};
function ln(x1,y1,x2,y2,col,lw=2,a=1){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.strokeStyle=rgba(col,a);c.lineWidth=lw;c.stroke();}
function circ(x,y,r,fill,stroke,lw=2,a=1){c.beginPath();c.arc(x,y,r,0,6.2832);if(fill){c.fillStyle=fill.startsWith&&fill[0]==='#'?rgba(fill,a):fill;c.fill();}if(stroke){c.strokeStyle=rgba(stroke,a);c.lineWidth=lw;c.stroke();}}
function goldGrad(y0,y1,l=COL.goldL,m=COL.gold,d='#B07F22'){const g=c.createLinearGradient(0,y0,0,y1);g.addColorStop(0,l);g.addColorStop(.5,m);g.addColorStop(1,d);return g;}
function vgrad(y0,y1,a,b){const g=c.createLinearGradient(0,y0,0,y1);g.addColorStop(0,a);g.addColorStop(1,b);return g;}
function rgrad(x,y,r0,r1,stops){const g=c.createRadialGradient(x,y,r0,x,y,r1);stops.forEach(s=>g.addColorStop(s[0],s[1]));return g;}
/* soft glowing stroke of the current path */
function strokeGlow(col,lw,a=1,gl=1){c.save();c.lineJoin='round';c.lineCap='round';
 if(gl>0){c.strokeStyle=rgba(col,.14*a*gl);c.lineWidth=lw*6;c.stroke();c.strokeStyle=rgba(col,.28*a*gl);c.lineWidth=lw*2.8;c.stroke();}
 c.strokeStyle=rgba(col,a);c.lineWidth=lw;c.stroke();c.restore();}

/* ---------- typography ---------- */
const FH='"CinzelV","Cinzel",Georgia,"Times New Roman",serif',FB='"InterV","Inter",system-ui,"Segoe UI",Arial,sans-serif';
const setF=(s,f,w)=>{c.font=(w||(f==='h'?700:500))+' '+s+'px '+(f==='h'?FH:FB);};
function tw(str,s,f='b',w,ls=0){c.save();setF(s,f,w);c.letterSpacing=ls+'px';const m=c.measureText(str).width-ls;c.restore();return m;}
function fit(str,s,maxW,f='h',w,ls=0){const m=tw(str,s,f,w,ls);return m>maxW?s*maxW/m:s;}
/* o: s size, f 'h'|'b', w weight, col, a alpha, al 'c'|'l'|'r', ls letter-spacing, grad, stroke, sw, glow, gb, rot, sc, bl */
function text(str,x,y,o={}){
 const s=o.s||36,f=o.f||'b',ls=o.ls||0,al=o.al||'c';
 c.save();c.translate(x,y);if(o.rot)c.rotate(o.rot);if(o.sc)c.scale(o.sc,o.scy||o.sc);
 setF(s,f,o.w);c.letterSpacing=ls+'px';c.textBaseline=o.bl||'middle';c.textAlign='left';
 const w=c.measureText(str).width-ls,px=al==='c'?-w/2:al==='r'?-w:0;
 if(o.a!=null)c.globalAlpha*=o.a;
 if(o.stroke){c.lineJoin='round';c.lineWidth=o.sw||s*.14;c.strokeStyle=o.stroke;c.strokeText(str,px,0);}
 if(o.glow){c.shadowColor=rgba(o.glow,o.ga??.85);c.shadowBlur=(o.gb||s*.4)*K;}
 c.fillStyle=o.grad?goldGrad(-s*.55,s*.55):(o.col||COL.text);
 c.fillText(str,px,0);c.restore();return w;}
/* per-letter kinetic title. tt = seconds since it started */
function kin(str,cx,y,s,tt,o={}){
 const f=o.f||'h',ls=o.ls??s*.07,stag=o.stag??.04,dur=o.dur??.5,mode=o.mode||'rise';
 const ch=[...str];c.save();setF(s,f,o.w);c.letterSpacing='0px';const ws=ch.map(q=>c.measureText(q).width+ls);c.restore();
 const total=ws.reduce((a,b)=>a+b,0)-ls;let x=cx-total/2;
 ch.forEach((q,i)=>{const a=clamp((tt-i*stag)/dur);if(a>0&&q!==' '){const e=E.out3(a);
  const oo=Object.assign({},o,{s,f,al:'c',ls:0,a:e*(o.a??1)});
  if(mode==='slam'){oo.sc=1+(1-e)*1.1;}
  const yy=mode==='rise'?y+(1-e)*s*.45:mode==='drop'?y-(1-E.out4(a))*s*.6:y;
  text(q,x+ws[i]/2-ls/2,yy,oo);}x+=ws[i];});
 return total;}
/* headline: fitted gold Cinzel title */
function title(str,cx,y,s,tt,o={}){const ss=fit(str,s,o.maxW||1560,'h',700,(o.ls??s*.07));
 return kin(str,cx,y,ss,tt,Object.assign({grad:true,stroke:COL.ink,glow:COL.gold,ga:.55,gb:ss*.3},o));}
/* body label (Inter) */
const label=(str,x,y,s=26,o={})=>text(str,x,y,Object.assign({s,f:'b',w:600,ls:s*.14,col:COL.text},o));

/* ---------- ui ---------- */
function panel(x,y,w,h,o={}){c.save();const r=o.r??18;

let t0=null,paused=PRM.get('paused')==='1',startAt=parseFloat(PRM.get('t')||'0')||0,done=false;
function loop(ts){if(t0===null)t0=ts-startAt*1000;const T=(ts-t0)/1000;
 if(!paused){frame(T);if(T>=TOTAL+.5&&!done){done=true;window.__done=true;document.dispatchEvent(new Event('animationend'));}}
 if(!done)requestAnimationFrame(loop);}
function boot(){window.__ready=true;frame(startAt);if(!paused)requestAnimationFrame(loop);}
