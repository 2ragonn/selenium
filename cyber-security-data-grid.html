<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cyber Security Data Grid</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden}
  #c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
     width:min(100vw,calc(100vh * 16 / 9));height:min(100vh,calc(100vw * 9 / 16));
     display:block;background:#000}
  #err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#7fb2ff;
       font:600 28px/1.4 system-ui,sans-serif;text-align:center;padding:40px}
</style>
</head>
<body>
<canvas id="c" width="3840" height="2160"></canvas>
<div id="err">This browser cannot draw the animation (no WebGL2 and no Canvas 2D).</div>
<script>
/*
  CYBER SECURITY DATA GRID  -  red / blue digital grid: hacking vs. security
  3840x2160 canvas, 15 second seamless loop, autoplays on open.

  Everything is a pure function of time (see renderFrame(t)); every motion is periodic over the
  15 s loop, so frame 0 follows frame 899 (at 60 fps) with no visible seam.

  If WebGL2 is unavailable (GPU disabled, old browser, headless without GPU) the page falls back
  automatically to a Canvas 2D renderer of the same 15 s loop.

  Hooks for offline / frame-by-frame capture:
     window.renderFrame(t)      draw the frame for time t (seconds, wraps at 15)
     window.ANIMATION           { duration:15, width:3840, height:2160 }
     window.__ready             true once the first frame has been drawn
  URL parameters:  ?t=6.5  freeze on a single frame (preview), ?paused  start paused,
                   ?msaa=0  disable multisampling (lighter on weak GPUs)
*/
(function () {
'use strict';
function runGL(){
const W = 3840, H = 2160, LOOP = 15;
const canvas = document.getElementById('c');
let gl = null;
const ATTRS = [
  { antialias: false, alpha: false, depth: false, stencil: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' },
  { antialias: false, alpha: false, depth: false, stencil: false, preserveDrawingBuffer: true },
  { preserveDrawingBuffer: true },
  {}
];
for (const a of ATTRS) { try { gl = canvas.getContext('webgl2', a); } catch (e) { gl = null; } if (gl) break; }
if (!gl) return false;

const extCBF = gl.getExtension('EXT_color_buffer_float');
const extCBH = gl.getExtension('EXT_color_buffer_half_float');
const HDR = !!(extCBF || extCBH);
const FMT = HDR ? gl.RGBA16F : gl.RGBA8;

/* ------------------------------------------------------------------ utilities */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rand = mulberry32(20240915);
const rr = (a,b)=>a+(b-a)*rand();
const sstep=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x);};

/* ------------------------------------------------------------------ shaders */
const HEAD = `#version 300 es
precision highp float;
precision highp int;
uniform mat4 uVP;
uniform vec3 uEye;
uniform vec3 uCR;
uniform vec3 uCU;
uniform vec3 uCF;
uniform vec2 uRes;
uniform float uT;
uniform float uP;
uniform float uAlert;
uniform float uGlitch;
uniform float uAtk;
uniform float uDef;
uniform float uTanH;
uniform float uAspect;
const float TAU = 6.283185307179586;
float ss(float a,float b,float x){float t=clamp((x-a)/(b-a),0.0,1.0);return t*t*(3.0-2.0*t);}
vec2 ss(float a,float b,vec2 x){vec2 t=clamp((x-a)/(b-a),0.0,1.0);return t*t*(3.0-2.0*t);}
// anti-aliased edge glow: widens with pixel footprint, keeps energy constant
float edgeG(float d,float w,float fw){float w2=max(w,fw*1.4);return ss(w2,0.0,d)*min(1.0,w/w2);}
uint pcg(uint v){uint s=v*747796405u+2891336137u;uint w=((s>>((s>>28u)+4u))^s)*277803737u;return (w>>22u)^w;}
float h21(vec2 c,float salt){
  ivec2 i=ivec2(floor(c))+ivec2(50000);
  uint h=pcg(uint(i.x)+pcg(uint(i.y)+pcg(uint(salt*131.0)+7u)));
  return float(h>>8)*(1.0/16777216.0);
}
vec3 hazeColor(vec3 d){
  float h=d.y;
  float hz=exp(-abs(h)*10.0);
  float side=ss(0.30,-0.50,d.x);
  vec3 glow=mix(vec3(0.03,0.20,0.95),vec3(0.95,0.04,0.12),side);
  glow=mix(glow,vec3(0.95,0.04,0.12),uAlert*0.40);
  vec3 c=vec3(0.003,0.008,0.028)+vec3(0.0,0.006,0.026)*exp(-abs(h)*3.0);
  c+=glow*hz*0.20;
  c+=glow*exp(-abs(h)*3.2)*0.012;
  c*=mix(1.0,0.30,ss(0.0,0.9,h));
  return c;
}
`;

/* grid state: which cells are breached (red), fronts of the breach, the blue defence wave */
const FIELD = `
const vec2 SH=vec2(0.0,60.0);
const vec2 ORG[5]=vec2[5](vec2(-38.0,28.0),vec2(44.0,42.0),vec2(-8.0,96.0),vec2(64.0,90.0),vec2(-70.0,80.0));
const float OT0[5]=float[5](2.2,2.9,3.5,4.1,4.7);
const float ORM[5]=float[5](30.0,30.0,34.0,32.0,34.0);
// returns (redAmount, breachFront, defenceRing, restoredAfterglow)
vec4 fieldState(vec2 c){
  float hj=h21(c,5.0);
  float lo=h21(floor(c*0.25),6.0);
  vec2 q=c+0.5;
  float inf=0.0,eI=0.0;
  for(int k=0;k<5;k++){
    float g=clamp((uT-OT0[k])/4.4,0.0,1.0);
    if(g>0.0){
      float R=ORM[k]*(1.0-(1.0-g)*(1.0-g));
      float d=distance(q,ORG[k])+(hj-0.5)*4.0+(lo-0.5)*9.0;
      inf=max(inf,ss(-1.2,1.2,R-d));
      eI=max(eI,exp(-abs(R-d)*0.7)*(1.0-g));
    }
  }
  float Rc=(uT-8.6)*24.0;
  float dc=distance(q,SH)+(hj-0.5)*3.0+(lo-0.5)*4.0;
  float cure=ss(-1.5,1.5,Rc-dc);
  float fr=1.0-ss(90.0,125.0,Rc);
  float eC=exp(-abs(Rc-dc)*0.55)*fr*step(0.0,Rc);
  float aft=exp(-max(Rc-dc,0.0)*0.2)*inf*step(0.0,Rc-dc)*fr;
  return vec4(inf*(1.0-cure),eI*(1.0-cure),eC,aft);
}
`;

const VS_FULL = HEAD + `
out vec2 vUv;
void main(){
  vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));
  vUv=p; gl_Position=vec4(p*2.0-1.0,0.0,1.0);
}`;

/* ---- background haze / horizon */
const FS_BG = HEAD + `
in vec2 vUv; out vec4 o;
void main(){
  vec2 n=vUv*2.0-1.0;
  vec3 d=normalize(uCF+uCR*n.x*uTanH*uAspect+uCU*n.y*uTanH);
  o=vec4(hazeColor(d),1.0);
}`;

/* ---- glossy grid floor */
const VS_FLOOR = HEAD + `
layout(location=0) in vec3 aPos;
out vec3 vW;
void main(){ vW=aPos; gl_Position=uVP*vec4(aPos,1.0); }`;

const FS_FLOOR = HEAD + FIELD + `
in vec3 vW; out vec4 o;
float pulseTrain(float along,float idx,float salt){
  float h=h21(vec2(idx,0.0),salt);
  float on=step(0.5,h);
  float dir=h21(vec2(idx,1.0),salt)<0.5?-1.0:1.0;
  float k=1.0+floor(h21(vec2(idx,2.0),salt)*3.0);
  float off=h21(vec2(idx,3.0),salt);
  const float L=64.0;
  float f=fract(dir*along/L-k*uP+off);
  float a=exp(-(1.0-f)*L/3.0)*ss(1.0,0.985,f);
  float f2=fract(dir*along/L-k*uP+off+0.5);
  float b=exp(-(1.0-f2)*L/3.0)*ss(1.0,0.985,f2)*0.6;
  return on*(a+b);
}
void main(){
  vec2 p=vW.xz;
  vec3 tp=vW-uEye; float dist=length(tp); vec3 vd=tp/dist;
  vec2 cell=floor(p);
  vec4 fs=fieldState(cell);
  float red=fs.x;
  vec3 cb=vec3(0.04,0.30,1.0), cr=vec3(1.0,0.04,0.10);
  vec3 col=mix(cb,cr,red);
  vec3 hot=mix(vec3(0.55,0.85,1.0),vec3(1.0,0.55,0.45),red);

  float fw=max(length(fwidth(p)),1e-4);
  vec2 dd=abs(p-floor(p+0.5));
  float lw=0.03;
  vec2 ln=(1.0-ss(lw-fw*0.5,lw+fw*0.5,dd))*min(1.0,lw/fw);
  float far=ss(0.22,0.7,fw);

  float mz=step(mod(floor(p.y+0.5)+800.0,8.0),0.5);
  float mx=step(mod(floor(p.x+0.5)+800.0,8.0),0.5);
  float pz=pulseTrain(p.x,floor(p.y+0.5),21.0);
  float px=pulseTrain(p.y,floor(p.x+0.5),23.0);
  float iz=(0.50+1.0*mz)+3.2*pz;
  float ix=(0.50+1.0*mx)+3.2*px;
  float linesSharp=ln.y*iz+ln.x*ix;
  float linesAvg=((0.50+0.5)*2.0+1.6*(pz+px))*0.12;
  float lines=mix(linesSharp,linesAvg,far);
  vec3 lc=mix(col,hot,clamp((pz*ln.y+px*ln.x)*0.7,0.0,1.0));
  float spill=(exp(-dd.x*9.0)*(0.05+0.45*px)+exp(-dd.y*9.0)*(0.05+0.45*pz))*(1.0-far);

  float hc=h21(cell,1.0), hk=h21(cell,2.0);
  float kk=1.0+floor(hk*3.0);
  float act=step(0.80,h21(cell,3.0));
  float fl=pow(max(0.5+0.5*sin(TAU*(kk*uP+hc*17.0)),0.0),6.0)*act;
  float flick=0.5+0.5*sin(TAU*(6.0*uP+hc*13.0));
  float stripe=0.5+0.5*sin(TAU*(p.y*3.0+3.0*uP))*(1.0-far);
  vec2 lf=fract(p)-0.5;
  float inner=mix(1.0-ss(0.36,0.5,max(abs(lf.x),abs(lf.y))),0.75,far);
  float tile=0.008*(0.6+0.8*hc)+0.16*fl+red*(0.05+0.09*flick*stripe)+0.20*fs.w+0.22*fs.y+0.45*fs.z;
  vec3 tileC=col*tile*inner;

  // emblem plinth: rotating rings on the floor under the shield
  float rs=distance(p,SH);
  float ang=atan(p.y-SH.y,p.x-SH.x+1e-4);
  float dsh=step(0.5,fract(ang/TAU*36.0+uP*3.0));
  float w1=0.05+fw;
  float ringG=ss(w1+0.12,0.0,abs(rs-10.0))*(0.55+0.45*dsh)
             +ss(w1+0.05,0.0,abs(rs-13.0))*0.9
             +ss(w1+0.25,0.0,abs(rs-7.0))*0.5*(1.0-dsh);
  vec3 rc=mix(vec3(0.15,0.60,1.0),vec3(1.0,0.12,0.15),uAlert);
  vec3 plinth=rc*(ringG*1.5+exp(-rs*0.08)*0.05);

  float Rc=(uT-8.6)*24.0;
  float frr=(1.0-ss(90.0,125.0,Rc))*step(0.0,Rc);
  float wr=0.20+fw;
  float ringW=ss(wr,0.0,abs(rs-Rc))+0.35*ss(wr,0.0,abs(rs-Rc*0.80))
             +0.10*exp(-abs(rs-Rc)*0.30)*step(rs,Rc);
  vec3 waveC=vec3(0.45,0.85,1.0)*ringW*frr*2.4;
  vec3 em=lc*lines*(1.0+fs.z*5.0+fs.y*4.0)+col*spill*0.5+tileC+plinth+waveC;

  float fog=1.0-exp(-pow(dist*0.0058,1.5));
  float fres=pow(1.0-clamp(abs(vd.y),0.0,1.0),2.0);
  float alpha=mix(0.90,0.52,fres);
  vec3 haze=hazeColor(vd);
  vec3 base=vec3(0.0025,0.007,0.020)*alpha;
  vec3 rgb=(em+base)*(1.0-fog)+haze*fog;
  o=vec4(rgb,mix(alpha,1.0,fog));
}`;

/* ---- data towers (instanced boxes); drawn twice (mirror = reflection in the glossy floor) */
const VS_TOWER = HEAD + FIELD + `
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNrm;
layout(location=2) in vec4 aInst;
uniform float uMirror;
out vec3 vW; out vec3 vN; out vec3 vL; out vec3 vC; out float vH; out float vFl;
void main(){
  vec2 c=aInst.xy; float s1=aInst.z, s2=aInst.w;
  vec4 fs=fieldState(c);
  float red=fs.x;
  float kk=1.0+floor(s2*3.0);
  float base=mix(0.45,5.6,pow(s1,2.5))*(0.6+0.9*ss(0.0,55.0,abs(c.x)));
  float breathe=0.72+0.28*sin(TAU*(kk*uP+s1*9.0));
  float wave=0.5+0.5*sin(TAU*(c.y*0.045-2.0*uP)+c.x*0.07);
  float h=base*(0.55+0.75*wave)*breathe;
  float jit=red*(0.5+0.5*sin(TAU*((8.0+floor(s2*8.0))*uP+s1*7.0)))*1.7*(0.3+s1);
  h+=jit+fs.z*(3.0+5.0*s1)+fs.y*(2.0+6.0*s2)+fs.w*1.6*s1;
  h=max(h,0.12);
  float hc=h21(c,7.0);
  vec3 cb=mix(vec3(0.04,0.26,1.0),vec3(0.05,0.60,1.0),hc*hc*0.7);
  vec3 cr=mix(vec3(1.0,0.03,0.09),vec3(1.0,0.16,0.10),h21(c,8.0)*0.6);
  vec3 col=mix(cb,cr,red);
  col=mix(col,vec3(1.0,0.92,0.88),clamp(fs.y*0.6+fs.z*0.7,0.0,1.0));
  vC=col;
  vFl=pow(max(0.5+0.5*sin(TAU*(kk*uP+s2*13.0)),0.0),8.0)*step(0.78,s2)+fs.z*0.8+fs.y*0.5;
  vH=h;
  vL=vec3(aPos.x,aPos.y*h,aPos.z);
  vec3 wp=vec3(c.x+0.5+aPos.x*0.74,aPos.y*h,c.y+0.5+aPos.z*0.74);
  wp.y*=uMirror;
  vW=wp; vN=vec3(aNrm.x,aNrm.y*uMirror,aNrm.z);
  gl_Position=uVP*vec4(wp,1.0);
}`;

const FS_TOWER = HEAD + `
in vec3 vW; in vec3 vN; in vec3 vL; in vec3 vC; in float vH; in float vFl;
out vec4 o;
void main(){
  vec3 n=normalize(vN);
  vec3 dL=fwidth(vL);
  vec3 tp=vW-uEye; float dist=length(tp); vec3 vd=tp/dist;
  vec3 col;
  if(abs(n.y)>0.5){
    float e=0.5-max(abs(vL.x),abs(vL.z));
    float rim=edgeG(e,0.07,max(dL.x,dL.z));
    float panel=1.0-ss(0.0,0.5,e)*0.5;
    col=vC*(0.09*panel+1.5*rim+2.2*vFl);
  } else {
    float u=abs(n.x)>0.5?vL.z:vL.x;
    float fwu=abs(n.x)>0.5?dL.z:dL.x;
    float ya=vL.y;
    float ve=0.5-abs(u);
    float edge=edgeG(ve,0.06,fwu);
    float topG=ss(0.45,0.0,vH-ya);
    float g=pow(clamp(ya/max(vH,0.1),0.0,1.0),1.6);
    float rows=ss(0.80,0.96,fract(ya*2.5));
    float win=step(0.40,h21(vec2(floor(u*3.0+1.5),floor(ya*2.5)+floor(vW.z*13.0)+floor(vW.x*7.0)),11.0));
    float pat=mix(rows*win,0.28,ss(0.10,0.30,dL.y));
    col=vC*(0.012+0.20*g+0.7*edge*(0.4+0.6*g)+1.1*topG+0.45*pat*(0.3+g)+1.0*vFl*g);
    col*=0.75+0.25*n.x*sign(uCR.x+1e-4);
  }
  if(vW.y<0.0) col*=0.62*exp(vW.y*0.16);
  float fog=1.0-exp(-pow(dist*0.0058,1.5));
  col=mix(col,hazeColor(vd),fog);
  o=vec4(col,1.0);
}`;

/* ---- vertical data beams */
const VS_BEAM = HEAD + `
layout(location=0) in vec2 aQ;
layout(location=1) in vec4 aB;
layout(location=2) in vec4 aC;
uniform float uMirror;
out vec2 vQ; out vec4 vC; out float vDist;
void main(){
  vec3 base=vec3(aB.x,0.0,aB.y);
  vec3 r=normalize(vec3(uCR.x,0.0,uCR.z)+vec3(1e-5,0.0,0.0));
  vec3 wp=base+r*aQ.x*aB.w+vec3(0.0,aQ.y*aB.z*uMirror,0.0);
  vQ=aQ; vC=aC; vDist=length(wp-uEye);
  gl_Position=uVP*vec4(wp,1.0);
}`;
const FS_BEAM = HEAD + `
in vec2 vQ; in vec4 vC; in float vDist; out vec4 o;
uniform float uInt;
void main(){
  float u=vQ.x, v=vQ.y;
  float across=exp(-u*u*6.0)+0.6*exp(-u*u*60.0);
  float along=pow(1.0-v,1.5)*ss(0.0,0.02,v);
  float k=vC.z;
  float pl=pow(fract(v*2.0-k*3.0*uP+vC.y),7.0);
  float kind=vC.x;
  vec3 col=kind<0.5?vec3(1.0,0.10,0.14):vec3(0.14,0.55,1.0);
  float amp=kind<0.5?(0.16+0.95*uAtk):(0.25+0.75*uDef);
  float flick=kind<0.5?mix(1.0,0.72+0.28*sin(TAU*(9.0*uP+vC.y*13.0)),uAtk):1.0;
  float I=across*along*(0.30+1.6*pl)*amp*flick;
  I*=exp(-vDist*0.0045);
  vec3 c=mix(col,vec3(1.0,0.85,0.85),0.25*pl);
  o=vec4(c*I*1.1*uInt,1.0);
}`;

/* ---- attack / defence arcs (ribbons with travelling packets) */
const VS_ARC = HEAD + `
layout(location=0) in vec4 aS;
layout(location=1) in vec4 aE;
layout(location=2) in vec4 aP;
out float vS; out float vSide; out vec4 vP; out float vKind;
const int N=96;
vec3 arcP(vec3 S,vec3 E,float pk,float s){
  vec3 p=mix(S,E,s);
  p.y+=pk*4.0*s*(1.0-s);
  return p;
}
void main(){
  int seg=gl_VertexID>>1;
  float side=((gl_VertexID&1)==0)?-1.0:1.0;
  float s=float(seg)/float(N);
  float ds=1.0/float(N);
  vec3 P1=arcP(aS.xyz,aE.xyz,aE.w,s);
  vec3 P0=arcP(aS.xyz,aE.xyz,aE.w,max(s-ds,0.0));
  vec3 P2=arcP(aS.xyz,aE.xyz,aE.w,min(s+ds,1.0));
  vec4 c1=uVP*vec4(P1,1.0), c0=uVP*vec4(P0,1.0), c2=uVP*vec4(P2,1.0);
  vec2 a=c0.xy/c0.w, b=c2.xy/c2.w;
  vec2 d=(b-a)*vec2(uAspect,1.0);
  d=normalize(d+vec2(1e-7));
  vec2 nrm=vec2(-d.y,d.x)/vec2(uAspect,1.0);
  float wn=aP.z*2.0/uRes.y;
  c1.xy+=nrm*side*wn*c1.w;
  gl_Position=c1;
  vS=s; vSide=side; vP=aP; vKind=aS.w;
}`;
const FS_ARC = HEAD + `
in float vS; in float vSide; in vec4 vP; in float vKind; out vec4 o;
void main(){
  float k=vP.x, off=vP.y;
  float hp1=fract(k*uP+off);
  float hp2=fract(k*uP+off+0.5);
  float b1=fract(hp1-vS), b2=fract(hp2-vS);
  float p1=exp(-b1*16.0)*ss(0.0,0.012,b1);
  float p2=exp(-b2*16.0)*ss(0.0,0.012,b2)*0.8;
  float pulse=p1+p2;
  float across=exp(-vSide*vSide*4.5)+0.5*exp(-vSide*vSide*30.0);
  float endF=ss(0.0,0.05,vS)*ss(1.0,0.93,vS);
  bool red=vKind<0.5;
  float env=red?(0.22+0.95*uAtk):(0.20+0.95*uDef);
  vec3 col=red?vec3(1.0,0.10,0.14):vec3(0.16,0.62,1.0);
  vec3 hotc=red?vec3(1.0,0.75,0.70):vec3(0.75,0.95,1.0);
  float I=(0.14+1.5*pulse)*across*endF*env;
  vec3 c=mix(col,hotc,clamp(pulse*0.9,0.0,1.0));
  o=vec4(c*I,1.0);
}`;

/* ---- shield emblem hologram */
const VS_EMB = HEAD + `

void main(){

const FS_EMB = HEAD + `
uniform sampler2D uEmb; uniform float uInt;
in vec2 vQ; out vec4 o;

/* ------------------------------------------------------------------ GL helpers */
function compile(type, src, name){
  const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
    const log=gl.getShaderInfoLog(s);
    console.error('Shader error ['+name+']:\n'+log);
    const lines=src.split('\n'); const m=/ERROR: \d+:(\d+)/.exec(log||'');
    if(m){const ln=+m[1]; console.error(lines.slice(Math.max(0,ln-3),ln+2).join('\n'));}
    throw new Error('shader '+name);
  }
  return s;
}
function program(vs,fs,name){
  const p=gl.createProgram();
  gl.attachShader(p,compile(gl.VERTEX_SHADER,vs,name+'.vs'));
  gl.attachShader(p,compile(gl.FRAGMENT_SHADER,fs,name+'.fs'));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)){console.error('Link error ['+name+']: '+gl.getProgramInfoLog(p));throw new Error('link '+name);}
  const u={}; const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){const info=gl.getActiveUniform(p,i);u[info.name.replace(/\[0\]$/,'')]=gl.getUniformLocation(p,info.name);}
  return {p,u};
}
function buf(data,target){const b=gl.createBuffer();gl.bindBuffer(target||gl.ARRAY_BUFFER,b);gl.bufferData(target||gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);return b;}
function tex2D(w,h,fmt){
  const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texStorage2D(gl.TEXTURE_2D,1,fmt,w,h);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  return t;
}
function fboWith(tex){
  const f=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);

}
function vao(fn){const v=gl.createVertexArray();gl.bindVertexArray(v);fn();gl.bindVertexArray(null);return v;}
function attr(loc,size,stride,offset,div){gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,size,gl.FLOAT,false,stride,offset);if(div)gl.vertexAttribDivisor(loc,div);}

function makeAtlas(){

  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,gl.RGBA,gl.UNSIGNED_BYTE,c);

const ORG=[[-38,28],[44,42],[-8,96],[64,90],[-70,80]], OT0=[2.2,2.9,3.5,4.1,4.7], ORM=[30,30,34,32,34];
const SH=[0,60], EMB=[0,17,62];
function field(cx,cz,t){
  const hj=h21(cx,cz,5), lo=h21(Math.floor(cx*0.25),Math.floor(cz*0.25),6);
  const qx=cx+0.5,qz=cz+0.5; let inf=0,eI=0;
  for(let k=0;k<5;k++){
    const g=clamp((t-OT0[k])/4.4,0,1);
    if(g>0){
      const R=ORM[k]*(1-(1-g)*(1-g));
      const d=Math.hypot(qx-ORG[k][0],qz-ORG[k][1])+(hj-0.5)*4+(lo-0.5)*9;
      inf=Math.max(inf,ss(-1.2,1.2,R-d)); eI=Math.max(eI,Math.exp(-Math.abs(R-d)*0.7)*(1-g));
    }
  }
  const Rc=(t-8.6)*24, dc=Math.hypot(qx-SH[0],qz-SH[1])+(hj-0.5)*3+(lo-0.5)*4;
  const cure=ss(-1.5,1.5,Rc-dc), fr=1-ss(90,125,Rc);
  const eC=Math.exp(-Math.abs(Rc-dc)*0.55)*fr*(Rc>0?1:0);
  const aft=Math.exp(-Math.max(Rc-dc,0)*0.2)*inf*(Rc-dc>=0?1:0)*fr;
  return [inf*(1-cure),eI*(1-cure),eC,aft];
}

/* ---------- shield emblem layers (pre-rendered once, blue + red) */
function makeEmblem(){
  const S=1024,r=mulberry32(7);
  const mk=()=>{const c=document.createElement('canvas');c.width=c.height=S;return c;};
  const tint=(src,col)=>{const c=mk(),g=c.getContext('2d');g.drawImage(src,0,0);g.globalCompositeOperation='source-in';g.fillStyle=col;g.fillRect(0,0,S,S);return c;};
  const shieldPath=(g,cx,cy,w,h)=>{g.beginPath();g.moveTo(cx,cy-h);g.bezierCurveTo(cx+w*0.35,cy-h*0.93,cx+w*0.72,cy-h*0.88,cx+w,cy-h*0.80);g.lineTo(cx+w,cy-h*0.10);g.bezierCurveTo(cx+w,cy+h*0.50,cx+w*0.50,cy+h*0.84,cx,cy+h);g.bezierCurveTo(cx-w*0.50,cy+h*0.84,cx-w,cy+h*0.50,cx-w,cy-h*0.10);g.lineTo(cx-w,cy-h*0.80);g.bezierCurveTo(cx-w*0.72,cy-h*0.88,cx-w*0.35,cy-h*0.93,cx,cy-h);g.closePath();};
  const hexPath=(g,x,y,R)=>{g.beginPath();for(let i=0;i<6;i++){const a=Math.PI/3*i,px=x+R*Math.cos(a),py=y+R*Math.sin(a);i?g.lineTo(px,py):g.moveTo(px,py);}g.closePath();};
  const CX=512,CY=520,SW=292,SHH=352;
  const sh=mk(),g=sh.getContext('2d');g.lineJoin='round';
  g.shadowColor='#fff';g.shadowBlur=34;g.lineWidth=15;g.strokeStyle='#fff';shieldPath(g,CX,CY,SW,SHH);g.stroke();g.shadowBlur=0;
  shieldPath(g,CX,CY,SW,SHH);g.fillStyle='rgba(255,255,255,0.09)';g.fill();
  g.lineWidth=5;g.strokeStyle='rgba(255,255,255,0.75)';shieldPath(g,CX,CY,SW*0.86,SHH*0.86);g.stroke();
  g.save();shieldPath(g,CX,CY,SW*0.84,SHH*0.84);g.clip();
  const R=30,dx=R*1.5,dy=R*Math.sqrt(3);
  for(let c=-12;c<=12;c++)for(let q=-12;q<=12;q++){const x=CX+c*dx,y=CY+q*dy+(c&1?dy/2:0);hexPath(g,x,y,R-2.5);g.lineWidth=2.2;g.strokeStyle='rgba(255,255,255,0.30)';g.stroke();if(r()<0.13){g.fillStyle='rgba(255,255,255,'+(0.10+r()*0.18).toFixed(2)+')';g.fill();}}
  g.restore();
  const lock=(open)=>{
    const c=mk(),q=c.getContext('2d'),bx=CX,by=CY+18;
    q.shadowColor='#fff';q.shadowBlur=28;q.fillStyle='#fff';q.strokeStyle='#fff';q.lineCap='butt';q.lineJoin='round';
    q.save();q.lineWidth=36;const legX=74,top=by-84;
    if(open){q.translate(bx-legX,by-70);q.rotate(-0.62);q.translate(-(bx-legX),-(by-70));q.translate(0,-22);}
    q.beginPath();q.moveTo(bx-legX,by-56);q.lineTo(bx-legX,top-16);q.arc(bx,top-16,legX,Math.PI,0);q.lineTo(bx+legX,by-56);q.stroke();q.restore();
    const w=250,h=196,x=bx-w/2,y=by-70,rad=30;
    q.beginPath();q.moveTo(x+rad,y);q.arcTo(x+w,y,x+w,y+h,rad);q.arcTo(x+w,y+h,x,y+h,rad);q.arcTo(x,y+h,x,y,rad);q.arcTo(x,y,x+w,y,rad);q.closePath();q.fill();
    q.shadowBlur=0;q.globalCompositeOperation='destination-out';
    q.beginPath();q.arc(bx,y+h*0.40,27,0,TAU);q.fill();
    q.beginPath();q.moveTo(bx-15,y+h*0.40+10);q.lineTo(bx+15,y+h*0.40+10);q.lineTo(bx+22,y+h*0.78);q.lineTo(bx-22,y+h*0.78);q.closePath();q.fill();
    return c;
  };
  const lc=lock(false),lo=lock(true);
  return {shieldB:tint(sh,'#1a8cff'),shieldR:tint(sh,'#ff1a26'),closedB:tint(lc,'#1a8cff'),closedR:tint(lc,'#ff1a26'),openB:tint(lo,'#1a8cff'),openR:tint(lo,'#ff1a26')};
}

/* ---------- camera */
const FOV=40*Math.PI/180,TANH=Math.tan(FOV/2),FOCAL=(H/2)/TANH;
let CAM=null;
function proj(x,y,z){
  const dx=x-CAM.e[0],dy=y-CAM.e[1],dz=z-CAM.e[2];
  const zc=dx*CAM.f[0]+dy*CAM.f[1]+dz*CAM.f[2]; if(zc<0.5) return null;
  return [W/2+(dx*CAM.r[0]+dy*CAM.r[1]+dz*CAM.r[2])/zc*FOCAL, H/2-(dx*CAM.u[0]+dy*CAM.u[1]+dz*CAM.u[2])/zc*FOCAL, zc];
}
function timeline(t){
  const p=t/LOOP,th=p*TAU;
  const burst=(c,w,a)=>a*Math.exp(-Math.pow((t-c)/w,2));
  const alert=ss(3.0,5.6,t)*(1-ss(8.5,10.5,t));
  const glitch=Math.min(1,burst(3.3,0.12,0.40)+burst(6.5,0.12,0.40)+burst(8.6,0.14,0.55));
  const atk=0.25+0.75*ss(2.2,4.5,t)*(1-ss(8.6,10.5,t));
  const def=0.25+0.75*ss(8.4,9.6,t)*(1-ss(13.0,14.6,t));
  const sh=glitch*0.07;
  const e=[7*Math.sin(th)+sh*Math.sin(t*31.4),11.2+1.0*Math.sin(2*th+0.7)+sh*Math.sin(t*26.7+1.3),-30+4*Math.cos(th)];
  const tg=[3*Math.sin(th+1.1),3.8+0.7*Math.sin(2*th+2.0),62];
  const roll=0.012*Math.sin(2*th+0.4),up=[Math.sin(roll),Math.cos(roll),0];
  let f=[tg[0]-e[0],tg[1]-e[1],tg[2]-e[2]];let l=Math.hypot(f[0],f[1],f[2]);f=f.map(v=>v/l);
  let r=[f[1]*up[2]-f[2]*up[1],f[2]*up[0]-f[0]*up[2],f[0]*up[1]-f[1]*up[0]];l=Math.hypot(r[0],r[1],r[2]);r=r.map(v=>v/l);
  const u=[r[1]*f[2]-r[2]*f[1],r[2]*f[0]-r[0]*f[2],r[0]*f[1]-r[1]*f[0]];
  return {t,p,alert,glitch,atk,def,cam:{e,f,r,u}};
}

const b1=mkC(960,540),b2=mkC(240,135),b3=mkC(960,540),b4=mkC(240,135);

{const g=vgc.createRadialGradient(480,270,150,480,270,600);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.62)');vgc.fillStyle=g;vgc.fillRect(0,0,960,540);}

const BAND_Z=[-6,2,8,16,26,38,54,74,100,130,152];
const XMIN=-112,XMAX=112,ZMIN=-6,ZMAX=152,NX=XMAX-XMIN,NZ=ZMAX-ZMIN;
const redG=new Float32Array(NX*NZ);
const ptX=new Float32Array((NX+1)*(NZ+1)),ptY=new Float32Array((NX+1)*(NZ+1));
const bandOf=z=>{for(let b=0;b<BAND_Z.length-1;b++)if(z<BAND_Z[b+1])return b;return BAND_Z.length-2;};

function worldCircle(cx,cz,r,n){
  const pts=[];for(let i=0;i<=n;i++){const a=i/n*TAU;pts.push(proj(cx+Math.cos(a)*r,0,cz+Math.sin(a)*r));}return pts;
}
function strokePts(pts,col,lw){
  ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.beginPath();let pen=false;
  for(const q of pts){if(!q){pen=false;continue;}if(!pen){ctx.moveTo(q[0],q[1]);pen=true;}else ctx.lineTo(q[0],q[1]);}
  ctx.stroke();
}

/* ---------- frame */
function render(tIn){
  const t=((tIn%LOOP)+LOOP)%LOOP;
  const S=timeline(t);CAM=S.cam;const p=S.p,alert=S.alert;
  const ex=CAM.e[0],ey=CAM.e[1],ez=CAM.e[2];
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.lineCap='round';ctx.lineJoin='round';

  // ---- sky / horizon
  const fh=Math.hypot(CAM.f[0],CAM.f[2])||1;
  const hp=proj(ex+CAM.f[0]/fh*5000,ey,ez+CAM.f[2]/fh*5000);
  const hy=hp?hp[1]:H*0.42,hf=clamp(hy/H,0.05,0.95);
  let g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#01030a');g.addColorStop(hf*0.55,'#020618');g.addColorStop(hf,'#061238');g.addColorStop(Math.min(1,hf+0.015),'#020818');g.addColorStop(1,'#01040b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  const glow=(cx,col,a)=>{ctx.save();ctx.translate(cx,hy);ctx.scale(1,0.42);const rg=ctx.createRadialGradient(0,0,0,0,0,W*0.55);rg.addColorStop(0,rgba(col[0],col[1],col[2],a));rg.addColorStop(1,rgba(col[0],col[1],col[2],0));ctx.fillStyle=rg;ctx.fillRect(-W*0.6,-W*0.6,W*1.2,W*1.2);ctx.restore();};
  glow(W*0.06,[255,20,55],0.28+0.22*alert);glow(W*0.94,[30,90,255],0.24-0.08*alert);glow(W*0.5,[70,60,230],0.09+0.05*alert);

  // ---- floor grid
  for(let z=ZMIN;z<ZMAX;z++)for(let x=XMIN;x<XMAX;x++)redG[(z-ZMIN)*NX+(x-XMIN)]=field(x,z,t)[0];
  for(let z=0;z<=NZ;z++)for(let x=0;x<=NX;x++){const q=proj(x+XMIN,0,z+ZMIN);const i=z*(NX+1)+x;if(q){ptX[i]=q[0];ptY[i]=q[1];}else{ptX[i]=NaN;ptY[i]=NaN;}}
  const NB=BAND_Z.length-1,G=[];
  for(let b=0;b<NB;b++)G.push({bm:new Path2D(),bM:new Path2D(),rm:new Path2D(),rM:new Path2D(),fill:new Path2D()});
  const redAt=(x,z)=>(x<XMIN||x>=XMAX||z<ZMIN||z>=ZMAX)?0:redG[(z-ZMIN)*NX+(x-XMIN)];
  for(let z=ZMIN;z<=ZMAX;z++){
    const hw=(z-ez)*0.68+Math.abs(ex)+8;
    const x0=Math.max(XMIN,Math.floor(ex-hw)),x1=Math.min(XMAX-1,Math.ceil(ex+hw));
    const b=bandOf(Math.min(z,ZMAX-1));
    for(let x=x0;x<=x1;x++){
      const ia=(z-ZMIN)*(NX+1)+(x-XMIN);
      if(isNaN(ptX[ia]))continue;
      const red=Math.max(redAt(x,z),redAt(x,z-1))>0.5;
      if(x<XMAX&&z<=ZMAX){ // x-parallel segment (x -> x+1 at z)
        const ib=ia+1;
        if(x<XMAX-0&&!isNaN(ptX[ib])){const P=(z%8===0)?(red?G[b].rM:G[b].bM):(red?G[b].rm:G[b].bm);P.moveTo(ptX[ia],ptY[ia]);P.lineTo(ptX[ib],ptY[ib]);}
      }
      if(z<ZMAX){ // z-parallel segment (z -> z+1 at x)
        const ic=ia+(NX+1),redz=Math.max(redAt(x,z),redAt(x-1,z))>0.5;
        if(!isNaN(ptX[ic])){const P=(x%8===0)?(redz?G[b].rM:G[b].bM):(redz?G[b].rm:G[b].bm);P.moveTo(ptX[ia],ptY[ia]);P.lineTo(ptX[ic],ptY[ic]);}
      }
      if(z<ZMAX&&x<XMAX-1&&redAt(x,z)>0.35){const ic=ia+(NX+1);if(!isNaN(ptX[ic])&&!isNaN(ptX[ia+1])&&!isNaN(ptX[ic+1])){const F=G[b].fill;F.moveTo(ptX[ia],ptY[ia]);F.lineTo(ptX[ia+1],ptY[ia+1]);F.lineTo(ptX[ic+1],ptY[ic+1]);F.lineTo(ptX[ic],ptY[ic]);F.closePath();}}
    }
  }
  for(let b=0;b<NB;b++){
    const zm=(BAND_Z[b]+BAND_Z[b+1])/2,d=Math.max(8,zm-ez);
    const fogA=Math.exp(-Math.pow(d*0.0058,1.5)*1.25);
    const lw=clamp(0.06*FOCAL/d,1.1,6.5);
    ctx.fillStyle=rgba(255,30,50,0.14*fogA);ctx.fill(G[b].fill);
    const draw=(path,c,major)=>{
      ctx.strokeStyle=rgba(c[0],c[1],c[2],0.12*fogA*(major?1.6:1));ctx.lineWidth=lw*(major?4.2:3.2);ctx.stroke(path);
      ctx.strokeStyle=rgba(c[0],c[1],c[2],(major?0.95:0.62)*fogA);ctx.lineWidth=lw*(major?1.7:1);ctx.stroke(path);
    };
    draw(G[b].bm,[40,125,255],false);draw(G[b].bM,[95,185,255],true);
    draw(G[b].rm,[255,45,65],false);draw(G[b].rM,[255,115,115],true);
  }

  // ---- data packets travelling along the grid lines
  const L=64;
  for(let axis=0;axis<2;axis++){
    const salt=axis?23:21,k0=axis?XMIN:ZMIN,k1=axis?XMAX:ZMAX;
    for(let idx=k0;idx<k1;idx++){
      const h=h21(idx,0,salt);if(h<0.5)continue;
      const dir=h21(idx,1,salt)<0.5?-1:1,kk=1+Math.floor(h21(idx,2,salt)*3),off=h21(idx,3,salt);
      for(let tr=0;tr<2;tr++){
        const c=1+kk*p-off-tr*0.5;
        for(let n=-3;n<=3;n++){
          const along=dir*L*(n+c);
          const lo=axis?ZMIN:-118,hi=axis?ZMAX-6:118;
          if(along<lo||along>hi)continue;
          const wx=axis?idx:along,wz=axis?along:idx;
          const dist=wz-ez;if(dist>112||dist<10)continue;if(tr&&dist>80)continue;
          const red=redAt(Math.floor(wx),Math.floor(wz))>0.5;
          const cc=red?[255,120,110]:[150,215,255];
          const wpx=clamp(0.10*FOCAL/dist,1.6,10);
          const fa=Math.exp(-Math.pow(dist*0.0058,1.5))*(tr?0.6:1);
          let prev=proj(wx,0,wz);if(!prev)continue;
          const taus=[0,1.2,3,6];const al=[0.95,0.55,0.22];
          for(let s=0;s<3;s++){
            const tx=axis?idx:along-dir*taus[s+1],tz=axis?along-dir*taus[s+1]:idx;
            const q=proj(tx,0,tz);if(!q)break;
            ctx.strokeStyle=rgba(cc[0],cc[1],cc[2],al[s]*fa);ctx.lineWidth=wpx*(1.5-s*0.3);
            ctx.beginPath();ctx.moveTo(prev[0],prev[1]);ctx.lineTo(q[0],q[1]);ctx.stroke();prev=q;
          }
        }
      }
    }
  }

  // ---- shield plinth + defence shockwave rings on the floor
  const rc=[mix(38,255,alert),mix(150,30,alert),mix(255,40,alert)];
  strokePts(worldCircle(SH[0],SH[1],10,120),rgba(rc[0],rc[1],rc[2],0.85),4);
  strokePts(worldCircle(SH[0],SH[1],13,120),rgba(rc[0],rc[1],rc[2],0.55),3);
  strokePts(worldCircle(SH[0],SH[1],7,90),rgba(rc[0],rc[1],rc[2],0.35),3);
  const Rc=(t-8.6)*24,frr=(1-ss(90,125,Rc))*(Rc>0?1:0);
  if(frr>0.01){
    const ring=worldCircle(SH[0],SH[1],Rc,180);
    strokePts(ring,rgba(115,217,255,0.16*frr),26);strokePts(ring,rgba(150,230,255,0.85*frr),5);
    strokePts(worldCircle(SH[0],SH[1],Rc*0.8,160),rgba(115,217,255,0.4*frr),3);
  }

  // ---- data towers (painter's order, far to near), opaque with distance haze
  ctx.globalCompositeOperation='source-over';
  const haze=[4,12,44];
  for(const T of towers){
    const fs=field(T.x,T.z,t),red=fs[0];
    const kk=1+Math.floor(T.s2*3);
    const base=mix(0.45,5.6,Math.pow(T.s1,2.5))*(0.6+0.9*ss(0,55,Math.abs(T.x)));
    const breathe=0.72+0.28*Math.sin(TAU*(kk*p+T.s1*9));
    const wave=0.5+0.5*Math.sin(TAU*(T.z*0.045-2*p)+T.x*0.07);
    let h=base*(0.55+0.75*wave)*breathe;
    h+=red*(0.5+0.5*Math.sin(TAU*((8+Math.floor(T.s2*8))*p+T.s1*7)))*1.7*(0.3+T.s1)+fs[2]*(3+5*T.s1)+fs[1]*(2+6*T.s2)+fs[3]*1.6*T.s1;
    h=Math.max(h,0.12);
    const x0=T.x+0.13,x1=T.x+0.87,z0=T.z+0.13,z1=T.z+0.87;
    const dist=z0-ez;
    const fog=1-Math.exp(-Math.pow(dist*0.0058,1.5));
    const hc=h21(T.x,T.z,7);
    let cr=mix(mix(10,13,hc*hc*0.7),mix(255,255,0),red),cg=mix(mix(66,153,hc*hc*0.7),mix(8,41,h21(T.x,T.z,8)*0.6),red),cb=mix(255,mix(25,25,0),red);
    const hot=clamp(fs[1]*0.6+fs[2]*0.7,0,1);
    cr=mix(cr,255,hot);cg=mix(cg,235,hot);cb=mix(cb,225,hot);
    const fl=Math.pow(Math.max(0.5+0.5*Math.sin(TAU*(kk*p+T.s2*13)),0),8)*(T.s2>0.78?1:0);
    const a=proj(x0,0,z0),b=proj(x1,0,z0),c=proj(x1,h,z0),d=proj(x0,h,z0);
    if(!a||!b||!c||!d)continue;
    if(Math.max(a[0],b[0])<-20||Math.min(a[0],b[0])>W+20)continue;
    if(b[0]-a[0]<0.8&&a[1]-d[1]<1.5)continue;
    const F=(k)=>rgb(mix(cr*k,haze[0],fog),mix(cg*k,haze[1],fog),mix(cb*k,haze[2],fog));
    // side face
    if(ex<x0||ex>x1){
      const xs=ex<x0?x0:x1;
      const s0=proj(xs,0,z0),s1=proj(xs,0,z1),s2=proj(xs,h,z1),s3=proj(xs,h,z0);
      if(s0&&s1&&s2&&s3){ctx.fillStyle=F(0.13);ctx.beginPath();ctx.moveTo(s0[0],s0[1]);ctx.lineTo(s1[0],s1[1]);ctx.lineTo(s2[0],s2[1]);ctx.lineTo(s3[0],s3[1]);ctx.closePath();ctx.fill();}
    }
    // front face + brighter upper band
    ctx.fillStyle=F(0.20);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.lineTo(d[0],d[1]);ctx.closePath();ctx.fill();
    const mh=proj(x0,h*0.68,z0),mh2=proj(x1,h*0.68,z0);
    if(mh&&mh2&&h>1.2){ctx.fillStyle=F(0.34);ctx.beginPath();ctx.moveTo(mh[0],mh[1]);ctx.lineTo(mh2[0],mh2[1]);ctx.lineTo(c[0],c[1]);ctx.lineTo(d[0],d[1]);ctx.closePath();ctx.fill();}
    // top face
    if(h<ey){
      const e1=proj(x0,h,z1),f1=proj(x1,h,z1);
      if(e1&&f1){ctx.fillStyle=F(0.62+0.9*fl);ctx.beginPath();ctx.moveTo(d[0],d[1]);ctx.lineTo(c[0],c[1]);ctx.lineTo(f1[0],f1[1]);ctx.lineTo(e1[0],e1[1]);ctx.closePath();ctx.fill();
        ctx.strokeStyle=F(1.25);ctx.lineWidth=clamp(0.05*FOCAL/Math.max(dist,8),1,4);ctx.stroke();}
    }
    ctx.strokeStyle=F(0.85);ctx.lineWidth=clamp(0.04*FOCAL/Math.max(dist,8),0.8,3);
    ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(d[0],d[1]);ctx.moveTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.stroke();
  }

  // ---- beams of light
  ctx.globalCompositeOperation='lighter';
  for(const B of beams){
    const bp=proj(B.x,0,B.z),tp=proj(B.x,B.h,B.z);if(!bp||!tp)continue;
    const amp=B.kind===0?(0.16+0.95*S.atk)*(0.72+0.28*Math.sin(TAU*(9*p+B.seed*13))*S.atk+0.28*(1-S.atk)):(0.25+0.75*S.def);
    const fa=Math.exp(-bp[2]*0.0045),hw=Math.max(1.2,B.w*FOCAL/bp[2]);
    const col=B.kind===0?[255,26,36]:[36,140,255];
    const gr=ctx.createLinearGradient(0,bp[1],0,tp[1]);
    gr.addColorStop(0,rgba(col[0],col[1],col[2],clamp(0.55*amp*fa,0,1)));gr.addColorStop(0.5,rgba(col[0],col[1],col[2],clamp(0.2*amp*fa,0,1)));gr.addColorStop(1,rgba(col[0],col[1],col[2],0));
    ctx.fillStyle=gr;
    for(let L2=0;L2<5;L2++){ctx.globalAlpha=0.30;const w2=hw*(1-L2*0.2);ctx.fillRect(bp[0]-w2,tp[1],w2*2,bp[1]-tp[1]);}
    ctx.globalAlpha=1;
  }

  // ---- attack (red) and defence (blue) arcs with travelling packets
  const NA=48;
  for(const A of arcs){
    const pts=[];
    for(let i=0;i<=NA;i++){const s=i/NA;pts.push(proj(mix(A.S[0],A.E[0],s),mix(A.S[1],A.E[1],s)+A.pk*4*s*(1-s),mix(A.S[2],A.E[2],s)));}
    const env=A.kind===0?0.22+0.95*S.atk:0.20+0.95*S.def;
    const col=A.kind===0?[255,26,36]:[41,158,255],hot=A.kind===0?[255,190,180]:[190,240,255];
    strokePts(pts,rgba(col[0],col[1],col[2],0.06*env),A.w*2.2);
    strokePts(pts,rgba(col[0],col[1],col[2],0.22*env),Math.max(1.6,A.w*0.32));
    for(let pu=0;pu<2;pu++){
      const head=fract(A.k*p+A.off+pu*0.5),ih=Math.floor(head*NA);
      for(let j=0;j<9;j++){
        const i=ih-j;if(i<1||i>=NA)continue;
        const q0=pts[i],q1=pts[i+1];if(!q0||!q1)continue;
        const bb=(head-i/NA),al=Math.exp(-bb*16)*(pu?0.8:1)*env*Math.min(1,i/(NA*0.05))*Math.min(1,(NA-i)/(NA*0.07));
        ctx.strokeStyle=rgba(col[0],col[1],col[2],0.30*al);ctx.lineWidth=A.w*1.3;ctx.beginPath();ctx.moveTo(q0[0],q0[1]);ctx.lineTo(q1[0],q1[1]);ctx.stroke();
        ctx.strokeStyle=rgba(hot[0],hot[1],hot[2],0.95*al);ctx.lineWidth=Math.max(1.6,A.w*0.4);ctx.beginPath();ctx.moveTo(q0[0],q0[1]);ctx.lineTo(q1[0],q1[1]);ctx.stroke();
      }
    }
  }

  // ---- shield emblem hologram
  {
    const ec=proj(EMB[0],EMB[1],EMB[2]);
    if(ec){
      const pulse=1+0.035*Math.exp(-Math.pow((t-8.7)/0.35,2))+0.012*Math.sin(TAU*p*3);
      const sz=15*pulse*FOCAL/ec[2],x=ec[0],y=ec[1];
      const open=ss(0.35,0.65,alert);
      const rg=ctx.createRadialGradient(x,y,0,x,y,sz);rg.addColorStop(0,rgba(rc[0],rc[1],rc[2],0.10));rg.addColorStop(1,rgba(rc[0],rc[1],rc[2],0));
      ctx.fillStyle=rg;ctx.fillRect(x-sz,y-sz,sz*2,sz*2);
      const dr=(img,a)=>{if(a<0.01)return;ctx.globalAlpha=a;ctx.drawImage(img,x-sz,y-sz,sz*2,sz*2);};
      const sw=0.78+0.18*Math.sin(TAU*(p*3));
      dr(EM.shieldB,(1-alert)*sw);dr(EM.shieldR,alert*sw);
      dr(EM.closedB,(1-open)*(1-alert)*0.95);dr(EM.closedR,(1-open)*alert*0.95);
      dr(EM.openR,open*alert*0.95);dr(EM.openB,open*(1-alert)*0.95);
      ctx.globalAlpha=1;
      // rotating HUD rings
      const ring=(rad,dash,offUnits,lw,al)=>{
        const R=sz*rad,C=TAU*R;ctx.setLineDash(dash.map(v=>v*C));ctx.lineDashOffset=-offUnits*C;
        ctx.strokeStyle=rgba(rc[0],rc[1],rc[2],al);ctx.lineWidth=lw;ctx.beginPath();ctx.arc(x,y,R,0,TAU);ctx.stroke();ctx.setLineDash([]);
      };
      ring(0.975,[1,0],0,sz*0.006,0.9);
      ring(0.935,[0.6/96,0.4/96],6*p/96,sz*0.004,0.7);
      ring(0.955,[0.28/72,0.72/72],-2*p/72,sz*0.03,0.55);
      ring(0.90,[0.55/3,0.45/3],-p/3,sz*0.014,0.85);
      ring(0.885,[0.4/5,0.6/5],2*p/5,sz*0.009,0.7);
    }
  }

  // ---- floating hex tags
  ctx.textBaseline='middle';
  for(const T of tags){
    const q=proj(T.x,T.y,T.z);if(!q)continue;
    const wpx=T.sc*5.6*FOCAL/q[2],hpx=T.sc*0.9*FOCAL/q[2];if(hpx<8)continue;
    const fs=field(Math.floor(T.x),Math.floor(T.z),t)[0];
    const col=[mix(76,255,fs),mix(184,56,fs),mix(255,66,fs)];
    const al=(0.55+0.45*Math.sin(TAU*(2*p+T.seed*9)))*Math.exp(-q[2]*0.006)*ss(6,16,hpx);
    let txt='';for(let ci=0;ci<6;ci++){const chg=h21(ci,T.seed*50,61)>=0.7?1:0;txt+='0123456789ABCDEF'[Math.floor(h21(ci,T.seed*100+chg*Math.floor(p*22),60)*16)];}
    ctx.font='bold '+Math.max(6,Math.round(wpx*0.86/3.6))+'px "Consolas","DejaVu Sans Mono","Courier New",monospace';
    ctx.fillStyle=rgba(col[0],col[1],col[2],al*0.95);
    ctx.fillText(txt,q[0]-wpx/2+wpx*0.14,q[1]);
    ctx.fillRect(q[0]-wpx/2+wpx*0.02,q[1]-hpx*0.14,hpx*0.28,hpx*0.28);
    ctx.fillRect(q[0]-wpx/2+wpx*0.14,q[1]+hpx*0.42,wpx*0.86,Math.max(1,hpx*0.05));
  }

  // ---- large soft bokeh discs
  for(const K of bokeh){
    const ph=fract(K.y/30+K.k*p),yy=ph*30,ks=1+Math.floor(K.c*2);
    const q=proj(K.x+2.2*Math.sin(TAU*(ks*p+K.a)),yy,K.z+2.2*Math.cos(TAU*(ks*p+K.b)));if(!q)continue;
    const r=K.size*FOCAL/q[2],al=Math.sin(ph*Math.PI)*(0.55+0.45*Math.sin(TAU*(3*p+K.c*9)));
    const fs=field(Math.floor(K.x),Math.floor(K.z),t)[0];
    const col=[mix(70,255,fs),mix(165,56,fs),mix(255,66,fs)];
    ctx.fillStyle=rgba(col[0],col[1],col[2],0.05*al);ctx.beginPath();ctx.arc(q[0],q[1],r,0,TAU);ctx.fill();
    ctx.strokeStyle=rgba(col[0],col[1],col[2],0.10*al);ctx.lineWidth=Math.max(1.5,r*0.04);ctx.stroke();
  }

  // ---- bloom (blurred, contrast-boosted copies of the frame added back)
  if(HAS_FILTER){
    b1c.globalCompositeOperation='copy';b1c.imageSmoothingQuality='high';b1c.drawImage(canvas,0,0,W,H,0,0,960,540);
    b2c.globalCompositeOperation='copy';b2c.imageSmoothingQuality='high';b2c.drawImage(b1,0,0,960,540,0,0,240,135);
    b3c.globalCompositeOperation='copy';b3c.filter='brightness(1.2) contrast(1.5) blur(4px)';b3c.drawImage(b1,0,0);b3c.filter='none';
    b4c.globalCompositeOperation='copy';b4c.filter='brightness(1.2) contrast(1.4) blur(5px)';b4c.drawImage(b2,0,0);b4c.filter='none';
    ctx.globalCompositeOperation='lighter';ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
    ctx.globalAlpha=0.30;ctx.drawImage(b3,0,0,W,H);ctx.globalAlpha=0.28;ctx.drawImage(b4,0,0,W,H);ctx.globalAlpha=1;
  }

  // ---- glitch bursts (brief horizontal slice shifts)
  ctx.globalCompositeOperation='source-over';
  if(S.glitch>0.03){
    const q=Math.floor(t*10);
    for(let i=0;i<9;i++){
      if(h21(i,q,41)>0.5*S.glitch+0.25)continue;
      const y=Math.floor(h21(i,q,42)*H*0.95),hh=Math.floor(30+h21(i,q,43)*160),dx=Math.round((h21(i,q,44)-0.5)*190*S.glitch);
      ctx.drawImage(canvas,0,y,W,hh,dx,y,W,hh);
    }
  }

  // ---- red-alert tint, vignette, HUD corners
  if(alert>0.01){ctx.globalCompositeOperation='lighter';ctx.fillStyle=rgba(255,20,40,0.05*alert);ctx.fillRect(0,0,W,H);}
  ctx.globalCompositeOperation='source-over';ctx.drawImage(vig,0,0,W,H);
  ctx.strokeStyle=rgba(mix(90,255,alert),mix(180,80,alert),mix(255,90,alert),0.5);ctx.lineWidth=5;ctx.lineCap='butt';
  const m=W*0.02,arm=170;
  [[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]].forEach(c=>{ctx.beginPath();ctx.moveTo(c[0]+c[2]*arm,c[1]);ctx.lineTo(c[0],c[1]);ctx.lineTo(c[0],c[1]+c[3]*arm);ctx.stroke();});
}

/* ---------- playback */
window.renderFrame=render;
window.ANIMATION={duration:LOOP,width:W,height:H,renderer:'canvas2d'};
const params=new URLSearchParams(location.search);
function boot(){
  if(params.has('t')){render(parseFloat(params.get('t'))||0);window.__ready=true;return;}
  const t0=performance.now();
  function tick(now){render((now-t0)/1000);window.__ready=true;if(!params.has('paused'))requestAnimationFrame(tick);}
  requestAnimationFrame(tick);
}
if(document.readyState==='complete')boot();else window.addEventListener('load',boot);
})();
</script>
</body>
</html>
