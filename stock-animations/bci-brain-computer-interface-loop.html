<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brain-Computer Interface – Neural Control Loop (4K / 15s seamless loop)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#02030a;overflow:hidden;cursor:none}
  #stage{position:absolute;left:0;top:0;width:3840px;height:2160px;transform-origin:0 0;overflow:hidden}
  canvas{display:block;width:3840px;height:2160px}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="3840" height="2160"></canvas></div>
<script>
(()=>{
'use strict';
/* ==========================================================================
   BRAIN-COMPUTER INTERFACE  ·  4K · 15 s · seamless loop · no text, no logos
   Story (all wordless): a paralysed hand tries to move -> the intent leaves the
   motor cortex -> the nerve pathway is broken (sparks) -> an electrode array
   under the skull picks the spikes up -> a cable carries them to a decoder ->
   the on-screen cursor moves & clicks while the real hand stays still.
   Every motion is periodic in 15 s (or a divisor of it) => perfect loop.
   Hooks for frame-exact capture:  window.__renderAt(seconds)  /  window.__DURATION
   ========================================================================== */
const W=3840,H=2160,DUR=15,TAU=Math.PI*2;
const cv=document.getElementById('c');
const ctx=cv.getContext('2d',{alpha:false});
const stage=document.getElementById('stage');
function fit(){
  const s=Math.min(innerWidth/W,innerHeight/H);
  stage.style.transform='translate('+((innerWidth-W*s)/2)+'px,'+((innerHeight-H*s)/2)+'px) scale('+s+')';
}
addEventListener('resize',fit);fit();

/* ----------------------------- small utilities --------------------------- */
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,v)=>{const t=clamp((v-a)/(b-a));return t*t*(3-2*t)};
const sstep5=(a,b,v)=>{const t=clamp((v-a)/(b-a));return t*t*t*(t*(t*6-15)+10)};
const frac=v=>v-Math.floor(v);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry32(20260607);
function gauss(){let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*v)}
function ihash(a,b){let h=(Math.imul(a|0,374761393)+Math.imul(b|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}

/* ------------------------------ 3D noise --------------------------------- */
const perm=new Uint8Array(512);
(()=>{const p=[];for(let i=0;i<256;i++)p.push(i);const r=mulberry32(11);for(let i=255;i>0;i--){const j=Math.floor(r()*(i+1));const t=p[i];p[i]=p[j];p[j]=t}for(let i=0;i<512;i++)perm[i]=p[i&255]})();
const fd=t=>t*t*t*(t*(t*6-15)+10);
function gr(h,x,y,z){h&=15;const u=h<8?x:y,v=h<4?y:(h===12||h===14?x:z);return((h&1)?-u:u)+((h&2)?-v:v)}
function noise3(x,y,z){
  const X=Math.floor(x)&255,Y=Math.floor(y)&255,Z=Math.floor(z)&255;
  x-=Math.floor(x);y-=Math.floor(y);z-=Math.floor(z);
  const u=fd(x),v=fd(y),w=fd(z);
  const A=perm[X]+Y,AA=perm[A]+Z,AB=perm[A+1]+Z,B=perm[X+1]+Y,BA=perm[B]+Z,BB=perm[B+1]+Z;
  return lerp(lerp(lerp(gr(perm[AA],x,y,z),gr(perm[BA],x-1,y,z),u),lerp(gr(perm[AB],x,y-1,z),gr(perm[BB],x-1,y-1,z),u),v),
              lerp(lerp(gr(perm[AA+1],x,y,z-1),gr(perm[BA+1],x-1,y,z-1),u),lerp(gr(perm[AB+1],x,y-1,z-1),gr(perm[BB+1],x-1,y-1,z-1),u),v),w);
}

/* ------------------------------ layout ----------------------------------- */
const BRAIN={cx:1450,cy:880,S:640,F:4.6};
const SCREEN={x:2470,y:262,w:1210,h:880};
const SIG={x:2470,y:1262,w:1210,h:690};
const CORE={x:2255,y:1000};
const HAND={x:520,y:1930,s:1.5};
const ORDER=[0,2,4,1,3];                 // pentagram order -> long, readable cursor moves
const TILE=[];
(()=>{ // five target tiles on a pentagon inside the screen
  const cx=SCREEN.x+SCREEN.w*0.5-95, cy=SCREEN.y+88+(SCREEN.h-88-100)/2, rx=SCREEN.w*0.285, ry=SCREEN.h*0.265;
  for(let k=0;k<5;k++){const a=-Math.PI/2+k*TAU/5;TILE.push({x:cx+Math.cos(a)*rx,y:cy+Math.sin(a)*ry,k})}
})();

/* ------------------------------ sprites ---------------------------------- */
function mkSprite(r,g,b,size=96,whiten=0.8){
  const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');
  const L=k=>`rgb(${Math.round(r+(255-r)*k)},${Math.round(g+(255-g)*k)},${Math.round(b+(255-b)*k)})`;
  const q=size/2,gd=x.createRadialGradient(q,q,0,q,q,q);
  gd.addColorStop(0,L(whiten));gd.addColorStop(0.07,L(whiten*0.6));
  gd.addColorStop(0.16,`rgba(${r},${g},${b},0.75)`);gd.addColorStop(0.34,`rgba(${r},${g},${b},0.26)`);
  gd.addColorStop(0.62,`rgba(${r},${g},${b},0.07)`);gd.addColorStop(1,`rgba(${r},${g},${b},0)`);
  x.fillStyle=gd;x.fillRect(0,0,size,size);return c;
}
function mkSoft(r,g,b,size=256){ // pure soft glow, no hot core
  const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');
  const q=size/2,gd=x.createRadialGradient(q,q,0,q,q,q);
  gd.addColorStop(0,`rgba(${r},${g},${b},0.55)`);gd.addColorStop(0.4,`rgba(${r},${g},${b},0.18)`);gd.addColorStop(1,`rgba(${r},${g},${b},0)`);
  x.fillStyle=gd;x.fillRect(0,0,size,size);return c;
}
const SP={brain:[]};
for(let i=0;i<16;i++){const t=i/15;SP.brain.push(mkSprite(Math.round(lerp(70,168,t)),Math.round(lerp(214,112,t)),255,96,0.7))}
SP.hot=mkSprite(120,235,255,96,0.9);
SP.warm=mkSprite(255,184,96,96,0.8);
SP.coral=mkSprite(255,92,108,96,0.8);
SP.violet=mkSprite(150,110,255,96,0.7);
SP.cyan=mkSprite(80,225,255,96,0.75);
SP.softC=mkSoft(60,200,255);SP.softV=mkSoft(120,90,255);SP.softW=mkSoft(255,170,90);SP.softK=mkSoft(255,80,110);
function glow(s,x,y,size,a){ctx.globalAlpha=a;ctx.drawImage(s,x-size*0.5,y-size*0.5,size,size)}

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

/* ------------------------------ polylines -------------------------------- */
function Poly(n){this.n=n;this.x=new Float32Array(n+1);this.y=new Float32Array(n+1);this.l=new Float32Array(n+1);this.L=0}
Poly.prototype.finish=function(){this.l[0]=0;for(let i=1;i<=this.n;i++){this.l[i]=this.l[i-1]+Math.hypot(this.x[i]-this.x[i-1],this.y[i]-this.y[i-1])}this.L=this.l[this.n]};
let _px=0,_py=0,_tx=1,_ty=0;
Poly.prototype.at=function(d){
  d=clamp(d,0,this.L);let lo=0,hi=this.n;
  while(hi-lo>1){const m=(lo+hi)>>1;if(this.l[m]<=d)lo=m;else hi=m}
  const seg=this.l[hi]-this.l[lo]||1,f=(d-this.l[lo])/seg;
  _px=lerp(this.x[lo],this.x[hi],f);_py=lerp(this.y[lo],this.y[hi],f);
  const dx=this.x[hi]-this.x[lo],dy=this.y[hi]-this.y[lo],m=Math.hypot(dx,dy)||1;_tx=dx/m;_ty=dy/m;
};
function cubic(P,p0x,p0y,p1x,p1y,p2x,p2y,p3x,p3y,from){
  const n=P.n;for(let i=0;i<=n;i++){const t=i/n,m=1-t,a=m*m*m,b=3*m*m*t,c=3*m*t*t,d=t*t*t;const k=(from||0)+i;P.x[k]=a*p0x+b*p1x+c*p2x+d*p3x;P.y[k]=a*p0y+b*p1y+c*p2y+d*p3y}
}

/* ------------------------------ timeline --------------------------------- */
const CYC=3;                                  // 5 intent cycles of 3 s = 15 s
const actEnv=u=>0.10+0.90*sstep(0.03,0.16,u)*(1-sstep(0.74,0.92,u));
function envAt(tt){return actEnv(frac(tt/CYC))}
const cycDir=[];                              // movement direction of each cycle (for decoder / raster tuning)
for(let c=0;c<5;c++){const a=TILE[ORDER[c]],b=TILE[ORDER[(c+1)%5]];cycDir.push(Math.atan2(b.y-a.y,b.x-a.x))}

function cursorAt(tt){
  tt=((tt%DUR)+DUR)%DUR;
  const c=Math.floor(tt/CYC),u=(tt-CYC*c)/CYC;
  const a=TILE[ORDER[c]],b=TILE[ORDER[(c+1)%5]];
  const p=sstep5(0.22,0.74,u);
  let x=lerp(a.x,b.x,p),y=lerp(a.y,b.y,p);
  const dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||1,nx=-dy/dist,ny=dx/dist;
  const bow=(c%2?1:-1)*0.13*dist*Math.sin(Math.PI*p);
  x+=nx*bow;y+=ny*bow;
  const mv=4*p*(1-p),tr=mv*9;
  x+=tr*(Math.sin(TAU*tt*61/DUR)+0.6*Math.sin(TAU*tt*97/DUR+0.3));
  y+=tr*(Math.cos(TAU*tt*71/DUR+1.1)+0.6*Math.sin(TAU*tt*113/DUR));
  return {x,y,c,u,p,mv};
}

/* ================================ BRAIN ==================================== */
const BR={ax:0.84,ay:0.58,az:1.0,yc:0.10};
const NMAX=21000;
const BX=new Float32Array(NMAX),BY=new Float32Array(NMAX),BZ=new Float32Array(NMAX);
const NXa=new Float32Array(NMAX),NYa=new Float32Array(NMAX),NZa=new Float32Array(NMAX);
const BG=new Float32Array(NMAX),BD0=new Float32Array(NMAX),BPH=new Float32Array(NMAX);
const BCI=new Uint8Array(NMAX),BPART=new Uint8Array(NMAX);
let N=0;
function addPt(x,y,z,nx,ny,nz,g,part){
  const l=Math.hypot(nx,ny,nz)||1;const i=N++;
  BX[i]=x;BY[i]=y;BZ[i]=z;NXa[i]=nx/l;NYa[i]=ny/l;NZa[i]=nz/l;BG[i]=g;BPART[i]=part;
  BCI[i]=clamp(Math.round((1-(z+1)/2.1)*15),0,15);BPH[i]=rnd();
}
function insideMain(x,y,z){
  const yl=y-BR.yc,ay=yl>0?BR.ay:BR.ay*0.62,wz=1-0.10*(z/BR.az);
  const a=x/(BR.ax*wz),b=yl/ay,c=z/BR.az;return a*a+b*b+c*c;
}
function insideTemp(x,y,z){const dz=(z-0.14)/0.58,dx=(Math.abs(x)-0.50)/0.27,dy=(y+0.14*dz+0.27)/0.19;return dx*dx+dy*dy+dz*dz}
function insideCb(x,y,z){const a=x/0.50,b=(y+0.30)/0.26,c=(z+0.74)/0.34;return a*a+b*b+c*c}
function segDist(px,py,ax,ay,bx,by){const vx=bx-ax,vy=by-ay;const t=clamp(((px-ax)*vx+(py-ay)*vy)/(vx*vx+vy*vy));return Math.hypot(px-(ax+vx*t),py-(ay+vy*t))}
function foldFn(x,y,z){
  const f=3.5,q=1.7;
  const w1=noise3(x*q+3.1,y*q,z*q)*0.55,w2=noise3(x*q,y*q+7.7,z*q+1.3)*0.55,w3=noise3(x*q+9.2,y*q+2.2,z*q)*0.55;
  const qx=(x+w1)*f,qy=(y+w2)*f,qz=(z+w3)*f,e=0.02;
  const n0=noise3(qx,qy,qz);
  const gx=noise3(qx+e,qy,qz)-noise3(qx-e,qy,qz),gy=noise3(qx,qy+e,qz)-noise3(qx,qy-e,qz),gz=noise3(qx,qy,qz+e)-noise3(qx,qy,qz-e);
  const gl=Math.hypot(gx,gy,gz)/(2*e)+0.05;
  return sstep(0.010,0.034,Math.abs(n0)/gl/f);
}
function grooves(x,y,z){
  let f=1;
  if(Math.abs(x)>0.2)f*=sstep(0.012,0.045,segDist(z,y,0.68,-0.02,-0.45,0.22));   // lateral (Sylvian) fissure
  f*=sstep(0.010,0.036,segDist(z,y,-0.10,0.68,0.17,0.20));                         // central sulcus
  return f;
}
function genBrain(){
  // cerebrum
  let cnt=0,tries=0;
  while(cnt<11500&&tries<900000){
    tries++;
    let dx=gauss(),dy=gauss(),dz=gauss();const l=Math.hypot(dx,dy,dz);dx/=l;dy/=l;dz/=l;
    const ay=dy>0?BR.ay:BR.ay*0.62,A=BR.ax,B=ay,C=BR.az;
    if(rnd()*0.86>Math.sqrt((B*C*dx)**2+(A*C*dy)**2+(A*B*dz)**2))continue;
    const wz=1-0.10*dz;let x=BR.ax*wz*dx;const y=BR.yc+ay*dy,z=BR.az*dz;
    if(Math.abs(x)<0.026)continue;
    if(dy<-0.42&&rnd()<0.93)continue;
    x+=(x>0?1:-1)*0.014;
    if(insideTemp(x,y,z)<0.88)continue;
    const g=foldFn(x,y,z)*grooves(x,y,z);
    if(rnd()>0.05+0.95*Math.pow(g,1.5))continue;
    const nx=dx/(BR.ax*wz),ny=dy/ay,nz=dz/BR.az,nl=Math.hypot(nx,ny,nz),disp=0.05*(g-0.45);
    addPt(x+nx/nl*disp,y+ny/nl*disp,z+nz/nl*disp,nx,ny,nz,g,0);cnt++;
  }
  // temporal lobes
  cnt=0;tries=0;
  while(cnt<2400&&tries<400000){
    tries++;
    let dx=gauss(),dy=gauss(),dz=gauss();const l=Math.hypot(dx,dy,dz);dx/=l;dy/=l;dz/=l;
    const sx=rnd()<0.5?-1:1;
    const x=sx*(0.50+0.27*dx),y=-0.27+0.19*dy-0.14*dz,z=0.14+0.58*dz;
    if(insideMain(x,y,z)<0.90)continue;
    const g=foldFn(x,y,z)*sstep(0.0,0.05,Math.abs(y-0.0)+ (y<0?0.05:0));
    if(rnd()>0.05+0.95*Math.pow(g,1.5))continue;
    addPt(x,y,z,sx*dx/0.27,dy/0.19,dz/0.58,g,0);cnt++;
  }
  // cerebellum
  cnt=0;tries=0;
  while(cnt<2300&&tries<400000){
    tries++;
    let dx=gauss(),dy=gauss(),dz=gauss();const l=Math.hypot(dx,dy,dz);dx/=l;dy/=l;dz/=l;
    const x=0.50*dx,y=-0.30+0.26*dy,z=-0.74+0.34*dz;
    if(insideMain(x,y,z)<0.92)continue;
    const g=0.5+0.5*Math.sin(y*84+2.0*noise3(x*2,y*2,z*2));
    if(rnd()>0.10+0.9*Math.pow(g,1.2))continue;
    addPt(x,y,z,dx/0.50,dy/0.26,dz/0.34,0.35+0.65*g,1);cnt++;
  }
  // brain stem
  cnt=0;tries=0;
  const ax=0,ay=-0.72,az=-0.24,al=Math.hypot(ay,az),ux=0,uy=ay/al,uz=az/al; // axis
  const e2x=0,e2y=uz,e2z=-uy;                                                // perpendicular (other is x)
  while(cnt<700&&tries<100000){
    tries++;
    const s=Math.floor(rnd()*46)/46+rnd()*0.01,th=rnd()*TAU;
    const rad=(0.125-0.05*s)*(1+0.18*Math.exp(-((s-0.22)*(s-0.22))/0.01));
    const cx=0,cy=-0.28+ay*s,cz=-0.22+az*s;
    const nx=Math.cos(th),ny=Math.sin(th)*e2y,nz=Math.sin(th)*e2z;
    const x=cx+rad*nx,y=cy+rad*ny,z=cz+rad*nz;
    if(insideMain(x,y,z)<0.92||insideCb(x,y,z)<0.9)continue;
    addPt(x,y,z,nx,ny,nz,0.55+0.45*Math.abs(Math.sin(s*46*Math.PI)),2);cnt++;
  }
}
genBrain();

/* motor-cortex point (where the array sits) + local frame */
const MOT={x:0,y:0.36,z:0.20,nx:0,ny:0,nz:0};
(()=>{
  const y=MOT.y,z=MOT.z,wz=1-0.10*z/BR.az;
  const s=1-Math.pow((y-BR.yc)/BR.ay,2)-Math.pow(z/BR.az,2);
  MOT.x=BR.ax*wz*Math.sqrt(s)+0.014+0.01;
  let nx=MOT.x/Math.pow(BR.ax*wz,2),ny=(y-BR.yc)/(BR.ay*BR.ay),nz=z/(BR.az*BR.az);const l=Math.hypot(nx,ny,nz);
  MOT.nx=nx/l;MOT.ny=ny/l;MOT.nz=nz/l;
})();
const ARR={n:10,pitch:0.023,ux:0,uy:0,uz:0,vx:0,vy:0,vz:0};
(()=>{ // tangent axes: u = AP direction, v = up-ish
  let ux=0,uy=0,uz=1;const d=ux*MOT.nx+uy*MOT.ny+uz*MOT.nz;ux-=d*MOT.nx;uy-=d*MOT.ny;uz-=d*MOT.nz;
  const ul=Math.hypot(ux,uy,uz);ux/=ul;uy/=ul;uz/=ul;
  const vx=MOT.ny*uz-MOT.nz*uy,vy=MOT.nz*ux-MOT.nx*uz,vz=MOT.nx*uy-MOT.ny*ux;
  const sgn=vy<0?-1:1;
  ARR.ux=ux;ARR.uy=uy;ARR.uz=uz;ARR.vx=vx*sgn;ARR.vy=vy*sgn;ARR.vz=vz*sgn;
})();
for(let i=0;i<N;i++)BD0[i]=Math.hypot(BX[i]-MOT.x,BY[i]-MOT.y,BZ[i]-MOT.z);
const STEM={x:0,y:-1.0,z:-0.46};

/* neighbour graph (neural mesh) */
let EA,EB,NE=0;
const ADJ_S=new Int32Array(NMAX+1);let ADJ=null;
(()=>{
  const cs=0.075,grid=new Map();
  const key=(a,b,c)=>((a+64)*128+(b+64))*128+(c+64);
  for(let i=0;i<N;i++){const k=key(Math.floor(BX[i]/cs),Math.floor(BY[i]/cs),Math.floor(BZ[i]/cs));let a=grid.get(k);if(!a){a=[];grid.set(k,a)}a.push(i)}
  const edges=new Set(),ea=[],eb=[];
  for(let i=0;i<N;i++){
    const cx=Math.floor(BX[i]/cs),cy=Math.floor(BY[i]/cs),cz=Math.floor(BZ[i]/cs);
    const cand=[];
    for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)for(let c=-1;c<=1;c++){
      const L=grid.get(key(cx+a,cy+b,cz+c));if(!L)continue;
      for(const j of L){if(j===i||BPART[j]!==BPART[i])continue;const d=Math.hypot(BX[i]-BX[j],BY[i]-BY[j],BZ[i]-BZ[j]);if(d<cs*1.05)cand.push([d,j])}
    }
    cand.sort((p,q)=>p[0]-q[0]);
    const k=Math.min(cand.length,BPART[i]===1?3:2);
    for(let m=0;m<k;m++){const j=cand[m][1],lo=Math.min(i,j),hi=Math.max(i,j),kk=lo*NMAX+hi;if(!edges.has(kk)){edges.add(kk);ea.push(lo);eb.push(hi)}}
  }
  NE=ea.length;EA=Int32Array.from(ea);EB=Int32Array.from(eb);
  const deg=new Int32Array(N+1);for(let e=0;e<NE;e++){deg[EA[e]]++;deg[EB[e]]++}
  for(let i=0;i<N;i++)ADJ_S[i+1]=ADJ_S[i]+deg[i];
  ADJ=new Int32Array(ADJ_S[N]);const fill=new Int32Array(N);
  for(let e=0;e<NE;e++){const a=EA[e],b=EB[e];ADJ[ADJ_S[a]+fill[a]++]=b;ADJ[ADJ_S[b]+fill[b]++]=a}
})();

/* signal paths: random walks over the mesh, pulses ride on them */
const PATHS=[];
(()=>{
  const periods=[1.5,2.5,3,5,7.5,15/4];
  for(let k=0;k<330;k++){
    let cur=Math.floor(rnd()*N),prev=-1,dirx=0,diry=0,dirz=0;const p=[cur];
    for(let s=0;s<13;s++){
      const a=ADJ_S[cur],b=ADJ_S[cur+1];if(b===a)break;
      let best=-1,bs=-9;
      for(let m=a;m<b;m++){const j=ADJ[m];if(j===prev)continue;
        let dx=BX[j]-BX[cur],dy=BY[j]-BY[cur],dz=BZ[j]-BZ[cur];const l=Math.hypot(dx,dy,dz)||1;dx/=l;dy/=l;dz/=l;
        const sc=(dx*dirx+dy*diry+dz*dirz)+rnd()*0.7;if(sc>bs){bs=sc;best=j}}
      if(best<0)break;
      let dx=BX[best]-BX[cur],dy=BY[best]-BY[cur],dz=BZ[best]-BZ[cur];const l=Math.hypot(dx,dy,dz)||1;dirx=dx/l;diry=dy/l;dirz=dz/l;
      prev=cur;cur=best;p.push(cur);
    }

      ctx.lineWidth=9;ctx.lineCap='round';ctx.strokeStyle=`rgba(140,245,255,${0.9*sstep(0.70,0.78,cu)})`;
      ctx.beginPath();ctx.arc(tl.x,tl.y,sz/2+26,-Math.PI/2,-Math.PI/2+TAU*f);ctx.stroke();ctx.lineCap='butt';
      ctx.globalCompositeOperation='lighter';glow(SP.cyan,tl.x+Math.cos(-Math.PI/2+TAU*f)*(sz/2+26),tl.y+Math.sin(-Math.PI/2+TAU*f)*(sz/2+26),80,0.9);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
    }
  }
  // decoder (population vector)
  const dcx=S.x+S.w-150,dcy=S.y+88+(S.h-88-100)/2,dth=cycDir[cc];
  const speed=cu>0.22&&cu<0.78?cur.mv:0.0;
  ctx.globalCompositeOperation='source-over';ctx.strokeStyle='rgba(150,200,255,0.18)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(dcx,dcy,112,0,TAU);ctx.stroke();
  ctx.beginPath();ctx.arc(dcx,dcy,60,0,TAU);ctx.stroke();
  ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
  for(let k=0;k<32;k++){
    const a=TAU*k/32,tune=Math.max(0,Math.cos(a-dth)),jit=0.5+0.5*Math.sin(TAU*((k%9+3)*t/DUR+k*0.7));
    const len=12+(86*tune*(0.15+0.85*speed)+10*jit)*(0.4+0.6*A);
    ctx.lineWidth=7;ctx.strokeStyle=`rgba(${lerp(110,170,k/32)},${lerp(230,130,tune<0.2?1:1-tune*0.5)},255,${0.35+0.6*tune})`;
    ctx.beginPath();ctx.moveTo(dcx+Math.cos(a)*30,dcy+Math.sin(a)*30);ctx.lineTo(dcx+Math.cos(a)*(30+len),dcy+Math.sin(a)*(30+len));ctx.stroke();
  }
  const ml=26+70*(0.15+0.85*speed);ctx.lineWidth=7;ctx.strokeStyle='rgba(255,255,255,0.95)';ctx.beginPath();ctx.moveTo(dcx,dcy);ctx.lineTo(dcx+Math.cos(dth)*ml,dcy+Math.sin(dth)*ml);ctx.stroke();
  glow(SP.hot,dcx+Math.cos(dth)*ml,dcy+Math.sin(dth)*ml,60,0.9);glow(SP.hot,dcx,dcy,50,0.7);ctx.lineCap='butt';ctx.globalAlpha=1;
  // cursor trail + cursor
  ctx.globalCompositeOperation='lighter';
  for(let k=22;k>=1;k--){const q=cursorAt(t-k*0.022);const f=1-k/23;glow(SP.cyan,q.x,q.y,16+60*f,0.50*f*f*(0.2+0.8*clamp(cur.mv*3,0,1)))}
  ctx.globalAlpha=1;
  drawArrow(cur.x,cur.y,1.7,'rgba(255,255,255,0.98)',0.55);
  ctx.restore();  // clip
  ctx.restore();  // bob
}

/* ============================ SIGNALS PANEL ================================ */
const EEG_CH=6,EEG_AMP=[];
for(let c=0;c<EEG_CH;c++){const a=[];for(let k=0;k<5;k++)a.push({f:[3,5,9,14,23][k]+c%3,m:[2,-3,5,-7,11][k]*(c%2?1:-1)*(k%2?1:-1)||2,p:rnd()*TAU,a:[1,0.7,0.5,0.35,0.22][k]*(0.8+rnd()*0.4)});EEG_AMP.push(a)}
const EEG_GRAD=[];
function drawSignals(t,u,A){
  const S=SIG;
  glassPanel(S.x,S.y,S.w,S.h,38,SP.softC,0.13,t,0.5);
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(255,255,255,0.10)';rr(S.x+50,S.y+34,230,24,12);ctx.fill();rr(S.x+296,S.y+34,100,24,12);ctx.fill();
  ctx.globalCompositeOperation='lighter';glow(SP.warm,S.x+S.w-62,S.y+46,46,0.5+0.4*A);glow(SP.cyan,S.x+S.w-112,S.y+46,40,0.5);ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
  ctx.strokeStyle='rgba(255,255,255,0.07)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(S.x,S.y+88);ctx.lineTo(S.x+S.w,S.y+88);ctx.stroke();
  const x0=S.x+56,x1=S.x+S.w-56,wid=x1-x0,vs=240;
  const top=S.y+112,chH=54,nCh=EEG_CH;
  // grid
  ctx.strokeStyle='rgba(150,190,255,0.06)';ctx.lineWidth=2;ctx.beginPath();
  for(let i=0;i<=11;i++){const x=x0+wid*i/11;ctx.moveTo(x,top-6);ctx.lineTo(x,top+chH*nCh+6)}
  for(let c=0;c<=nCh;c++){ctx.moveTo(x0,top+chH*c);ctx.lineTo(x1,top+chH*c)}ctx.stroke();
  // EEG
  ctx.globalCompositeOperation='lighter';ctx.lineJoin='round';
  const NS=240;
  for(let ch=0;ch<nCh;ch++){
    const yc=top+chH*(ch+0.5),col=lerp(0,1,ch/(nCh-1));
    if(!EEG_GRAD[ch]){const g=ctx.createLinearGradient(x0,0,x1,0);const rgb=`${Math.round(lerp(90,165,col))},${Math.round(lerp(225,125,col))},255`;g.addColorStop(0,`rgba(${rgb},0)`);g.addColorStop(0.35,`rgba(${rgb},0.55)`);g.addColorStop(1,`rgba(${rgb},1)`);EEG_GRAD[ch]=g}
    const P=new Path2D();
    for(let i=0;i<=NS;i++){
      const px=i/NS,x=x0+wid*px,ts=t-(1-px)*(wid/vs);
      const e=envAt(ts);let v=0;
      for(const w of EEG_AMP[ch])v+=w.a*Math.sin(TAU*(w.f*px+w.m*t/DUR)+w.p);
      const burst=Math.sin(TAU*(61*px-47*t/DUR+ch))*0.35*e;
      const y=yc-(v*0.34*(0.30+0.95*e)+burst)*chH*0.62;
      if(i)P.lineTo(x,y);else P.moveTo(x,y);
    }
    ctx.strokeStyle=EEG_GRAD[ch];ctx.globalAlpha=0.16;ctx.lineWidth=9;ctx.stroke(P);ctx.globalAlpha=1;ctx.lineWidth=2.6;ctx.stroke(P);
  }
  // raster plot (direction-tuned spikes)
  const rTop=top+chH*nCh+44,rows=34,rowH=(S.y+S.h-46-rTop)/rows;
  ctx.fillStyle='rgba(150,190,255,0.04)';ctx.fillRect(x0,rTop-8,wid,rows*rowH+16);
  const q=20,baseSlot=Math.floor(t*q);
  const bright=new Path2D(),mid=new Path2D(),dim=new Path2D();
  const colsN=Math.ceil(wid/(vs/q))+1;
  for(let j=0;j<colsN;j++){
    const si=baseSlot-j,T=si/q,x=x1-(t-T)*vs-4;if(x<x0)break;
    const e=envAt(T),cyc=((Math.floor(T/CYC)%5)+5)%5,th=cycDir[cyc];
    const idx=((si%300)+300)%300;
    for(let r=0;r<rows;r++){
      const pref=TAU*r/rows*1.0+ihash(r,5)*0.6,tune=Math.max(0,Math.cos(pref-th));
      const pr=0.012+0.62*e*tune*tune+0.05*e;
      if(ihash(r,idx)<pr){const P=j<7?bright:j<46?mid:dim;P.rect(x,rTop+r*rowH+rowH*0.15,5,rowH*0.7)}
    }
  }
  ctx.fillStyle='rgba(235,255,255,0.98)';ctx.fill(bright);ctx.fillStyle='rgba(120,225,255,0.85)';ctx.fill(mid);ctx.fillStyle='rgba(160,135,255,0.55)';ctx.fill(dim);
  // playhead
  const pg=ctx.createLinearGradient(0,top,0,rTop+rows*rowH);pg.addColorStop(0,'rgba(180,240,255,0)');pg.addColorStop(0.5,'rgba(180,240,255,0.7)');pg.addColorStop(1,'rgba(180,240,255,0)');
  ctx.fillStyle=pg;ctx.fillRect(x1+2,top-10,4,rTop+rows*rowH-top+20);
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}

/* ================================ post ===================================== */
const bl1=document.createElement('canvas');bl1.width=960;bl1.height=540;const b1=bl1.getContext('2d');
const bl2=document.createElement('canvas');bl2.width=480;bl2.height=270;const b2=bl2.getContext('2d');
const hasFilter=('filter' in b1);
b1.imageSmoothingQuality='high';b2.imageSmoothingQuality='high';
function bloom(){
  if(!hasFilter)return;
  b1.globalCompositeOperation='copy';if(hasFilter)b1.filter='brightness(1.15) contrast(1.55) blur(5px)';b1.drawImage(cv,0,0,960,540);if(hasFilter)b1.filter='none';
  b2.globalCompositeOperation='copy';if(hasFilter)b2.filter='blur(5px)';b2.drawImage(bl1,0,0,480,270);if(hasFilter)b2.filter='none';
  ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=0.40;ctx.drawImage(bl1,0,0,W,H);ctx.globalAlpha=0.34;ctx.drawImage(bl2,0,0,W,H);
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}

/* ============================== main render ================================= */
function render(t){
  t=((t%DUR)+DUR)%DUR;
  const c=Math.floor(t/CYC),u=(t-c*CYC)/CYC,A=actEnv(u);
  ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  ctx.drawImage(bgC,0,0);
  // camera: slow push-in + drift, loops exactly
  const z=1+0.026*(0.5-0.5*Math.cos(TAU*t/DUR)),cx=30*Math.sin(TAU*t/DUR),cy=14*Math.cos(TAU*t/DUR);
  ctx.setTransform(1+0.0,0,0,1,cx*0.35,cy*0.35);drawDust(t,DUST);
  ctx.setTransform(z,0,0,z,(1-z)*W/2+cx,(1-z)*H/2+cy);
  drawRings(t,A);
  brainFrame(t,u,A);               // computes projections first
  ctx.globalCompositeOperation='source-over';
  drawSkull(t);
  drawArray(t,u,A);
  drawHand(t,u,A);
  drawNerve(t,u,A);
  drawCable(t,u,A);
  drawLinks(t,u,A);
  drawCore(t,u,A);
  drawScreen(t,u,A);
  drawSignals(t,u,A);
  ctx.setTransform(1.0+0.03,0,0,1.03,-(0.03)*W/2-cx*1.8,-(0.03)*H/2-cy*1.8);drawDust(t+3.7,BOKEH.map(b=>({x:b.x,y:b.y,r:b.r*0.5,ax:b.ax,ay:b.ay,m:1,n:1,p:b.p,q:b.q,tw:1,a:b.a*14,c:b.c})));
  ctx.setTransform(1,0,0,1,0,0);
  bloom();
  ctx.globalCompositeOperation='source-over';ctx.drawImage(vigC,0,0);
  // film grain (also acts as dither to avoid banding in the encode)
  const fi=Math.floor(t*30),ox=Math.floor(ihash(fi,1)*512),oy=Math.floor(ihash(fi,2)*512);
  ctx.save();ctx.translate(-ox,-oy);ctx.globalCompositeOperation='lighter';ctx.globalAlpha=0.045;ctx.fillStyle=grainPat;ctx.fillRect(ox,oy,W,H);ctx.restore();
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}

/* ============================== autoplay loop =============================== */
window.__DURATION=DUR;window.__renderAt=render;
let t0=null,seeking=false;
function frame(ts){
  if(!seeking){
    if(t0===null)t0=ts;
    render(((ts-t0)/1000)%DUR);
  }
  requestAnimationFrame(frame);
}
render(0);
requestAnimationFrame(frame);
window.__seek=(s)=>{seeking=true;render(s)};   // frame-stepping helper for external capture tools
window.__play=()=>{seeking=false;t0=null};
})();
</script>
