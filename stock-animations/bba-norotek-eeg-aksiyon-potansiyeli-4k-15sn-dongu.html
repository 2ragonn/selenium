'use strict';

/* =============================================================================================
   CORE
============================================================================================= */

function glow(x, y, r, c, a) { al(a == null ? 1 : a); ctx.drawImage(sprite(c), x - r, y - r, r * 2, r * 2); }

function hgrad(x0, x1, c, stops) {
  const g = ctx.createLinearGradient(x0, 0, x1, 0);
  for (const [p, a] of stops) g.addColorStop(p, rgba(c, a));

}

function pchip(K) {
  const n = K.length, h = [], d = [], m = new Array(n);
  for (let i = 0; i < n - 1; i++) { h[i] = K[i + 1][0] - K[i][0]; d[i] = (K[i + 1][1] - K[i][1]) / h[i]; }

  for (let i = 1; i < n - 1; i++) {
    if (d[i - 1] * d[i] <= 0) m[i] = 0;
    else { const w1 = 2 * h[i] + h[i - 1], w2 = h[i] + 2 * h[i - 1]; m[i] = (w1 + w2) / (w1 / d[i - 1] + w2 / d[i]); }

    x = clamp(x); let i = 0; while (i < n - 2 && x > K[i + 1][0]) i++;

/* =============================================================================================
   BACKGROUND  (periodic -> loops perfectly)
============================================================================================= */
const AK = [[1.2, C.cy, C.vi], [3.5, C.vi, C.cy], [5.9, C.bl, C.vi], [8.2, C.pk, C.vi], [10.4, C.bl, C.cy], [13.0, C.am, C.cy]];

  let i = AK.length - 1;
  for (let k = 0; k < AK.length; k++) if (t >= AK[k][0]) i = k;
  const a = AK[i], b = AK[(i + 1) % AK.length];
  const ta = a[0]; let tb = b[0]; if (tb <= ta) tb += DUR;
  let tt = t; if (tt < ta) tt += DUR;
  const w = eio(clamp((tt - ta) / (tb - ta)));

const DUST = (() => {
  const r = mulberry32(11), a = [];

})();
const BOKEH = (() => {
  const r = mulberry32(5), a = [];

  return a;
})();
const auC = mk(960, 540), au = auC.getContext('2d');

  au.setTransform(.5, 0, 0, .5, 0, 0); au.globalCompositeOperation = 'source-over'; au.clearRect(0, 0, 1920, 1080); au.globalCompositeOperation = 'lighter';
  const blob = (x, y, r, c, a) => { au.globalAlpha = a; au.drawImage(sprite(c), x - r, y - r, r * 2, r * 2); };
  blob(520 + 280 * Math.cos(ph + .3), 300 + 150 * Math.sin(ph + 1), 1050, c1, .20);
  blob(1480 + 300 * Math.cos(ph + 2.2), 380 + 170 * Math.sin(ph + 3.1), 1000, c2, .15);
  blob(960 + 400 * Math.cos(ph + 4.1), 1020 + 120 * Math.sin(ph + .6), 1300, C.bl, .10);
  au.globalAlpha = 1;
}
function drawBG(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  mode('source-over'); ctx.globalAlpha = 1;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#04050d'); g.addColorStop(.55, '#050813'); g.addColorStop(1, '#03040a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  aurora(t); mode('lighter'); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high'; ctx.drawImage(auC, 0, 0, W, H);
  ctx.setTransform(U, 0, 0, U, 0, 0);

  const gs = 40, oy = (t / DUR * gs) % gs;

  for (let y = -gs + oy; y < 1080; y += gs) for (let x = 0; x < 1920; x += gs) ctx.rect(x - .7, y - .7, 1.4, 1.4);
  ctx.fill();

  for (const b of BOKEH) {

    al(.06); ctx.strokeStyle = rgba(b.c, 1); ctx.lineWidth = 1; ctx.stroke();
  }

  for (const d of DUST) {

    const tw = .55 + .45 * Math.sin(ph * d.q * 2 + d.ph);

/* =============================================================================================
   3D HELPERS + PROCEDURAL BRAIN
============================================================================================= */
function mkCam(yaw, pitch, cx, cy, R, D) {
  return { cx, cy, R, D: D || 3.6, cyw: Math.cos(yaw), syw: Math.sin(yaw), cp: Math.cos(pitch), sp: Math.sin(pitch) };

const TP = [0, 0, 0, 0];
function rotP(c, x, y, z) {
  const x1 = x * c.cyw + z * c.syw, z1 = -x * c.syw + z * c.cyw;
  const y2 = y * c.cp - z1 * c.sp, z2 = y * c.sp + z1 * c.cp;
  const s = c.D / (c.D - z2);

function rotNZ(c, x, y, z) { const z1 = -x * c.syw + z * c.cyw; return y * c.sp + z1 * c.cp; }

const BR = (() => {
  const NC = 15000, NB = 2600, NS = 800, N = NC + NB + NS, r = mulberry32(7);
  const px = new Float32Array(N), py = new Float32Array(N), pz = new Float32Array(N);
  const ux = new Float32Array(N), uy = new Float32Array(N), uz = new Float32Array(N);
  const fo = new Float32Array(N), hc = new Uint8Array(N);

  const sphere = (i, n) => {                                 // jittered fibonacci sphere -> organic, no spiral moire
    const y = 1 - 2 * (i + .5) / n, q = Math.sqrt(1 - y * y), th = i * GAN;
    let x = Math.cos(th) * q + (r() - .5) * .03, yy = y + (r() - .5) * .03, z = Math.sin(th) * q + (r() - .5) * .03;
    const m = Math.hypot(x, yy, z); return [x / m, yy / m, z / m];
  };
  // cerebral cortex: folded ellipsoid with sulci, sylvian groove, temporal lobe, longitudinal fissure
  for (let i = 0; i < NC; i++) {
    const [x, y, z] = sphere(i, NC);
    const f1 = Math.abs(2 * vn3(x * 3.1 + 4, y * 3.1 + 9, z * 3.1 + 2) - 1);
    const f2 = Math.abs(2 * vn3(x * 7.4 + 1, y * 7.4 + 6, z * 7.4 + 3) - 1);
    const f3 = Math.abs(2 * vn3(x * 15 + 7, y * 15 + 2, z * 15 + 8) - 1);
    const fold = .30 * f1 + .42 * f2 + .28 * f3;
    const lat = sstep(.35, .85, Math.abs(x));
    const tb = Math.exp(-Math.pow((z - .22) / .42, 2)) * lat * sstep(.25, -.45, y);          // temporal lobe bulge
    const gv = Math.exp(-Math.pow((y - .04 + .12 * (z - .2)) / .05, 2)) * lat * sstep(-.55, .1, z);   // sylvian groove

    if (CHAN.some(c => Math.abs(x - c.x) < 54)) continue;
    const w = wob(x), yt = my - 30 + w, yb = my + 30 + w * .8;
    lip.moveTo(x - 3, yt + 8); lip.lineTo(x - 3, my - 4); lip.moveTo(x + 3, yt + 8); lip.lineTo(x + 3, my - 8);
    lip.moveTo(x - 3, yb - 8); lip.lineTo(x - 3, my + 4); lip.moveTo(x + 3, yb - 8); lip.lineTo(x + 3, my + 8);
    heads.moveTo(x + 7.5, yt); heads.arc(x, yt, 7.5, 0, TAU); heads2.moveTo(x + 7.5, yb); heads2.arc(x, yb, 7.5, 0, TAU);
  }
  ctx.strokeStyle = 'rgba(210,225,255,1)'; ctx.lineWidth = 1.3; al(.28); ctx.stroke(lip);
  ctx.fillStyle = rgba(C.bl, 1); al(.75); ctx.fill(heads); ctx.fillStyle = rgba(C.vi, 1); al(.75); ctx.fill(heads2);
  // channels
  const open = CHAN.map(c => bump(s, c.a, c.b));
  CHAN.forEach((c, i) => {
    const g = open[i], gap = 7 + 24 * g;
    for (const sd of [-1, 1]) {
      const bx = c.x + sd * (gap / 2 + 20) - 20;
      const gr = ctx.createLinearGradient(bx, 0, bx + 40, 0); gr.addColorStop(0, rgba(c.c, .06)); gr.addColorStop(1, rgba(c.c, .26));
      ctx.fillStyle = gr; al(1); rr(bx, my - 56, 40, 112, 16); ctx.fill();
      ctx.strokeStyle = rgba(c.c, 1); ctx.lineWidth = 1.6; al(.55 + .45 * g); rr(bx, my - 56, 40, 112, 16); ctx.stroke();
    }
    glow(c.x, my, 60 + 50 * g, c.c, .1 + .5 * g);
    text(c.sym, c.x, my - 82, { size: 19, font: MONO, align: 'center', a: .55 + .45 * g, color: rgba(c.c, 1), weight: 500 });
  });
  // surface charges (polarity follows the membrane voltage)
  const pol = clamp(-V / 70, -1, 1);
  for (let x = 150; x < 920; x += 62) {
    if (CHAN.some(c => Math.abs(x - c.x) < 60)) continue;
    const yo = my - 74, yi = my + 74;
    text('+', x, yo + 8, { size: 26, font: MONO, align: 'center', a: Math.max(pol, 0) * .8, color: rgba(C.am, 1), weight: 500 });
    text('−', x, yo + 8, { size: 26, font: MONO, align: 'center', a: Math.max(-pol, 0) * .8, color: rgba(C.cy, 1), weight: 500 });
    text('−', x, yi + 8, { size: 26, font: MONO, align: 'center', a: Math.max(pol, 0) * .8, color: rgba(C.cy, 1), weight: 500 });
    text('+', x, yi + 8, { size: 26, font: MONO, align: 'center', a: Math.max(-pol, 0) * .8, color: rgba(C.am, 1), weight: 500 });
  }
  const IC = [C.cy, C.am, C.vi, C.mi];
  for (const io of IONS) {
    const x = io.x + io.ax * Math.sin(t * io.w1 + io.p1), y = io.y + io.ay * Math.sin(t * io.w2 + io.p2);
    glow(x, y, 15, IC[io.type], .55); ctx.beginPath(); ctx.arc(x, y, 4.2, 0, TAU); ctx.fillStyle = rgba(IC[io.type], 1); al(.95); ctx.fill();
  }
  // ions passing through open channels
  CHAN.forEach((c, i) => {
    const g = open[i]; if (g < .04) return;
    for (let k = 0; k < 8; k++) {
      let q = fract(tau * 1.5 + k / 8 + i * .13); if (c.dir < 0) q = 1 - q;
      const y = lerp(my - 150, my + 150, q), x = c.x + 5 * Math.sin(q * 14 + k), fa = Math.sin(Math.PI * (c.dir < 0 ? 1 - q : q)) * g;
      glow(x, y, 26, c.c, .8 * fa); ctx.beginPath(); ctx.arc(x, y, 5, 0, TAU); ctx.fillStyle = '#fff'; al(.95 * fa); ctx.fill();
    }
  });
  // legend
  [['Na⁺ sodyum', C.cy], ['K⁺ potasyum', C.vi], ['Ca²⁺ kalsiyum', C.am], ['Cl⁻ klorür', C.mi]].forEach((l, i) => {
    const x = 138 + i * 200; ctx.beginPath(); ctx.arc(x, 858, 5, 0, TAU); ctx.fillStyle = rgba(l[1], 1); al(.95); ctx.fill();
    text(l[0], x + 14, 864, { size: 16, font: MONO, a: .65 });
  });
  text('HÜCRE İÇİ', 914, 800, { size: 13, font: MONO, align: 'right', ls: 5, a: .3 });
  text('HÜCRE DIŞI', 914, 282, { size: 13, font: MONO, align: 'right', ls: 5, a: .3 });

  /* ---- voltage graph ---- */
  const GX = 980, GY = 190, GW = 840, GH = 430;
  panel(GX, GY, GW, GH, 30, 1);
  text('AKSİYON POTANSİYELİ', GX + 38, GY + 58, { size: 19, font: MONO, ls: 7, a: .85, weight: 500 });
  const vc = mixc(C.cy, C.am, sstep(-62, 30, V));
  text((V < -.5 ? '−' : V > .5 ? '+' : '') + Math.abs(Math.round(V)), GX + GW - 112, GY + 70, { size: 62, weight: 200, align: 'right', color: rgba(vc, 1) });
  text('mV', GX + GW - 38, GY + 66, { size: 20, font: MONO, align: 'right', a: .6, ls: 3 });
  const pX0 = GX + 100, pX1 = GX + GW - 40, curX = GX + GW - 150, pps = 330, yv = v => GY + GH - 38 - (v + 90) * 2.12;
  for (const [v, lab] of [[35, '+35'], [0, '0'], [-85, '−85']]) {
    al(v === 0 ? .3 : .16); ctx.fillStyle = '#cfe0ff'; ctx.fillRect(pX0, yv(v), pX1 - pX0, 1);
    text(lab, pX0 - 14, yv(v) + 6, { size: 17, font: MONO, align: 'right', a: .6 });
  }
  ctx.setLineDash([7, 7]); ctx.strokeStyle = rgba(C.am, 1); ctx.lineWidth = 1.3; al(.7); ctx.beginPath(); ctx.moveTo(pX0, yv(-55)); ctx.lineTo(pX1, yv(-55)); ctx.stroke(); ctx.setLineDash([]);
  text('EŞİK', pX1, yv(-55) - 10, { size: 13, font: MONO, align: 'right', ls: 4, a: .75, color: rgba(C.am, 1) });
  const past = new Path2D(), fut = new Path2D();
  for (let x = pX0; x <= pX1; x += 2) {
    const tv = tau - (curX - x) / pps, v = apV(Math.max(tv, -1)), yy = yv(v);
    if (x <= curX) { x === pX0 ? past.moveTo(x, yy) : past.lineTo(x, yy); }
    else { x <= curX + 2 ? fut.moveTo(x, yy) : fut.lineTo(x, yy); }
  }
  ctx.lineJoin = 'round';
  ctx.strokeStyle = hgrad(pX0, curX, C.cy, [[0, 0], [.5, .7], [1, 1]]);
  ctx.lineWidth = 12; al(.16); ctx.stroke(past); ctx.lineWidth = 2.6; al(1); ctx.stroke(past);
  ctx.strokeStyle = rgba(C.cy, 1); ctx.lineWidth = 1.2; al(.18); ctx.setLineDash([3, 6]); ctx.stroke(fut); ctx.setLineDash([]);
  al(.3); ctx.fillStyle = rgba(C.cy, 1); ctx.fillRect(curX, GY + 100, 1, GH - 140);
  glow(curX, yv(V), 56, vc, .95); ctx.beginPath(); ctx.arc(curX, yv(V), 6.5, 0, TAU); ctx.fillStyle = '#fff'; al(1); ctx.fill();
  ctx.beginPath(); ctx.arc(curX, yv(V), 15, 0, TAU); ctx.strokeStyle = rgba(vc, 1); ctx.lineWidth = 1.5; al(.8); ctx.stroke();

  /* ---- axon ---- */
  const AX = 980, AY = 650, AW = 840, AH = 240;
  panel(AX, AY, AW, AH, 30, 1);
  text('AKSON', AX + 38, AY + 58, { size: 19, font: MONO, ls: 7, a: .85, weight: 500 });
  const ay = AY + 135, a0 = AX + 120, a1 = AX + AW - 110;
  glow(AX + 78, ay, 70, C.vi, .5); ctx.beginPath(); ctx.arc(AX + 78, ay, 24, 0, TAU); ctx.fillStyle = '#e6dcff'; al(.95); ctx.fill();
  for (let i = 0; i < 4; i++) { const a = Math.PI * (.65 + i * .23) ; ctx.beginPath(); ctx.moveTo(AX + 78, ay); ctx.lineTo(AX + 78 + Math.cos(a) * 46, ay + Math.sin(a) * 46 + (i < 2 ? 0 : 0)); ctx.strokeStyle = rgba(C.vi, 1); ctx.lineWidth = 2; al(.7); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(AX + 100, ay); ctx.lineTo(a1 + 40, ay); ctx.strokeStyle = rgba(C.wh, 1); ctx.lineWidth = 2; al(.4); ctx.stroke();
  const nSeg = 6, segW = (a1 - a0) / nSeg;
  for (let i = 0; i < nSeg; i++) { const x = a0 + i * segW + 8; ctx.fillStyle = hgrad(x, x + segW - 16, C.cy, [[0, .14], [1, .06]]); al(1); rr(x, ay - 17, segW - 16, 34, 17); ctx.fill(); ctx.strokeStyle = rgba(C.cy, 1); ctx.lineWidth = 1.2; al(.4); ctx.stroke(); }
  for (let i = 0; i < 3; i++) { const a = (i - 1) * .5; ctx.beginPath(); ctx.moveTo(a1 + 40, ay); ctx.lineTo(a1 + 40 + Math.cos(a) * 52, ay + Math.sin(a) * 52); ctx.strokeStyle = rgba(C.wh, 1); ctx.lineWidth = 2; al(.5); ctx.stroke(); glow(a1 + 40 + Math.cos(a) * 52, ay + Math.sin(a) * 52, 14, C.cy, .6); }
  const prog = clamp((s - .22) / .4);
  if (prog > 0 && prog < 1.0) {
    const px = lerp(a0 - 40, a1 + 40, prog), nodeD = Math.abs(((px - a0) % segW + segW) % segW - segW + 8);
    glow(px, ay, 80, C.am, .95); glow(px, ay, 34, C.wh, .9); ctx.beginPath(); ctx.arc(px, ay, 7, 0, TAU); ctx.fillStyle = '#fff'; al(1); ctx.fill();
    for (let i = 0; i < nSeg; i++) { const x = a0 + i * segW + segW / 2, d = Math.abs(px - x); if (d < segW) { ctx.strokeStyle = rgba(C.am, 1); ctx.lineWidth = 1.6; al(.8 * (1 - d / segW)); rr(a0 + i * segW + 8, ay - 17, segW - 16, 34, 17); ctx.stroke(); } }
  }
  if (prog >= 1) { const q = (s - .62) / .2; if (q < 1) for (let i = 0; i < 3; i++) glow(a1 + 40 + Math.cos((i - 1) * .5) * 52, ay + Math.sin((i - 1) * .5) * 52, 40 * (1 - q) + 14, C.am, .9 * (1 - q)); }
  void ex;
}

/* =============================================================================================
   HUD  +  POST
============================================================================================= */
const CHAPTERS = ['EEG · KAFA DERİSİ ELEKTROTLARI', 'ALFA RİTMİ · 8–13 Hz', 'BBA · 1973', 'SEREBRAL KORTEKS', 'ÖLÇEK · İNSANLAR / NÖRONLAR', 'AKSİYON POTANSİYELİ'];
function hud(alphas) {
  GA = 1; mode('lighter'); ctx.setTransform(U, 0, 0, U, 0, 0);
  const m = 56, L = 34; ctx.strokeStyle = 'rgba(205,224,255,1)'; ctx.lineWidth = 1.4; al(.26);
  ctx.beginPath();
  ctx.moveTo(m, m + L); ctx.lineTo(m, m); ctx.lineTo(m + L, m);
  ctx.moveTo(1920 - m - L, m); ctx.lineTo(1920 - m, m); ctx.lineTo(1920 - m, m + L);
  ctx.moveTo(m, 1080 - m - L); ctx.lineTo(m, 1080 - m); ctx.lineTo(m + L, 1080 - m);
  ctx.moveTo(1920 - m - L, 1080 - m); ctx.lineTo(1920 - m, 1080 - m); ctx.lineTo(1920 - m, 1080 - m - L);
  ctx.stroke();
  alphas.forEach((a, i) => {
    const la = clamp(a * 2 - 1); if (la < .01) return;
    text('0' + (i + 1) + ' / 06', 100, 100, { size: 16, font: MONO, ls: 5, a: .85 * la, color: rgba(C.cy, 1), weight: 500 });
    text(CHAPTERS[i], 236, 100, { size: 16, font: MONO, ls: 5, a: .6 * la });
  });
  alphas.forEach((a, i) => { const x = 960 + (i - 2.5) * 52; ctx.fillStyle = '#e6f1ff'; al(.16 + .84 * a); ctx.fillRect(x - 18, 1030, 36, 3); if (a > .05) glow(x, 1031, 30, C.cy, .6 * a); });
}

const bA = mk(960, 540), bAb = mk(960, 540), bB = mk(240, 135), bBb = mk(240, 135), bC = mk(120, 68), bCb = mk(120, 68);
const bg = [bA, bAb, bB, bBb, bC, bCb].map(c => c.getContext('2d'));
const noise = (() => { const c = mk(256, 256), g = c.getContext('2d'), d = g.createImageData(256, 256), r = mulberry32(99); for (let i = 0; i < d.data.length; i += 4) { const v = 118 + r() * 20 | 0; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); return c; })();
const noisePat = ctx.createPattern(noise, 'repeat');
let vigGrad = null;

function post(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); GA = 1;
  const [a, ab, b, bb, c, cb] = bg;
  a.filter = 'contrast(1.55)'; a.globalCompositeOperation = 'copy'; a.drawImage(cv, 0, 0, 960, 540); a.filter = 'none';
  ab.filter = 'blur(5px)'; ab.globalCompositeOperation = 'copy'; ab.drawImage(bA, 0, 0); ab.filter = 'none';
  b.globalCompositeOperation = 'copy'; b.drawImage(bA, 0, 0, 240, 135);
  bb.filter = 'blur(3px)'; bb.globalCompositeOperation = 'copy'; bb.drawImage(bB, 0, 0); bb.filter = 'none';
  c.globalCompositeOperation = 'copy'; c.drawImage(bB, 0, 0, 120, 68);
  cb.filter = 'blur(3px)'; cb.globalCompositeOperation = 'copy'; cb.drawImage(bC, 0, 0); cb.filter = 'none';
  ab.globalCompositeOperation = 'lighter'; ab.imageSmoothingQuality = 'high';
  ab.globalAlpha = 1; ab.drawImage(bBb, 0, 0, 960, 540); ab.globalAlpha = .9; ab.drawImage(bCb, 0, 0, 960, 540); ab.globalAlpha = 1;
  mode('lighter'); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.globalAlpha = .56; ctx.drawImage(bAb, 0, 0, W, H);
  // vignette
  mode('source-over'); ctx.globalAlpha = 1;
  if (!vigGrad) { vigGrad = ctx.createRadialGradient(W / 2, H / 2, H * .42, W / 2, H / 2, H * .98); vigGrad.addColorStop(0, 'rgba(2,3,8,0)'); vigGrad.addColorStop(1, 'rgba(2,3,8,.62)'); }
  ctx.fillStyle = vigGrad; ctx.fillRect(0, 0, W, H);
  // gentle film grain (also fights banding in the dark gradients after video encoding)
  const fi = Math.floor(t * 60), ox = Math.floor(h1(fi * 1.37) * 256), oy = Math.floor(h1(fi * 2.11 + 4) * 256);
  noisePat.setTransform(new DOMMatrix().translate(ox, oy).scale(2));
  mode('overlay'); ctx.globalAlpha = .06; ctx.fillStyle = noisePat; ctx.fillRect(0, 0, W, H);
  mode('source-over'); ctx.globalAlpha = 1;
}

/* =============================================================================================
   TIMELINE
============================================================================================= */
const SEG = {            // [fadeIn start, fadeIn end, fadeOut start, fadeOut end]
  A: [-.6, 0, 2.4, 2.9], B: [2.4, 2.9, 4.6, 5.1], C: [4.6, 5.1, 7.0, 7.5],
  D: [7.0, 7.5, 9.2, 9.7], E: [9.2, 9.7, 11.4, 11.9], F: [11.4, 11.9, 14.4, 15.0]
};
const segA = (s, t) => sstep(s[0], s[1], t) * (1 - sstep(s[2], s[3], t));

function scene(fn, key, t, local) {
  const s = SEG[key], a0 = segA(s, local), a = Math.pow(a0, 1.7);
  if (a < .003) return a0;
  const pe = clamp((local - s[0]) / (s[1] - s[0])), px = clamp((local - s[2]) / (s[3] - s[2]));
  const sc = 1 + .03 * (1 - eout(pe)) - .02 * eio(px);
  ctx.save(); ctx.setTransform(U, 0, 0, U, 0, 0);
  ctx.translate(960, 540); ctx.scale(sc, sc); ctx.translate(-960, -540);
  GA = a; mode('lighter'); fn();
  ctx.restore(); GA = 1;
  return a0;
}

function draw(t) {
  t = ((t % DUR) + DUR) % DUR;
  drawBG(t);
  const tA = t > 7 ? t - DUR : t;                               // beat A also fades IN across the loop seam
  const al_ = [
    scene(() => beatA(tA), 'A', t, tA),
    scene(() => beatB(t - SEG.B[0], t), 'B', t, t),
    scene(() => beatC(t - SEG.C[0]), 'C', t, t),
    scene(() => beatD(t - SEG.D[0], t), 'D', t, t),
    scene(() => beatE(t - SEG.E[0]), 'E', t, t),
    scene(() => beatF(t - SEG.F[0], t), 'F', t, t)
  ];
  hud(al_);
  post(t);
}

/* =============================================================================================
   RUN  -  autoplays from frame 0, loops forever
============================================================================================= */
window.renderAt = draw; window.DURATION = DUR;
draw(qs.has('t') ? parseFloat(qs.get('t')) : 0);
if (!qs.has('t')) {
  let t0 = null;
  const tick = ts => { if (t0 === null) t0 = ts; draw(((ts - t0) / 1000) % DUR); requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
})();
</script>
