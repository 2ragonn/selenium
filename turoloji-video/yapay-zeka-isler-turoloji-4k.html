  else if (NOW < s196) { const k = 1 + .08 * Math.sin((NOW - s195) * 10); L('KENDİNE', 760, s195 + .02, { size: 260, col: '#fff' }); L('İYİ BAK', 1020, s195 + .2, { size: 300, col: C.pink }); ctx.save(); ctx.translate(1700, 1600); ctx.scale(k, k); ico('heart', 0, 0, 280, { col: C.pink, lw: 1.5, glow: 60, fill: rgba(C.pink, .25) }); ctx.restore(); }
  else { const p = pr(NOW, s196, s196 + .35, E.o5); ctx.save(); ctx.globalAlpha = p; drawLogoMark(560, 1000, 420 * (.8 + .2 * p), { glow: 120 }); T(BRAND, 260, 1480, { size: 280, col: '#fff', sp: 14, grad: [C.cya, '#fff', C.vio2] }); T('ile kal.', 260, 1680, { size: 150, fam: 'i', wt: 600, col: C.mute }); ctx.restore(); }

/* ============================================================
   BOOT — autoplays once on load, holds the last frame at the end
   ============================================================ */
(function () {
  // sort + fill any gaps so that no scene is ever blank
  SHOTS.sort((a, b) => a.a - b.a);
  const filled = []; let next = 1;
  const fallback = (a, b) => ({ a, b, mood: 'neutral', tr: { k: 'fade', d: .25 }, bg: {}, s: S[a].s, e: S[b].e, cam: 1, o: {}, fn: () => {
    const n = (() => { for (let i = a; i <= b; i++) if (NOW >= S[i].s && NOW < S[i].e) return i; return b; })();
    const lines = wrap(S[n].tx, 3000, 150, 700); lines.forEach((l, i) => T(l, CX, CY - (lines.length - 1) * 90 + i * 180, { size: 150, align: 'center', base: 'middle' }));
    T('SAHNE ' + n, CX, 300, { size: 50, align: 'center', col: C.mute, fam: 'i' });
  } });
  SHOTS.forEach(sh => { if (sh.a > next) { filled.push(fallback(next, sh.a - 1)); console.warn('uncovered scenes', next, sh.a - 1); } filled.push(sh); next = sh.b + 1; });
  if (next <= 196) { filled.push(fallback(next, 196)); console.warn('uncovered scenes', next, 196); }
  SHOTS.length = 0; filled.forEach(s => SHOTS.push(s));

  let t0 = 0, manual = false; const T0 = parseFloat(QS.get('t') || '0');
  window.__duration = DUR; window.__done = false; window.__ready = false;
  window.seek = t => { manual = true; render(t); return t; };
  window.__shots = SHOTS.map(s => [s.a, s.b, s.s, s.e]);
  let gen = 0, frames = 0;
  function loop(g) {
    if (manual || g !== gen) return;
    const t = (performance.now() - t0) / 1000 + T0;
    render(t); window.__t = t; window.__frames = ++frames; if (t >= DUR) window.__done = true;
    requestAnimationFrame(() => loop(g));
  }
  addEventListener('keydown', e => { if (e.key === 'r' || e.key === 'R') { manual = false; t0 = performance.now(); window.__done = false; frames = 0; gen++; loop(gen); } });
  function fit() { const k = Math.min(innerWidth / W, innerHeight / H); document.getElementById('stage').style.transform = `translate(-50%,-50%) scale(${k})`; }
  addEventListener('resize', fit); fit();
  const txt = 'ĞÜŞİÖÇğüşıöç₺0123456789 %−≠→';
  const loads = ['700 100px "Space Grotesk"', '500 100px "Space Grotesk"', '400 100px "Inter"', '600 100px "Inter"', '800 100px "Inter"'].map(f => document.fonts.load(f, txt).catch(() => 0));
  Promise.race([Promise.all(loads), new Promise(r => setTimeout(r, 2500))]).then(() => {
    render(T0); window.__ready = true;
    if (QS.get('manual') === '1') { manual = true; return; }
    t0 = performance.now(); gen++; loop(gen);
  });
})();
