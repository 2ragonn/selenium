[0.0,3.36,"İsekay kahramanlarının bir listesini yapsak,"],
[3.36,5.56,"çoğunun elinde bir kılıç olur."],
[5.56,7.38,"Bazılarının sihir yeteneği,"],
[7.38,9.86,"bazılarının bir sistem ekranı."],
[9.86,13.92,"Bugün konuşacağımız adamın elinde bir diploma var."],
[13.92,16.16,"İnşaat mühendisliği diploması."],
[16.16,17.14,"Hepsi bu."],
[17.14,19.48,"Ve size şunu iddia edeceğim,"],
[19.48,25.02,"bu, bugüne kadar yazılmış en gerçekçi İsekay güç fantazisi."],
[25.02,26.22,"Şaka yapmıyorum."],
[26.22,29.12,"Videonun ortasında size tarihten bir rakam vereceğim."],
[29.12,31.46,"Ve o rakamı duyduğunuzda,"],
[31.46,32.94,"modern bir mühendisin,"],
[32.94,38.18,"ortaçağ dünyasında neden gerçekten tanrı gibi görüneceğini anlayacaksınız."],
[38.18,40.42,"Sihirle hiçbir ilgisi yok."],
[40.42,42.66,"Bu videoda dört şey yapacağız."],
[42.66,45.56,"Birincisi, bu adamın yaptığı mühendislik işlerinin"],
[45.56,48.78,"gerçekten işe yarayıp yaramayacağını kontrol edeceğiz."],
[48.78,53.64,"Bu bölüm videonun en uzun kısmı olacak ve bence en ilginç kısmı."],
[53.64,58.42,"İkincisi, bu seriyi anlamak için bilmeniz gereken tür ayrımlarını netleştireceğiz."],
[58.42,63.16,"Çünkü İsekay'ı, regresyon ve romana düşmek aynı şey değil."],
[63.16,66.12,"Ve neredeyse herkes bunları karıştırıyor."],
[66.12,71.52,"Üçüncüsü, geçen videoda konuştuğumuz Solo Leveling ile bu seriyi karşılaştıracağız."],
[71.52,78.26,"İkisi de Kore çıkışlı, ikisi de devasa başarı ve ikisi de tam olarak birbirinin zıttı."],
[78.26,82.36,"Dördüncüsü, bu serinin çoğu okurun bilmediği bir sırrı var."],
[82.36,83.82,"Sonunda anlatacağım."],
[83.82,85.76,"Ve bir de kişisel bir bölüm olacak."],
[85.76,90.04,"Çünkü ben bu hikayenin baş karakterini gerçekten çok seviyorum."],
[90.04,92.62,"Ve nedenini anlatmak istiyorum."],
[92.62,95.02,"Bu kanalın adı Değişik Sesler."],
[95.02,99.18,"Burada hikayeleri anlatıyor ve içlerinde ne olduğuna bakıyoruz."],
[99.18,102.62,"Beğendiyseniz abone olun. Bir saniyeniz alır."],
[102.62,104.12,"Başlayalım."],
[104.12,106.62,"Önce hiç bilmeyenler için kurulum."],
[106.62,110.12,"Serinin adı The Greatest Estate Developer."],
[110.12,111.46,"Kore kökenli."],
[111.46,113.2,"Önce bir web romanı olarak çıktı."],
[113.2,115.78,"Yazarı B.K. Moon."],
[115.78,122.18,"Naver'ın web roman platformunda 2019'un Haziran ayında başladı ve 2020 Kasım'da bitti."],
[122.18,124.5,"Sonra Webtoon uyarlaması geldi."],
[124.5,128.56,"2021'in Ağustos ayında Naver Webtoon'da yayına başladı."],
[128.56,130.58,"Uyarlamayı Lee Hyun Min yaptı."],
[130.58,133.3,"Çizimler Kim Hyun Soo'ya ait."],
[133.3,134.76,"Hikaye şöyle."],
[134.76,137.44,"Suho Kim adında bir üniversite öğrencisi var."],
[137.44,139.18,"İnşaat mühendisliği okuyor."],
[139.18,141.5,"Parası yok, borcu var, hayatı zor."],
[141.5,145.84,"Her gece bir fantastik roman okuyarak uyuyor."],
[145.84,149.5,"Ve bir sabah o romanın içinde uyanıyor."],
[149.5,152.52,"Girdiği beden Lloyd Frontera'ya ait."],
[152.52,156.56,"Lloyd, romanın en berbat yan karakterlerinden biri."],
[156.56,160.1,"Tembel, öfkeli, sürekli içen bir asilzade."],
[160.1,164.3,"Ve ailesi devasa bir borcun altında batmak üzere."],
[164.3,169.2,"Yani Suho fakirlikten kaçmaya çalışırken daha büyük bir borcun içine uyanıyor."],
[169.2,171.84,"Ama bir şey var."],
[171.84,173.62,"Mühendislik bilgisi."],
[173.62,176.78,"Ve serinin tamamı bunun üzerine kurulu."],
[176.78,181.88,"Bu adam kılıç sallamıyor, büyü öğrenmiyor, seviye atlamıyor."],
[181.88,183.68,"İnşaat yapıyor."],
[183.68,188.76,"Şimdi kişisel bölüme geçeyim çünkü sonraya bırakırsam kendimi tutamayacağım."],
[188.76,190.88,"Ben Lloyd'i çok seviyorum."],
[190.88,192.24,"Ve nedenini anlatayım."],
[192.24,195.12,"Çünkü bence bu karakterin başarısı tesadüf değil."],
[195.12,199.3,"İsekay kahramanları genelde iki tipten biridir."],
[199.3,203.26,"Birinci tip, soğuk, sakin, güçlü."],
[203.26,205.1,"Az konuşur, çok yener."],
[205.1,206.24,"Havalıdır."],
[206.24,208.86,"İkinci tip, tamamen boş bir kap."],
[208.86,213.64,"Okur'un kendini yerleştirmesi için kişiliği bilerek silinmiş bir karakter."],
[213.64,215.68,"Lloyd hiçbiri değil."],
[215.68,221.14,"Lloyd panikliyor, şikayet ediyor, açgözlü, kısa yoldan zengin olmaya çalışıyor, övünüyor,"],
[221.14,224.54,"işler ters gidince bağırıyor, yalan söylüyor."],
[224.54,228.78,"Ve bütün bunları yaparken bir yandan da gerçekten yetenekli."],
[228.78,231.2,"Yani gerçek bir insana benziyor."],
[231.2,236.62,"Sizinle tartışmayı kaybedecek ama sonra size çalışan bir kanalizasyon sistemi kuracak biri."],
[236.62,239.78,"Ve asıl sevdiğim şey şu."],
[239.78,242.62,"Lloyd sıkıcı şeyler için heyecanlanıyor."],
[242.62,245.36,"Drenajdan bahsederken gözleri parlıyor."],
[245.36,247.28,"Zemin etüdü yaparken keyif alıyor."],
[247.28,253.86,"Bir yolun kaç katmandan oluşması gerektiğini anlatırken gerçekten mutlu."],
[253.86,255.7,"Kurguda bu çok nadir bir şey."],
[255.7,260.04,"Genelde kahramanlar büyük ve görkemli şeyler için heyecanlanır."],
[260.04,263.0,"Lloyd kanalizasyon için heyecanlanıyor."],
[263.0,265.32,"Ve o heyecan bulaşıcı."],
[265.32,268.62,"Bu serinin asıl sihri bence bu."],
[268.62,270.5,"Tamam, devam edelim."],
[270.5,273.1,"Şimdi videonun asıl kısmı."],
[273.1,275.34,"Bu mühendislik gerçekten işe yarar mı?"],
[275.34,278.64,"Önce size o rakamı vereyim."],
[278.64,281.42,"Roma İmparatorluğu beton kullanıyordu."],
[281.42,283.14,"Gerçek anlamda beton."],
[283.14,286.6,"Kireç ile volkanik külü karıştırarak yaptıkları bir karışım."],
[286.6,290.16,"Bu karışım su altında bile sertleşebiliyordu."],
[290.16,292.9,"Panteonun kubbesi bu betondan yapıldı."],
[292.9,294.5,"2000 yıl önce."],
[294.5,296.98,"Ve hala ayakta."],
[296.98,298.9,"Sonra Batı Roma çöktü."],
[298.9,301.24,"Ve beton kayboldu."],
[301.24,303.26,"Yapım bilgisi aktarılmadı."],

/* =====================================================================
   BAŞLATMA: yazı tipleri hazır olunca otomatik oynar (bir kez), son karede durur.
   ===================================================================== */
(function(){
  function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.transform=`translate(${(innerWidth-W*s)/2}px,${(innerHeight-H*s)/2}px) scale(${s})`;}
  addEventListener('resize',fit);fit();
  mkGrain();
  // editoryal fotoğraflar (opsiyonel; yüklenemezse çizimler tek başına yeterli)
  loadWiki('pantheon','Pantheon,_Rome');
  loadWiki('aqueduct','Pont_du_Gard');
  loadWiki('sewer','Cloaca_Maxima');
  loadWiki('road','Appian_Way');
  loadWiki('pisa','Leaning_Tower_of_Pisa');
  loadWiki('castle','Carcassonne');
  loadWiki('vesuvius','Mount_Vesuvius');
  loadWiki('colosseum','Colosseum');

  const START=Math.max(0,+(Q.get('t0')||0));let t0=null,manual=false,curT=0,started=false;window.__frames=0;
  window.DURATION=DUR;window.SCENES=SC;window.__ready=false;window.__done=false;
  window.seek=function(t){manual=true;curT=t;render(t);};
  window.play=function(){manual=false;t0=null;};
  window.render=render;
  function loop(now){
    if(!manual){
      if(t0===null)t0=now;
      curT=(now-t0)/1000+START;
      if(curT>=DUR){curT=DUR;window.__done=true;}
      render(curT);window.__frames++;
    }
    if(!window.__done||manual)requestAnimationFrame(loop);
  }
  function go(){if(started)return;started=true;window.__ready=true;render(0);requestAnimationFrame(loop);}
  const fonts=['400 100px Anton','400 100px Bangers','800 100px "Baloo 2"','600 100px "Baloo 2"','700 100px "Chakra Petch"'];
  const sample='İıĞğŞşÇçÖöÜü ABC';
  const wait=Promise.all(fonts.map(f=>document.fonts.load(f,sample).catch(()=>{})));
  Promise.race([wait,new Promise(r=>setTimeout(r,2500))]).then(go,go);
})();
</script>
