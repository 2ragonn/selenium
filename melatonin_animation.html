<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Screens, Melatonin &amp; the Hormone of Darkness — 4K Animation</title>
<meta name="viewport" content="width=3840,height=2160">
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#04060f;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas#c{width:100vw;height:100vh;display:block;background:#04060f}
</style>
</head>
<body>
<canvas id="c" width="3840" height="2160"></canvas>
<script>
/* =====================================================================
   SCREENS & MELATONIN — a 9:43 synchronized explainer animation
   3840 x 2160, pure Canvas 2D, autoplays, time-driven (performance.now)
   Optional: append ?t=120 to the URL to start at 120 s (for previews).
   ===================================================================== */
'use strict';
const W=3840,H=2160,CX=W/2,CY=H/2;
const cv=document.getElementById('c');
let ctx=cv.getContext('2d',{alpha:false});const MAIN=ctx;const OFF=document.createElement('canvas');OFF.width=W;OFF.height=H;const OCTX=OFF.getContext('2d');
// draw a module through an offscreen buffer so it can be faded as a whole
function drawVia(fn,alpha){if(alpha>=1){fn();return}ctx=OCTX;OCTX.setTransform(1,0,0,1,0,0);OCTX.globalAlpha=1;OCTX.clearRect(0,0,W,H);try{fn()}finally{ctx=MAIN}MAIN.save();MAIN.setTransform(1,0,0,1,0,0);MAIN.globalAlpha=alpha;MAIN.drawImage(OFF,0,0);MAIN.restore()}
const FONT='"Inter","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
const MONO='"JetBrains Mono","SF Mono","Cascadia Code",Consolas,monospace';

/* ---------- palette ---------- */
const WHITE='#f5f7ff', INK='#060915', MUTED='rgba(245,247,255,0.55)', DIM='rgba(245,247,255,0.28)';
const AMBER='#ffb547', GOLD='#ffd37a', ORANGE='#ff7b2e', WARM='#ff9a3c';
const BLUE='#3b8cff', CYAN='#4fe3ff', ICE='#bfe6ff', VIOLET='#8b6cff';
const GREEN='#45e08a', RED='#ff5a6e', PINK='#ff7ab6';
const rgba=(hex,a)=>{const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`};

/* ---------- math ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v, sat=v=>clamp(v,0,1), lerp=(a,b,t)=>a+(b-a)*t;
const ramp=(t,a,b)=>sat((t-a)/(b-a));
const eo=t=>1-Math.pow(1-sat(t),3), ei=t=>Math.pow(sat(t),3);
const eio=t=>{t=sat(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const eo5=t=>1-Math.pow(1-sat(t),5);
const back=t=>{t=sat(t);const c=1.70158,c3=c+1;return 1+c3*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const elastic=t=>{t=sat(t);return t===0||t===1?t:Math.pow(2,-10*t)*Math.sin((t*10-.75)*(2*Math.PI/3))+1};
const pulse=(t,f=1,ph=0)=>.5+.5*Math.sin((t*f+ph)*Math.PI*2);
const TAU=Math.PI*2;
let seed=1;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
function hash(n){const s=Math.sin(n*12.9898+78.233)*43758.5453;return s-Math.floor(s)}
// smooth 1D noise
function noise1(x){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hash(i),hash(i+1),u)*2-1}

/* ---------- shape helpers ---------- */
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.closePath()}
function line(x1,y1,x2,y2,color,w=4,alpha=1,cap='round'){ctx.save();ctx.globalAlpha*=alpha;ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap=cap;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore()}
function glow(x,y,r,color,a=1,inner=0){const g=ctx.createRadialGradient(x,y,r*inner,x,y,r);g.addColorStop(0,rgba(color,a));g.addColorStop(.35,rgba(color,a*.35));g.addColorStop(1,rgba(color,0));ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)}
function card(x,y,w,h,o={}){ctx.save();const r=o.r??48;ctx.globalAlpha*=o.alpha??1;
  if(o.shadow!==false){ctx.shadowColor='rgba(0,0,0,0.55)';ctx.shadowBlur=70;ctx.shadowOffsetY=24}
  rr(x,y,w,h,r);ctx.fillStyle=o.fill||'rgba(14,20,44,0.78)';ctx.fill();ctx.shadowColor='transparent';
  const g=ctx.createLinearGradient(x,y,x,y+h);g.addColorStop(0,'rgba(255,255,255,0.07)');g.addColorStop(1,'rgba(255,255,255,0.015)');ctx.fillStyle=g;ctx.fill();
  ctx.lineWidth=o.lw||3;ctx.strokeStyle=o.stroke||'rgba(255,255,255,0.14)';ctx.stroke();
  if(o.accent){ctx.save();ctx.clip();ctx.fillStyle=o.accent;ctx.fillRect(x,y,w,10);ctx.restore()}
  ctx.restore()}
function arrow(x1,y1,x2,y2,o={}){const p=sat(o.p??1);if(p<=0)return;const col=o.color||WHITE,w=o.w||10;
  const bend=o.bend||0;const mx=(x1+x2)/2+bend*(y1-y2)*.5,my=(y1+y2)/2+bend*(x2-x1)*.5;
  const pt=s=>{const a=lerp(x1,mx,s),b=lerp(mx,x2,s),c=lerp(y1,my,s),d=lerp(my,y2,s);return [lerp(a,b,s),lerp(c,d,s)]};
  ctx.save();ctx.globalAlpha*=o.alpha??1;ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';
  if(o.glow){ctx.shadowColor=col;ctx.shadowBlur=30}
  if(o.dash){ctx.setLineDash(o.dash);ctx.lineDashOffset=-(o.t||0)*300}
  ctx.beginPath();const N=24;for(let i=0;i<=N;i++){const [px,py]=pt(p*i/N);i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.stroke();
  const [hx,hy]=pt(p),[bx,by]=pt(Math.max(0,p-.02));const ang=Math.atan2(hy-by,hx-bx),hs=(o.head||w*3.2);
  ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(hx+Math.cos(ang)*hs*.6,hy+Math.sin(ang)*hs*.6);
  ctx.lineTo(hx+Math.cos(ang+2.5)*hs,hy+Math.sin(ang+2.5)*hs);ctx.lineTo(hx+Math.cos(ang-2.5)*hs,hy+Math.sin(ang-2.5)*hs);ctx.closePath();ctx.fill();ctx.restore()}

/* ---------- text ---------- */
function font(size,weight=700,fam=FONT){ctx.font=`${weight} ${size}px ${fam}`}
function txt(s,x,y,size,o={}){ctx.save();ctx.globalAlpha*=o.alpha??1;font(size,o.weight??700,o.mono?MONO:FONT);
  ctx.textAlign=o.align||'center';ctx.textBaseline=o.base||'middle';
  if(o.ls){ctx.letterSpacing=o.ls+'px'}
  if(o.glow){ctx.shadowColor=o.glow;ctx.shadowBlur=o.blur||50}
  if(o.stroke){ctx.lineWidth=o.lw||6;ctx.strokeStyle=o.stroke;ctx.strokeText(s,x,y)}
  ctx.fillStyle=o.color||WHITE;ctx.fillText(s,x,y);ctx.restore()}
function measure(s,size,weight=700,fam=FONT){font(size,weight,fam);return ctx.measureText(s).width}
function wrapLines(s,maxW,size,weight=700){font(size,weight);const words=s.split(' '),lines=[];let cur='';
  for(const w of words){const test=cur?cur+' '+w:w;if(ctx.measureText(test.replace(/\*/g,'')).width>maxW&&cur){lines.push(cur);cur=w}else cur=test}
  if(cur)lines.push(cur);return lines}
// big kinetic headline: words rise in one after another
function headline(s,x,y,size,o={}){const p=sat(o.p??1),lines=wrapLines(s,o.maxW||3000,size,o.weight||800);
  const lh=size*(o.lh||1.08);let idx=0;const total=lines.reduce((a,l)=>a+l.split(' ').length,0);
  const y0=y-(lines.length-1)*lh/2;
  lines.forEach((ln,li)=>{const words=ln.split(' ');font(size,o.weight||800);const widths=words.map(w=>ctx.measureText(w.replace(/\*/g,'')).width);
    const sp=size*.26;const lw=widths.reduce((a,b)=>a+b,0)+sp*(words.length-1);let cx=(o.align==='left'?x:x-lw/2);
    words.forEach((w,wi)=>{const wp=ramp(p,idx/total*.75,idx/total*.75+.25);idx++;const hl=w.startsWith('*')&&w.length>1;const clean=w.replace(/\*/g,'');
      const e=eo5(wp);ctx.save();ctx.globalAlpha*=e*(o.alpha??1);
      const dy=(1-e)*size*.5;ctx.translate(cx+widths[wi]/2,y0+li*lh+dy);
      if(o.glow||hl){ctx.shadowColor=hl?(o.hlGlow||o.hl||AMBER):o.glow;ctx.shadowBlur=o.blur||40}
      font(size,o.weight||800);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=hl?(o.hl||AMBER):(o.color||WHITE);ctx.fillText(clean,0,0);ctx.restore();
      cx+=widths[wi]+sp})})}
function pill(x,y,s,o={}){const size=o.size||44;font(size,o.weight||700);const w=ctx.measureText(s).width+size*1.4,h=size*1.9;ctx.save();ctx.globalAlpha*=o.alpha??1;
  const px=o.align==='left'?x:x-w/2;rr(px,y-h/2,w,h,h/2);ctx.fillStyle=o.fill||rgba(o.color||WHITE,0.12);ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=rgba(o.color||WHITE,0.45);ctx.stroke();
  txt(s,px+w/2,y+2,size,{color:o.color||WHITE,weight:o.weight||700});ctx.restore();return w}
function tag(x,y,s,o={}){ctx.save();ctx.globalAlpha*=o.alpha??1;txt(s,x,y,o.size||40,{color:o.color||MUTED,weight:600,ls:8,align:o.align||'center'});ctx.restore()}
function counter(v,dec=0){return v.toLocaleString('en-US',{maximumFractionDigits:dec,minimumFractionDigits:dec})}

/* ---------- background ---------- */
const STARS=[];for(let i=0;i<420;i++)STARS.push({x:rnd()*W,y:rnd()*H,r:rnd()*2.2+.6,ph:rnd()*TAU,sp:rnd()*.6+.2});
const grain=document.createElement('canvas');grain.width=grain.height=512;{const g=grain.getContext('2d'),d=g.createImageData(512,512);for(let i=0;i<d.data.length;i+=4){const v=rnd()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}g.putImageData(d,0,0)}
let bgTint={c:BLUE,a:.16}, bgTarget={c:BLUE,a:.16};
function drawBG(t,warmth=0){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#070a1c');g.addColorStop(.55,'#070b1f');g.addColorStop(1,'#03040c');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // drifting aurora blobs (cool + a warm one that strengthens with warmth)
  ctx.save();ctx.globalCompositeOperation='screen';
  glow(W*.22+Math.sin(t*.11)*300,H*.3+Math.cos(t*.13)*180,1500,'#1a2a7a',.42);
  glow(W*.8+Math.sin(t*.09+2)*320,H*.72+Math.cos(t*.1)*160,1600,'#2b1a66',.36);
  glow(W*.5+Math.sin(t*.07+4)*500,H*1.05,1900,'#ff8a2a',.08+.3*warmth);
  ctx.restore();
  ctx.fillStyle=WHITE;for(const s of STARS){const a=.25+.55*pulse(t,s.sp,s.ph);ctx.globalAlpha=a*.6;circ(s.x,s.y+((t*8*s.sp)%40)-20,s.r);ctx.fill()}ctx.globalAlpha=1;
  // faint grid
  ctx.save();ctx.strokeStyle='rgba(255,255,255,0.028)';ctx.lineWidth=2;ctx.beginPath();for(let x=0;x<=W;x+=240){ctx.moveTo(x,0);ctx.lineTo(x,H)}for(let y=0;y<=H;y+=240){ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke();ctx.restore();
}
function drawPost(t){
  // vignette
  const v=ctx.createRadialGradient(CX,CY,H*.35,CX,CY,H*1.05);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,0.62)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  // film grain
  ctx.save();ctx.globalAlpha*=.045;ctx.globalCompositeOperation='overlay';const ox=Math.floor(hash(Math.floor(t*60))*512),oy=Math.floor(hash(Math.floor(t*60)+7)*512);
  ctx.translate(-ox,-oy);ctx.fillStyle=ctx.createPattern(grain,'repeat');ctx.fillRect(0,0,W+512,H+512);ctx.restore();
}

/* =====================================================================
   ICON / OBJECT LIBRARY  (all drawn around (x,y), scale s)
   ===================================================================== */
function drawPhone(x,y,w,h,o={}){ctx.save();ctx.translate(x,y);ctx.rotate(o.rot||0);const r=w*.14;
  if(o.glowColor){ctx.save();ctx.globalCompositeOperation='screen';glow(0,0,Math.max(w,h)*(o.glowR||1.4),o.glowColor,(o.glowA??.55));ctx.restore()}
  ctx.shadowColor='rgba(0,0,0,0.6)';ctx.shadowBlur=60;rr(-w/2,-h/2,w,h,r);ctx.fillStyle='#0b0e1a';ctx.fill();ctx.shadowColor='transparent';
  ctx.lineWidth=w*.02;ctx.strokeStyle='rgba(255,255,255,0.22)';ctx.stroke();
  const b=w*.05,sw=w-2*b,sh=h-2*b;rr(-sw/2,-sh/2,sw,sh,r*.8);
  const sc=o.screen||'#0a0d18';if(typeof sc==='string')ctx.fillStyle=sc;else{const g=ctx.createLinearGradient(0,-sh/2,0,sh/2);g.addColorStop(0,sc[0]);g.addColorStop(1,sc[1]);ctx.fillStyle=g}ctx.fill();
  if(o.content){ctx.save();rr(-sw/2,-sh/2,sw,sh,r*.8);ctx.clip();o.content(sw,sh);ctx.restore()}
  // notch
  rr(-w*.16,-sh/2+w*.03,w*.32,w*.07,w*.035);ctx.fillStyle='#0b0e1a';ctx.fill();ctx.restore()}
// scrolling social feed used inside phones
function feed(sw,sh,t,warm=0){const cardH=sh*.22,gap=sh*.03,off=(t*sh*.25)%(cardH+gap);
  for(let i=-1;i<6;i++){const y=-sh/2+i*(cardH+gap)-off+sh*.1;ctx.fillStyle=warm?'rgba(255,170,90,0.14)':'rgba(255,255,255,0.09)';rr(-sw*.42,y,sw*.84,cardH,sw*.05);ctx.fill();
    ctx.fillStyle=warm?'rgba(255,190,120,0.35)':'rgba(255,255,255,0.3)';circ(-sw*.32,y+cardH*.22,sw*.06);ctx.fill();
    for(let k=0;k<3;k++){rr(-sw*.22,y+cardH*.12+k*cardH*.14,sw*(k?0.45:0.3),cardH*.07,20);ctx.fill()}
    rr(-sw*.38,y+cardH*.5,sw*.76,cardH*.42,sw*.03);ctx.fillStyle=warm?rgba(ORANGE,.25):rgba(BLUE,.35);ctx.fill()}}
function drawBrain(x,y,s,o={}){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.globalAlpha*=o.alpha??1;const col=o.color||PINK;
  // cerebrum
  ctx.beginPath();ctx.moveTo(-1.05,0.05);ctx.bezierCurveTo(-1.15,-0.6,-0.6,-1.05,0.05,-1.0);ctx.bezierCurveTo(0.7,-1.02,1.2,-0.6,1.15,-0.05);ctx.bezierCurveTo(1.12,0.35,0.85,0.55,0.55,0.6);
  ctx.bezierCurveTo(0.3,0.62,0.1,0.55,-0.1,0.6);ctx.bezierCurveTo(-0.5,0.7,-1.0,0.5,-1.05,0.05);ctx.closePath();
  ctx.fillStyle=o.fill||rgba(col,.12);ctx.fill();ctx.lineWidth=o.lw||0.035;ctx.strokeStyle=o.stroke||rgba(col,.9);if(o.glow){ctx.shadowColor=col;ctx.shadowBlur=o.glow}ctx.stroke();ctx.shadowColor='transparent';
  // cerebellum + stem
  ctx.beginPath();ctx.moveTo(0.55,0.6);ctx.bezierCurveTo(0.95,0.55,1.1,0.85,0.9,1.0);ctx.bezierCurveTo(0.7,1.12,0.45,1.0,0.45,0.78);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0.3,0.75);ctx.bezierCurveTo(0.35,0.95,0.3,1.2,0.4,1.45);ctx.moveTo(0.55,0.72);ctx.bezierCurveTo(0.6,0.95,0.6,1.2,0.65,1.45);ctx.stroke();
  // folds
  ctx.lineWidth=(o.lw||0.035)*.7;ctx.globalAlpha*=.65;ctx.beginPath();
  ctx.moveTo(-0.75,-0.2);ctx.bezierCurveTo(-0.55,-0.5,-0.3,-0.3,-0.2,-0.6);ctx.moveTo(-0.3,0.3);ctx.bezierCurveTo(-0.1,0.0,0.15,0.2,0.3,-0.1);
  ctx.moveTo(0.2,-0.75);ctx.bezierCurveTo(0.4,-0.5,0.6,-0.7,0.8,-0.4);ctx.moveTo(-0.6,0.4);ctx.bezierCurveTo(-0.45,0.25,-0.35,0.4,-0.2,0.3);ctx.moveTo(0.5,0.3);ctx.bezierCurveTo(0.65,0.1,0.85,0.25,0.95,0.05);ctx.stroke();
  ctx.restore();return {px:x+0.22*s,py:y+0.12*s}} // pineal position (center-back)
function drawPineal(px,py,r,a,t){ctx.save();ctx.globalCompositeOperation='screen';glow(px,py,r*(4+pulse(t,1.2)*1.2),AMBER,a*.8);ctx.restore();
  ctx.save();ctx.globalAlpha*=a;ctx.fillStyle=GOLD;ctx.shadowColor=AMBER;ctx.shadowBlur=60;ctx.beginPath();ctx.ellipse(px,py,r*1.15,r*.8,-.5,0,TAU);ctx.fill();ctx.restore()}
function drawEye(x,y,s,o={}){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.globalAlpha*=o.alpha??1;
  // cross-section eyeball, looking left
  ctx.lineWidth=.045;ctx.strokeStyle=o.stroke||'rgba(255,255,255,0.85)';ctx.fillStyle='rgba(255,255,255,0.05)';circ(0,0,1);ctx.fill();ctx.stroke();
  // cornea bulge + lens
  ctx.beginPath();ctx.arc(-0.95,0,0.42,Math.PI*.55,Math.PI*1.45);ctx.stroke();
  ctx.beginPath();ctx.ellipse(-0.7,0,0.13,0.36,0,0,TAU);ctx.fillStyle=rgba(ICE,.5);ctx.fill();ctx.stroke();
  // iris
  ctx.strokeStyle=rgba(CYAN,.9);ctx.lineWidth=.08;ctx.beginPath();ctx.moveTo(-0.84,-0.72);ctx.lineTo(-0.84,-0.38);ctx.moveTo(-0.84,0.72);ctx.lineTo(-0.84,0.38);ctx.stroke();
  // retina (back inner lining) highlighted
  ctx.lineWidth=.1;ctx.strokeStyle=rgba(o.retina||AMBER,o.retinaA??.9);if(o.glow){ctx.shadowColor=o.retina||AMBER;ctx.shadowBlur=40}ctx.beginPath();ctx.arc(0,0,0.9,-Math.PI*.42,Math.PI*.42);ctx.stroke();ctx.shadowColor='transparent';
  // optic nerve
  ctx.lineWidth=.045;ctx.strokeStyle='rgba(255,255,255,0.85)';ctx.beginPath();ctx.moveTo(0.95,0.3);ctx.bezierCurveTo(1.6,0.45,2.1,0.4,2.6,0.4);ctx.moveTo(0.98,0.05);ctx.bezierCurveTo(1.6,0.2,2.1,0.15,2.6,0.15);ctx.stroke();
  ctx.restore()}
function drawClock(x,y,r,o={}){ctx.save();ctx.translate(x,y);ctx.globalAlpha*=o.alpha??1;
  if(o.night){ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,o.night[0],o.night[1]);ctx.closePath();ctx.fillStyle=rgba(VIOLET,.25);ctx.fill()}
  circ(0,0,r);ctx.lineWidth=r*.07;ctx.strokeStyle=o.color||'rgba(255,255,255,0.85)';ctx.fillStyle=o.fill||'rgba(255,255,255,0.04)';ctx.fill();ctx.stroke();
  for(let i=0;i<12;i++){const a=i/12*TAU;line(Math.cos(a)*r*.85,Math.sin(a)*r*.85,Math.cos(a)*r*.93,Math.sin(a)*r*.93,'rgba(255,255,255,0.6)',r*.035)}
  const h=(o.h??22)/12*TAU-Math.PI/2,m=(o.m??0)/60*TAU-Math.PI/2;
  line(0,0,Math.cos(h)*r*.5,Math.sin(h)*r*.5,o.hand||WHITE,r*.08);line(0,0,Math.cos(m)*r*.75,Math.sin(m)*r*.75,o.hand||WHITE,r*.05);
  circ(0,0,r*.06);ctx.fillStyle=o.hand||WHITE;ctx.fill();ctx.restore()}
// melatonin skeletal structure (N-acetyl-5-methoxytryptamine)
const MOL_A=[[0.866,0.5],[0,1],[-0.866,0.5],[-0.866,-0.5],[0,-1],[0.866,-0.5],[1.817,0.809,'N'],[2.405,0],[1.817,-0.809],[2.317,-1.675],[3.317,-1.675],[3.817,-2.541,'N'],[4.817,-2.541],[5.317,-1.675,'O'],[5.317,-3.407],[-1.732,-1.0,'O'],[-2.732,-1.0]];
const MOL_B=[[0,1],[1,2,1],[2,3],[3,4,1],[4,5],[5,0,1],[0,6],[6,7],[7,8,1],[8,5],[8,9],[9,10],[10,11],[11,12],[12,13,1],[12,14],[3,15],[15,16]];
function drawMolecule(x,y,s,rot,o={}){ctx.save();ctx.translate(x,y);ctx.globalAlpha*=o.alpha??1;const p=sat(o.p??1);const col=o.color||AMBER;
  const pts=MOL_A.map(a=>{const ax=a[0]-1.4,ay=a[1]+0.9;const c=Math.cos(rot),sn=Math.sin(rot);return [ (ax*c-ay*sn)*s, (ax*sn+ay*c)*s*(o.squash||1) ]});
