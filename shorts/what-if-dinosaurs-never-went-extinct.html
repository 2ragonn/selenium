<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What If Dinosaurs Never Went Extinct?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#04070b;}
  #stage{position:absolute;left:0;top:0;width:2160px;height:3840px;overflow:hidden;transform-origin:0 0;}
  #c{display:block;width:2160px;height:3840px;}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="2160" height="3840"></canvas></div>
<script>
'use strict';
/* =====================================================================
   WHAT IF DINOSAURS NEVER WENT EXTINCT?  —  9:16 Shorts animation
   2160x3840 · 49.6 s · autoplay · deterministic timeline (seekable)
   COLOR THEORY (complementary + accent):
     Teal / Jade  -> life, ancient jungle, ice, the coexisting future
     Amber / Ember-> asteroid fire, deserts, sunsets, energy
     Coral red    -> danger, predators, conflict (triadic accent)
     Deep teal-black base keeps both hues glowing.
   ===================================================================== */
const W = 2160, H = 3840, CX = W / 2, CY = H / 2, DUR = 49.6;
const PI = Math.PI, TAU = PI * 2;
const cv = document.getElementById('c');
const mainCtx = cv.getContext('2d');
let ctx = mainCtx;

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const st = document.getElementById('stage');
  st.style.transform = `translate(${(innerWidth - W * s) / 2}px,${(innerHeight - H * s) / 2}px) scale(${s})`;
}
addEventListener('resize', fit); fit();

function mk(w = W, h = H) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const buf = mk(), bctx = buf.getContext('2d');
const tb1 = mk(), t1 = tb1.getContext('2d');
const tb2 = mk(), t2 = tb2.getContext('2d');
const scn = mk(), sctx = scn.getContext('2d');

/* ---------- palette ---------- */
const C = {
  void: '#04080C', night: '#071822', deep: '#0B2A33', navy: '#0A1B2E',
  teal: '#16E3CB', tealD: '#0A7C74', jade: '#2BD67B', jungle: '#0E4A38', moss: '#1F7A55',
  amber: '#FFA41B', ember: '#FF6A1A', gold: '#FFD166', coral: '#FF3B5C', blood: '#B3122A',
  ice: '#C9F7FF', frost: '#6FD3FF', sand: '#F4AE62', dune: '#C2602A',
  white: '#FFF8EC', ink: '#05080C', violet: '#5B3CC4'
};

/* ---------- math ---------- */
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  out2: t => 1 - (1 - t) * (1 - t),
  out3: t => 1 - Math.pow(1 - t, 3),
  in3: t => t * t * t,
  in2: t => t * t,
  io3: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  out5: t => 1 - Math.pow(1 - t, 5),
  expo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t <= 0 ? 0 : Math.pow(2, 10 * t - 10),
  back: t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  elastic: t => t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (TAU / 3)) + 1,
  sine: t => -(Math.cos(PI * t) - 1) / 2
};
function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453123; return x - Math.floor(x); };
const noise1 = x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u); };
const fbm = x => noise1(x) * .55 + noise1(x * 2.1 + 9) * .3 + noise1(x * 4.3 + 21) * .15;
const shk = (t, amp, f = 22, seed = 0) => [(noise1(t * f + seed) - .5) * 2 * amp, (noise1(t * f + seed + 57.3) - .5) * 2 * amp];
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
function mixHex(h1, h2, t) {
  const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
  const r = Math.round(lerp(a >> 16 & 255, b >> 16 & 255, t)), g = Math.round(lerp(a >> 8 & 255, b >> 8 & 255, t)), bl = Math.round(lerp(a & 255, b & 255, t));
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | bl).toString(16).slice(1);
}

/* ---------- drawing primitives ---------- */
function linG(x0, y0, x1, y1, stops) { const g = ctx.createLinearGradient(x0, y0, x1, y1); for (const s of stops) g.addColorStop(s[0], s[1]); return g; }
function radG(x, y, r0, r1, stops, x2, y2) { const g = ctx.createRadialGradient(x2 == null ? x : x2, y2 == null ? y : y2, r0, x, y, r1); for (const s of stops) g.addColorStop(s[0], s[1]); return g; }
function bg(stops, x0 = 0, y0 = 0, x1 = 0, y1 = H) { ctx.fillStyle = linG(x0, y0, x1, y1, stops); ctx.fillRect(-400, -400, W + 800, H + 800); }
function fillAll(c, a = 1) { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = a; ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); ctx.restore(); }
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); }
function ell(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, TAU); }
function poly(p) { ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]); for (let i = 1; i < p.length; i++) ctx.lineTo(p[i][0], p[i][1]); ctx.closePath(); }
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function capsule(x1, y1, r1, x2, y2, r2) {
  const a = Math.atan2(y2 - y1, x2 - x1), nx = -Math.sin(a), ny = Math.cos(a);
  ctx.beginPath(); ctx.moveTo(x1 + nx * r1, y1 + ny * r1); ctx.lineTo(x2 + nx * r2, y2 + ny * r2);
  ctx.arc(x2, y2, r2, a + PI / 2, a - PI / 2, true); ctx.lineTo(x1 - nx * r1, y1 - ny * r1);
  ctx.arc(x1, y1, r1, a - PI / 2, a + PI / 2, true); ctx.closePath(); ctx.fill();
}
function chain(pts, rs) { for (let i = 0; i < pts.length - 1; i++) capsule(pts[i][0], pts[i][1], rs[i], pts[i + 1][0], pts[i + 1][1], rs[i + 1]); }
function catmull(p, seg = 6) {
  const o = [];
  for (let i = 0; i < p.length - 1; i++) {
    const p0 = p[Math.max(0, i - 1)], p1 = p[i], p2 = p[i + 1], p3 = p[Math.min(p.length - 1, i + 2)];
    for (let s = 0; s < seg; s++) {
      const t = s / seg, t2 = t * t, t3 = t2 * t;
      const f = (a, b, c, d) => .5 * ((2 * b) + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
      o.push([f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1]), lerp(p1[2], p2[2], t)]);
    }
  }
  o.push(p[p.length - 1]); return o;
}
/* filled organic body from a spine of [x,y,radius] */
function ribbon(sp) {
  const P = catmull(sp, 7), up = [], dn = [];
  for (let i = 0; i < P.length; i++) {
    const a = P[Math.max(0, i - 1)], b = P[Math.min(P.length - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1]; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
    up.push([P[i][0] - dy * P[i][2], P[i][1] + dx * P[i][2]]); dn.push([P[i][0] + dy * P[i][2], P[i][1] - dx * P[i][2]]);
  }
  ctx.beginPath(); ctx.moveTo(up[0][0], up[0][1]);
  for (let i = 1; i < up.length; i++) ctx.lineTo(up[i][0], up[i][1]);
  for (let i = dn.length - 1; i >= 0; i--) ctx.lineTo(dn[i][0], dn[i][1]);
  ctx.closePath(); ctx.fill();
  const e = P[P.length - 1]; circ(e[0], e[1], e[2]); ctx.fill();
  return P;
}

/* ---------- glow sprites ---------- */
const glowCache = {};
function glowSprite(hex) {
  if (glowCache[hex]) return glowCache[hex];
  const c = mk(256, 256), g = c.getContext('2d');
  const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, rgba(hex, 1)); gr.addColorStop(.18, rgba(hex, .55)); gr.addColorStop(.45, rgba(hex, .16)); gr.addColorStop(1, rgba(hex, 0));
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256); return glowCache[hex] = c;
}
function glow(x, y, r, hex, a = 1) {
  if (a <= 0 || r <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha *= a; ctx.drawImage(glowSprite(hex), x - r, y - r, r * 2, r * 2); ctx.restore();
}

/* ---------- star field & particles ---------- */
const STARS = (() => { const r = rng(7), a = []; for (let i = 0; i < 900; i++) a.push({ x: r() * W, y: r() * H, s: r() * r() * 7 + 1.5, p: r() * TAU, c: r() < .12 ? C.amber : r() < .28 ? C.teal : '#ffffff' }); return a; })();
function stars(t, alpha = 1, vy = 0, vx = 0) {
  ctx.save();
  for (const s of STARS) {
    const tw = .5 + .5 * Math.sin(t * 3 + s.p);
    let x = (s.x + vx * t * s.s) % W, y = (s.y + vy * t * s.s) % H; if (x < 0) x += W; if (y < 0) y += H;
    ctx.globalAlpha = alpha * tw; ctx.fillStyle = s.c; ctx.fillRect(x, y, s.s, s.s);
    if (s.s > 6) glow(x, y, s.s * 6, s.c, alpha * tw * .6);
  }
  ctx.restore();
}
function field(t, seed, n, o) {
  const r = rng(seed); ctx.save(); ctx.globalCompositeOperation = o.blend || 'lighter';
  for (let i = 0; i < n; i++) {
    const x0 = r() * W, y0 = r() * H, sz = lerp(o.min || 4, o.max || 14, r() * r()), sp = lerp(.5, 1.5, r()), ph = r() * TAU;
    let x = (x0 + (o.vx || 0) * t * sp + Math.sin(t * (o.wob || 1) + ph) * (o.wa || 20)) % W;
    let y = (y0 + (o.vy == null ? -60 : o.vy) * t * sp) % H; if (x < 0) x += W; if (y < 0) y += H;
    ctx.globalAlpha = (o.a || .8) * (.55 + .45 * Math.sin(t * 2.3 + ph));
    if (o.glow) ctx.drawImage(glowSprite(o.color), x - sz * 4, y - sz * 4, sz * 8, sz * 8);
    else { ctx.fillStyle = o.color; circ(x, y, sz); ctx.fill(); }
  }
  ctx.restore();
}
function speedLines(t, cx, cy, n, color, k = 1, seed = 3) {
  const r = rng(seed); ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = color; ctx.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const a = r() * TAU, sp = lerp(.6, 1.6, r()), off = r(), d = (off + t * sp * 1.3) % 1;
    const r0 = lerp(150, 2900, d * d), len = lerp(200, 900, r()) * k * d;
    ctx.globalAlpha = d * .85 * Math.min(1, k); ctx.lineWidth = lerp(3, 16, r()) * d;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0); ctx.lineTo(cx + Math.cos(a) * (r0 + len), cy + Math.sin(a) * (r0 + len)); ctx.stroke();
  }
  ctx.restore();
}
function hLines(t, color, n, speed, seed = 5, a = .6, y0 = 0, y1 = H) {
  const r = rng(seed); ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = color; ctx.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const y = lerp(y0, y1, r()), len = lerp(200, 1100, r()), sp = lerp(.7, 1.5, r()), off = r() * (W + 2000);
    let x = W + 1000 - ((off + t * speed * sp) % (W + 2200));
    ctx.globalAlpha = a * lerp(.3, 1, r()); ctx.lineWidth = lerp(3, 12, r());
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + len, y); ctx.stroke();
  }
  ctx.restore();
}
/* soft cinematic light leaks */
function leaks(t, a = .35, c1 = C.amber, c2 = C.teal) {
  glow(CX + Math.sin(t * .7) * 900, 700 + Math.cos(t * .5) * 400, 1500, c1, a);
  glow(CX + Math.cos(t * .6) * 900, H - 900 + Math.sin(t * .8) * 400, 1500, c2, a * .8);
}

/* ---------- typography ---------- */
const FD = '"Anton","Bebas Neue",Impact,"Haettenschweiler","Arial Narrow",sans-serif';
const FC = '"Montserrat","Arial Black","Segoe UI Black",Arial,sans-serif';
function TW(str, size, o = {}) { ctx.save(); ctx.font = `${o.weight || ''} ${size}px ${o.font || FD}`; ctx.letterSpacing = (o.ls || 0) + 'px'; const w = ctx.measureText(str).width; ctx.restore(); return w; }
function fitS(str, size, maxW, o = {}) { const w = TW(str, size, o); return w > maxW ? size * maxW / w : size; }
function T(str, x, y, size, o = {}) {
  const a = o.a == null ? 1 : o.a; if (a <= 0) return;
  ctx.save(); ctx.translate(x, y);
  if (o.rot) ctx.rotate(o.rot);
  if (o.sc != null) ctx.scale(o.sc, o.sc);
  if (o.sx != null) ctx.scale(o.sx, 1);
  if (o.skew) ctx.transform(1, 0, o.skew, 1, 0, 0);
  ctx.font = `${o.weight || ''} ${size}px ${o.font || FD}`;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle'; ctx.letterSpacing = (o.ls || 0) + 'px';
  ctx.globalAlpha *= a;
  if (o.shadow !== false) { ctx.shadowColor = o.glow || 'rgba(0,0,0,.55)'; ctx.shadowBlur = o.glow ? (o.gb || 70) : 40; ctx.shadowOffsetY = o.glow ? 0 : 14; }
  if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = o.sw || size * .12; ctx.strokeStyle = o.stroke; ctx.strokeText(str, 0, 0); ctx.shadowColor = 'transparent'; }
  let fill = o.color || C.white;
  if (o.grad) { const m = size * .55; const g = ctx.createLinearGradient(0, -m, 0, m); o.grad.forEach((c, i) => g.addColorStop(i / (o.grad.length - 1), c)); fill = g; }
  ctx.fillStyle = fill; ctx.fillText(str, 0, 0);
  if (o.outline) { ctx.shadowColor = 'transparent'; ctx.lineWidth = o.ow || 6; ctx.strokeStyle = o.outline; ctx.strokeText(str, 0, 0); }
  ctx.restore();
}
/* slam-in: huge -> normal with overshoot */
function slam(str, x, y, size, lt, t0, o = {}) {
  const p = prog(lt, t0, t0 + (o.d || .3)); if (p <= 0) return;
  T(str, x, y, size, { ...o, sc: lerp(o.from || 2.6, 1, E.back(p)) * (o.sc || 1), a: clamp(p * 4) * (o.a == null ? 1 : o.a) });
}
/* per-letter kinetic entrance */
function letters(str, x, y, size, lt, t0, o = {}) {
  ctx.save(); ctx.font = `${o.weight || ''} ${size}px ${o.font || FD}`; ctx.letterSpacing = '0px';
  const ls = o.ls || 0, ch = [...str], ws = ch.map(c => ctx.measureText(c).width + ls), tot = ws.reduce((a, b) => a + b, 0) - ls; ctx.restore();
  let cx = x - tot / 2; const st = o.stagger || .035, d = o.d || .38, mode = o.mode || 'rise';
  ch.forEach((c, i) => {
    const p = prog(lt, t0 + i * st, t0 + i * st + d);
    if (p > 0 && c !== ' ') {
      const e = (o.ease || E.back)(p); let oy = 0, sc = 1, rot = 0;
      if (mode === 'rise') oy = (1 - e) * size * .8;
      else if (mode === 'drop') oy = -(1 - e) * size * 1.3;
      else if (mode === 'pop') sc = Math.max(0.001, e);
      else if (mode === 'spin') { rot = (1 - e) * 1.4; sc = Math.max(0.001, e); }
      const wob = o.wobble ? Math.sin(lt * 9 + i) * o.wobble : 0;
      T(c, cx + (ws[i] - ls) / 2, y + oy + wob, size, { ...o, ls: 0, sc, rot, align: 'center', a: clamp(p * 3) * (o.a == null ? 1 : o.a) });
    }
    cx += ws[i];
  });
}
const GLY = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&@$?!';
function scramble(str, lt, t0, dur) {
  const p = prog(lt, t0, t0 + dur); let out = '';
  for (let i = 0; i < str.length; i++) {
    if (str[i] === ' ' || p >= (i / str.length) * .75 + .25) out += str[i];
    else out += GLY[Math.floor(hash(i * 13.7 + Math.floor(lt * 28)) * GLY.length)];
  }
  return out;
}
function glitchT(str, x, y, size, lt, o = {}) {
  const k = o.k == null ? 1 : o.k, j = (hash(Math.floor(lt * 24)) - .5) * size * .1 * k, d = size * .025 * k;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  T(str, x - d - j, y, size, { ...o, color: C.coral, grad: null, stroke: null, glow: null, shadow: false, outline: null, a: .9 * (o.a == null ? 1 : o.a) });
  T(str, x + d + j, y, size, { ...o, color: C.teal, grad: null, stroke: null, glow: null, shadow: false, outline: null, a: .9 * (o.a == null ? 1 : o.a) });
  ctx.restore();
  T(str, x, y, size, o);
}
/* UI pill tag with wipe */
function tag(str, x, y, size, lt, t0, bgc, fg, o = {}) {
  const p = E.out5(prog(lt, t0, t0 + .35)); if (p <= 0) return;
  const w = TW(str, size, { font: o.font || FC, weight: 900, ls: o.ls || 4 }) + size * 1.1, h = size * 1.6;
  ctx.save(); ctx.translate(x, y); if (o.rot) ctx.rotate(o.rot);
  ctx.beginPath(); ctx.rect(-w / 2, -h / 2 - 10, w * p, h + 20); ctx.clip();
  ctx.fillStyle = bgc; rrect(-w / 2, -h / 2, w, h, h * .28); ctx.fill();
  T(str, 0, 4, size, { font: o.font || FC, weight: 900, color: fg, ls: o.ls || 4, shadow: false });
  ctx.restore();
}

/* ---------- post FX ---------- */
function snap() { bctx.setTransform(1, 0, 0, 1, 0, 0); bctx.globalCompositeOperation = 'copy'; bctx.globalAlpha = 1; bctx.drawImage(cv, 0, 0); bctx.globalCompositeOperation = 'source-over'; }
function motionBlur(dx, dy, m = 8) {
  if (Math.abs(dx) + Math.abs(dy) < 2) return; snap();
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (let k = 1; k <= m; k++) { const f = k / m - .5; ctx.globalAlpha = 1 / (k + 1); ctx.drawImage(buf, dx * f * 2, dy * f * 2); }
  ctx.restore();
}
function zoomBlur(amt, m = 8, cx = CX, cy = CY) {
  if (amt < .004) return; snap();
  ctx.save();
  for (let k = 1; k <= m; k++) { const s = 1 + amt * k / m; ctx.globalAlpha = 1 / (k + 1); ctx.setTransform(s, 0, 0, s, cx - cx * s, cy - cy * s); ctx.drawImage(buf, 0, 0); }
  ctx.restore();
}
function rgbSplit(d, dy = 0) {
  if (Math.abs(d) + Math.abs(dy) < 1) return; snap();
  for (const [g, col] of [[t1, '#ff0000'], [t2, '#00ffff']]) { g.globalCompositeOperation = 'copy'; g.drawImage(buf, 0, 0); g.globalCompositeOperation = 'multiply'; g.fillStyle = col; g.fillRect(0, 0, W, H); }
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(tb1, d, dy); ctx.drawImage(tb2, -d, -dy); ctx.restore();
}
function slices(t, amt, n = 16, seed = 1) {
  if (amt < 1) return; snap(); ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  const fr = Math.floor(t * 30);
  for (let i = 0; i < n; i++) {
    if (hash(i * 7.1 + fr * 1.3 + seed) < .4) continue;
    const y = hash(i * 3.3 + fr * .7 + seed) * H, h = lerp(24, 300, hash(i * 9.7 + fr)), dx = (hash(i * 5.1 + fr * 2.1) - .5) * 2 * amt;
    ctx.drawImage(buf, 0, y, W, h, dx, y, W, h);
  }
  ctx.restore();
}
function shimmer(t, amt, y0, y1, step = 24) {
  snap(); ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (let y = y0; y < y1; y += step) { const dx = Math.sin(y * .02 + t * 9) * amt * ((y - y0) / (y1 - y0)); ctx.drawImage(buf, 0, y, W, step, dx, y, W, step); }
  ctx.restore();
}
function flash(a, col = '#ffffff') { if (a > 0) fillAll(col, clamp(a)); }
const NOISE = (() => { const c = mk(512, 512), g = c.getContext('2d'), d = g.createImageData(512, 512), r = rng(99); for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); return c; })();
let noisePat = null;
function grain(t, a = .06) {
