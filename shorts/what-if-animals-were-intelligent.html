/* ---------------- math / easing ---------------- */
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut3 = k => 1 - Math.pow(1 - k, 3);
const eIn3 = k => k * k * k;

const eOutExpo = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);

/* ---------------- sprites & buffers ---------------- */
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const glowCache = {};
function glowSprite(col) {

  ctx.translate(x, y); ctx.scale(fit, fit);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round'; ctx.miterLimit = 2;
  let cx = -total / 2;
  for (let i = 0; i < words.length; i++) {
    const wa = at + i * (o.stagger ?? 0.065);
    if (T < wa) { cx += ws[i] + sp; continue; }

    const s = lerp(o.from ?? 1.75, 1, eBack(k)), a = prog(T, wa, wa + 0.05) * (o.alpha ?? 1);

/* ---------------- post FX ---------------- */
function bloom(a) {
