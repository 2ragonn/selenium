<span class="fp" style="font-family:'Unbounded';font-weight:900">WHAT IF</span><span class="fp" style="font-family:'Space Grotesk';font-weight:700">ALT</span>
<script>
'use strict';
/* =====================================================================
   WHAT IF HUMANS COULD FLY?  — YouTube Short (2160x3840, 9:16)
   Pure canvas engine. Autoplays on load. Duration 43.26s.
   Color theory: sky AZURE (210deg) + complementary sunrise CORAL/GOLD
   (15-45deg) = freedom & aspiration. CYAN for tech/air-lanes,
   MAGENTA/RED for tension (jam, storm, risk), deep INDIGO base.
   ===================================================================== */
const W=2160,H=3840,CX=1080,CY=1920,TAU=Math.PI*2,D=Math.PI/180,PI=Math.PI;
const DUR=43.26;
const FD="'Unbounded','Arial Black','Segoe UI Black',Impact,sans-serif";
const FU="'Space Grotesk','Segoe UI','Helvetica Neue',Arial,sans-serif";
const cv=document.getElementById('c');
const MAIN=cv.getContext('2d');
let ctx=MAIN;
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
const BUF=mk(W,H),BX=BUF.getContext('2d');
let NOW=0;
function withCtx(g,fn){const o=ctx;ctx=g;try{fn();}finally{ctx=o;}}

/* ---------------- palette ---------------- */
const P={ink:'#0B0F33',indigo:'#141A55',violet:'#3A1C71',azure:'#2F9BFF',cyan:'#39F0FF',coral:'#FF6A3D',gold:'#FFC53D',
 magenta:'#FF3D7F',red:'#FF3348',cloud:'#F3F6FF',mist:'#B9C3F2',sand:'#F6D7A7',green:'#3DFFA8',white:'#FFFFFF',lilac:'#B07CFF'};

/* ---------------- math ---------------- */
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const fract=x=>x-Math.floor(x);
const h1=n=>fract(Math.sin(n*127.1+311.7)*43758.5453);
const wrap=(v,m)=>((v%m)+m)%m;
const bell=(t,c,w)=>Math.exp(-Math.pow((t-c)/w,2));
const E={
 inQ:t=>t*t,outQ:t=>1-(1-t)*(1-t),inC:t=>t*t*t,outC:t=>1-Math.pow(1-t,3),
 ioC:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,ioS:t=>-(Math.cos(PI*t)-1)/2,
 outE:t=>t>=1?1:1-Math.pow(2,-10*t),inE:t=>t<=0?0:Math.pow(2,10*t-10),
 outB:t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);},
 outEl:t=>t<=0?0:t>=1?1:Math.pow(2,-10*t)*Math.sin((t*10-0.75)*(TAU/3))+1
};
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------------- color ---------------- */
const _rgb={};
function RGB(h){if(_rgb[h])return _rgb[h];const s=h.slice(1);return _rgb[h]=[parseInt(s.slice(0,2),16),parseInt(s.slice(2,4),16),parseInt(s.slice(4,6),16)];}
function rgba(h,a){const c=RGB(h);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function mixc(a,b,t){const x=RGB(a),y=RGB(b);return '#'+[0,1,2].map(i=>Math.round(lerp(x[i],y[i],clamp(t))).toString(16).padStart(2,'0')).join('');}

/* ---------------- drawing helpers ---------------- */
function lg(x0,y0,x1,y1,stops){const g=ctx.createLinearGradient(x0,y0,x1,y1);stops.forEach(s=>g.addColorStop(s[0],s[1]));return g;}
function bg(stops){ctx.fillStyle=lg(0,0,0,H,stops);ctx.fillRect(-W,-H,3*W,3*H);}
function RR(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function C(x,y,r){ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,TAU);}
function line(x0,y0,x1,y1){ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();}
function poly(pts,close){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));if(close){ctx.closePath();}}
function quadPath(a,b,c,d){ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.lineTo(d[0],d[1]);ctx.closePath();}
function star4(x,y,r,rot){ctx.beginPath();for(let i=0;i<8;i++){const a=rot+i*PI/4;const rr=i%2?r*0.2:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}ctx.closePath();}
const _gl={};
function GS(col){if(_gl[col])return _gl[col];const c=mk(256,256),g=c.getContext('2d'),[r,gg,b]=RGB(col);const gr=g.createRadialGradient(128,128,0,128,128,128);
 gr.addColorStop(0,`rgba(${r},${gg},${b},1)`);gr.addColorStop(0.18,`rgba(${r},${gg},${b},0.62)`);gr.addColorStop(0.5,`rgba(${r},${gg},${b},0.18)`);gr.addColorStop(1,`rgba(${r},${gg},${b},0)`);
 g.fillStyle=gr;g.fillRect(0,0,256,256);return _gl[col]=c;}
function glow(x,y,r,col,a=1){if(a<=0.004||r<=0)return;const o=ctx.globalCompositeOperation,oa=ctx.globalAlpha;ctx.globalCompositeOperation='lighter';ctx.globalAlpha=Math.min(1,a);ctx.drawImage(GS(col),x-r,y-r,r*2,r*2);ctx.globalAlpha=oa;ctx.globalCompositeOperation=o;}
function rays(x,y,rot,n,col,a,len){ctx.save();ctx.globalCompositeOperation='lighter';ctx.translate(x,y);ctx.rotate(rot);const g=ctx.createRadialGradient(0,0,0,0,0,len);g.addColorStop(0,rgba(col,a));g.addColorStop(1,rgba(col,0));ctx.fillStyle=g;const hw=TAU/n*0.22;for(let i=0;i<n;i++){const a0=i*TAU/n;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,len,a0-hw,a0+hw);ctx.closePath();ctx.fill();}ctx.restore();}
function speedV(t,n,sp,col,a,seed,dir=1){ctx.save();ctx.lineCap='round';for(let i=0;i<n;i++){const x=h1(i*3.1+seed)*W;const len=260+h1(i*7.7+seed)*900;const span=H+len*2;const y=wrap(h1(i*5.3+seed)*span+t*sp*(0.6+h1(i+seed)*0.8)*dir,span)-len;const al=a*(0.3+0.7*h1(i*9.1+seed));ctx.strokeStyle=sp*dir>=0?lg(x,y,x,y+len,[[0,rgba(col,0)],[1,rgba(col,al)]]):lg(x,y,x,y+len,[[0,rgba(col,al)],[1,rgba(col,0)]]);ctx.lineWidth=3+h1(i*2.2+seed)*6;line(x,y,x,y+len);}ctx.restore();}
function speedH(t,n,sp,col,a,seed,y0=0,y1=H){ctx.save();ctx.lineCap='round';for(let i=0;i<n;i++){const y=lerp(y0,y1,h1(i*3.1+seed));const len=300+h1(i*7.7+seed)*1000;const span=W+len*2;const x=wrap(h1(i*5.3+seed)*span+t*sp*(0.6+h1(i+seed)*0.8),span)-len;const al=a*(0.3+0.7*h1(i*9.1+seed));ctx.strokeStyle=sp>=0?lg(x,y,x+len,y,[[0,rgba(col,0)],[1,rgba(col,al)]]):lg(x,y,x+len,y,[[0,rgba(col,al)],[1,rgba(col,0)]]);ctx.lineWidth=3+h1(i*2.2+seed)*6;line(x,y,x+len,y);}ctx.restore();}
function ribbon(pts,w0,col,a0=0.8,col2){if(pts.length<2)return;const L=[],R=[];for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[Math.min(i+1,pts.length-1)],o=pts[Math.max(i-1,0)];let dx=q[0]-o[0],dy=q[1]-o[1];const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;const w=w0*Math.pow(1-i/(pts.length-1),0.8);L.push([p[0]-dy*w,p[1]+dx*w]);R.push([p[0]+dy*w,p[1]-dx*w]);}
 const a=pts[0],b=pts[pts.length-1];ctx.fillStyle=lg(a[0],a[1],b[0],b[1],[[0,rgba(col,a0)],[0.5,rgba(col2||col,a0*0.45)],[1,rgba(col2||col,0)]]);ctx.beginPath();L.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));for(let i=R.length-1;i>=0;i--)ctx.lineTo(R[i][0],R[i][1]);ctx.closePath();ctx.fill();}

/* ---------------- text ---------------- */
function tx(s,x,y,size,o={}){
 ctx.save();
 ctx.font=`${o.w||900} ${size}px ${o.f||FD}`;
 ctx.textAlign=o.al||'center';ctx.textBaseline='middle';
 ctx.letterSpacing=(o.ls||0)+'px';
 if(o.a!=null)ctx.globalAlpha*=o.a;
 if(o.maxW){const m=ctx.measureText(s).width;if(m>o.maxW){const k=o.maxW/m;ctx.translate(x,y);ctx.scale(k,k);ctx.translate(-x,-y);}}
 if(o.shadow){ctx.fillStyle=o.shadow;ctx.fillText(s,x,y+size*0.09);}
 if(o.st){ctx.lineJoin='round';ctx.lineWidth=o.sw||size*0.16;ctx.strokeStyle=o.st;ctx.strokeText(s,x,y);}
 if(o.grad){const m=ctx.measureText(s).width;const x0=o.al==='left'?x:o.al==='right'?x-m:x-m/2;ctx.fillStyle=lg(x0,y-size*0.5,x0+m,y+size*0.5,o.grad.map((c,i)=>[i/(o.grad.length-1),c]));}

/* ---------------- top-down city ---------------- */
const CITY=(()=>{
 const r=rng(11),P_=420,RD=96,NX=26,NY=40,B=[],PK=[],CARS=[];
 for(let i=0;i<NX;i++)for(let j=0;j<NY;j++){
  const x0=(i-NX/2)*P_+RD/2,y0=(j-NY/2)*P_+RD/2,S=P_-RD;
  if(r()<0.08){PK.push({x:x0,y:y0,s:S,trees:Array.from({length:8},()=>[x0+40+r()*(S-80),y0+40+r()*(S-80),20+r()*22])});continue;}
  const inset=16,bs=S-inset*2,mode=r();let parts;
  if(mode<0.3)parts=[[0,0,1,1]];
  else if(mode<0.62){const k=0.35+r()*0.3;parts=r()<0.5?[[0,0,k,1],[k,0,1-k,1]]:[[0,0,1,k],[0,k,1,1-k]];}
  else{const kx=0.4+r()*0.2,ky=0.4+r()*0.2;parts=[[0,0,kx,ky],[kx,0,1-kx,ky],[0,ky,kx,1-ky],[kx,ky,1-kx,1-ky]];}
  const dc=Math.hypot(i-NX/2,j-NY/2);
  parts.forEach(([u,v,w,h])=>{const g=12;const bx=x0+inset+u*bs+g/2,by=y0+inset+v*bs+g/2,bw=w*bs-g,bd=h*bs-g;const tall=r()<0.14;
   const ht=(tall?230+r()*170:40+r()*150)*(dc<7?1.15:1);
   B.push({x:bx,y:by,w:bw,d:bd,h:ht,c:Math.floor(r()*4),ac:r()<0.75?[r(),r(),0.1+r()*0.1]:null,id:B.length});});
 }
 for(let k=0;k<520;k++){const hor=r()<0.5;CARS.push({hor,lane:Math.floor(r()*(hor?NY:NX)),dir:r()<0.5?1:-1,o:r(),sp:110+r()*170,c:Math.floor(r()*5)});}
 return {B,PK,CARS,P_,RD,NX,NY};
})();

let PR=null,PSC=null;
function drawCity(cam,o={}){
 const pal=o.pal||PAL.day,F=2000,cr=Math.cos(cam.rot||0),sr=Math.sin(cam.rot||0),fx=cam.fx??CX,fy=cam.fy??CY;
 const pr=(x,y,h)=>{const s=F/(cam.A-h),dx=x-cam.x,dy=y-cam.y;return[fx+(dx*cr-dy*sr)*s,fy+(dx*sr+dy*cr)*s];};
 PR=pr;PSC=h=>F/(cam.A-h);
 const s0=F/cam.A,R=Math.hypot(W,H)*0.62/s0+500;
 const q=(a,b,c,d)=>{quadPath(a,b,c,d);ctx.fill();};
 ctx.fillStyle=pal.road;ctx.fillRect(-W,-H,3*W,3*H);
 const {P_,RD,NX,NY}=CITY;
 const i0=Math.max(0,Math.floor((cam.x-R)/P_+NX/2)),i1=Math.min(NX-1,Math.ceil((cam.x+R)/P_+NX/2));
 const j0=Math.max(0,Math.floor((cam.y-R)/P_+NY/2)),j1=Math.min(NY-1,Math.ceil((cam.y+R)/P_+NY/2));
 for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){const x=(i-NX/2)*P_+RD/2,y=(j-NY/2)*P_+RD/2,S=P_-RD;
  ctx.fillStyle=pal.walk;q(pr(x,y,0),pr(x+S,y,0),pr(x+S,y+S,0),pr(x,y+S,0));
  ctx.fillStyle=pal.lot;q(pr(x+16,y+16,0),pr(x+S-16,y+16,0),pr(x+S-16,y+S-16,0),pr(x+16,y+S-16,0));}
 if(s0>0.5){ctx.save();ctx.strokeStyle=pal.line;ctx.globalAlpha=0.55;ctx.lineWidth=Math.max(1.5,5*s0);ctx.setLineDash([34*s0,46*s0]);
  for(let i=i0;i<=i1+1;i++){const x=(i-NX/2)*P_;const a=pr(x,cam.y-R,0),b=pr(x,cam.y+R,0);line(a[0],a[1],b[0],b[1]);}
  for(let j=j0;j<=j1+1;j++){const y=(j-NY/2)*P_;const a=pr(cam.x-R,y,0),b=pr(cam.x+R,y,0);line(a[0],a[1],b[0],b[1]);}
  ctx.restore();}
 for(const pk of CITY.PK){if(Math.abs(pk.x-cam.x)>R||Math.abs(pk.y-cam.y)>R)continue;ctx.fillStyle=pal.park;q(pr(pk.x+16,pk.y+16,0),pr(pk.x+pk.s-16,pk.y+16,0),pr(pk.x+pk.s-16,pk.y+pk.s-16,0),pr(pk.x+16,pk.y+pk.s-16,0));
  for(const [tx_,ty_,tr] of pk.trees){const c0=pr(tx_,ty_,0),c1=pr(tx_,ty_,45),r=tr*PSC(45);ctx.fillStyle='rgba(0,0,0,0.22)';C(c0[0]+r*0.25,c0[1]+r*0.25,r);ctx.fill();ctx.fillStyle=pal.tree;C(c1[0],c1[1],r);ctx.fill();ctx.fillStyle=pal.treeHi;C(c1[0]-r*0.3,c1[1]-r*0.3,r*0.45);ctx.fill();}}
 if(s0>0.42){for(const c of CITY.CARS){let x,y;const Lx=NX*P_,Ly=NY*P_;
   if(c.hor){y=(c.lane-NY/2)*P_+c.dir*RD*0.22;x=-Lx/2+wrap(c.o*Lx+c.dir*c.sp*NOW,Lx);}else{x=(c.lane-NX/2)*P_+c.dir*RD*0.22;y=-Ly/2+wrap(c.o*Ly+c.dir*c.sp*NOW,Ly);}
   if(Math.abs(x-cam.x)>R||Math.abs(y-cam.y)>R)continue;const s=pr(x,y,0);ctx.save();ctx.translate(s[0],s[1]);ctx.rotate((cam.rot||0)+(c.hor?0:PI/2));ctx.fillStyle=pal.car[c.c];ctx.fillRect(-24*s0,-11*s0,48*s0,22*s0);
   if(pal.night){ctx.fillStyle='#FFF6C8';ctx.fillRect(c.dir*20*s0-3*s0,-9*s0,6*s0,18*s0);}else{ctx.fillStyle='rgba(11,15,51,0.35)';ctx.fillRect(-6*s0,-9*s0,16*s0,18*s0);}ctx.restore();}}
 const vis=[];for(const b of CITY.B){const dx=b.x+b.w/2-cam.x,dy=b.y+b.d/2-cam.y;if(dx>R||dx<-R||dy>R||dy<-R)continue;b._d=dx*dx+dy*dy;vis.push(b);}
 vis.sort((a,b)=>b._d-a._d);
 const hs=o.hs??1;
 for(const b of vis){
  const h=b.h*hs,x0=b.x,y0=b.y,x1=b.x+b.w,y1=b.y+b.d;
  const g0=pr(x0,y0,0),g1=pr(x1,y0,0),g2=pr(x1,y1,0),g3=pr(x0,y1,0);
  const r0=pr(x0,y0,h),r1=pr(x1,y0,h),r2=pr(x1,y1,h),r3=pr(x0,y1,h);
  const ws=pal.wallS[b.c];
  if(cam.y<y0){ctx.fillStyle=ws[0];q(g0,g1,r1,r0);}
  if(cam.x>x1){ctx.fillStyle=ws[1];q(g1,g2,r2,r1);}
  if(cam.y>y1){ctx.fillStyle=ws[2];q(g2,g3,r3,r2);}
  if(cam.x<x0){ctx.fillStyle=ws[3];q(g3,g0,r0,r3);}

   if(b.ac){const as=b.ac[2]*Math.min(b.w,b.d),ax=x0+b.w*0.1+b.ac[0]*(b.w*0.8-as),ay=y0+b.d*0.1+b.ac[1]*(b.d*0.8-as);ctx.fillStyle=pal.ac;q(pr(ax,ay,h+10),pr(ax+as,ay,h+10),pr(ax+as,ay+as,h+10),pr(ax,ay+as,h+10));}}
  if(pal.night&&b.h>220&&sh*b.w>10){const lp=pr(x0+8,y0+8,h);ctx.fillStyle='#FF3348';C(lp[0],lp[1],5*sh);ctx.fill();glow(lp[0],lp[1],40*sh,P.red,0.5+0.5*Math.sin(NOW*4+b.id));}
  if(o.fx)o.fx(b,r0,r1,r2,r3,sh,h);
 }
}

[['fly',1,46],['curb',1,22],['rising',1,20],['rooftops',1,16],['glitter',1,10],['straight',1,22],['routes',1,16],['pad',1,30],['fast',1,32],['jam',1,22],['storm',1,40],['shoves',1,52],['sideways',1,42],['burn',1,26],['rules',1,34],['speed',1,34],['vertical',1,30],['skip',1,14],['weekend',1,20],["isn't",1,44],['risk',1,26],['who',1,24],['controls',1,30],['crowded',1,20],['wildest',1,30],['question',1,18],['comments',1,14],['idea',1,16],['next',1,52],['video',1,40],['go',2,64]].forEach(([w,n,a])=>IMP.push([T(w,n)+0.02,a]));
function shake(t){let x=0,y=0;for(const [ti,a] of IMP){const dt=t-ti;if(dt<0||dt>0.6)continue;const e=a*Math.exp(-dt*9);x+=e*Math.sin(dt*72+ti*13);y+=e*Math.cos(dt*61+ti*7);}
 const s0=SHOTS_T('sStorm'),s1=SHOTS_T('sBurn');if(t>s0&&t<s1){x+=10*(Math.sin(t*37)+Math.sin(t*23.7));y+=10*(Math.cos(t*31)+Math.sin(t*19.3));}
 return [x,y];}

/* =====================================================================
   CAPTIONS (word-synced kinetic subtitles)
   ===================================================================== */
const CAP_Y=2660,CAP_S=150;
function captions(t){
 let ch=null;for(const c of CHUNKS)if(t>=c.t0&&t<c.t1){ch=c;break;}if(!ch)return;
 ctx.save();ctx.font=`900 ${CAP_S}px ${FD}`;ctx.letterSpacing='0px';
 const words=ch.words.map(w=>w.w.toUpperCase());const ws=words.map(w=>ctx.measureText(w).width);const gap=CAP_S*0.3;
 let tot=ws.reduce((a,b)=>a+b,0)+gap*(words.length-1);const sc=Math.min(1,1820/tot);
 const ent=E.outB(clamp((t-ch.t0)/0.18));const y=CAP_Y+(1-ent)*50;
 let cur=-1;ch.words.forEach((w,i)=>{if(t>=w.t0)cur=i;});
 let x=CX-tot*sc/2;
 ch.words.forEach((w,i)=>{const cx=x+ws[i]*sc/2;x+=(ws[i]+gap)*sc;if(t<w.t0-0.02)return;
  const p=clamp((t-w.t0+0.02)/0.14);const s=sc*(0.55+0.45*E.outB(p))*(i===cur?1.07:1);
  ctx.save();ctx.translate(cx,y);ctx.scale(s,s);ctx.globalAlpha=clamp(p*3);
  const isCur=i===cur;
  if(isCur){const pw=ws[i]+64,ph=CAP_S*1.22;ctx.fillStyle=rgba(P.ink,0.5);RR(-pw/2+8,-ph/2+14,pw,ph,ph*0.28);ctx.fill();RR(-pw/2,-ph/2,pw,ph,ph*0.28);ctx.fillStyle=w.key?P.coral:P.azure;ctx.fill();}
  ctx.font=`900 ${CAP_S}px ${FD}`;ctx.textAlign='center';ctx.textBaseline='middle';
  if(!isCur){ctx.fillStyle=rgba(P.ink,0.6);ctx.fillText(words[i],0,CAP_S*0.1);ctx.lineJoin='round';ctx.lineWidth=24;ctx.strokeStyle=P.ink;ctx.strokeText(words[i],0,0);}
  ctx.fillStyle=isCur?'#FFFFFF':(w.key?P.gold:'#FFFFFF');ctx.fillText(words[i],0,0);
  ctx.restore();});
 ctx.restore();
}

/* =====================================================================
   POST FX / TRANSITIONS / GRADE
   ===================================================================== */
function postFX(t,si){
 const S=SHOTS[si],lt=t-S.t0,nx=SHOTS[si+1];
 let whip=0;if(S.tr==='whip'&&lt<0.16)whip=1-lt/0.16;if(nx&&nx.tr==='whip'&&S.t1-t<0.1)whip=Math.max(whip,1-(S.t1-t)/0.1);
 if(whip>0.02){BX.globalCompositeOperation='copy';BX.drawImage(cv,0,0);BX.globalCompositeOperation='source-over';const off=whip*whip*300;
  for(let i=1;i<=6;i++){ctx.globalAlpha=0.2;ctx.drawImage(BUF,-off*i/3,0);ctx.drawImage(BUF,off*i/6,0);}ctx.globalAlpha=1;
  ctx.save();ctx.globalAlpha=whip*0.6;speedH(t,40,0,'#FFFFFF',1,99);ctx.restore();}
 if(S.tr==='glitch'&&lt<0.2){const k=1-lt/0.2;BX.globalCompositeOperation='copy';BX.drawImage(cv,0,0);BX.globalCompositeOperation='source-over';const fr=Math.floor(t*60);
  for(let i=0;i<12;i++){const y=h1(fr*13+i)*H,hh=40+h1(fr*7+i)*280,dx=(h1(fr*3+i)-0.5)*300*k;ctx.drawImage(BUF,0,y,W,hh,dx,y,W,hh);if(i%3===0){ctx.fillStyle=rgba(i%2?P.cyan:P.magenta,0.25*k);ctx.fillRect(0,y,W,hh*0.3);}}
  ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=0.35*k;ctx.drawImage(BUF,24*k,0);ctx.restore();}
}
function grade(t){
 const g=ctx.createRadialGradient(CX,CY*0.95,H*0.28,CX,CY,H*0.78);g.addColorStop(0,'rgba(5,6,25,0)');g.addColorStop(1,'rgba(5,6,25,0.5)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.save();ctx.globalAlpha=0.06;ctx.globalCompositeOperation='overlay';ctx.fillStyle=GRAIN_PAT;const fr=Math.floor(t*24);ctx.translate(-Math.floor(h1(fr)*512),-Math.floor(h1(fr+7)*512));ctx.fillRect(0,0,W+512,H+512);ctx.restore();
}
function slices(u,k){const C3=[[P.gold,P.coral,P.magenta],[P.cyan,P.azure,P.violet],[P.magenta,P.gold,P.coral]][k%3];ctx.save();ctx.translate(CX,CY);ctx.rotate(-0.38);const X=u*5200;
 ctx.fillStyle=C3[0];ctx.fillRect(X-2700-260,-3000,5400+520,6000);ctx.fillStyle='#FFFFFF';ctx.fillRect(X-2700-100,-3000,5400+200,6000);ctx.fillStyle=lg(X-2700,0,X+2700,0,[[0,C3[1]],[1,C3[2]]]);ctx.fillRect(X-2700,-3000,5400,6000);ctx.restore();}
function overlays(t,si){
 const S=SHOTS[si],lt=t-S.t0;
 if(S.tr==='flash'&&lt<0.2){ctx.fillStyle=`rgba(255,250,240,${0.8*(1-E.outC(lt/0.2))})`;ctx.fillRect(0,0,W,H);}
 for(const k of [si,si+1]){const X=SHOTS[k];if(!X||X.tr!=='slice')continue;const u=(t-X.t0)/0.15;if(u<-1||u>1)continue;slices(u,k);}
 if(si===0&&t<0.12){ctx.fillStyle=`rgba(255,255,255,${0.9*(1-t/0.12)})`;ctx.fillRect(0,0,W,H);}
}
function progressBar(t){const f=clamp(t/DUR);ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(0,H-14,W,14);ctx.fillStyle=lg(0,0,W,0,[[0,P.cyan],[0.5,P.gold],[1,P.coral]]);ctx.fillRect(0,H-14,W*f,14);}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
function frame(t){
 NOW=t;ctx=MAIN;
 let si=0;for(let i=0;i<SHOTS.length;i++)if(t>=SHOTS[i].t0)si=i;
 const S=SHOTS[si],lt=t-S.t0,d=Math.min(S.t1,DUR+2)-S.t0,nx=SHOTS[si+1];
 ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.filter='none';
 let z=1;if(S.tr==='zoom')z*=1+0.28*(1-E.outE(clamp(lt/0.4)));if(S.tr==='flash')z*=1+0.06*(1-E.outC(clamp(lt/0.3)));
 if(nx&&nx.tr==='zoom'){const rem=S.t1-t;if(rem<0.12)z*=1+0.14*(1-rem/0.12);}
 const sk=shake(t);
 ctx.translate(CX+sk[0],CY+sk[1]);ctx.scale(z,z);ctx.translate(-CX,-CY);
 ctx.save();S.fn(t,lt,d,S);ctx.restore();
 ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
 postFX(t,si);
 grade(t);
 if(S.cap!==false)captions(t);
 overlays(t,si);
 progressBar(t);
}
window.renderAt=t=>frame(t);
(function boot(){
 const qs=new URLSearchParams(location.search);const FIX=qs.has('t')?parseFloat(qs.get('t')):null;
 function fit(){const s=Math.min(innerWidth/W,innerHeight/H);const st=document.getElementById('stage');if(s<1){st.style.transform=`translate(${(innerWidth-W*s)/2}px,${(innerHeight-H*s)/2}px) scale(${s})`;document.body.style.width=innerWidth+'px';document.body.style.height=innerHeight+'px';}else{st.style.transform='none';document.body.style.width=W+'px';document.body.style.height=H+'px';}}
 fit();addEventListener('resize',fit);
 let T0=null;
 function loop(now){if(T0===null)T0=now;const t=FIX!=null?FIX:(now-T0)/1000;frame(t);requestAnimationFrame(loop);}
 const go=()=>requestAnimationFrame(loop);
 frame(FIX!=null?FIX:0);
 const fl=document.fonts?Promise.all([document.fonts.load('900 100px Unbounded'),document.fonts.load('700 100px "Space Grotesk"')]):Promise.resolve();
 if(qs.has('still'))return;
 Promise.race([fl,new Promise(r=>setTimeout(r,700))]).then(go,go);
})();

</script>
