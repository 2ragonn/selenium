<script>
'use strict';
/* =====================================================================
   WHAT IF EARTH'S GRAVITY DISAPPEARED?  —  YouTube Short (9:16, 2160x3840)
   Duration 39.62 s, autoplays on load, holds the final frame.
   Colour system (complementary + accent):
     cool  : deep-space navy / indigo, cyan + sky blue  -> Earth, air, water, order
     field : electric violet / lilac                      -> gravity itself
     heat  : orange / red / amber                         -> danger, chaos, destruction
     pop   : yellow captions, mint = "safe / gravity ON"
   Extras: ?t=12.3 freezes a frame; ?lite=1 skips heavy post-FX for slow (non-GPU) capture;
           window.renderAt(t) renders any time (seconds) for frame-accurate exporters.
   ===================================================================== */
const W=2160,H=3840,CX=1080,CY=1920,TEND=39.62,TAU=Math.PI*2;
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
let T=0;

/* ---------- palette ---------- */
const PAL={void:'#03040B',navy:'#0D1340',cyan:'#3FE7FF',sky:'#2D9CFF',blue:'#2B5BFF',violet:'#8B5CFF',lilac:'#C3A6FF',
  orange:'#FF7A1A',amber:'#FFB547',red:'#FF2E4D',yellow:'#FFD53D',white:'#F4F7FF',mint:'#3DFFB5'};
const _hc=new Map();
function hex2rgb(h){let c=_hc.get(h);if(c)return c;const s=h.replace('#','');c=[parseInt(s.slice(0,2),16),parseInt(s.slice(2,4),16),parseInt(s.slice(4,6),16)];_hc.set(h,c);return c;}
function rgba(k,a){const c=hex2rgb(PAL[k]||k);return`rgba(${c[0]},${c[1]},${c[2]},${a<0?0:a>1?1:a})`;}
function mixHex(a,b,t){const A=hex2rgb(PAL[a]||a),B=hex2rgb(PAL[b]||b);t=t<0?0:t>1?1:t;return`rgb(${Math.round(A[0]+(B[0]-A[0])*t)},${Math.round(A[1]+(B[1]-A[1])*t)},${Math.round(A[2]+(B[2]-A[2])*t)})`;}
function shade(hex,amt){return mixHex(hex,amt>0?'#FFFFFF':'#000000',Math.abs(amt));}

/* ---------- math ---------- */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(a,b,x)=>clamp((x-a)/(b-a));
const eo2=t=>1-(1-t)*(1-t);
const eo3=t=>1-Math.pow(1-t,3);
const ei2=t=>t*t;
const eio3=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eoBack=(t,s=1.9)=>{t=clamp(t)-1;return 1+(s+1)*t*t*t+s*t*t;};
const eoEl=t=>t<=0?0:t>=1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*TAU/3)+1;
const ss=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t);};
const H1=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453123;return s-Math.floor(s);};
const H2=(a,b)=>H1(a*57.31+b*13.17+1.3);
const n1=x=>{const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return(H1(i)+(H1(i+1)-H1(i))*u)*2-1;};
const norm3=(x,y,z)=>{const l=Math.hypot(x,y,z);return[x/l,y/l,z/l];};
const mix3=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}

/* ---------- Perlin noise ---------- */
const PP=new Uint8Array(512);
(()=>{const r=mulberry(20251011);const p=[];for(let i=0;i<256;i++)p[i]=i;for(let i=255;i>0;i--){const j=(r()*(i+1))|0;const t=p[i];p[i]=p[j];p[j]=t;}for(let i=0;i<512;i++)PP[i]=p[i&255];})();
function g3(h,x,y,z){h&=15;const u=h<8?x:y,v=h<4?y:(h===12||h===14)?x:z;return((h&1)?-u:u)+((h&2)?-v:v);}
function pn3(x,y,z){
  let X=Math.floor(x),Y=Math.floor(y),Z=Math.floor(z);x-=X;y-=Y;z-=Z;X&=255;Y&=255;Z&=255;
  const u=x*x*x*(x*(x*6-15)+10),v=y*y*y*(y*(y*6-15)+10),w=z*z*z*(z*(z*6-15)+10);
  const A=PP[X]+Y,AA=PP[A]+Z,AB=PP[A+1]+Z,B=PP[X+1]+Y,BA=PP[B]+Z,BB=PP[B+1]+Z;
  const l1=lerp(g3(PP[AA],x,y,z),g3(PP[BA],x-1,y,z),u),l2=lerp(g3(PP[AB],x,y-1,z),g3(PP[BB],x-1,y-1,z),u);
  const l3=lerp(g3(PP[AA+1],x,y,z-1),g3(PP[BA+1],x-1,y,z-1),u),l4=lerp(g3(PP[AB+1],x,y-1,z-1),g3(PP[BB+1],x-1,y-1,z-1),u);
  return lerp(lerp(l1,l2,v),lerp(l3,l4,v),w);
}
function fbm3(x,y,z,o){let s=0,a=.5,f=1;for(let i=0;i<o;i++){s+=a*pn3(x*f,y*f,z*f);f*=2.03;a*=.5;}return s;}

/* ---------- fonts ---------- */
const FH='"Anton","Bebas Neue",Impact,"Arial Narrow Bold",sans-serif';
const FU='"Space Grotesk","Segoe UI",Roboto,Helvetica,Arial,sans-serif';
const LITE=/[?&]lite=1/.test(location.search);
const HAS_FILTER=typeof ctx.filter==='string';
const HAS_LS='letterSpacing' in ctx;

/* =====================================================================
   PROCEDURAL ASSETS
   ===================================================================== */
// ---- Earth textures (equirectangular) ----
const TW=2048,TH=1024,TMASK=TW-1;
const texDay=new Uint32Array(TW*TH),texSea=new Uint32Array(TW*TH),texCloud=new Uint8Array(TW*TH),texLight=new Uint8Array(TW*TH),texOcean=new Uint8Array(TW*TH);
function pack(r,g,b){r=r>255?255:r<0?0:r;g=g>255?255:g<0?0:g;b=b>255?255:b<0?0:b;return(255<<24|(b|0)<<16|(g|0)<<8|(r|0))>>>0;}
function genEarth(){
  const C={sh:[64,214,245],mid:[24,120,222],deep:[11,42,118],sand:[228,190,118],sand2:[204,146,80],grass:[70,184,96],forest:[30,122,74],brown:[146,110,70],rock:[186,170,150],snow:[244,248,255],ice:[228,242,255],bedA:[132,104,86],bedB:[44,32,50]};
  for(let j=0;j<TH;j++){
    const lat=(0.5-(j+0.5)/TH)*Math.PI,cl=Math.cos(lat),sl=Math.sin(lat),al=Math.abs(lat)/(Math.PI/2);
    for(let i=0;i<TW;i++){
      const lon=(i+0.5)/TW*TAU,x=cl*Math.cos(lon),y=sl,z=cl*Math.sin(lon),idx=j*TW+i;
      let e=fbm3(x*1.6+4.3,y*1.6+1.1,z*1.6-2.7,6)+0.045*pn3(x*12,y*12,z*12);
      const iceN=al+0.06*pn3(x*6+9,y*6,z*6);
      if(e<0.06){
        const dp=clamp((0.06-e)/0.32);
        let c=dp<0.18?mix3(C.sh,C.mid,dp/0.18):mix3(C.mid,C.deep,(dp-0.18)/0.82);
        let bed=mix3(C.bedA,C.bedB,dp);const mot=0.82+0.32*pn3(x*20,y*20,z*20);
        if(iceN>0.86){c=C.ice;bed=C.ice;texOcean[idx]=0;}else texOcean[idx]=1;
        texDay[idx]=pack(c[0],c[1],c[2]);texSea[idx]=pack(bed[0]*mot,bed[1]*mot,bed[2]*mot);
      }else{
        const h=clamp((e-0.06)/0.32),m=fbm3(x*3+7.7,y*3+2.2,z*3+5.5,3);
        const desert=m<-0.04&&al>0.08&&al<0.5;let c;
        if(iceN>0.8)c=C.snow;
        else if(desert)c=mix3(C.sand,C.sand2,clamp(h*1.5));
        else c=h<0.35?mix3(C.grass,C.forest,clamp(h/0.35+m)):h<0.7?mix3(C.forest,C.brown,(h-0.35)/0.35):mix3(C.rock,C.snow,(h-0.7)/0.3);
        const sh=0.9+0.2*pn3(x*30,y*30,z*30);
        texDay[idx]=texSea[idx]=pack(c[0]*sh,c[1]*sh,c[2]*sh);
        if(iceN<0.78&&!desert){const l=pn3(x*55+3,y*55,z*55)+0.6*pn3(x*130,y*130,z*130);texLight[idx]=clamp((l-0.16)*3.4)*(1-h*0.7)*255;}
      }
      const cn=fbm3(x*2.2+11.1,y*3.4+3.3,z*2.2-6.6,5)+0.1*Math.sin(lat*7);
      texCloud[idx]=clamp((cn-0.03)/0.28)*235;
    }
  }
}
// ---- Earth sphere sprite (per-pixel shading lookup) ----
const ES=1200,ER=ES/2;
let eCan,eCtx,eImg,eBuf,eN=0,eIdx,eU,eV,eDay,eNight,eRim,eSpec,eA,eKey='';
function prepSphere(){
  eCan=mk(ES,ES);eCtx=eCan.getContext('2d');eImg=eCtx.createImageData(ES,ES);eBuf=new Uint32Array(eImg.data.buffer);
  const cap=Math.ceil(ES*ES*0.8);
  eIdx=new Int32Array(cap);eU=new Float32Array(cap);eV=new Int32Array(cap);eDay=new Float32Array(cap);eNight=new Float32Array(cap);eRim=new Float32Array(cap);eSpec=new Float32Array(cap);eA=new Float32Array(cap);
  const L=norm3(-0.55,0.5,0.68),Hv=norm3(L[0],L[1],L[2]+1),tilt=0.32,ct=Math.cos(tilt),st=Math.sin(tilt);
  let n=0;
  for(let py=0;py<ES;py++)for(let px=0;px<ES;px++){
    const nx=(px+0.5-ER)/ER,ny=(py+0.5-ER)/ER,d2=nx*nx+ny*ny,dist=Math.sqrt(d2)*ER;
    const a=clamp(ER-dist+0.5);if(a<=0)continue;
    const nz=Math.sqrt(Math.max(0,1-d2)),vx=nx,vy=-ny,vz=nz;
    const wy=vy*ct+vz*st,wz=-vy*st+vz*ct;
    const lat=Math.asin(clamp(wy,-1,1)),lon=Math.atan2(wz,vx);
    eU[n]=((lon/TAU*TW)%TW+TW)%TW;eV[n]=Math.min(TH-1,((0.5-lat/Math.PI)*TH)|0)*TW;
    const dif=vx*L[0]+vy*L[1]+vz*L[2];
    eDay[n]=0.03+0.97*ss(-0.12,0.45,dif)*(0.62+0.38*clamp(dif));
    eNight[n]=1-ss(-0.25,0.08,dif);
    eRim[n]=Math.pow(1-nz,2.2)*(0.22+0.78*ss(-0.3,0.4,dif));
    eSpec[n]=Math.pow(Math.max(0,vx*Hv[0]+vy*Hv[1]+vz*Hv[2]),46)*0.9;
    eA[n]=a;eIdx[n]=py*ES+px;n++;
  }
  eN=n;
}
function renderEarth(rot,crot,cAmt,drain){
  const key=(rot|0)+'_'+(crot|0)+'_'+cAmt.toFixed(2)+'_'+drain.toFixed(2);
  if(key===eKey)return;eKey=key;
  const R=((rot%TW)+TW)%TW,CR=((crot%TW)+TW)%TW,cm=cAmt*0.0039,dn=1-drain;
  for(let k=0;k<eN;k++){
    const row=eV[k],ti=row+(((eU[k]+R)|0)&TMASK);
    const c=texDay[ti];let r=c&255,g=(c>>>8)&255,b=(c>>>16)&255;const oc=texOcean[ti];
    if(drain>0&&oc){const s=texSea[ti];r+=((s&255)-r)*drain;g+=(((s>>>8)&255)-g)*drain;b+=(((s>>>16)&255)-b)*drain;}
    const ca=texCloud[row+(((eU[k]+CR)|0)&TMASK)]*cm;
    r+=(250-r)*ca;g+=(252-g)*ca;b+=(255-b)*ca;
    const dy=eDay[k];r*=dy;g*=dy;b*=dy;
    if(oc){const sp=eSpec[k]*(1-ca)*dn*255;r+=sp*.9;g+=sp*.95;b+=sp;}
    const li=texLight[ti]*eNight[k]*(1-ca*0.8);r+=li;g+=li*0.62;b+=li*0.25;
    const rm=eRim[k];r+=rm*70;g+=rm*170;b+=rm*255;
    eBuf[eIdx[k]]=((eA[k]*255)<<24|(b>255?255:b)<<16|(g>255?255:g)<<8|(r>255?255:r))>>>0;
  }
  eCtx.putImageData(eImg,0,0);
}
// ---- Moon sprite ----
const MSZ=600;let moonCan;
function genMoon(){
  moonCan=mk(MSZ,MSZ);const c=moonCan.getContext('2d'),img=c.createImageData(MSZ,MSZ),d=new Uint32Array(img.data.buffer);
  const R=MSZ/2,L=norm3(-0.55,0.45,0.7),rnd=mulberry(9),cr=[];
  for(let i=0;i<46;i++){const u=rnd()*2-1,th=rnd()*TAU,s=Math.sqrt(1-u*u);cr.push([s*Math.cos(th),u,s*Math.sin(th),0.04+Math.pow(rnd(),2.5)*0.22]);}
  for(let py=0;py<MSZ;py++)for(let px=0;px<MSZ;px++){
    const nx=(px+.5-R)/R,ny=(py+.5-R)/R,d2=nx*nx+ny*ny,a=clamp(R-Math.sqrt(d2)*R+.5);if(a<=0)continue;
    const vz=Math.sqrt(Math.max(0,1-d2)),vx=nx,vy=-ny;
    let base=0.74+0.2*fbm3(vx*2.5,vy*2.5,vz*2.5,4);const mare=fbm3(vx*1.3+5,vy*1.3,vz*1.3,3);if(mare<-0.04)base*=0.7;
    for(const q of cr){const dt=vx*q[0]+vy*q[1]+vz*q[2];if(dt<0.85)continue;const an=Math.acos(clamp(dt,-1,1))/q[3];if(an<1)base*=0.8+0.14*an*an;else if(an<1.25)base*=1+0.22*(1.25-an)*4;}
    const dif=vx*L[0]+vy*L[1]+vz*L[2],sh=0.04+0.96*ss(-0.08,0.5,dif)*(0.55+0.45*clamp(dif)),col=base*sh*255,rim=Math.pow(1-vz,3)*50;
    d[py*MSZ+px]=pack(col*0.98+rim*0.6,col+rim*0.5,col*1.05+rim)&0x00FFFFFF|((a*255)<<24);
  }
  c.putImageData(img,0,0);
}
// ---- space backdrop ----
let nebCan,starA,starB,spaceCan;const hero=[];
function buildSpace(){
  nebCan=mk(540,960);const n=nebCan.getContext('2d');n.fillStyle='#04050E';n.fillRect(0,0,540,960);
  const r=mulberry(77);const cols=['139,92,255','45,91,255','63,231,255','224,64,251','255,122,26'];
  for(let i=0;i<30;i++){const x=r()*540,y=r()*960,rad=60+r()*260,ci=i%5,a=(ci===4?0.07:ci===3?0.09:0.15)*(.5+r()*.6);
    const g=n.createRadialGradient(x,y,0,x,y,rad);g.addColorStop(0,`rgba(${cols[ci]},${a})`);g.addColorStop(1,`rgba(${cols[ci]},0)`);n.fillStyle=g;n.fillRect(0,0,540,960);}
  starA=mk(2700,4600);let s=starA.getContext('2d');
  for(let i=0;i<2800;i++){const x=r()*2700,y=r()*4600,rad=0.6+Math.pow(r(),3)*2.6,a=0.25+r()*0.7,t=r();s.fillStyle=t<0.12?`rgba(190,170,255,${a})`:t<0.22?`rgba(160,230,255,${a})`:t<0.27?`rgba(255,210,160,${a})`:`rgba(255,255,255,${a})`;s.beginPath();s.arc(x,y,rad,0,TAU);s.fill();}
  starB=mk(2700,4600);s=starB.getContext('2d');
  for(let i=0;i<260;i++){const x=r()*2700,y=r()*4600,rad=2+r()*4,t=r();const c=t<0.3?'160,230,255':t<0.5?'200,180,255':'255,255,255';
    const g=s.createRadialGradient(x,y,0,x,y,rad*5);g.addColorStop(0,`rgba(${c},.95)`);g.addColorStop(0.2,`rgba(${c},.45)`);g.addColorStop(1,`rgba(${c},0)`);s.fillStyle=g;s.fillRect(x-rad*5,y-rad*5,rad*10,rad*10);}
  spaceCan=mk(2700,4600);const sc=spaceCan.getContext('2d');sc.fillStyle='#03040B';sc.fillRect(0,0,2700,4600);sc.drawImage(nebCan,0,0,2700,4600);sc.drawImage(starA,0,0);sc.drawImage(starB,0,0);
  for(let i=0;i<34;i++)hero.push({x:r()*2600-1300,y:r()*4400-2200,s:10+r()*22,f:1+r()*3,ph:r()*TAU,c:r()<.4?'cyan':r()<.6?'lilac':'white'});
}
function bgSpace(o={}){
  const z=o.z??1,px=o.px??0,py=o.py??0;
  ctx.save();ctx.translate(CX+px*.4,CY+py*.4);ctx.scale(z,z);ctx.drawImage(spaceCan,-1350,-2300);
  if((o.neb??1)<1){ctx.fillStyle=`rgba(3,4,11,${1-(o.neb??1)})`;ctx.fillRect(-1350,-2300,2700,4600);}
  ctx.restore();
  ctx.save();ctx.translate(CX+px*.8,CY+py*.8);ctx.scale(z*1.06,z*1.06);
  ctx.globalCompositeOperation='lighter';
  for(const h of hero){const tw=0.45+0.55*Math.sin(T*h.f+h.ph);if(tw<0.05)continue;const L=h.s*(2.2+tw*2);
    ctx.fillStyle=rgba(h.c,0.9*tw);ctx.fillRect(h.x-L,h.y-1.5,L*2,3);ctx.fillRect(h.x-1.5,h.y-L,3,L*2);
    ctx.beginPath();ctx.arc(h.x,h.y,h.s*0.35,0,TAU);ctx.fill();}
  ctx.restore();
}
// ---- twilight city sky ----
let skyFar,skyNear;
function genSkyline(h,col,winA,seed,minH,maxH){
  const c=mk(W+600,h),g=c.getContext('2d'),r=mulberry(seed);let x=0;
  while(x<W+600){const bw=90+r()*210,bh=minH+r()*(maxH-minH),by=h-bh;
    g.fillStyle=col;g.fillRect(x,by,bw,bh);if(r()<0.3)g.fillRect(x+bw*0.4,by-70-r()*80,8,90+r()*60);
    for(let wy=by+30;wy<h-20;wy+=34)for(let wx=x+16;wx<x+bw-20;wx+=28)if(r()<winA){g.fillStyle=r()<0.82?`rgba(255,190,110,${0.35+r()*0.5})`:'rgba(120,220,255,.5)';g.fillRect(wx,wy,12,16);}
    x+=bw+4+r()*20;}
  return c;
}
function bgTwilight(o={}){
  const hy=o.hy??2400,px=o.px??0;
  const g=ctx.createLinearGradient(0,-400,0,hy);
  g.addColorStop(0,'#05071F');g.addColorStop(0.36,'#141149');g.addColorStop(0.6,'#3B1A66');g.addColorStop(0.8,'#9A2F6E');g.addColorStop(0.93,'#F06A3C');g.addColorStop(1,'#FFB15C');
  ctx.fillStyle=g;ctx.fillRect(-400,-400,W+800,hy+400);
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=0.5;ctx.drawImage(starA,-300,-400-hy*0.1);ctx.restore();
  glow(CX+380,hy,1500,'orange',0.5);glow(CX+380,hy,520,'amber',0.7);
  ctx.drawImage(skyFar,-300+px*0.3,hy-900+30);
  ctx.drawImage(skyNear,-300+px*0.6,hy-1100+70);
  if(o.dark){ctx.fillStyle=`rgba(3,4,20,${o.dark})`;ctx.fillRect(-400,-400,W+800,hy+400);}
}
// ---- cloud puffs ----
const cloudCans=[];
function genClouds(){
  for(let v=0;v<4;v++){const c=mk(760,600),g=c.getContext('2d'),r=mulberry(100+v);const P=[];

function zoomBlur(amt,cx=CX,cy=CY){

  ctx.save();for(let i=1;i<=5;i++){const s=1+amt*0.028*i;ctx.globalAlpha=0.5/(i+0.6);ctx.setTransform(s,0,0,s,cx*(1-s),cy*(1-s));ctx.drawImage(buf,0,0);}ctx.restore();
}
function chroma(px){
  if(px<1.5)return;px=Math.min(px,40);
  bx.globalCompositeOperation='copy';bx.drawImage(cv,0,0);bx.globalCompositeOperation='multiply';bx.fillStyle='#FF0000';bx.fillRect(0,0,W,H);
  bx2.globalCompositeOperation='copy';bx2.drawImage(cv,0,0);bx2.globalCompositeOperation='multiply';bx2.fillStyle='#00FFFF';bx2.fillRect(0,0,W,H);
  bx.globalCompositeOperation='source-over';bx2.globalCompositeOperation='source-over';
  ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='lighter';ctx.drawImage(buf,px,0);ctx.drawImage(buf2,-px,px*0.3);ctx.restore();
}
function glitch(amt,seed){
  if(amt<=0.01)return;bx.globalCompositeOperation='copy';bx.drawImage(cv,0,0);bx.globalCompositeOperation='source-over';
  ctx.save();ctx.setTransform(1,0,0,1,0,0);const n=7+((H1(seed)*6)|0);
  for(let i=0;i<n;i++){const y=H1(seed+i*1.7)*H,h=30+H1(seed+i*2.3)*280,dx=(H1(seed+i*3.1)-.5)*560*amt;ctx.drawImage(buf,0,y,W,h,dx,y,W,h);
    if(H1(seed+i*4.4)>.6){ctx.globalCompositeOperation='lighter';ctx.fillStyle=rgba(H1(seed+i*5)>.5?'cyan':'red',0.18*amt);ctx.fillRect(0,y,W,h);ctx.globalCompositeOperation='source-over';}}
  ctx.restore();
}

/* =====================================================================
   RENDER
   ===================================================================== */
function resetCtx(){ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.filter='none';ctx.setLineDash([]);ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;ctx.lineDashOffset=0;}
function render(t){
  T=t;window.currentTime=t;resetCtx();ctx.fillStyle='#03040B';ctx.fillRect(0,0,W,H);
  let si=SHOTS.length-1;for(let i=0;i<SHOTS.length;i++)if(t<SHOTS[i].e){si=i;break;}
  const sh=SHOTS[si],lt=t-sh.s,d=Math.min(sh.e,TEND)-sh.s,p=clamp(lt/d);
  const S=impulse(SHAKES,t);let bp=0;for(const[ti,a]of BEATP){const u=t-ti;if(u>=0&&u<0.35)bp+=a*(1-eo3(u/0.35));}
  const punch=sh.np?0:(1-eo3(clamp(lt/0.34)))*(sh.pk??0.1),sc=1+punch+bp+S*0.0007;
  ctx.save();ctx.translate(CX+n1(t*21.3)*S,CY+n1(t*17.9+31)*S);ctx.rotate(n1(t*13.1+77)*S*0.0008);ctx.scale(sc,sc);ctx.translate(-CX,-CY);
  try{sh.f(lt,d,p);}catch(err){console.error('shot error',si,err);}
  ctx.restore();resetCtx();
  if(!LITE){bloom(0.42,0.3);
  if(!sh.np&&si>0&&lt<0.2)zoomBlur((1-lt/0.2)*1.1);
  if(sh.zb)zoomBlur(sh.zb(p),CX,1700);
  const cA=impulse(CHROMA,t);if(cA>1.5)chroma(cA);}
  for(const[a,b,amp]of GLITCH)if(t>=a&&t<b){const s=Math.floor(t*30);glitch(amp*(H1(s*1.3)>0.3?1:0.2),s*7.31);}
  const ds=t>=29.2&&t<29.92?0.85*ss(29.2,29.45,t):0;
  if(ds>0&&HAS_FILTER){bx.globalCompositeOperation='copy';bx.drawImage(cv,0,0);ctx.filter='grayscale(1) contrast(1.15)';ctx.globalAlpha=ds;ctx.drawImage(buf,0,0);resetCtx();ctx.fillStyle=`rgba(255,30,60,${0.12*ds})`;ctx.fillRect(0,0,W,H);}
  try{drawHUD(t);drawCaptions(t);}catch(err){console.error('overlay error',err);}
  resetCtx();
  for(const[ti,amp,col,du]of FLASHES){const u=t-ti;if(u>=0&&u<du){ctx.globalAlpha=amp*Math.pow(1-u/du,2);ctx.fillStyle=col;ctx.fillRect(0,0,W,H);}}
  if(!sh.np&&lt<0.08&&si>0){ctx.globalAlpha=0.22*(1-lt/0.08);ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,W,H);}
  resetCtx();ctx.drawImage(vigCan,0,0,W,H);
  const f=Math.floor(t*30),pat=grainPats[f%4];if(pat&&!LITE){pat.setTransform(new DOMMatrix([2,0,0,2,(H1(f)*256)|0,(H1(f+0.5)*256)|0]));ctx.globalCompositeOperation='overlay';ctx.globalAlpha=0.13;ctx.fillStyle=pat;ctx.fillRect(0,0,W,H);}
  resetCtx();
}

/* =====================================================================
   BOOT
   ===================================================================== */
function fit(){const s=Math.min(innerWidth/W,innerHeight/H),st=document.getElementById('stage');if(Math.abs(s-1)<0.002){st.style.transform='none';}else st.style.transform=`translate(${(innerWidth-W*s)/2}px,${(innerHeight-H*s)/2}px) scale(${s})`;}
addEventListener('resize',fit);fit();
genEarth();prepSphere();genMoon();buildSpace();genClouds();genMisc();
skyFar=genSkyline(900,'#2A1B5C',0.18,11,180,620);skyNear=genSkyline(1100,'#140E33',0.32,12,280,900);
[[300,1350,'#22348A','#0F1748'],[260,1750,'#3A2A8A','#160F48'],[360,2150,'#1E4BA8','#0B1A55'],[300,1500,'#2C2F7A','#120F3E'],[380,1950,'#2A5BB8','#0E1C5A'],[300,1400,'#45307A','#1A0F40']].forEach((b,i)=>towerCans.push(genTower(b[0],b[1],700+i,b[2],b[3])));
window.renderAt=render;window.DURATION=TEND;
render(0);
const qs=new URLSearchParams(location.search),FIX=qs.has('t')?parseFloat(qs.get('t')):null;
if(FIX!==null&&!isNaN(FIX)){const go=()=>render(clamp(FIX,0,TEND));(document.fonts?document.fonts.ready:Promise.resolve()).then(go);go();}
else{
  let t0=null;
  const loop=()=>{const now=performance.now();if(t0===null)t0=now;const t=Math.min((now-t0)/1000,TEND);render(t);if(t<TEND)requestAnimationFrame(loop);};
  const fontsReady=()=>document.fonts?Promise.race([Promise.all([document.fonts.load('400 100px "Anton"'),document.fonts.load('700 100px "Space Grotesk"'),document.fonts.load('500 100px "Space Grotesk"')]),new Promise(r=>setTimeout(r,2500))]).catch(()=>{}):Promise.resolve();
  // the clock starts only once the page has fully loaded (what screen/frame recorders wait for)
  const start=()=>fontsReady().then(()=>{render(0);requestAnimationFrame(loop);});
  if(document.readyState==='complete')start();else addEventListener('load',start,{once:true});
}
</script>
