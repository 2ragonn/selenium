<body>
<canvas id="c" width="2160" height="3840"></canvas>
<div class="fl" style="font-family:'Anton'">Aa0</div>
<div class="fl" style="font-family:'Montserrat';font-weight:900">Aa0</div>
<div class="fl" style="font-family:'JetBrains Mono';font-weight:800">Aa0</div>
<script>
(()=>{
'use strict';
/* =====================================================================
   WHAT IF THE SUN DISAPPEARED FOR 24 HOURS  -  YouTube Short (9:16)
   2160x3840 canvas, 43.9 s, autoplay. Everything is a pure function of
   time, so frame-by-frame capture tools render it identically.
   Colour story (temperature as narrative):
     solar gold/orange vs. deep space blue (complementary)  ->
     ice cyan / glacier blue with a thin warm "remaining heat" accent ->
     alarm red + amber against cold navy (crisis tension) ->
     electric violet + cyan (gravity / physics) ->
     near-monochrome darkness -> gold returns (sunrise payoff).
   ===================================================================== */
const W=2160,H=3840,CX=W/2,CY=H/2;
const cv=document.getElementById('c');
const ctx=cv.getContext('2d',{alpha:false});
const HAS_LS='letterSpacing' in ctx;
const QS=new URLSearchParams(location.search);
const FIXED=QS.has('t')?parseFloat(QS.get('t')):null;
const PI=Math.PI,TAU=PI*2;
const {sin,cos,abs,min,max,pow,sqrt,floor,ceil,exp,atan2,hypot,round}=Math;
const FD="'Anton','Impact','Arial Narrow',sans-serif";
const FC="'Montserrat','Arial Black',sans-serif";
const FM="'JetBrains Mono','Consolas',monospace";
let T=0;

/* ---------------- math ---------------- */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const inv=(a,b,x)=>clamp((x-a)/(b-a));
const sstep=(a,b,x)=>{const u=inv(a,b,x);return u*u*(3-2*u);};
const fract=x=>x-floor(x);
const E={
  oC:x=>1-pow(1-x,3), iC:x=>x*x*x, ioC:x=>x<.5?4*x*x*x:1-pow(-2*x+2,3)/2,
  oE:x=>x>=1?1:1-pow(2,-10*x), iE:x=>x<=0?0:pow(2,10*x-10),
  oB:x=>{const c1=1.70158,c3=c1+1;return 1+c3*pow(x-1,3)+c1*pow(x-1,2);},
  oQ:x=>1-(1-x)*(1-x)
};
function hash(n){const s=sin(n*12.9898+78.233)*43758.5453;return s-floor(s);}
function vnoise(x){const i=floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hash(i),hash(i+1),u)*2-1;}
function mulberry(seed){return ()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------------- colour ---------------- */
const C={
  sunCore:[255,238,190],gold:[255,196,64],orange:[255,122,26],ember:[255,72,20],
  ice:[120,225,255],glacier:[52,120,255],frost:[226,244,255],
  alarm:[255,44,74],amber:[255,170,40],violet:[150,100,255],cyan:[60,240,255],
  white:[255,255,255],star:[214,228,255]
};
const rgba=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const mix=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const THERM=[[0,[6,3,26]],[.18,[38,10,92]],[.36,[118,18,140]],[.52,[208,36,92]],[.66,[255,98,30]],[.8,[255,180,40]],[.92,[255,240,140]],[1,[255,255,255]]];
function therm(v){v=clamp(v);for(let i=1;i<THERM.length;i++){if(v<=THERM[i][0]){const a=THERM[i-1],b=THERM[i];return mix(a[1],b[1],(v-a[0])/(b[0]-a[0]));}}return THERM[THERM.length-1][1];}

/* ---------------- canvas helpers ---------------- */
function mkC(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
const glowCache=new Map();
function glowSpr(c){
  const q=[c[0]>>3<<3,c[1]>>3<<3,c[2]>>3<<3],k=q.join(',');
  let s=glowCache.get(k);if(s)return s;
  s=mkC(256,256);const g=s.getContext('2d');
  const gr=g.createRadialGradient(128,128,0,128,128,128);
  gr.addColorStop(0,rgba(q,1));gr.addColorStop(.1,rgba(q,.8));gr.addColorStop(.3,rgba(q,.28));
  gr.addColorStop(.6,rgba(q,.07));gr.addColorStop(1,rgba(q,0));
  g.fillStyle=gr;g.fillRect(0,0,256,256);glowCache.set(k,s);return s;
}
function glow(x,y,r,c,a=1){if(a<=.003||r<=0)return;const ga=ctx.globalAlpha;ctx.globalAlpha=ga*min(1,a);ctx.drawImage(glowSpr(c),x-r,y-r,r*2,r*2);ctx.globalAlpha=ga;}
function addGlow(x,y,r,c,a=1){ctx.save();ctx.globalCompositeOperation='lighter';glow(x,y,r,c,a);ctx.restore();}
function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,max(0,r),0,TAU);}
function rr(x,y,w,h,r){r=min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function line(a,b){ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}
function camShake(a){if(a>0)ctx.translate(vnoise(T*37)*a,vnoise(T*41+50)*a);}
function fillBG(top,bot){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,rgba(top));g.addColorStop(1,rgba(bot));ctx.fillStyle=g;ctx.fillRect(-400,-400,W+800,H+800);}
function txt(s,x,y,o={}){
  const size=o.size||100;
  ctx.save();
  ctx.font=`${o.weight||400} ${size}px ${o.family||FD}`;
  ctx.textAlign=o.align||'center';ctx.textBaseline=o.base||'middle';
  if(HAS_LS&&o.ls){ctx.letterSpacing=o.ls+'px';if((o.align||'center')==='center')x+=o.ls/2;}
  if(o.alpha!=null)ctx.globalAlpha*=o.alpha;
  if(o.comp)ctx.globalCompositeOperation=o.comp;
  if(o.glow){ctx.shadowColor=o.glow;ctx.shadowBlur=o.blur||40;}
  if(o.stroke){ctx.lineWidth=o.lw||8;ctx.strokeStyle=o.stroke;ctx.lineJoin='round';ctx.strokeText(s,x,y);}
  if(o.color!==false){ctx.fillStyle=o.color||'#fff';ctx.fillText(s,x,y);}
  ctx.restore();
}
function measure(s,size,family=FD,weight=400,ls=0){ctx.save();ctx.font=`${weight} ${size}px ${family}`;if(HAS_LS)ctx.letterSpacing=ls+'px';const w=ctx.measureText(s).width;ctx.restore();return w;}
const GLY='0123456789ABCDEFGHJKLMNPRSTUVWXYZ#%&@';
function scramble(s,p,seed=0){if(p>=1)return s;const k=floor(p*s.length);let o='';for(let i=0;i<s.length;i++){const ch=s[i];o+=(i<k||ch===' '||ch===':'||ch==='.')?ch:GLY[floor(hash(i*31.7+floor(T*30)*1.3+seed)*GLY.length)];}return o;}
function chip(x,y,label,col,o={}){
  const size=o.size||44;ctx.save();ctx.font=`800 ${size}px ${FM}`;if(HAS_LS)ctx.letterSpacing='4px';
  const w=ctx.measureText(label).width+size*1.7,h=size*1.95;
  if(o.alpha!=null)ctx.globalAlpha*=o.alpha;
  rr(x-w/2,y-h/2,w,h,h/2);ctx.fillStyle=rgba(o.bg||[4,6,16],o.bga??.62);ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle=rgba(col,.9);ctx.stroke();
  if(o.dot){ctx.fillStyle=rgba(col,(sin(T*9)>0)?1:.3);circle(x-w/2+size*.9,y,size*.22);ctx.fill();}
  ctx.fillStyle=rgba(col);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,x+2+(o.dot?size*.35:0),y+2);ctx.restore();
}
function tag(x,y,dx,dy,label,col,a=1){
  if(a<=0)return;ctx.save();ctx.globalAlpha*=a;ctx.strokeStyle=rgba(col,.9);ctx.lineWidth=3;
  const ex=x+dx+(dx>=0?160:-160);
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+dx,y+dy);ctx.lineTo(ex,y+dy);ctx.stroke();
  ctx.fillStyle=rgba(col);circle(x,y,11);ctx.fill();
  ctx.globalCompositeOperation='lighter';glow(x,y,70,col,.7);ctx.globalCompositeOperation='source-over';
  txt(label,ex+(dx>=0?22:-22),y+dy,{size:46,family:FM,weight:800,ls:5,align:dx>=0?'left':'right',color:rgba(col)});
  ctx.restore();
}
function segRing(cx,cy,r,n,filled,col,w,gap=.035,hot){
  ctx.save();ctx.lineWidth=w;ctx.lineCap='butt';
  for(let i=0;i<n;i++){
    const a0=-PI/2+i/n*TAU+gap,a1=-PI/2+(i+1)/n*TAU-gap;
    ctx.strokeStyle='rgba(255,255,255,0.07)';ctx.beginPath();ctx.arc(cx,cy,r,a0,a1);ctx.stroke();
    const f=clamp(filled-i);
    if(f>0){const c=(hot&&i===floor(filled))?hot:col;ctx.strokeStyle=rgba(c);ctx.shadowColor=rgba(c,.9);ctx.shadowBlur=34;ctx.beginPath();ctx.arc(cx,cy,r,a0,a0+(a1-a0)*f);ctx.stroke();ctx.shadowBlur=0;}
  }

}

  ctx.save();ctx.translate(0,-170);ctx.scale(pulse,pulse);ctx.fillStyle='rgba(255,255,255,0.92)';circle(0,0,135);ctx.fill();ctx.fillStyle='#120a18';ctx.beginPath();ctx.moveTo(-40,-62);ctx.lineTo(70,0);ctx.lineTo(-40,62);ctx.closePath();ctx.fill();ctx.restore();
  if(t>=42.86){ctx.save();ctx.globalCompositeOperation='lighter';for(let k=0;k<3;k++){const ph=fract(T*1.6+k/3);ctx.strokeStyle=rgba(C.gold,(1-ph)*.7);ctx.lineWidth=8;circle(0,-170,150+ph*360);ctx.stroke();}ctx.restore();}
  ctx.restore();
  ctx.save();ctx.globalCompositeOperation='lighter';for(let i=0;i<40;i++){const a=hash(i*2.9)*TAU,rd=900+hash(i*1.3)*400+sin(T*2+i)*40;const x=CX+cos(a+T*.2)*rd*.75,y=1500+sin(a+T*.2)*rd;starburst(x,y,30+hash(i)*30,4,T+i,C.gold,.5*(.5+.5*sin(T*5+i)));}ctx.restore();
}

/* ---------------- timeline ---------------- */
const SHOTS=[

 [2.00,2.96,sh24,{p:.16,fl:.45,fc:C.gold}],

];
const BEATS=[1.55,2.59,6.58,9.87,13.45,14.17,16.43,18.54,21.40,23.48,23.85,25.69,26.81,29.10,31.76,35.82,39.04,41.04,43.11];

/* ---------------- captions (voice-over, word by word) ---------------- */
const LINES=[
 [0.00,2.96,"What if the ^Sun ^disappeared for ^24 ^hours?"],
 [2.96,6.02,"For ^8 ^minutes, nothing changes. Then..."],
 [6.02,9.06,"the ^last ^light arrives. You look up at an ^empty"],
 [9.06,12.14,"^sky. ^Hour ^1: ^temperatures start ^falling."],
 [12.14,15.26,"^Solar ^panels stop producing ^power. ^Cities switch on every ^light"],
 [15.26,18.34,"they have. ^Hour ^12: ^Crops and ^ecosystems"],
 [18.34,21.40,"are ^stressed. You crowd into ^heated ^buildings while governments fight"],
 [21.40,24.34,"^panic and ^rationed ^energy. Now, the ^bigger ^danger:"],
 [24.34,27.44,"Imagine the Sun's ^gravity ^vanishes too. ^Earth would leave"],
 [27.44,29.78,"its usual ^orbit and drift off in a ^straight ^line."],
 [29.78,32.62,"The ^final ^hours: ^pure ^darkness."],
 [32.62,38.50,"You wait, staring up, wondering if the ^Sun will ever ^return. This was more than one ^long ^night."],
 [38.50,43.50,"What's your ^wildest ^what-if question? Drop it in the ^comments. Your idea could become our ^next ^video!"]
];
const GROUPS=[];
(function(){
  const NUM={'24':10,'8':5,'1':3,'12':6},words=[];
  for(const[a,b,str]of LINES){
    const ws=str.split(' ').map(tok=>{const key=tok[0]==='^',w=key?tok.slice(1):tok,core=w.replace(/[^A-Za-z0-9']/g,'');
      let wt=(NUM[core]??core.length)+3;if(/,$/.test(w))wt+=2;if(/[.?!:]$/.test(w))wt+=3;
      const disp=(/\.\.\.$/.test(w)?w:w.replace(/[,.:]+$/,'')).toUpperCase();return{text:disp,key,wt,brk:/[.?!:,]$/.test(w)};});
    const tot=ws.reduce((s,w)=>s+w.wt,0);let acc=a;
    for(const w of ws){w.t0=acc;acc+=w.wt*(b-a)/tot;w.t1=acc;words.push(w);}
  }
  let g=null;
  for(const w of words){
    if(!g||g.words.length>=3||g.chars+1+w.text.length>15||g.brk){g={words:[],chars:-1,brk:false};GROUPS.push(g);}
    g.words.push(w);g.chars+=1+w.text.length;if(w.brk)g.brk=true;
  }
  GROUPS.forEach(g=>{g.t0=g.words[0].t0;g.t1=g.words[g.words.length-1].t1;});
})();
function accentAt(t){if(t<6.02)return C.gold;if(t<9.51)return[255,190,100];if(t<19.01)return C.ice;if(t<24.34)return[255,72,96];if(t<29.78)return[178,140,255];if(t<33.99)return C.ice;return C.gold;}
function layoutGroup(g){
  const size=150;ctx.save();ctx.font=`900 ${size}px ${FC}`;if(HAS_LS)ctx.letterSpacing='-2px';g.ws=g.words.map(w=>ctx.measureText(w.text).width);ctx.restore();
  const sp=40;let tot=g.ws.reduce((a,b)=>a+b,0)+sp*(g.words.length-1);g.size=size;g.sp=sp;
  if(tot>1660){const f=1660/tot;g.size=size*f;g.ws=g.ws.map(v=>v*f);g.sp=sp*f;tot=1660;}g.tot=tot;
}
function drawCaptions(t){
  if(t>=43.5||t<0)return;
  let gi=-1;for(let i=0;i<GROUPS.length;i++){if(t>=GROUPS[i].t0)gi=i;else break;}
  if(gi<0)return;const g=GROUPS[gi],end=gi+1<GROUPS.length?GROUPS[gi+1].t0:g.t1+.3;if(t>=end)return;
  if(!g.ws)layoutGroup(g);
  const acc=accentAt(t),rot=(gi%2?-1:1)*.014,n=g.words.length,sz=g.size;
  ctx.save();ctx.translate(CX,2650);ctx.rotate(rot);
  ctx.font=`900 ${sz}px ${FC}`;if(HAS_LS)ctx.letterSpacing='-2px';ctx.textAlign='center';ctx.textBaseline='alphabetic';
  let x=-g.tot/2;
  for(let k=0;k<n;k++){
    const w=g.words[k],ww=g.ws[k],cx=x+ww/2;x+=ww+g.sp;if(t<w.t0)continue;
    const age=t-w.t0,s=lerp(.45,1,E.oB(clamp(age/.18))),a=clamp(age/.05),active=k===n-1||t<g.words[k+1].t0,base=sz*.36;
    ctx.save();ctx.translate(cx,0);ctx.scale(s,s);ctx.globalAlpha=a;
    if(active){ctx.save();ctx.rotate(-rot*1.6);ctx.shadowColor=rgba(acc,.75);ctx.shadowBlur=60;ctx.fillStyle=rgba(acc);rr(-ww/2-32,-sz*.58,ww+64,sz*1.14,36);ctx.fill();ctx.restore();
      ctx.fillStyle='#070a16';ctx.fillText(w.text,0,base);}
    else{ctx.lineWidth=26;ctx.lineJoin='round';ctx.strokeStyle='rgba(0,0,0,0.92)';ctx.shadowColor='rgba(0,0,0,0.7)';ctx.shadowBlur=36;ctx.strokeText(w.text,0,base);ctx.shadowBlur=0;
      ctx.fillStyle=w.key?rgba(acc):'#ffffff';ctx.fillText(w.text,0,base);}
    ctx.restore();
  }
  ctx.restore();
}

/* ---------------- HUD (story clock) ---------------- */
function drawHUD(t){
  const a=sstep(1.65,1.95,t)*(1-sstep(38.3,38.55,t));if(a<=.01)return;
  const sec=storySec(t),on=t>=36.33,sc=on?C.gold:C.alarm,hr=sec/3600;
  ctx.save();ctx.globalAlpha=a;
  rr(120,300,700,100,50);ctx.fillStyle='rgba(4,6,14,0.55)';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=rgba(sc,.7);ctx.stroke();
  ctx.fillStyle=rgba(sc,on?1:(sin(T*8)>0?1:.3));circle(180,350,15);ctx.fill();
  txt(on?'SUN ONLINE':'SUN OFFLINE',220,352,{size:48,family:FM,weight:800,ls:6,align:'left',color:rgba(sc)});
  rr(1300,300,740,100,50);ctx.fillStyle='rgba(4,6,14,0.55)';ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.stroke();
  txt('T+ '+fmtHMS(sec),2000,352,{size:54,family:FM,weight:800,align:'right',color:'#fff'});
  const x0=120,x1=2040,y=440,n=24,gap=8,sw=(x1-x0-gap*(n-1))/n;
  for(let i=0;i<n;i++){const xx=x0+i*(sw+gap);ctx.fillStyle='rgba(255,255,255,0.13)';ctx.fillRect(xx,y,sw,12);const f=clamp(hr-i);if(f>0){ctx.fillStyle=rgba(on?C.gold:mix(C.gold,C.ice,i/23));ctx.fillRect(xx,y,sw*f,12);}}
  if(t>9.4)txt('TEMP '+fmtT(tempAt(t)),2040,505,{size:44,family:FM,weight:800,align:'right',color:rgba(on?C.gold:C.ice),alpha:sstep(9.4,9.7,t)});
  ctx.restore();
}

/* ---------------- post ---------------- */
let grainPat=null;
function glitch(u,seed){
  const fr=floor(T*30);
  for(let i=0;i<9;i++){const y=floor(hash(i*7.1+seed*3.3+fr)*H),h=40+hash(i*3.7+seed+fr)*260,dx=(hash(i*1.9+seed+fr)-.5)*280*(1-u);ctx.drawImage(cv,0,y,W,h,dx,y,W,h);}
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle=rgba(C.cyan,.1*(1-u));ctx.fillRect(0,hash(seed+fr)*H,W,120);ctx.fillStyle=rgba(C.alarm,.1*(1-u));ctx.fillRect(0,hash(seed+fr+1)*H,W,90);ctx.restore();
}
function post(t){
  ctx.drawImage(VIG,0,0,W,H);
  if(!grainPat)grainPat=ctx.createPattern(GRAIN,'repeat');
  const f=floor(t*24);ctx.save();ctx.globalCompositeOperation='overlay';ctx.globalAlpha=.075;ctx.translate(-hash(f)*512,-hash(f+7)*512);ctx.scale(2,2);ctx.fillStyle=grainPat;ctx.fillRect(0,0,W/2+512,H/2+512);ctx.restore();
}
function render(t){
  T=t;
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.filter='none';ctx.shadowBlur=0;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  let si=0;for(let i=0;i<SHOTS.length;i++)if(t>=SHOTS[i][0])si=i;
  const S=SHOTS[si],lt=t-S[0],d=S[1]-S[0],fx=S[3];
  let k=1+(fx.p||0)*(1-E.oC(clamp(lt/.42)));
  for(const b of BEATS)if(t>=b&&t<b+.6)k+=.035*exp(-(t-b)*9);
  ctx.save();ctx.translate(CX,CY);ctx.scale(k,k);ctx.translate(-CX,-CY);
  try{S[2](lt,d,t);}catch(e){console.error(e);}
  ctx.restore();
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.shadowBlur=0;ctx.filter='none';
  if(fx.g&&lt<fx.g)glitch(lt/fx.g,si);
  drawHUD(t);
  if(fx.fl&&lt<.3){ctx.fillStyle=rgba(fx.fc||C.white,fx.fl*pow(1-lt/.3,2));ctx.fillRect(0,0,W,H);}
  for(const b of BEATS)if(t>=b&&t<b+.25){ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle=rgba(accentAt(t),.1*(1-(t-b)/.25));ctx.fillRect(0,0,W,H);ctx.restore();}
  drawCaptions(t);
  post(t);
}

/* ---------------- boot ---------------- */
function init(){
  genStars();initGL();genNebula();genFrost();CITY=genCity();CROPS=genCrops();PEOPLE=genPeople();genPersonSprite();genVig();genGrain();
  TREES=[genTree(41,330,3520,560,-PI/2-.05),genTree(42,1830,3560,620,-PI/2+.06),genTree(43,1120,3720,380,-PI/2+.02)];
}
init();
const fontP=Promise.all(["400 100px 'Anton'","900 100px 'Montserrat'","800 100px 'JetBrains Mono'"].map(f=>document.fonts.load(f))).catch(()=>{});
let started=false,t0=null;
function loop(){const now=performance.now();if(t0===null)t0=now;render((now-t0)/1000);requestAnimationFrame(loop);}
function start(){
  if(started)return;started=true;
  try{genDarkPts();}catch(e){}
  window.__ready=true;
  if(FIXED!==null){render(FIXED);window.__done=true;}else requestAnimationFrame(loop);
}
window.__renderAt=t=>render(t);
// Fit the 2160x3840 canvas to the viewport (no-op when the viewport is exactly 2160x3840).
function fit(){const vw=innerWidth||W,vh=innerHeight||H,s=min(vw/W,vh/H);
  cv.style.transform=(abs(s-1)<.001&&vw===W)?'none':`translate(${(vw-W*s)/2}px,${(vh-H*s)/2}px) scale(${s})`;}
fit();addEventListener('resize',fit);
Promise.race([fontP,new Promise(r=>setTimeout(r,2500))]).then(start);
})();
