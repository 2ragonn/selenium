/* ==========================================================================
   WHAT IF EVERY HUMAN DISAPPEARED?  —  YouTube Short, 2160x3840 (9:16), 46.5s
   --------------------------------------------------------------------------
   COLOR THEORY (story-driven palette that evolves with the narration)
   ACT I  "Vanishing city"  : complementary pair — electric cyan #19E3FF vs
                              sodium amber #FF9A2E on night navy #050817.
   ACT II "Systems fail"    : cyan is drained, alarm red #FF2D55 takes over
                              (warm/cold tension -> danger -> darkness).
   ACT III "Rewilding"      : analogous greens #0E5E3A / #2BD67B / #B8FF3C,
                              lit by golden sun #FFC845, with split-complementary
                              violet/pink dusk skies #7B4DFF / #FF4FA0.
   CTA                      : lime #B8FF3C + magenta #FF4FA0 on deep forest.
   ========================================================================== */
'use strict';
const W=2160,H=3840,DUR=46.48;
const cv=document.getElementById('c'),X=cv.getContext('2d');
const B=document.createElement('canvas');B.width=W;B.height=H;const bx=B.getContext('2d');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H)||1;const st=document.getElementById('stage');
  st.style.transform=`translate(${(innerWidth-W*s)/2}px,${(innerHeight-H*s)/2}px) scale(${s})`;}
addEventListener('resize',fit);fit();
['100px "Anton"','800 100px "JetBrains Mono"','500 100px "JetBrains Mono"','700 100px "Space Grotesk"','500 100px "Space Grotesk"']
  .forEach(f=>{try{document.fonts.load(f)}catch(e){}});

/* ---------- math ---------- */
const PI=Math.PI,TAU=PI*2;
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const inv=(a,b,v)=>clamp((v-a)/(b-a));
const E={
  oc:t=>1-Math.pow(1-t,3), ic:t=>t*t*t, ioc:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  oe:t=>t>=1?1:1-Math.pow(2,-10*t), ie:t=>t<=0?0:Math.pow(2,10*t-10),
  ob:t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)},
  oel:t=>t<=0?0:t>=1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*TAU/3)+1,
  ios:t=>-(Math.cos(PI*t)-1)/2, oq:t=>1-(1-t)*(1-t)
};
function RNG(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function vn(x){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hash(i),hash(i+1),u)*2-1}
function vn2(x,y){const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j,ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
  const h=(a,b)=>hash(a*57.13+b*311.7);return lerp(lerp(h(i,j),h(i+1,j),ux),lerp(h(i,j+1),h(i+1,j+1),ux),uy)}
function fbm(x,y){return vn2(x,y)*.5+vn2(x*2.03,y*2.03)*.25+vn2(x*4.1,y*4.1)*.125+vn2(x*8.2,y*8.2)*.0625}

/* ---------- palette ---------- */
const C={night:'#050817',navy:'#0A1238',deep:'#02030A',cyan:'#19E3FF',amber:'#FF9A2E',red:'#FF2D55',white:'#F4F7FF',
  green:'#2BD67B',lime:'#B8FF3C',moss:'#0E5E3A',forest:'#04140D',gold:'#FFC845',violet:'#7B4DFF',pink:'#FF4FA0',dusk:'#2A1640',steel:'#1A2238'};
const _rgb={};
function rgb(h){return _rgb[h]||(_rgb[h]=(n=>[n>>16&255,n>>8&255,n&255])(parseInt(h.slice(1),16)))}
function rgba(h,a){const c=rgb(h);return `rgba(${c[0]},${c[1]},${c[2]},${a})`}
function mix(a,b,t){t=clamp(t);const A=rgb(a),Q=rgb(b);return '#'+[0,1,2].map(i=>Math.round(A[i]+(Q[i]-A[i])*t).toString(16).padStart(2,'0')).join('')}

/* ---------- drawing helpers ---------- */
const F={a:'"Anton", Impact, "Arial Narrow", sans-serif',m:'"JetBrains Mono", ui-monospace, Consolas, monospace',g:'"Space Grotesk", "Segoe UI", Arial, sans-serif'};
function T(c,s,x,y,o={}){
  c.save();c.font=`${o.w||''} ${o.size||100}px ${o.f||F.a}`;
  c.textAlign=o.al||'center';c.textBaseline=o.bl||'middle';
  if('letterSpacing' in c)c.letterSpacing=(o.ls||0)+'px';
  c.globalAlpha=o.a==null?1:o.a;
  if(o.sh){c.shadowColor=o.sh;c.shadowBlur=o.sb||40;}
  if(o.st){c.lineJoin='round';c.lineWidth=o.sw||10;c.strokeStyle=o.st;c.strokeText(s,x,y);c.shadowBlur=0;}
  if(o.fill!==false){c.fillStyle=o.c||'#fff';c.fillText(s,x,y);}
  c.restore();
}
function rgbT(c,s,x,y,o,off){ // chromatic-aberration text (R+G+B additive = white core)
  c.save();c.globalCompositeOperation='lighter';
  T(c,s,x-off,y,{...o,c:'#ff1030',st:null,sh:null});T(c,s,x,y,{...o,c:'#10ff50',st:null,sh:null});T(c,s,x+off,y+off*.2,{...o,c:'#2040ff',st:null,sh:null});
  c.restore();
}
function tw(c,s,size,f=F.a,w=''){c.font=`${w} ${size}px ${f}`;if('letterSpacing' in c)c.letterSpacing='0px';return c.measureText(s).width}
const _glow={};
function glowSpr(col){if(_glow[col])return _glow[col];const k=document.createElement('canvas');k.width=k.height=256;const g=k.getContext('2d');
  const gr=g.createRadialGradient(128,128,0,128,128,128);gr.addColorStop(0,rgba(col,1));gr.addColorStop(.18,rgba(col,.55));gr.addColorStop(.5,rgba(col,.14));gr.addColorStop(1,rgba(col,0));
  g.fillStyle=gr;g.fillRect(0,0,256,256);return _glow[col]=k}
function G(c,x,y,r,col,a=1){if(a<=0||r<=0)return;c.globalAlpha=a;c.drawImage(glowSpr(col),x-r,y-r,r*2,r*2)} // caller sets 'lighter'
function glow(c,x,y,r,col,a=1){c.save();c.globalCompositeOperation='lighter';G(c,x,y,r,col,a);c.restore()}
function fillBG(c,stops,y0=0,y1=H){const g=c.createLinearGradient(0,y0,0,y1);stops.forEach(s=>g.addColorStop(s[0],s[1]));c.fillStyle=g;c.fillRect(-W,-H,W*3,H*3)}
function rrect(c,x,y,w,h,r){c.beginPath();c.roundRect?c.roundRect(x,y,w,h,r):c.rect(x,y,w,h)}
function camera(c,s,dx=0,dy=0,rot=0,cx=W/2,cy=H/2){c.translate(cx,cy);c.rotate(rot);c.scale(s,s);c.translate(-cx+dx,-cy+dy)}
function rays(c,x,y,n,len,col,a,rot,spread=.09){c.save();c.globalCompositeOperation='lighter';
  for(let i=0;i<n;i++){const an=rot+i/n*TAU+vn(i*3.1)*.2,w=spread*(.5+hash(i*7.7));
    const g=c.createRadialGradient(x,y,0,x,y,len);g.addColorStop(0,rgba(col,a*(.5+.5*hash(i))));g.addColorStop(1,rgba(col,0));
    c.fillStyle=g;c.beginPath();c.moveTo(x,y);c.arc(x,y,len,an-w,an+w);c.closePath();c.fill()}
  c.restore()}
function dust(c,t,n,seed,col,sz,a,vy=-40,vx=0,area=[0,0,W,H]){c.save();c.globalCompositeOperation='lighter';
  for(let i=0;i<n;i++){const h1=hash(seed+i*1.37),h2=hash(seed+i*2.71),h3=hash(seed+i*4.13);
    const x=area[0]+((h1*area[2]+vx*t*(.5+h3)+vn(t*.5+i)*40)%area[2]+area[2])%area[2];
    const y=area[1]+((h2*area[3]+vy*t*(.5+h3))%area[3]+area[3])%area[3];
    G(c,x,y,sz*(.4+h3),col,a*(.4+.6*Math.abs(Math.sin(t*2+i))))}
  c.restore()}

/* ---------- silhouettes ---------- */
function person(c,x,y,h,col,ph=0){c.fillStyle=col;c.beginPath();
  c.arc(x,y-h*.9,h*.085,0,TAU);c.fill();
  rrect(c,x-h*.15,y-h*.8,h*.3,h*.43,h*.09);c.fill();
  const sw=Math.sin(ph)*h*.03;
  rrect(c,x-h*.13+sw,y-h*.42,h*.11,h*.42,h*.05);c.fill();rrect(c,x+h*.02-sw,y-h*.42,h*.11,h*.42,h*.05);c.fill();
  rrect(c,x-h*.21,y-h*.76,h*.075,h*.36,h*.04);c.fill();rrect(c,x+h*.135,y-h*.76,h*.075,h*.36,h*.04);c.fill();}
function leaf(c,x,y,s,a,col){c.save();c.translate(x,y);c.rotate(a);c.fillStyle=col;c.beginPath();c.moveTo(0,0);
  c.quadraticCurveTo(s*.5,-s*.42,s,0);c.quadraticCurveTo(s*.5,s*.42,0,0);c.fill();c.restore()}
function weed(c,x,y,ang,len,depth,g,seed,cols){ // recursive growing plant
  if(g<=0||depth<0)return;const r=RNG(seed);const L=len*clamp(g*1.6);
  const bend=(r()-.5)*.9;const ex=x+Math.cos(ang)*L,ey=y+Math.sin(ang)*L;
  const mx=x+Math.cos(ang+bend*.5)*L*.5,my=y+Math.sin(ang+bend*.5)*L*.5;
  c.strokeStyle=cols[0];c.lineWidth=Math.max(2,len*.06);c.lineCap='round';c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(mx,my,ex,ey);c.stroke();
  const nl=3;for(let i=1;i<=nl;i++){const k=i/(nl+1);if(g*1.6<k)break;const lx=lerp(x,ex,k),ly=lerp(y,ey,k);
    const ls=len*.38*clamp((g*1.6-k)*2);leaf(c,lx,ly,ls,ang+(i%2?-1:1)*(.9+r()*.4),i%2?cols[1]:cols[2])}
  if(g>.45){const g2=(g-.45)/.55;const n=depth>1?2+(r()>.5):1;
    for(let i=0;i<n;i++)weed(c,ex,ey,ang+(r()-.5)*1.3,len*(.6+r()*.2),depth-1,g2,seed*7+i*13+1,cols)}
  else if(depth===0&&g>.9&&cols[3]){c.fillStyle=cols[3];c.beginPath();c.arc(ex,ey,len*.12,0,TAU);c.fill()}
}
function crown(c,x,y,r,seed,cols,g=1){if(g<=0)return;const q=RNG(seed);r*=E.ob(clamp(g));
  for(let l=0;l<3;l++){c.fillStyle=cols[l];const n=7-l*2;
    for(let i=0;i<n;i++){const a=q()*TAU,d=q()*r*(.55-l*.12);const rr=r*(.42-l*.08)*(.8+q()*.4);
      c.beginPath();c.arc(x+Math.cos(a)*d-l*r*.08,y+Math.sin(a)*d*.8-l*r*.12,rr,0,TAU);c.fill()}}}
function vine(c,pts,prog,w,seed,cols){ // pts: polyline; grows along with leaves
  if(prog<=0)return;const q=RNG(seed);const n=pts.length-1;const end=prog*n;
  c.strokeStyle=cols[0];c.lineWidth=w;c.lineCap='round';c.lineJoin='round';c.beginPath();c.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<=Math.ceil(end);i++){const k=Math.min(1,end-(i-1));c.lineTo(lerp(pts[i-1][0],pts[i][0],k),lerp(pts[i-1][1],pts[i][1],k))}c.stroke();
  for(let i=1;i<=Math.floor(end);i++){const s=w*(3+q()*3);leaf(c,pts[i][0],pts[i][1],s,(i%2?-.6:-2.5)+q()*.6,cols[1+(i%2)])}}
function vinePts(x0,y0,x1,y1,n,amp,seed){const p=[];for(let i=0;i<=n;i++){const k=i/n;p.push([lerp(x0,x1,k)+Math.sin(k*9+seed)*amp+vn(seed+k*6)*amp,lerp(y0,y1,k)])}return p}
function deer(c,x,y,s,col,ph=0,walk=0,head=1,antl=true,dir=1){
  c.save();c.translate(x,y);c.scale(s*dir,s);c.fillStyle=col;c.strokeStyle=col;c.lineCap='round';c.lineJoin='round';
  c.lineWidth=.085;
  c.beginPath();c.ellipse(-.46,-1.0,.24,.3,.2,0,TAU);c.fill();c.beginPath();c.ellipse(.44,-1.0,.2,.27,-.1,0,TAU);c.fill();
  for(const [lx,o,f] of [[-.5,0,1],[-.36,PI,1],[.42,PI*.5,-1],[.56,PI*1.5,-1]]){
    const a=Math.sin(ph+o)*.42*walk,kx=lx+Math.sin(a)*.42,ky=-.92+Math.cos(a)*.42;
    const b=a+Math.max(0,Math.sin(ph+o+1.3))*.7*walk*f;
    c.beginPath();c.moveTo(lx,-1.0);c.lineTo(kx,ky);c.lineTo(kx+Math.sin(b)*.5,ky+Math.cos(b)*.5);c.stroke()}
  c.beginPath();c.ellipse(0,-1.08,.72,.3,0,0,TAU);c.fill();
  c.beginPath();c.ellipse(.42,-1.1,.3,.31,0,0,TAU);c.fill();
  c.beginPath();c.ellipse(-.72,-1.18,.1,.06,-.4,0,TAU);c.fill();
  const hx=lerp(1.08,.9,head),hy=lerp(-.45,-1.78,head);
  c.beginPath();c.moveTo(.3,-1.28);c.quadraticCurveTo(hx-.25,(hy-1.2)/2,hx-.12,hy-.04);c.lineTo(hx+.06,hy+.12);
  c.quadraticCurveTo(.85,(hy-1)/2+.1,.72,-.98);c.closePath();c.fill();
  c.beginPath();c.ellipse(hx,hy,.2,.12,.35*head-.9*(1-head),0,TAU);c.fill();
  c.beginPath();c.ellipse(hx+.18,hy+.08*head+.12*(1-head),.12,.065,.5*head+.4*(1-head),0,TAU);c.fill();
  c.beginPath();c.ellipse(hx-.1,hy-.15,.13,.05,-.7,0,TAU);c.fill();
  c.beginPath();c.ellipse(hx-.16,hy-.1,.12,.045,-1.2,0,TAU);c.fill();
  if(antl){c.lineWidth=.04;for(const sd of [0,.07]){const bx0=hx-.04-sd,by0=hy-.14;
    c.beginPath();c.moveTo(bx0,by0);c.quadraticCurveTo(bx0-.15,by0-.35,bx0-.32+sd,by0-.7);c.stroke();
    c.beginPath();c.moveTo(bx0-.08,by0-.22);c.lineTo(bx0+.06,by0-.48);c.stroke();
    c.beginPath();c.moveTo(bx0-.2,by0-.48);c.lineTo(bx0-.06,by0-.72);c.stroke();
    c.beginPath();c.moveTo(bx0-.12,by0-.08);c.lineTo(bx0-.3,by0-.2);c.stroke()}}
  c.restore()}
function dogSit(c,x,y,s,col,wag=0,tilt=0,collar=null){c.save();c.translate(x,y);c.scale(s,s);c.fillStyle=col;c.strokeStyle=col;
  c.beginPath();c.ellipse(0,-.4,.47,.42,0,0,TAU);c.fill();
  c.beginPath();c.ellipse(0,-.86,.33,.46,0,0,TAU);c.fill();
  c.beginPath();c.moveTo(.3,-.08);c.quadraticCurveTo(.6,-.02+wag*.06,.85,-.08-wag*.14);c.lineWidth=.1;c.lineCap='round';c.stroke();
  c.fillRect(-.17,-1.38,.34,.3);
  c.translate(.02,-1.42);c.rotate(tilt);
  c.beginPath();c.ellipse(0,0,.25,.23,0,0,TAU);c.fill();
  c.beginPath();c.ellipse(.27,.07,.19,.105,.12,0,TAU);c.fill();
  c.beginPath();c.ellipse(-.19,.08,.09,.2,.28,0,TAU);c.fill();
  c.beginPath();c.ellipse(.13,.04,.085,.18,-.25,0,TAU);c.fill();
  c.restore();
  if(collar){c.save();c.translate(x,y);c.scale(s,s);c.fillStyle=collar;rrect(c,-.19,-1.25,.38,.06,.03);c.fill();
    c.globalCompositeOperation='lighter';G(c,.1,-1.17,.08,C.gold,.9);c.restore()}}
function dogRun(c,x,y,s,col,ph){c.save();c.translate(x,y);c.scale(s,s);c.fillStyle=col;c.strokeStyle=col;c.lineCap='round';
  const bob=Math.sin(ph*2)*.04;c.translate(0,bob);
  c.lineWidth=.08;
  for(const [lx,o] of [[-.42,0],[-.3,.5],[.38,PI],[.5,PI+.5]]){const a=Math.sin(ph+o)*.8;
    c.beginPath();c.moveTo(lx,-.72);const kx=lx+Math.sin(a)*.28,ky=-.72+Math.cos(a)*.28;c.lineTo(kx,ky);
    c.lineTo(kx+Math.sin(a+(lx<0?.6:-.6))*.3,ky+Math.cos(a+(lx<0?.6:-.6))*.3);c.stroke()}
  c.beginPath();c.ellipse(0,-.8,.55,.19,-.05,0,TAU);c.fill();
  c.beginPath();c.ellipse(.36,-.84,.24,.22,0,0,TAU);c.fill();
  c.beginPath();c.moveTo(.45,-.95);c.lineTo(.68,-1.12);c.lineTo(.78,-.98);c.lineTo(.58,-.82);c.closePath();c.fill();
  c.beginPath();c.ellipse(.75,-1.06,.15,.11,.2,0,TAU);c.fill();c.beginPath();c.ellipse(.9,-1.02,.1,.05,.2,0,TAU);c.fill();
  c.beginPath();c.moveTo(.66,-1.13);c.lineTo(.64,-1.32);c.lineTo(.74,-1.15);c.fill();
  c.lineWidth=.07;c.beginPath();c.moveTo(-.52,-.86);c.quadraticCurveTo(-.75,-1.05+Math.sin(ph*2)*.1,-.85,-.95);c.stroke();

/* ---------- pre-rendered assets (built once before playback) ---------- */
const A={};const BUILD=[];
function mk(w,h){const k=document.createElement('canvas');k.width=w;k.height=h;return[k,k.getContext('2d')]}
function skylineLayer(seed,h,minW,maxW,minH,maxH,bcol,wins,litP,ws){
  const [k,g]=mk(Math.round(W*1.7),h);const q=RNG(seed);let x=0;
  while(x<k.width){const w=minW+q()*(maxW-minW),bh=minH+q()*(maxH-minH),top=h-bh;g.fillStyle=bcol;g.fillRect(x,top,w,bh);
    if(q()<.35){g.fillRect(x+w*.3,top-bh*.08,w*.4,bh*.08);if(q()<.6)g.fillRect(x+w*.48,top-bh*.22,6,bh*.14)}
    for(let yy=top+ws*2;yy<h-ws;yy+=ws*2.1)for(let xx=x+ws;xx<x+w-ws*1.5;xx+=ws*1.7){
      if(q()<litP){g.globalAlpha=.35+q()*.65;g.fillStyle=wins[q()*wins.length|0];g.fillRect(xx,yy,ws,ws*1.25)}}
    g.globalAlpha=1;x+=w+q()*24}
  return k}
BUILD.push(()=>{
  A.sky1=skylineLayer(21,1500,140,300,500,1400,'#0a0f2a',[C.cyan,'#9fe9ff',C.amber,'#ffd28a'],.28,16);
  A.sky2=skylineLayer(22,1900,200,420,800,1850,'#060a1d',[C.cyan,C.amber,'#ffe0a8'],.33,22);
  A.sky3=skylineLayer(23,2300,300,560,900,2200,'#03050f',[C.amber,'#ffd28a',C.cyan],.22,30);
  A.fsky1=skylineLayer(31,1500,140,300,500,1400,'#123a2c',['#2f6b4a'],.0,16);
  A.fsky2=skylineLayer(32,1900,200,420,800,1850,'#0b2a1f',['#1d4a36'],.0,22);
  // hero figure for disintegration
  const [k,g]=mk(1100,2520);person(g,550,2500,2400,'#fff');A.figMask=k;
  const [k2,g2]=mk(1100,2520);person(g2,556,2494,2400,C.cyan);g2.globalCompositeOperation='source-atop';
  g2.fillStyle='#ffb36b';g2.fillRect(0,0,1100,700);person(g2,540,2510,2400,'#05081a');A.fig=k2;
  const d=g.getImageData(0,0,1100,2520).data;A.cells=[];const q=RNG(5);
  for(let yy=0;yy<2520;yy+=22)for(let xx=0;xx<1100;xx+=22)if(d[((yy+11)*1100+xx+11)*4+3]>128)A.cells.push({x:xx,y:yy,r1:q(),r2:q(),r3:q()});
  // grain frames
  A.grain=[];for(let i=0;i<4;i++){const [gk,gg]=mk(540,960);const im=gg.createImageData(540,960);const r=RNG(99+i);
    for(let j=0;j<im.data.length;j+=4){const v=r()*255|0;im.data[j]=im.data[j+1]=im.data[j+2]=v;im.data[j+3]=255}gg.putImageData(im,0,0);A.grain.push(gk)}
});

/* =============================== SHOTS ================================== */
