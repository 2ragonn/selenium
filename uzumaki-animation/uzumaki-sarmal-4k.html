    for (let a = 0; a < arms; a++) { const base = rot + a / arms * TAU; for (let i = 0; i <= 160; i++) { const th = thMax * i / 160, r = th / TAU * pitch, ang = base + th; const x = CX + Math.cos(ang) * r, y = CY + Math.sin(ang) * r; i ? g.lineTo(x, y) : g.moveTo(x, y); } }
  }
  function drawTransition(i, s, type, td) {
    const q = clamp(s / td); const prev = c; ctx.save(); ctx.setTransform(RS, 0, 0, RS, 0, 0);
    runScene(i - 1, SCN[i - 1].d + s, ctx); // outgoing continues
    ctx.setTransform(RS, 0, 0, RS, 0, 0);
    runScene(i, s, octx);
    octx.save(); octx.setTransform(RS, 0, 0, RS, 0, 0); octx.globalCompositeOperation = 'destination-in'; octx.fillStyle = '#000'; octx.strokeStyle = '#000'; octx.lineCap = 'round'; octx.lineJoin = 'round';
    const Rmax = hyp(W, H) / 2 * 1.05;
    if (type === 'spiral') {
      const arms = 3, pitch = 1500, e = E.io2(q), w = pitch / arms * lerp(.12, 1.25, E.o2(e)), rot = e * 1.6;
      ctx.lineCap = 'round'; ctx.strokeStyle = INK; ctx.lineWidth = w + 56; armsPath(ctx, e, arms, rot, Rmax, pitch); ctx.stroke();
      octx.lineWidth = w; armsPath(octx, e, arms, rot, Rmax, pitch); octx.stroke();
    } else if (type === 'ink' || type === 'iris') {
      const e = E.io2(q), R = e * Rmax * 1.12, pts = []; const ox = CX + (type === 'ink' ? 400 : 0), oy = CY + (type === 'ink' ? -200 : 0);
      for (let k = 0; k < 90; k++) { const a = k / 90 * TAU, wob = type === 'ink' ? 1 + (vn(Math.cos(a) * 2 + 7, Math.sin(a) * 2 + 3) - .5) * .55 * (1 - e * .6) : 1; pts.push([ox + Math.cos(a) * R * wob, oy + Math.sin(a) * R * wob]); }
      ctx.fillStyle = INK; ctx.beginPath(); pts.forEach((p, j) => j ? ctx.lineTo(p[0] * 1, p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.lineWidth = 50; ctx.strokeStyle = INK; ctx.stroke();
      octx.beginPath(); pts.forEach((p, j) => j ? octx.lineTo(p[0], p[1]) : octx.moveTo(p[0], p[1])); octx.closePath(); octx.fill();
    } else if (type === 'slide') {
      const e = E.io3(q), sl = 380, x = lerp(-sl, W + sl, e), poly = [[-sl, 0], [x, 0], [x - sl, H], [-sl, H]];
      ctx.fillStyle = INK; ctx.beginPath(); ctx.moveTo(x + 40, 0); ctx.lineTo(x - sl + 40, H); ctx.lineTo(-sl, H); ctx.lineTo(-sl, 0); ctx.closePath(); ctx.fill();
      octx.beginPath(); poly.forEach((p, j) => j ? octx.lineTo(p[0], p[1]) : octx.moveTo(p[0], p[1])); octx.closePath(); octx.fill();
    } else { octx.fillRect(-10, -10, W + 20, H + 20); }
    octx.restore(); ctx.restore();
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(ocv, 0, 0); ctx.restore(); c = prev;
  }
  /* --- post processing --- */
  function post(t, n) {
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = .9; ctx.drawImage(vcv, 0, 0);
    // film grain
    const R = rng(BT * 7 + 3); const pat = ctx.createPattern(TEX.grainCv, 'repeat'); pat.setTransform(new DOMMatrix().translate(R() * 512, R() * 512).scale(2.2 * RS)); ctx.globalAlpha = .075; ctx.fillStyle = pat; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.restore();
    if (CONFIG.subtitles) subtitle(SCN[n - 1], t);
  }
  function subtitle(sc, t) {
    c = ctx; ctx.save(); ctx.setTransform(RS, 0, 0, RS, 0, 0); const size = 82, lines = wrapText(sc.text, 2900, size, F_S, 800), lh = size * 1.3, y0 = H - 110 - lines.length * lh;
    ctx.globalAlpha = clamp((t - sc.s) / .15) * clamp((sc.e - t) / .1); lines.forEach((l, i) => txt(l, CX, y0 + (i + .5) * lh, { size, font: F_S, w: 800, col: '#fff', st: INK, sw: 16 })); ctx.restore();
  }
  let lastN = 1;
  function renderAt(t) {
    t = clamp(t, 0, TOTAL - 1e-4); GT = t; BT = Math.floor(t * 10); c = ctx;
    let i = 0; for (let k = 0; k < SCN.length; k++) if (t >= SCN[k].s) i = k; else break; lastN = SCN[i].n;
    const sc = SCN[i], s = t - sc.s, tr = TRN[sc.n];
    if (tr && i > 0 && s < tr[1]) drawTransition(i, s, tr[0], tr[1]); else runScene(i, s, ctx);
    // global fade in at start, fade out at the very end
    ctx.save(); ctx.setTransform(RS, 0, 0, RS, 0, 0); if (t < .4) dimmer(1 - t / .4); if (t > TOTAL - .3) dimmer((t - (TOTAL - .3)) / .3); ctx.restore();
    post(t, sc.n);
  }
  window.__renderAt = renderAt; window.__duration = TOTAL; window.__scenes = SCN; window.__config = CONFIG;
  window.__ready = false; window.__done = false;

  /* --- autoplay loop --- */
  let startWall = null, tPrev = 0, fixedDt = parseFloat(QS.get('fixed') || '0'), speed = parseFloat(QS.get('speed') || '1'), t0 = parseFloat(QS.get('t') || '0'), paused = false, pausedAt = 0, curT = t0;
  function loop(now) {
    if (window.__stop) return;
    if (!paused) { if (fixedDt > 0) curT += fixedDt * speed; else { if (startWall === null) startWall = now - t0 / speed * 1000; curT = (now - startWall) / 1000 * speed; } }
    renderAt(curT); window.__t = curT;
    if (curT >= TOTAL) { window.__done = true; document.title += ' ✓'; dispatchEvent(new Event('uzumaki-done')); return; }
    requestAnimationFrame(loop);
  }
  addEventListener('keydown', e => {
    if (e.key === 's' || e.key === 'S') CONFIG.subtitles = !CONFIG.subtitles;
    else if (e.key === ' ') { paused = !paused; if (!paused && fixedDt <= 0) startWall = performance.now() - curT / speed * 1000; }
    else if (e.key === 'ArrowRight') { curT += 5; startWall = performance.now() - curT / speed * 1000; } else if (e.key === 'ArrowLeft') { curT = Math.max(0, curT - 5); startWall = performance.now() - curT / speed * 1000; }
    if (paused) renderAt(curT);
  });
  const fontsReady = Promise.race([
    Promise.all([document.fonts.load('140px Anton', 'İĞŞÇÖÜığşçöü0123456789'), document.fonts.load('800 80px "Shippori Mincho B1"', 'İĞŞÇÖÜığşçöü')]).catch(() => 0),
    new Promise(r => setTimeout(r, 3000))
  ]);
  fontsReady.then(() => {
    window.__ready = true; document.body.classList.add('go');
    if (QS.get('manual') === '1') { renderAt(t0); return; }
    requestAnimationFrame(loop);
  });
})();
