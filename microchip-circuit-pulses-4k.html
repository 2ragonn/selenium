<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Microchip Circuit Board Current Pulses - 4K 15s Seamless Loop</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  canvas { position: absolute; left: 50%; top: 50%; width: 3840px; height: 2160px; display: block;
           transform-origin: 50% 50%; transform: translate(-50%, -50%); background: #000; }
</style>
</head>
<body>
<canvas id="c" width="3840" height="2160"></canvas>
<script>
(() => {
'use strict';

/* =====================================================================
   MICROCHIP CIRCUIT BOARD - CURRENT ELECTRICITY PULSES
   3840x2160 - 15.000s - every motion is periodic in T, so the loop is seamless.
   Debug / frame-stepping: open with ?t=3.5 , or call window.renderFrame(seconds).
   ===================================================================== */

const T = 15, W = 3840, H = 2160, TAU = Math.PI * 2;
const WW = 4800, WH = 2700, CX = WW / 2, CY = WH / 2;   // world (board) size in units
const SS = 1.1;                                          // static layer pixel density

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });

/* fit canvas into any viewport (exactly 1:1 when viewport is 3840x2160) */
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  canvas.style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize', fit); fit();

/* ---------- helpers ---------- */
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
let R = rng(90210);
const rnd = (a = 0, b = 1) => a + (b - a) * R();
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(R() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const sstep = (a, b, x) => { x = clamp((x - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const mix = (c, d, k) => [c[0] + (d[0] - c[0]) * k, c[1] + (d[1] - c[1]) * k, c[2] + (d[2] - c[2]) * k].map(Math.round);
const FONT = 'ui-monospace, "Cascadia Mono", Consolas, Menlo, "DejaVu Sans Mono", monospace';

/* neon palette (cyan-dominant with electric blue, violet, magenta, amber accents) */
const CYAN = [60, 236, 255], BLUE = [64, 132, 255], VIOLET = [158, 96, 255], MAGENTA = [255, 72, 196], AMBER = [255, 176, 66];
const FARCOLS = [[40, 120, 200], [40, 120, 200], [70, 80, 200], [30, 170, 200], [120, 60, 190]];
const PAL = [CYAN, CYAN, CYAN, CYAN, BLUE, BLUE, VIOLET, MAGENTA, AMBER];
const pickCol = () => pick(PAL);

const DX = [1, Math.SQRT1_2, 0, -Math.SQRT1_2, -1, -Math.SQRT1_2, 0, Math.SQRT1_2];
const DY = [0, Math.SQRT1_2, 1, Math.SQRT1_2, 0, -Math.SQRT1_2, -1, -Math.SQRT1_2];

/* ---------- world layout constants ---------- */
const DIE = { x: CX - 390, y: CY - 390, s: 780 };         // silicon die
const PKG = { x: CX - 600, y: CY - 600, s: 1200 };        // package substrate

/* ---------- occupancy grid (keeps generated stuff from overlapping) ---------- */
const OC = 20, OW = Math.ceil(WW / OC), OH = Math.ceil(WH / OC);
const occ = new Uint8Array(OW * OH);
function occCircle(x, y, r) {
  const x0 = Math.max(0, Math.floor((x - r) / OC)), x1 = Math.min(OW - 1, Math.floor((x + r) / OC));
  const y0 = Math.max(0, Math.floor((y - r) / OC)), y1 = Math.min(OH - 1, Math.floor((y + r) / OC));
  for (let j = y0; j <= y1; j++) for (let i = x0; i <= x1; i++) occ[j * OW + i] = 1;
}
function occRect(x0, y0, x1, y1) {
  const a = Math.max(0, Math.floor(x0 / OC)), b = Math.min(OW - 1, Math.floor(x1 / OC));
  const c = Math.max(0, Math.floor(y0 / OC)), d = Math.min(OH - 1, Math.floor(y1 / OC));
  for (let j = c; j <= d; j++) for (let i = a; i <= b; i++) occ[j * OW + i] = 1;
}
function occFreeRect(x0, y0, x1, y1) {
  if (x0 < 90 || y0 < 90 || x1 > WW - 90 || y1 > WH - 90) return false;
  const a = Math.floor(x0 / OC), b = Math.floor(x1 / OC), c = Math.floor(y0 / OC), d = Math.floor(y1 / OC);
  for (let j = c; j <= d; j++) for (let i = a; i <= b; i++) if (occ[j * OW + i]) return false;
  return true;
}
function occFreePt(x, y, r) { return occFreeRect(x - r, y - r, x + r, y + r); }
function occLine(a, b, r) {
  const n = Math.max(1, Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / (OC * 0.5)));
  for (let i = 0; i <= n; i++) occCircle(a.x + (b.x - a.x) * i / n, a.y + (b.y - a.y) * i / n, r);
}
function occPoly(pts, r) { for (let i = 0; i < pts.length - 1; i++) occLine(pts[i], pts[i + 1], r); }

/* ---------- geometry ---------- */
function offsetPoly(pts, d) {
  const n = pts.length, nx = [], ny = [], out = [];
  for (let i = 0; i < n - 1; i++) { const dx = pts[i + 1].x - pts[i].x, dy = pts[i + 1].y - pts[i].y, l = Math.hypot(dx, dy) || 1; nx.push(-dy / l); ny.push(dx / l); }
  for (let i = 0; i < n; i++) {
    if (i === 0) out.push({ x: pts[0].x + nx[0] * d, y: pts[0].y + ny[0] * d });
    else if (i === n - 1) out.push({ x: pts[i].x + nx[n - 2] * d, y: pts[i].y + ny[n - 2] * d });
    else {
      const mx = nx[i - 1] + nx[i], my = ny[i - 1] + ny[i], k = 1 / (1 + nx[i - 1] * nx[i] + ny[i - 1] * ny[i]);
      out.push({ x: pts[i].x + mx * k * d, y: pts[i].y + my * k * d });
    }
  }
  return out;
}
/* ops: ['s',len] straight, ['c',len,info] straight under a chip, ['f',sgn,lateral] 45deg jog */
function route(start, dir, ops) {
  const pts = [{ x: start.x, y: start.y }], chips = []; let x = start.x, y = start.y;
  for (const op of ops) {
    if (op[0] === 's') { x += DX[dir] * op[1]; y += DY[dir] * op[1]; pts.push({ x, y }); }
    else if (op[0] === 'c') { const ia = pts.length - 1; x += DX[dir] * op[1]; y += DY[dir] * op[1]; pts.push({ x, y }); chips.push({ ia, ib: pts.length - 1, info: op[2] }); }
    else { const dd = (dir + op[1] + 8) % 8, len = op[2] * Math.SQRT2; x += DX[dd] * len; y += DY[dd] * len; pts.push({ x, y }); }
  }
  return { pts, chips };
}

/* ---------- containers ---------- */
const PATHS = [];      // every conductive path (drawn statically, pulses travel along them)
const CHIPS = [];      // ICs sitting on top of bundles
const COMPS = [];      // passives / small ICs
const PADS = [];       // {x,y,r,col}
const SILK = [];       // silkscreen text
const PULSES = [];
const FARPATHS = [];

function makePath(pts, o) {
  const cum = [0]; let minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
  for (let i = 0; i < pts.length; i++) {
    if (i) cum.push(cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
    minx = Math.min(minx, pts[i].x); miny = Math.min(miny, pts[i].y); maxx = Math.max(maxx, pts[i].x); maxy = Math.max(maxy, pts[i].y);
  }
  return Object.assign({ pts, cum, len: cum[cum.length - 1], bb: [minx - 40, miny - 40, maxx + 40, maxy + 40], hid: [], w: 5, col: CYAN }, o);
}
function addPulse(path, opt) {
  const tail = opt.tail, vt = opt.vt;
  const k = Math.max(1, Math.round(vt * T / (path.len + tail)));
  PULSES.push({ path, k, ph: opt.ph, tail, bright: opt.bright || 1, col: opt.col || path.col, flash: opt.flash !== false, far: !!opt.far });
}

/* =====================================================================
   BUILD WORLD
   ===================================================================== */
/* --- occupy die + package --- */
occRect(PKG.x - 30, PKG.y - 30, PKG.x + PKG.s + 30, PKG.y + PKG.s + 30);

/* --- radial bus bundles leaving the die, chained through ICs --- */
const chipLabels = ['AX-7720', 'NQ-QUAD', 'HBM3-E', 'PMIC-9', 'SERDES', 'FPGA-9K', 'DSP-40', 'LPDDR5X', 'PHY-16G', 'CACHE-X', 'NPU-8', 'IO-HUB'];
function buildSide(dirIdx, G, slot, tSpacing, n0, n1, twoFans) {
  const ox = DX[dirIdx], oy = DY[dirIdx], tx = -oy, ty = ox;     // outward + tangent
  const half = (G - 1) / 2;
  const latDot = (sg) => DX[(dirIdx + 2 * sg + 16) % 8] * tx + DY[(dirIdx + 2 * sg + 16) % 8] * ty;
  const bound = dirIdx === 0 ? WW - 110 - (DIE.x + DIE.s) : dirIdx === 4 ? DIE.x - 110 : dirIdx === 2 ? WH - 110 - (DIE.y + DIE.s) : DIE.y - 110;
  const maxAdv = Math.abs(bound);
  for (let g = 0; g < G; g++) {
    const r = g - half, ar = Math.abs(r);
    const n = rint(n0, n1), p = 12, w = 5;
    const start = { x: CX + ox * DIE.s / 2 + tx * r * slot, y: CY + oy * DIE.s / 2 + ty * r * slot };
    const shift = r * (tSpacing - slot);                        // signed lateral displacement along tangent
    const ops = []; let adv = 0;
    const lead = 236 + (half - ar) * (twoFans ? 50 : 42);
    ops.push(['s', lead]); adv += lead;
    const col = pickCol();
    const chipsPlan = [];
    if (Math.abs(shift) > 1) {
      const sg = (latDot(1) * shift > 0) ? 1 : -1;
      const f1 = twoFans ? Math.abs(shift) * 0.5 : Math.abs(shift);
      ops.push(['f', sg, f1]); adv += f1;
      if (twoFans) {
        const pre = 46 + (half - ar) * 58, depth = rint(112, 168), post = 44;
        ops.push(['s', pre]); ops.push(['c', depth, { }]); ops.push(['s', post]); adv += pre + depth + post;
        ops.push(['f', sg, Math.abs(shift) - f1]); adv += Math.abs(shift) - f1;
      }
    }
    // final straight, with a chip
    const rest = maxAdv - adv;
    if (rest > 260) {
      const depth = rint(110, 170), pre = rint(70, Math.max(80, Math.min(rest - depth - 90, 340)));
      ops.push(['s', pre]); ops.push(['c', depth, {}]); adv += pre + depth;
      ops.push(['s', maxAdv - adv]);
    } else ops.push(['s', Math.max(10, rest)]);
    const cl = route(start, dirIdx, ops);
    // occupy corridor
    occPoly(cl.pts, n * p / 2 + 34);
    // group properties
    const inbound = R() < 0.36;
    const bw = n * p;
    const rev = inbound;
    const phB = R(), tail = rnd(190, 360), vt = rnd(520, 980);
    const kAvg = null;
    const chipRefs = [];
    for (const c of cl.chips) {
      const a = cl.pts[c.ia], b = cl.pts[c.ib];
      const chip = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, dir: dirIdx, depth: Math.hypot(b.x - a.x, b.y - a.y), width: bw + 46, label: pick(chipLabels), col, glow: 0, pins: n, style: rint(0, 2), id: CHIPS.length, ph: R(), pitch: p, tw: w };
      CHIPS.push(chip); chipRefs.push(chip);
      occRect(chip.x - 90, chip.y - 90, chip.x + 90, chip.y + 90);
    }
    const bundleTraces = [];
    for (let j = 0; j < n; j++) {
      let pts = offsetPoly(cl.pts, (j - (n - 1) / 2) * p);
      let hid = cl.chips.map((c, ci) => [c.ia, c.ib, chipRefs[ci]]);
      if (rev) { const N = pts.length; pts = pts.slice().reverse(); hid = hid.map(h => [N - 1 - h[1], N - 1 - h[0], h[2]]); }
      const path = makePath(pts, { w, col, kind: 'main', hidIdx: hid });
      path.hid = hid.map(h => [path.cum[h[0]] + 5, path.cum[h[1]] - 5, h[2]]);
      PATHS.push(path); bundleTraces.push(path);
      // end pads
      const e = pts[pts.length - 1]; PADS.push({ x: e.x, y: e.y, r: 9, col });
      const s0 = pts[0]; PADS.push({ x: s0.x, y: s0.y, r: 8, col });
      const nP = R() < 0.45 ? 2 : 1;
      for (let q = 0; q < nP; q++) addPulse(path, { ph: (phB + j * 0.0045 + q * (0.5 + rnd(-0.08, 0.08))) % 1, tail, vt, bright: rnd(0.8, 1) });
    }
    /* bundle -> chip pin coords for chip drawing */
    for (const c of chipRefs) c.bundle = bundleTraces;
  }
}
buildSide(0, 7, 111, 310, 6, 7, true);      // right
buildSide(4, 7, 111, 310, 6, 7, true);      // left
buildSide(6, 5, 156, 300, 8, 10, false);    // top
buildSide(2, 5, 156, 300, 8, 10, false);    // bottom

/* --- side branches out of the bundle ICs (perpendicular mini buses) --- */
function pathFree(pts, r) {
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1], n = Math.max(1, Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / 14));
    for (let k = 0; k <= n; k++) if (!occFreePt(a.x + (b.x - a.x) * k / n, a.y + (b.y - a.y) * k / n, r)) return false;
  }
  return true;
}
for (const chip of CHIPS.slice()) {
  for (const side of [-1, 1]) {
    if (R() < 0.35) continue;
    const dirIdx = (chip.dir + 2 * side + 8) % 8;
    const n = rint(3, 5), p = 12, len = rnd(120, 340);
    const ox = DX[dirIdx], oy = DY[dirIdx];
    const start = { x: chip.x + ox * (chip.width / 2 + 2), y: chip.y + oy * (chip.width / 2 + 2) };
    // perpendicular offset of the chip side, bundle centred
    const ops = [['s', 30]];
    if (R() < 0.6) { const sg = R() < 0.5 ? 1 : -1; ops.push(['f', sg, rnd(50, 110)]); }
    ops.push(['s', len]);
    const cl = route(start, dirIdx, ops);
    // collision test (skip the first stretch inside the chip's own footprint)
    const testPts = cl.pts.slice(1);
    testPts.unshift({ x: start.x + ox * 40, y: start.y + oy * 40 });
    if (!pathFree(testPts, n * p / 2 + 12)) continue;
    occPoly(cl.pts, n * p / 2 + 22);
    const col = pickCol(), phB = R(), tail = rnd(110, 220), vt = rnd(400, 760);
    const rev = R() < 0.4;
    for (let j = 0; j < n; j++) {
      let pts = offsetPoly(cl.pts, (j - (n - 1) / 2) * p);
      if (rev) pts = pts.slice().reverse();
      const path = makePath(pts, { w: 4.5, col, kind: 'branch' });
      PATHS.push(path);
      const e = pts[pts.length - 1]; PADS.push({ x: e.x, y: e.y, r: 8, col });
      addPulse(path, { ph: (phB + j * 0.01) % 1, tail, vt });
    }
    // end-cap little IC
    const a = cl.pts[cl.pts.length - 1];
    if (occFreePt(a.x + ox * 60, a.y + oy * 60, 66) && R() < 0.75) {
      const chip2 = { x: a.x + ox * 46, y: a.y + oy * 46, dir: dirIdx, depth: 92, width: n * p + 36, label: pick(chipLabels), col, glow: 0, pins: n, style: rint(0, 2), id: CHIPS.length, ph: R(), pitch: p, tw: 4.5, terminal: true };
      CHIPS.push(chip2); occRect(chip2.x - 70, chip2.y - 70, chip2.x + 70, chip2.y + 70);
    }
  }
}

/* --- passives / small ICs with escape routing, filling the board --- */
function escapeRoute(pin, dir, col) {
  let x = pin.x, y = pin.y, d = dir; const pts = [{ x, y }];
  const segs = rint(2, 4);
  for (let s = 0; s < segs; s++) {
    if (s > 0) { const turn = pick([-1, 1, -1, 1, 0]); d = (d + turn + 8) % 8; }
    const isDiag = d % 2 === 1;
    const len = (isDiag ? rnd(24, 70) : rnd(34, 130));
    const nx = x + DX[d] * len, ny = y + DY[d] * len;
    let ok = true;
    for (let k = 1; k <= 6; k++) if (!occFreePt(x + (nx - x) * k / 6, y + (ny - y) * k / 6, 10)) { ok = false; break; }
    if (!ok) break;
    x = nx; y = ny; pts.push({ x, y });
    if (isDiag && s < segs - 1) { d = (d + pick([-1, 1]) + 8) % 8; }   // come back to axis-ish direction
  }
  if (pts.length < 2) return null;
  const path = makePath(pts, { w: rnd(3, 4.2), col, kind: 'micro' });
  if (path.len < 40) return null;
  occPoly(pts, 13);
  PADS.push({ x, y, r: 7, col });
  PATHS.push(path);
  if (R() < 0.62) addPulse(path, { ph: R(), tail: rnd(70, 170), vt: rnd(380, 820), bright: rnd(0.7, 1) });
  return path;
}
function placeComp(kind) {
  const x = rnd(140, WW - 140), y = rnd(140, WH - 140);
  const col = pickCol(); const horiz = R() < 0.5; const dir = horiz ? 0 : 2;
  let w, h, pins = [], body;
  if (kind === 'cap' || kind === 'res') {
    w = 36; h = 18;
    if (!occFreeRect(x - 60, y - 40, x + 60, y + 40)) return;
    const c = { kind, x, y, dir, w, h, col };
    COMPS.push(c);
    occRect(x - 30, y - 22, x + 30, y + 22);
    const ax = DX[dir], ay = DY[dir];
    for (const s of [-1, 1]) escapeRoute({ x: x + ax * s * 24, y: y + ay * s * 24 }, s > 0 ? dir : (dir + 4) % 8, col);
    if (R() < 0.5) SILK.push({ x, y: y + (horiz ? 26 : 0), t: (kind === 'cap' ? 'C' : 'R') + rint(10, 499), s: 12, a: 0.28 });
  } else if (kind === 'soic') {
    const np = pick([3, 4, 5]); w = 72; h = 46;
    if (!occFreeRect(x - 100, y - 100, x + 100, y + 100)) return;
    COMPS.push({ kind, x, y, dir, w, h, col, np, label: pick(chipLabels) });
    occRect(x - 55, y - 50, x + 55, y + 50);
    const ax = DX[dir], ay = DY[dir], px = -ay, py = ax;
    for (const side of [-1, 1]) for (let i = 0; i < np; i++) {
      const off = (i - (np - 1) / 2) * 16;
      escapeRoute({ x: x + px * side * 30 + ax * off, y: y + py * side * 30 + ay * off }, (dir + 2 * side + 8) % 8, col);
    }
    if (R() < 0.6) SILK.push({ x: x + ax * 0, y: y - 60, t: 'U' + rint(2, 99), s: 13, a: 0.3 });
  } else if (kind === 'qfn') {
    const np = pick([3, 4]); w = h = 30 + np * 22;
    if (!occFreeRect(x - 120, y - 120, x + 120, y + 120)) return;
    COMPS.push({ kind, x, y, dir: 0, w, h, col, np, label: pick(chipLabels) });
    occRect(x - w / 2 - 30, y - h / 2 - 30, x + w / 2 + 30, y + h / 2 + 30);
    for (let sd = 0; sd < 4; sd++) {
      const dd = sd * 2, ax = DX[dd], ay = DY[dd], px = -ay, py = ax;
      for (let i = 0; i < np; i++) {
        const off = (i - (np - 1) / 2) * 20;
        escapeRoute({ x: x + ax * (w / 2 + 12) + px * off, y: y + ay * (h / 2 + 12) + py * off }, dd, col);
      }
    }
    SILK.push({ x, y: y - h / 2 - 34, t: 'U' + rint(100, 999), s: 13, a: 0.3 });
  } else if (kind === 'vias') {
    if (!occFreeRect(x - 60, y - 60, x + 60, y + 60)) return;
    occRect(x - 46, y - 46, x + 46, y + 46);
    for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) if (R() < 0.85) PADS.push({ x: x + i * 24, y: y + j * 24, r: 6.5, col: R() < 0.2 ? col : null });
  }
}
for (let i = 0; i < 90; i++) placeComp('qfn');
for (let i = 0; i < 220; i++) placeComp('soic');
for (let i = 0; i < 700; i++) placeComp(R() < 0.55 ? 'cap' : 'res');
for (let i = 0; i < 90; i++) placeComp('vias');

/* --- package decoupling capacitor clusters at the package corners --- */
const PKG_CAPS = [];
for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
    if (i + j > 5) continue;
    PKG_CAPS.push({ x: CX + sx * (472 + i * 34 + (j % 2) * 4), y: CY + sy * (472 + j * 27), h: R() < 0.5 });
  }
}

/* --- die: floorplan --- */
const BLOCKS = [];
(function buildDie() {
  const inset = 36;
  const root = { x: DIE.x + inset, y: DIE.y + inset, w: DIE.s - inset * 2, h: DIE.s - inset * 2 };
  const gap = 12;
  function split(r, depth) {
    const minS = 168;
    const canV = r.w > minS * 1.9, canH = r.h > minS * 1.9;
    if ((!canV && !canH) || (depth >= 3 && R() < 0.28) || depth >= 5) { BLOCKS.push(r); return; }
    let vertical = canV && (!canH || r.w > r.h * (R() < 0.8 ? 1 : 0.6));
    const ratio = rnd(0.38, 0.62);
    if (vertical) {
      const w1 = (r.w - gap) * ratio;
      split({ x: r.x, y: r.y, w: w1, h: r.h }, depth + 1);
      split({ x: r.x + w1 + gap, y: r.y, w: r.w - w1 - gap, h: r.h }, depth + 1);
    } else {
      const h1 = (r.h - gap) * ratio;
      split({ x: r.x, y: r.y, w: r.w, h: h1 }, depth + 1);
      split({ x: r.x, y: r.y + h1 + gap, w: r.w, h: r.h - h1 - gap }, depth + 1);
    }

/* --- die: internal metal routing (with pulses) --- */
(function buildDieRouting() {
  const x0 = DIE.x + 20, y0 = DIE.y + 20, x1 = DIE.x + DIE.s - 20, y1 = DIE.y + DIE.s - 20;
  for (let i = 0; i < 230; i++) {
    let x = rnd(x0, x1), y = rnd(y0, y1), d = pick([0, 2, 4, 6]);
    const pts = [{ x, y }], segs = rint(3, 7);
    for (let s = 0; s < segs; s++) {
      if (s) d = (d + pick([-1, 1, -1, 1, 2, -2]) + 8) % 8;
      const len = d % 2 ? rnd(20, 60) : rnd(36, 160);
      let nx = x + DX[d] * len, ny = y + DY[d] * len;
      if (nx < x0 || nx > x1 || ny < y0 || ny > y1) { d = (d + 4) % 8; nx = x + DX[d] * len; ny = y + DY[d] * len; if (nx < x0 || nx > x1 || ny < y0 || ny > y1) break; }

    }
    if (pts.length < 3) continue;
    const col = pick([CYAN, CYAN, BLUE, VIOLET, MAGENTA, AMBER, CYAN]);
    const path = makePath(pts, { w: rnd(2.2, 3.4), col, kind: 'die' });
    if (path.len < 90) continue;

    addPulse(path, { ph: R(), tail: rnd(60, 130), vt: rnd(300, 620), bright: rnd(0.75, 1), flash: false });
    if (R() < 0.4) addPulse(path, { ph: R(), tail: rnd(60, 130), vt: rnd(300, 620), bright: 0.8, flash: false });
  }
})();

/* --- far (deep layer) circuitry - blurred, parallaxed, dim --- */
(function buildFar() {

/* ---------- pulses ---------- */

/* =====================================================================

    const tw = 0.5 + 0.5 * Math.sin(TAU * (f.tw * ph + f.ph));
    if (f.bokeh) {
      g.globalAlpha = f.a * (0.35 + 0.65 * tw) * 0.55; const s = f.s; const spr = BOKEH.get(f.col);
      for (const ox of [0, -W, W]) for (const oy of [0, -H, H]) { const xx = x + ox, yy = y + oy; if (xx < -s || xx > W + s || yy < -s || yy > H + s) continue; g.drawImage(spr, xx - s, yy - s, s * 2, s * 2); }
    } else {
      g.globalAlpha = f.a * (0.25 + 0.75 * tw); const s = f.s * (0.7 + 0.5 * tw); g.drawImage(HEAD.get(f.col) || HEAD.get(CYAN), x - s, y - s, s * 2, s * 2);
    }
  }
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';

  // ---- finishing: vignette + very fine grain (24 fps quantised => loops exactly)
  g.drawImage(VIG, 0, 0);
  const fr = Math.floor(t * 24), ox = (fr * 97) % 384, oy = (fr * 61) % 384;
  g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.012; g.translate(-ox, -oy); g.fillStyle = grainPat; g.fillRect(0, 0, W + 384, H + 384); g.restore();
}

window.renderFrame = drawFrame;

/* ---------- start ---------- */
const q = new URLSearchParams(location.search);
if (q.has('t')) {
  drawFrame(parseFloat(q.get('t')));
} else {
  let t0 = null;
  const loop = (ts) => { if (t0 === null) t0 = ts; drawFrame(((ts - t0) / 1000) % T); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
