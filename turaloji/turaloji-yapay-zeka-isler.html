<body>
<div id="stage"><canvas id="c" width="3840" height="2160"></canvas></div>
<script>

/* =====================================================================
   TURALOJİ — "Yapay Zeka Senin İşini Elinden Alacak mı?"
   3840x2160 · tek canvas · zamana bağlı (deterministik) animasyon motoru
   Ayarlar için aşağıdaki CONFIG bölümüne bakın.
   ===================================================================== */
(()=>{
'use strict';
const W=3840,H=2160,TAU=Math.PI*2,PI=Math.PI;
const cv=document.getElementById('c');
const c=cv.getContext('2d',{alpha:false});
const stage=document.getElementById('stage');
const QS=new URLSearchParams(location.search);

/* ------------------------------ AYARLAR ------------------------------ */
const CONFIG={
  captions: QS.get('captions')!=='0',   // true: sesle senkron Türkçe altyazı yakılır  (kapatmak için false)
  bug:      QS.get('bug')!=='0',        // sol üstte küçük kanal logosu + bölüm etiketi
  grain:    QS.get('grain')!=='0',      // çok hafif film greni
  autoplay: QS.get('autoplay')!=='0',   // sayfa açılınca kendiliğinden başlar
  startAt:  parseFloat(QS.get('t')||'0')||0
};

function fit(){
  const s=Math.min(innerWidth/W,innerHeight/H);
  stage.style.transform=`translate(${(innerWidth-W*s)/2}px,${(innerHeight-H*s)/2}px) scale(${s})`;
}
addEventListener('resize',fit); fit();

/* ------------------------------ MATEMATİK ---------------------------- */
const cl=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const pr=(T,a,b)=>cl((T-a)/(b-a));
const frac=x=>x-Math.floor(x);
const hs=n=>frac(Math.sin(n*127.1+311.7)*43758.5453);
const hs2=(a,b)=>hs(a*57.3+b*131.9+7.7);
const E={
  lin:t=>t,
  in2:t=>t*t, in3:t=>t*t*t, in4:t=>t*t*t*t,
  out2:t=>1-(1-t)*(1-t), out3:t=>1-Math.pow(1-t,3), out4:t=>1-Math.pow(1-t,4), out5:t=>1-Math.pow(1-t,5),
  io2:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,
  io3:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  io5:t=>t<.5?16*t*t*t*t*t:1-Math.pow(-2*t+2,5)/2,
  outExp:t=>t>=1?1:1-Math.pow(2,-10*t),
  outBack:t=>{const a=1.70158,b=a+1;return 1+b*Math.pow(t-1,3)+a*Math.pow(t-1,2)},
  outBack2:t=>{const a=3.2,b=a+1;return 1+b*Math.pow(t-1,3)+a*Math.pow(t-1,2)},
  outElastic:t=>t===0?0:t===1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*(TAU/3))+1,
  spring:t=>t>=1?1:1-Math.exp(-7.5*t)*Math.cos(t*17),
  bounce:t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375}
};
const an=(T,a,d,f=E.out3)=>f(pr(T,a,a+d));
const sstep=(T,a,b)=>{const t=pr(T,a,b);return t*t*(3-2*t)};

/* ------------------------------ RENKLER ------------------------------ */
const P={ink:'#05070f',white:'#f4f6ff',mute:'#8d96b5',dim:'#4a5170',violet:'#8b6cff',blue:'#4c8dff',cyan:'#28d7ff',
  mint:'#2cf5b0',lime:'#b8f53d',amber:'#ffb63d',orange:'#ff7a3d',red:'#ff4d66',pink:'#ff5cc8',gold:'#ffd166'};
const _rgb={};
function rgb(h){
  let r=_rgb[h]; if(r)return r;
  let s=h.replace('#',''); if(s.length===3)s=s.split('').map(x=>x+x).join('');
  r=_rgb[h]=[parseInt(s.slice(0,2),16),parseInt(s.slice(2,4),16),parseInt(s.slice(4,6),16)]; return r;
}
const A=(h,a=1)=>{const r=rgb(h);return `rgba(${r[0]},${r[1]},${r[2]},${a})`};

const SEGS=[];
let SC=[];
function normW(w){return lo(w.replace(/[.,?!:;"“”()]/g,'').replace(/['’]/g,''))}
function buildScenes(raw){
  SC=raw.map((r,i)=>{
    const s=r[0],e=r[1],t=r[2];
    const toks=t.split(/\s+/);
    const wts=toks.map(w=>{let k=normW(w).length+1.3;if(/[,;:]$/.test(w))k+=3.5;if(/[.?!]$/.test(w))k+=6.5;return k});
    const tot=wts.reduce((a,b)=>a+b,0);
    const lead=Math.min(.14,(e-s)*.06),tail=Math.min(.12,(e-s)*.05);
    const span=e-s-lead-tail;
    let acc=0;const wt=[],we=[];
    toks.forEach((w,j)=>{wt.push(s+lead+span*acc/tot);acc+=wts[j];we.push(s+lead+span*acc/tot)});
    return {n:i+1,s,e,t,toks,wt,we,norm:toks.map(normW)};
  });
}
const _cue={};
/* n. sahnede 'pref' ile başlayan kelimenin konuşulma anı (sn) */
function cue(n,pref,off=0){
  const k=n+'|'+pref;
  let v=_cue[k];
  if(v===undefined){
    const sc=SC[n-1];const p=lo(pref);
    let i=sc.norm.findIndex(w=>w.startsWith(p));
    if(i<0)i=sc.norm.findIndex(w=>w.includes(p));
    v=_cue[k]=i<0?sc.s+(sc.e-sc.s)*.3:sc.wt[i];
  }
  return v+off;
}
const S0=n=>SC[n-1].s, S1=n=>SC[n-1].e;
const fr=(n,f)=>lerp(SC[n-1].s,SC[n-1].e,f);
function sceneAt(T){
  let lo_=0,hi=SC.length-1;
  while(lo_<hi){const m=(lo_+hi+1)>>1;if(SC[m].s<=T)lo_=m;else hi=m-1}
  return SC[lo_];
}

const IMPACTS=[],FLASHES=[];
const impact=(t,amp=1)=>{IMPACTS.push([t,amp])};
const flash=(t,col='#ffffff',a=.8,dur=.35)=>{FLASHES.push([t,col,a,dur])};
function shakeAt(T){
  let x=0,y=0;
  for(let i=0;i<IMPACTS.length;i++){
    const t=IMPACTS[i][0],a=IMPACTS[i][1],d=T-t;if(d<0||d>.8)continue;
    const k=Math.exp(-d*6.5)*a;x+=Math.sin(d*95+t*13)*k*20;y+=Math.cos(d*83+t*7)*k*16;
  }
  return [x,y];
}

/* ------------------------------ GLOBE -------------------------------- */
const GN=1900,GL=[];
for(let i=0;i<GN;i++){const y=1-(i+.5)/GN*2,r=Math.sqrt(1-y*y),th=i*2.399963;GL.push([Math.cos(th)*r,y,Math.sin(th)*r,hs(i*3.1+.5)])}
function globe(cx,cy,R,T,o={}){
  const rot=T*(o.spin===undefined?.2:o.spin)+(o.rot0||0),tilt=o.tilt===undefined?.42:o.tilt;
  const cr=Math.cos(rot),sr=Math.sin(rot),ct=Math.cos(tilt),st=Math.sin(tilt);
  const col=o.col||P.cyan,frac_=o.frac||0,lost=o.lost||0,lcol=o.lcol||P.red;
  c.save();
  glow(cx,cy,R*1.55,o.glowCol||P.blue,.4*(o.ga===undefined?1:o.ga));
  const dg=c.createRadialGradient(cx-R*.3,cy-R*.35,R*.1,cx,cy,R);
  dg.addColorStop(0,'rgba(60,90,200,.20)');dg.addColorStop(1,'rgba(10,15,50,.05)');
  c.fillStyle=dg;c.beginPath();c.arc(cx,cy,R,0,TAU);c.fill();
  const bk=[[],[],[]];
  const dot=o.dot||R*.0105;
  c.fillStyle=col;
  const front=[],special=[];
  for(let i=0;i<GN;i++){
    const p=GL[i];
    const x1=p[0]*cr+p[2]*sr,z1=-p[0]*sr+p[2]*cr;
    const y1=p[1]*ct-z1*st,z2=p[1]*st+z1*ct;
    const px=cx+x1*R,py=cy-y1*R;
    const marked=p[3]<frac_;
    if(marked){special.push(px,py,z2,p[3])}
    else if(z2>=0)front.push(px,py,z2);
    else if(z2>-.6)bk[0].push(px,py);
  }
  const ga0=c.globalAlpha;
  c.globalAlpha=ga0*.2;c.beginPath();
  for(let i=0;i<bk[0].length;i+=2){c.moveTo(bk[0][i]+dot*.7,bk[0][i+1]);c.arc(bk[0][i],bk[0][i+1],dot*.7,0,TAU)}c.fill();
  for(let b=0;b<3;b++){
    c.globalAlpha=ga0*(.35+.3*b);c.beginPath();
    for(let i=0;i<front.length;i+=3){
      const z=front[i+2],bi=z<.33?0:z<.66?1:2;if(bi!==b)continue;
      const r=dot*(.8+z*.7);c.moveTo(front[i]+r,front[i+1]);c.arc(front[i],front[i+1],r,0,TAU);
    }
    c.fill();
  }
  c.globalAlpha=ga0;
  for(let i=0;i<special.length;i+=4){
    const z=special[i+2],h=special[i+3];
    const ph=pr(lost,h*.6,h*.6+.4);
    const cc=mixc(col,lcol,Math.min(1,ph*2.5));
    const al=(z>=0?.35+.65*z:.12)*(1-ph*ph*.88);
    const r=dot*(.8+Math.max(0,z)*.7)*(1+ph*.6-ph*ph*.8);
    c.globalAlpha=ga0*al;c.fillStyle=cc;c.beginPath();c.arc(special[i],special[i+1],r,0,TAU);c.fill();
    if(ph>0&&ph<.7)glow(special[i],special[i+1],r*7,lcol,.5*(1-ph/.7));
  }
  c.globalAlpha=ga0;
  c.strokeStyle=A(col,.28);c.lineWidth=R*.006;c.beginPath();c.arc(cx,cy,R*1.012,0,TAU);c.stroke();
  c.restore();
}

const CAP_SIZE=78,CAP_MAXW=3050;
function prepCaptions(){
  for(const sc of SC){
    const chunks=[];let cur=[],len=0;
    sc.toks.forEach((w,i)=>{
      cur.push(i);len+=w.length+1;
      const rest=sc.toks.length-1-i;
      if(rest>0&&(len>=56||(/[,.?!;:]$/.test(w)&&len>=30&&rest>2))){chunks.push(cur);cur=[];len=0}
    });
    if(cur.length){
      if(chunks.length&&cur.length<=2&&chunks[chunks.length-1].length>3)chunks[chunks.length-1].push(...cur);else chunks.push(cur);
    }
    sc.chunks=chunks.map((ids,k)=>({ids,t0:k===0?sc.s:sc.wt[ids[0]]-.04,t1:0,lay:null}));
    sc.chunks.forEach((ch,k)=>{ch.t1=k<sc.chunks.length-1?sc.chunks[k+1].t0:sc.e});
  }
}
function layoutChunk(sc,ch){
  if(ch.lay)return ch.lay;
  const ws=ch.ids.map(i=>tw(sc.toks[i],CAP_SIZE,700,F.ui));
  const sp=CAP_SIZE*.3;
  const total=ws.reduce((a,b)=>a+b,0)+sp*(ws.length-1);
  let lines;
  if(total<=CAP_MAXW)lines=[ch.ids.map((id,j)=>({id,w:ws[j]}))];
  else{
    let best=0,bd=1e9,acc=0;
    ch.ids.forEach((id,j)=>{acc+=ws[j]+sp;const d=Math.abs(acc-(total-acc));if(d<bd&&j<ch.ids.length-1){bd=d;best=j}});
    lines=[ch.ids.slice(0,best+1).map((id,j)=>({id,w:ws[j]})),ch.ids.slice(best+1).map((id,j)=>({id,w:ws[best+1+j]}))];
  }
  lines.forEach(l=>{l.tw=l.reduce((a,b)=>a+b.w,0)+sp*(l.length-1)});
  return ch.lay={lines,sp,maxw:Math.max(...lines.map(l=>l.tw))};
}

  });
}

function letters(str,cx,y,T,t0,o={}){
  const size=o.size||200,w8=o.w||800,font=o.font||F.disp,sp=o.sp||0;
  const ws=[...str].map(ch=>tw(ch,size,w8,font,0)+sp);
  const total=ws.reduce((a,b)=>a+b,0)-sp;
  let x=o.al==='left'?cx:cx-total/2;
  [...str].forEach((ch,i)=>{
    const e=E.out5(pr(T,t0+i*(o.stag||.05),t0+i*(o.stag||.05)+(o.dur||.7)));
    if(e>0){
      c.save();c.beginPath();c.rect(x-size*.1,y-size*.8,ws[i]+size*.2,size*1.6);c.clip();
      txt(ch,x+(ws[i]-sp)/2,y+(1-e)*size*1.0,{size,w:w8,font,col:o.col,grad:o.grad,glow:o.glow,a:cl(e*2.5)});
      c.restore();
    }
    x+=ws[i];
  });
  return total;
}
function padlock(cx,cy,s,col1,col2){
  c.save();
  c.lineWidth=s*.12;c.lineCap='round';c.strokeStyle=lg(cx-s/2,cy-s,cx+s/2,cy,[col1,col2]);
  c.beginPath();c.moveTo(cx-s*.28,cy-s*.04);c.lineTo(cx-s*.28,cy-s*.3);c.arc(cx,cy-s*.3,s*.28,PI,0);c.lineTo(cx+s*.28,cy-s*.04);c.stroke();
  c.shadowColor=A(col2,.6);c.shadowBlur=s*.25;
  rr(cx-s/2,cy-s*.08,s,s*.78,s*.16);c.fillStyle=lg(cx-s/2,cy,cx+s/2,cy+s*.7,[col1,col2]);c.fill();
  c.shadowBlur=0;c.shadowColor='transparent';
  rr(cx-s/2,cy-s*.08,s,s*.39,s*.16);c.fillStyle='rgba(255,255,255,.18)';c.fill();
  c.fillStyle='#0a0d24';c.beginPath();c.arc(cx,cy+s*.26,s*.085,0,TAU);c.fill();
  c.beginPath();c.moveTo(cx-s*.04,cy+s*.3);c.lineTo(cx+s*.04,cy+s*.3);c.lineTo(cx+s*.06,cy+s*.5);c.lineTo(cx-s*.06,cy+s*.5);c.closePath();c.fill();
  c.restore();
}
function ghost(x,y,s,T,col='#f2eeff',eye='#1a1440'){
  c.save();c.translate(x,y+Math.sin(T*2.1)*s*.035);
  glow(0,0,s*1.1,'#a58bff',.6);
  const p=new Path2D();
  p.moveTo(-.4*s,.5*s);p.lineTo(-.4*s,-.08*s);p.arc(0,-.08*s,.4*s,PI,0);p.lineTo(.4*s,.5*s);
  p.quadraticCurveTo(.33*s,.6*s,.27*s,.5*s);p.quadraticCurveTo(.2*s,.4*s,.13*s,.5*s);p.quadraticCurveTo(.07*s,.6*s,0,.5*s);
  p.quadraticCurveTo(-.07*s,.4*s,-.13*s,.5*s);p.quadraticCurveTo(-.2*s,.6*s,-.27*s,.5*s);p.quadraticCurveTo(-.33*s,.4*s,-.4*s,.5*s);p.closePath();
  c.fillStyle=lg(0,-.5*s,0,.55*s,['#ffffff',col,'#b9a6ff']);c.fill(p);
  c.fillStyle=eye;
  for(const sx of[-1,1]){c.beginPath();c.ellipse(sx*.15*s,-.1*s,.055*s,.085*s,0,0,TAU);c.fill()}
  c.beginPath();c.ellipse(0,.08*s,.06*s,.08*s,0,0,TAU);c.fill();
  c.restore();
}
function sparkle4(x,y,r,col,a=1,rot=0){
  c.save();c.translate(x,y);c.rotate(rot);c.globalAlpha*=a;c.fillStyle=col;
  c.beginPath();c.moveTo(0,-r);c.quadraticCurveTo(r*.14,-r*.14,r,0);c.quadraticCurveTo(r*.14,r*.14,0,r);c.quadraticCurveTo(-r*.14,r*.14,-r,0);c.quadraticCurveTo(-r*.14,-r*.14,0,-r);c.fill();c.restore();

  c.save();c.translate(x,y);

      c.fillStyle=g;c.beginPath();c.moveTo(0,0);c.arc(0,0,o.beam||1500,-.16,.16);c.closePath();c.fill();c.restore();
    }

  rr(-bw/2,s*.52,bw,s*.3,s*.08);c.fillStyle=lg(0,s*.5,0,s*.85,['#394061','#151a30']);c.fill();
  rr(-bw*.38,s*.38,bw*.76,s*.18,s*.05);c.fillStyle='#252b4a';c.fill();

  c.beginPath();c.moveTo(-s*.62,s*.42);c.arc(0,s*.42,s*.62,PI,0);c.closePath();
  const dim=mixc('#2a2f48',col,on);
  const g=c.createRadialGradient(-s*.2,-s*.1,s*.05,0,s*.2,s*.7);
  g.addColorStop(0,mixc(dim,'#ffffff',.55*on));g.addColorStop(.5,dim);g.addColorStop(1,mixc(dim,'#000000',.5));

  c.restore();
}

    const base=H+80-rise*(1-k*.1);
    const A_=60+36*k+rise*.05;
    c.beginPath();c.moveTo(-40,H+10);
    for(let x=-40;x<=W+40;x+=20){
      const lean=-(1-x/W)*rise*(.16-k*.03);
      const y=base+lean+Math.sin(x*.0016+wt*(1.3+k*.35)+k*2.1)*A_+Math.sin(x*.0043-wt*(2+k*.3)+k)*A_*.4;
      c.lineTo(x,y);
    }

      const s_=Math.abs(Math.cos(f*PI));

      c.restore();

  }
  c.restore();
}

function gearDraw(x,y,r,teeth,rot,col){
  c.save();c.translate(x,y);c.rotate(rot);

    pts.forEach((p_,i)=>{const px=Math.cos(p_[0])*p_[1],py=Math.sin(p_[0])*p_[1];(k===0&&i===0)?c.moveTo(px,py):c.lineTo(px,py)});
  }
  c.closePath();
  c.fillStyle=lg(-r,-r,r,r,[mixc(col,'#ffffff',.35),col,mixc(col,'#000000',.55)]);c.fill();
  c.lineWidth=5;c.strokeStyle='rgba(255,255,255,.3)';c.stroke();
  c.beginPath();c.arc(0,0,r*.55,0,TAU);c.fillStyle='rgba(0,0,0,.28)';c.fill();
  c.beginPath();c.arc(0,0,r*.22,0,TAU);c.fillStyle=mixc(col,'#ffffff',.5);c.fill();
  c.restore();
}

/* ====================================================================
   ANA DÖNGÜ · OYNATMA · API
   ==================================================================== */
SEGS.sort((a,b)=>a.a-b.a);
if(SEGS.length)SEGS[SEGS.length-1].last=true;
prepCaptions();
let curT=0,playing=false,t0w=0;
function loop(now){
  if(!playing)return;
  let T=(now-t0w)/1000;
  if(T>=END){T=END;playing=false;window.__done=true;curT=T;render(T);return}
  curT=T;render(T);requestAnimationFrame(loop);
}
function play(from){
  playing=true;window.__done=false;
  t0w=performance.now()-(from===undefined?curT:from)*1000;
  requestAnimationFrame(loop);
}
function pause(){playing=false}
function seek(t){curT=Math.max(0,Math.min(END,t));render(curT);if(playing)t0w=performance.now()-curT*1000}
window.TURALOJI={duration:END,seek,play,pause,render,get time(){return curT},get playing(){return playing},segments:SEGS,scenes:SC,config:CONFIG};
window.seek=seek;window.renderFrame=seek;
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();playing?pause():play()}
  else if(e.code==='ArrowRight')seek(curT+5);
  else if(e.code==='ArrowLeft')seek(curT-5);
  else if(e.code==='KeyC'){CONFIG.captions=!CONFIG.captions;seek(curT)}
  else if(e.code==='Home')seek(0);
});
async function boot(){
  try{
    const probe='AaĞğŞşİıÖöÜüÇç0123';
    await Promise.all(['800','700','600','500'].map(w=>document.fonts.load(w+' 100px Bricolage',probe)).concat(
      ['700','600','500','800'].map(w=>document.fonts.load(w+' 100px InterV',probe))));
    await document.fonts.ready;
  }catch(e){}
  makeNoise();
  INITS.forEach(f=>f());
  curT=CONFIG.startAt;render(curT);
  window.__ready=true;
  if(CONFIG.autoplay)play(CONFIG.startAt);
}
boot();

})();
