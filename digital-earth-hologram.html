    g = ctx.createLinearGradient(CX - half, 0, CX + half, 0);
    g.addColorStop(0, 'rgba(180,245,255,0)'); g.addColorStop(0.12, `rgba(200,250,255,${0.85 * ampS})`); g.addColorStop(0.88, `rgba(200,250,255,${0.85 * ampS})`); g.addColorStop(1, 'rgba(180,245,255,0)');
    ctx.strokeStyle = g; ctx.lineWidth = 3.2; ctx.beginPath(); ctx.moveTo(CX - half, sy); ctx.lineTo(CX + half, sy); ctx.stroke();
    // edge brackets
    ctx.strokeStyle = `rgba(190,248,255,${0.9 * ampS})`; ctx.lineWidth = 3;
    for (const sg of [-1, 1]) { const x = CX + sg * (half + 14); ctx.beginPath(); ctx.moveTo(x - sg * 4, sy - 16); ctx.lineTo(x + sg * 16, sy); ctx.lineTo(x - sg * 4, sy + 16); ctx.stroke(); }
    ctx.globalAlpha = ampS; ctx.drawImage(GLOW, CX + half - 40, sy - 40, 80, 80); ctx.drawImage(GLOW, CX - half - 40, sy - 40, 80, 80); ctx.globalAlpha = 1;
  }

  /* rim: crisp edge + travelling glints */
  ctx.lineWidth = 2.4; ctx.strokeStyle = `rgba(110,225,255,${0.38 * flick})`; ctx.beginPath(); ctx.arc(CX, CY, R, 0, TAU); ctx.stroke();
  for (let j = 0; j < 2; j++) {
    const cg = ctx.createConicGradient(TAU * tt * (j ? -1 : 1) + j * Math.PI, CX, CY);
    cg.addColorStop(0, 'rgba(190,250,255,0.95)'); cg.addColorStop(0.09, 'rgba(90,215,255,0.35)'); cg.addColorStop(0.2, 'rgba(60,180,255,0)');
    cg.addColorStop(0.82, 'rgba(60,180,255,0)'); cg.addColorStop(0.94, 'rgba(90,215,255,0.16)'); cg.addColorStop(1, 'rgba(190,250,255,0.95)');
    ctx.strokeStyle = cg; ctx.lineWidth = j ? 4 : 6; ctx.globalAlpha = j ? 0.6 : 1;
    ctx.beginPath(); ctx.arc(CX, CY, R + 1, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function draw(t) {
  const tt = t / DUR;
  setView(t); updateRings();
  const flick = 1 + 0.022 * Math.sin(TAU * 17 * tt) + 0.014 * Math.sin(TAU * 43 * tt + 1.3);

  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.drawImage(bgC, 0, 0);
  ctx.globalCompositeOperation = 'lighter';
  drawStars(tt);
  drawBokeh(tt, false);
  ctx.globalAlpha = 1; drawHUD(tt);
  ctx.globalAlpha = 1; drawBase(tt);
  ctx.globalAlpha = 1; for (const r of RINGS) drawRing(r, false, tt);

  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.drawImage(bodyC, CX - BS / 2, CY - BS / 2);

  ctx.globalCompositeOperation = 'lighter';
  drawGlobe(tt, flick);

  // hologram raster lines, drifting upward (integer cycles per loop)
  ctx.globalCompositeOperation = 'source-over';
  ctx.save(); ctx.beginPath(); ctx.arc(CX, CY, R, 0, TAU); ctx.clip();
  scanPat.setTransform(new DOMMatrix().translate(0, -((tt * 8 * 20) % 8)));
  ctx.fillStyle = scanPat; ctx.fillRect(CX - R, CY - R, R * 2, R * 2); ctx.restore();

  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 1; for (const r of RINGS) drawRing(r, true, tt);

  // drifting light motes
  const wrap = H + 240;
  for (const p of MOTES) {
    const y = (((p.y - p.k * wrap * tt) % wrap) + wrap) % wrap - 120, x = p.x + p.sw * Math.sin(TAU * (p.sf * tt + p.p));
    const tw = 0.55 + 0.45 * Math.sin(TAU * (3 * tt + p.p * 7));
    ctx.globalAlpha = p.a * tw; const z = p.s * (0.8 + 0.4 * tw), s = p.v ? GLOW_V : GLOW;
    ctx.drawImage(s, x - z / 2, y - z / 2, z, z);
  }
  drawBokeh(tt, true);

  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.drawImage(vigC, 0, 0);
}

window.DURATION = DUR;
window.renderFrame = t => draw(t);

const q = new URLSearchParams(location.search);
if (q.has('t')) {
  draw(parseFloat(q.get('t')) || 0); window.__ready = true;
} else {
  let t0 = null;
  const loop = ts => { if (t0 === null) t0 = ts; draw(((ts - t0) / 1000) % DUR); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
