html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#070D1F;}
#c{position:absolute;left:0;top:0;width:3840px;height:2160px;transform-origin:0 0;display:block;background:#070D1F;}
</style>

<body>
<canvas id="c" width="3840" height="2160"></canvas>
<script>
'use strict';
/* =====================================================================
   ¿ACABAMOS DE ESCUCHAR UNA SEÑAL DE OTRO PLANETA?  —  motor de animación
   Lienzo 3840x2160 · todo es una función pura del tiempo T (segundos)
   ===================================================================== */
const W=3840,H=2160,CX=1920,CY=1080,PI=Math.PI,TAU=PI*2;
const cv=document.getElementById('c'),MAIN=cv.getContext('2d');
let X=MAIN,T=0;
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
const BUF=mk(W,H),BX=BUF.getContext('2d');
const C={bg:'#070D1F',g:'#3DFF8F',w:'#EAF1FA',a:'#FFB020',r:'#FF4D5E',s:'#5B6B8C',d:'#0D1730',p:'#B57BFF',n:'#050A18'};
const FH="'Space Grotesk','Segoe UI',Arial,sans-serif",FM="'JetBrains Mono',Consolas,monospace";
const _ca=new Map();
function ca(h,a){a=Math.round(clamp(a)*1000)/1000;const k=h+a;let v=_ca.get(k);if(v)return v;const n=parseInt(h.slice(1),16);v=`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;_ca.set(k,v);return v;}

/* ---------- matemáticas y easing ---------- */
function clamp(v,a=0,b=1){return v<a?a:v>b?b:v;}
const lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-clamp(t),3);
const ei=t=>Math.pow(clamp(t),3);
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
const back=t=>{t=clamp(t);const c1=2.1,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const elas=t=>{t=clamp(t);return t===0?0:t===1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*2.0944)+1;};
const pp=(t0,d=.5)=>clamp((T-t0)/d);
const on=t0=>T>=t0;
const pulse=(t0,d=.6)=>{const p=(T-t0)/d;return p<0||p>1?0:Math.sin(p*PI);};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const RT=new Float32Array(8192);{const r=rng(1977);for(let i=0;i<8192;i++)RT[i]=r();}
const hs=(i,s=0)=>RT[(((i|0)*7+(s|0)*131)%8192+8192)%8192];
function vn(x,s=0){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hs(i,s),hs(i+1,s),u);}
const fbm=(x,s=0)=>vn(x,s)*.55+vn(x*2.3,s+3)*.3+vn(x*5.1,s+7)*.15;

/* ---------- primitivas ---------- */
function glow(c,b){X.shadowColor=c;X.shadowBlur=b;}
function noglow(){X.shadowBlur=0;X.shadowColor='transparent';}
function ss(c,lw){X.strokeStyle=c;if(lw)X.lineWidth=lw;}
function circle(x,y,r){X.beginPath();X.arc(x,y,Math.max(.1,r),0,TAU);}
function rr(x,y,w,h,r){X.beginPath();X.roundRect(x,y,w,h,r);}
function line(x1,y1,x2,y2){X.beginPath();X.moveTo(x1,y1);X.lineTo(x2,y2);X.stroke();}
function cap(){X.lineCap='round';X.lineJoin='round';}
function pline(pts,p=1){
  p=clamp(p);if(p<=0)return;const n=pts.length>>1;let L=0;const seg=[];
  for(let i=1;i<n;i++){const l=Math.hypot(pts[2*i]-pts[2*i-2],pts[2*i+1]-pts[2*i-1]);seg.push(l);L+=l;}
  let rem=L*p;X.beginPath();X.moveTo(pts[0],pts[1]);
  for(let i=1;i<n;i++){const l=seg[i-1];if(rem>=l){X.lineTo(pts[2*i],pts[2*i+1]);rem-=l;}else{const f=l?rem/l:0;X.lineTo(lerp(pts[2*i-2],pts[2*i],f),lerp(pts[2*i-1],pts[2*i+1],f));break;}}
  X.stroke();
}
function plineEnd(pts,p){ // punto final de una polilínea parcial
  const n=pts.length>>1;let L=0;const seg=[];
  for(let i=1;i<n;i++){const l=Math.hypot(pts[2*i]-pts[2*i-2],pts[2*i+1]-pts[2*i-1]);seg.push(l);L+=l;}
  let rem=L*clamp(p);
  for(let i=1;i<n;i++){const l=seg[i-1];if(rem>l){rem-=l;continue;}const f=l?rem/l:0;return[lerp(pts[2*i-2],pts[2*i],f),lerp(pts[2*i-1],pts[2*i+1],f)];}
  return[pts[2*n-2],pts[2*n-1]];
}
function smooth(pts,k=8){ // Catmull-Rom
  const n=pts.length>>1,o=[];const g=i=>{i=clamp(i,0,n-1);return[pts[2*i],pts[2*i+1]];};
  for(let i=0;i<n-1;i++){const p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);
    for(let j=0;j<k;j++){const t=j/k,t2=t*t,t3=t2*t;
      o.push(.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
             .5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3));}}
  o.push(pts[2*n-2],pts[2*n-1]);return o;
}
function ellPts(cx,cy,rx,ry,a0=0,a1=TAU,n=64){const o=[];for(let i=0;i<=n;i++){const a=lerp(a0,a1,i/n);o.push(cx+Math.cos(a)*rx,cy+Math.sin(a)*ry);}return o;}
function tick(x,y,s,p,c=C.g,lw){if(p<=0)return;X.save();cap();ss(c,lw||s*.16);glow(c,24);pline([x-s*.5,y,x-s*.14,y+s*.36,x+s*.56,y-s*.42],eo(p));X.restore();}
function xmark(x,y,s,p,c=C.r,lw){if(p<=0)return;X.save();cap();ss(c,lw||s*.16);glow(c,24);pline([x-s*.5,y-s*.5,x+s*.5,y+s*.5],eo(p*2));if(p>.5)pline([x+s*.5,y-s*.5,x-s*.5,y+s*.5],eo(p*2-1));X.restore();}
function arrow(x1,y1,x2,y2,p,c=C.w,lw=7,hd=34){
  if(p<=0)return;X.save();cap();ss(c,lw);glow(c,16);const e=eo(p);const ex=lerp(x1,x2,e),ey=lerp(y1,y2,e);line(x1,y1,ex,ey);
  const a=Math.atan2(y2-y1,x2-x1);X.beginPath();X.moveTo(ex-Math.cos(a-.45)*hd,ey-Math.sin(a-.45)*hd);X.lineTo(ex,ey);X.lineTo(ex-Math.cos(a+.45)*hd,ey-Math.sin(a+.45)*hd);X.stroke();X.restore();
}
function quake(times,amp=18,d=.42){let dx=0,dy=0;for(const t0 of times){const t=T-t0;if(t>=0&&t<d){const k=(1-t/d)*amp;dx+=Math.sin(t*97)*k;dy+=Math.cos(t*71)*k;}}X.translate(dx,dy);}
function zoomAt(x,y,k){X.translate(x,y);X.scale(k,k);X.translate(-x,-y);}

/* ---------- texto ---------- */
function font(sz,f='h',w=700){X.font=`${w} ${sz}px ${f==='m'?FM:FH}`;}
function txt(s,x,y,o={}){
  X.save();font(o.size||80,o.f,o.w);X.textAlign=o.align||'center';X.textBaseline=o.base||'middle';
  X.letterSpacing=(o.ls??0)+'px';X.globalAlpha*=o.alpha??1;X.fillStyle=o.color||C.w;
  if(o.glow)glow(o.gc||o.color||C.w,o.glow);X.fillText(s,x,y);X.restore();
}
function tw(s,size,f='h',ls=0){X.save();font(size,f);X.letterSpacing=ls+'px';const w=X.measureText(s).width;X.restore();return w;}
function pop(t0,s,x,y,o={}){
  if(T<t0)return;const p=pp(t0,o.d||.3);const k=lerp(o.from??.35,1,back(p));
  X.save();X.translate(x,y);X.rotate((o.rot||0)*(1-eo(p))*0);X.scale(k,k);X.globalAlpha*=clamp(p*3);txt(s,0,0,o);X.restore();
}
function chip(t0,s,x,y,o={}){
  if(T<t0)return;const p=pp(t0,.3);const k=lerp(.35,1,back(p));const sz=o.size||64;const c=o.color||C.a;
  X.save();font(sz,o.f,o.w);X.letterSpacing=(o.ls??4)+'px';const w=X.measureText(s).width;
  const bw=w+sz*1.1,bh=sz*1.7;let ox=0;if(o.align==='left')ox=bw/2;else if(o.align==='right')ox=-bw/2;
  X.translate(x+ox,y);X.scale(k,k);X.globalAlpha*=clamp(p*3)*(o.alpha??1);
  X.fillStyle=o.bg||ca(C.n,.88);rr(-bw/2,-bh/2,bw,bh,o.rad??sz*.28);X.fill();
  X.strokeStyle=c;X.lineWidth=o.lw||5;glow(c,o.glow??22);X.stroke();noglow();

function speedLines(p,c=C.w){const a=Math.sin(p*PI);if(a<=0)return;X.save();X.strokeStyle=c;X.lineCap='round';
  for(let i=0;i<70;i++){const an=hs(i,91)*TAU,r0=300+hs(i,92)*900,len=200+hs(i,93)*900*p;X.globalAlpha=a*(.25+hs(i,94)*.5);X.lineWidth=2+hs(i,95)*6;
    const r1=r0+p*1400;line(CX+Math.cos(an)*r1,CY+Math.sin(an)*r1,CX+Math.cos(an)*(r1+len),CY+Math.sin(an)*(r1+len));}X.restore();}
function render(t){
  T=t;const i=findScene(t),sc=S[i],pr=S[i-1],lt=t-sc.s;
  clearCtx(MAIN);X=MAIN;
  const TD={zoom:.55,morph:.6,wipe:.6,fade:.9,cut:.2}[pr?pr.out:'']||0;
  if(pr&&lt<TD){const p=lt/TD;
    if(pr.out==='zoom'){clearCtx(BX);drawScene(i-1,BX);
      MAIN.save();const k=lerp(.72,1,eo(p));zoomAt(CX,CY,k);drawScene(i,MAIN);MAIN.restore();
      MAIN.save();MAIN.globalAlpha=1-eo(p*1.1);const z=1+ei(p)*4.2;MAIN.drawImage(BUF,CX-W*z/2,CY-H*z/2,W*z,H*z);MAIN.restore();
      const g=MAIN.createRadialGradient(CX,CY,0,CX,CY,2000);g.addColorStop(0,ca(C.w,.55*Math.sin(p*PI)));g.addColorStop(.4,ca(C.g,.18*Math.sin(p*PI)));g.addColorStop(1,ca(C.g,0));MAIN.fillStyle=g;MAIN.fillRect(0,0,W,H);
      speedLines(p);}
    else if(pr.out==='morph'){drawScene(i,MAIN);clearCtx(BX);drawScene(i-1,BX);
      MAIN.save();MAIN.globalAlpha=1-eio(p);MAIN.filter=`blur(${Math.round(p*30)}px)`;const z=1+p*.08;MAIN.drawImage(BUF,CX-W*z/2,CY-H*z/2,W*z,H*z);MAIN.restore();}
    else if(pr.out==='wipe'){drawScene(i-1,MAIN);clearCtx(BX);drawScene(i,BX);const e=lerp(-700,W+700,eio(p));
      MAIN.save();MAIN.beginPath();MAIN.moveTo(-10,0);MAIN.lineTo(e+350,0);MAIN.lineTo(e-350,H);MAIN.lineTo(-10,H);MAIN.closePath();MAIN.clip();MAIN.drawImage(BUF,0,0);MAIN.restore();
      MAIN.save();MAIN.lineCap='round';MAIN.strokeStyle=C.g;MAIN.lineWidth=14;MAIN.shadowColor=C.g;MAIN.shadowBlur=60;MAIN.beginPath();MAIN.moveTo(e+350,0);MAIN.lineTo(e-350,H);MAIN.stroke();
      MAIN.strokeStyle=C.a;MAIN.lineWidth=4;MAIN.shadowColor=C.a;MAIN.beginPath();MAIN.moveTo(e+300,0);MAIN.lineTo(e-400,H);MAIN.stroke();MAIN.restore();}
    else if(pr.out==='fade'){if(p<.5){drawScene(i-1,MAIN);MAIN.fillStyle=ca('#000000',p*2);}else{drawScene(i,MAIN);MAIN.fillStyle=ca('#000000',(1-p)*2);}MAIN.fillRect(0,0,W,H);}
    else{ // corte con "golpe" y glitch
      MAIN.save();const k=lerp(1.05,1,eo(p));zoomAt(CX,CY,k);drawScene(i,MAIN);MAIN.restore();
      if(p<.75){BX.setTransform(1,0,0,1,0,0);BX.drawImage(cv,0,0);const fr=Math.floor(t*60);
        for(let k2=0;k2<9;k2++){const y=hs(k2+fr,11)*H,h=40+hs(k2+fr,12)*180,dx=(hs(k2+fr,13)-.5)*220*(1-p);MAIN.drawImage(BUF,0,y,W,h,dx,y,W,h);}
        MAIN.save();MAIN.globalCompositeOperation='screen';MAIN.globalAlpha=.35*(1-p);MAIN.drawImage(BUF,18*(1-p),0);MAIN.restore();}
      MAIN.fillStyle=ca(C.w,.16*(1-p));MAIN.fillRect(0,0,W,H);}
  }else drawScene(i,MAIN);
  X=MAIN;MAIN.setTransform(1,0,0,1,0,0);MAIN.filter='none';
  grain(.075);MAIN.drawImage(VIG,0,0);hud(t,i);
}
function hud(t,i){
  const a=t<5.4?0:clamp((t-5.4)/.6)*(t>604?clamp((610.3-t)/1.5):1)*.75;if(a<=0)return;
  X.save();X.globalAlpha=a;cap();X.strokeStyle=ca(C.w,.55);X.lineWidth=4;const m=70,l=100;
  for(const[x,y,sx,sy]of[[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]]){X.beginPath();X.moveTo(x,y+sy*l);X.lineTo(x,y);X.lineTo(x+sx*l,y);X.stroke();}
  const bl=.5+.5*Math.sin(t*5);X.fillStyle=C.g;X.globalAlpha=a*(.4+.6*bl);glow(C.g,20);circle(m+40,m+56,11);X.fill();noglow();X.globalAlpha=a;
  txt('SETI // ANÁLISIS DE SEÑAL',m+70,m+58,{size:34,f:'m',align:'left',color:ca(C.w,.8),ls:3});
  const mm=Math.floor(t/60),ssv=(t%60);txt(`T+ ${String(mm).padStart(2,'0')}:${ssv.toFixed(2).padStart(5,'0')}`,W-m-30,m+58,{size:34,f:'m',align:'right',color:ca(C.w,.8),ls:3});
  const fq=(1420.4058+Math.sin(t*.7)*.0004+(hs(Math.floor(t*8),3)-.5)*.0002).toFixed(4);
  txt(`FREC ${fq} MHz`,m+30,H-m-50,{size:30,f:'m',align:'left',color:ca(C.g,.8),ls:3});
  for(let k=0;k<14;k++){const h=10+fbm(t*3+k*.7,k)*60;X.fillStyle=ca(k>10?C.a:C.g,.75);X.fillRect(W-m-40-k*20,H-m-40-h,12,h);}
  txt(`${String(i+1).padStart(2,'0')}/75`,W-m-340,H-m-62,{size:30,f:'m',align:'right',color:ca(C.w,.6),ls:3});
  X.restore();
}
function fit(){const k=Math.min(innerWidth/W,innerHeight/H);cv.style.transform=`translate(${(innerWidth-W*k)/2}px,${(innerHeight-H*k)/2}px) scale(${k})`;}
addEventListener('resize',fit);fit();
(async function start(){
  try{await Promise.race([Promise.all([document.fonts.load(`700 80px 'Space Grotesk'`),document.fonts.load(`500 80px 'Space Grotesk'`),document.fonts.load(`700 80px 'JetBrains Mono'`),document.fonts.load(`500 80px 'JetBrains Mono'`)]),new Promise(r=>setTimeout(r,1500))]);}catch(e){}
  initBG();initWorld();initWow();
  try{T=217.5;clearCtx(BX);drawScene(findScene(217.5),BX);}catch(e){} // precalienta capas en caché
  const q=new URLSearchParams(location.search);const st=q.has('still')?parseFloat(q.get('still')):null;const off=parseFloat(q.get('t')||'0')||0;
  window.renderAt=t=>render(clamp(t,0,TOTAL));window.__ready=true;
  if(st!==null){render(st);return;}
  let t0=null;
  function loop(now){if(t0===null)t0=now;const t=Math.min(TOTAL,off+(now-t0)/1000);render(t);requestAnimationFrame(loop);}
  requestAnimationFrame(loop);
})();
