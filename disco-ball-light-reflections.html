<canvas id="stage" width="3840" height="2160"></canvas>
<script>
/* =====================================================================

   A spinning mirror ball throws hundreds of physically traced light

  { pos: [-6.4,  3.4,  4.2], hue: 324, amp: 26, sat: 0.92, hk: 1, hp: 0.0, lk: 1, lp: 0.0, gain: 1.00, beam: true  },

/* ------------------------------------------------------------------ */

/* ------------------------------------------------------------------ */

{ const rgb = [1, 0.93, 0.80];                      // warm white bucket
  spotSprites.push(makeSprite(SPOT_S, rgb, spotFn));
  flareSprites.push(makeSprite(FLARE_S, rgb, flareFn)); }

/* ------------------------------------------------------------------ */
/*  Camera                                                             */
/* ------------------------------------------------------------------ */

function toCam(x, y, z) {
  const dx = x - cam.x, dy = y - cam.y, dz = z - cam.z;

const NZ = 0.2;

  for (let i = 0; i < c.length; i++) {
    const a = c[i], b = c[(i + 1) % c.length], ai = a[2] >= NZ, bi = b[2] >= NZ;
    if (ai) out.push(a);

  out.forEach((p, i) => { const s = camToScreen(p); i ? ctx.lineTo(s[0], s[1]) : ctx.moveTo(s[0], s[1]); });

}

/* ------------------------------------------------------------------ */
/*  Mirror-ball facets                                                 */
/* ------------------------------------------------------------------ */

    const M = Math.max(6, Math.round(TAU * cl / dLat)), dLon = TAU / M;
    for (let j = 0; j < M; j++) {

      const cx = Math.cos(lon), sx = Math.sin(lon);

      t2 = [n[1] * t1[2] - n[2] * t1[1], n[2] * t1[0] - n[0] * t1[2], n[0] * t1[1] - n[1] * t1[0]];

        p: [cl * cx * BALL.r, sl * BALL.r, cl * sx * BALL.r],

const mkOri = () => ({ n: new Float32Array(F * 3), t1: new Float32Array(F * 3), t2: new Float32Array(F * 3), p: new Float32Array(F * 3) });

/* ------------------------------------------------------------------ */
/*  Light animation                                                    */
/* ------------------------------------------------------------------ */

      const inc = 0.4 + 0.6 * Math.abs(axis === 0 ? Rx : axis === 1 ? Ry : Rz);
      buf.valid[idx] = 1; buf.wall[idx] = wall;
      buf.cx[idx] = cx; buf.cy[idx] = cy; buf.ax[idx] = ax * SPOT_SCALE; buf.ay[idx] = ay * SPOT_SCALE;
      buf.bx[idx] = bx * SPOT_SCALE; buf.by[idx] = by * SPOT_SCALE;
      buf.a[idx] = ndl * fall * inc * Math.pow(clamp(9000 / area, 0.25, 1.6), 0.55);
    }
  }
}

function drawSpots(ls, gain) {
  const A = spotsA, B = spotsB, S = SPOT_S;
  ctx.globalCompositeOperation = 'lighter';
  for (let idx = 0; idx < SPN; idx++) {
    const va = A.valid[idx], vb = B.valid[idx];
    if (!va && !vb) continue;
    const st = ls[idx % NL]; if (st.lvl < 0.02) continue;
    const spr = spotSprites[st.bucket];
    if (va && vb && A.wall[idx] === B.wall[idx]) {
      const dxm = B.cx[idx] - A.cx[idx], dym = B.cy[idx] - A.cy[idx], D = Math.hypot(dxm, dym);
      const size = Math.sqrt(Math.abs(A.ax[idx] * A.by[idx] - A.ay[idx] * A.bx[idx])) + 1;
      const step = Math.max(6, size * 0.14);
      const N = D > 3000 ? 1 : clamp(Math.ceil(D / step), 1, 24);
      const overlap = Math.min(N, size / step);
      const ratio = clamp(size / (D + size), 0.32, 1);
      const base = 0.5 * (A.a[idx] + B.a[idx]) * st.lvl * gain;
      const alpha = Math.min(1, base * ratio * (N > 1 ? 1 / overlap : 1) * (N > 1 ? 1.6 : 1));
      ctx.globalAlpha = alpha;
      for (let i = 0; i < N; i++) {
        const f = (i + 0.5) / N, g = 1 - f;
        const ax = A.ax[idx] * g + B.ax[idx] * f, ay = A.ay[idx] * g + B.ay[idx] * f;
        const bx = A.bx[idx] * g + B.bx[idx] * f, by = A.by[idx] * g + B.by[idx] * f;
        const cx = A.cx[idx] * g + B.cx[idx] * f, cy = A.cy[idx] * g + B.cy[idx] * f;
        ctx.setTransform(ax / S, ay / S, bx / S, by / S, cx - (ax + bx) * 0.5, cy - (ay + by) * 0.5);
        ctx.drawImage(spr, 0, 0);
      }
    } else {
      const X = va ? A : B;
      ctx.globalAlpha = Math.min(1, X.a[idx] * st.lvl * gain * 0.5);
      const ax = X.ax[idx], ay = X.ay[idx], bx = X.bx[idx], by = X.by[idx];
      ctx.setTransform(ax / S, ay / S, bx / S, by / S, X.cx[idx] - (ax + bx) * 0.5, X.cy[idx] - (ay + by) * 0.5);
      ctx.drawImage(spr, 0, 0);
    }
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
}

/* ------------------------------------------------------------------ */
/*  Room                                                               */
/* ------------------------------------------------------------------ */
function drawRoom(ls, t) {
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#04040a'; ctx.fillRect(0, 0, W, H);
  const { x0, x1, y0, y1, z0, z1 } = BOX;
  fillPoly3([[x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0]], '#0a0b19');   // back
  fillPoly3([[x0, y0, z0], [x0, y0, z1], [x0, y1, z1], [x0, y1, z0]], '#07081a');   // left
  fillPoly3([[x1, y0, z0], [x1, y0, z1], [x1, y1, z1], [x1, y1, z0]], '#07081a');   // right
  fillPoly3([[x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1]], '#08080f');   // floor
  fillPoly3([[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]], '#05050b');   // ceiling

  // architectural panel seams
  ctx.lineWidth = 2.2; ctx.strokeStyle = 'rgba(150,160,230,0.06)'; ctx.beginPath();
  for (let x = x0; x <= x1 + 0.01; x += 1.5) line3(x, y0, z0, x, y1, z0);                 // back slats
  for (let y = y0 + 1.4; y < y1; y += 1.4) line3(x0, y, z0, x1, y, z0);
  for (let z = z0; z <= z1; z += 1.5) { line3(x0, y0, z, x0, y1, z); line3(x1, y0, z, x1, y1, z); }   // side slats
  for (let y = y0 + 1.4; y < y1; y += 1.4) { line3(x0, y, z0, x0, y, z1); line3(x1, y, z0, x1, y, z1); }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(140,150,255,0.07)'; ctx.lineWidth = 2.6; ctx.beginPath();       // floor tiles
  for (let x = x0; x <= x1 + 0.01; x += 1.5) line3(x, y0, z0, x, y0, z1);
  for (let z = z0; z <= z1; z += 1.5) line3(x0, y0, z, x1, y0, z);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(120,130,220,0.05)'; ctx.beginPath();                             // ceiling grid
  for (let x = x0; x <= x1 + 0.01; x += 3) line3(x, y1, z0, x, y1, z1);
  for (let z = z0; z <= z1; z += 3) line3(x0, y1, z, x1, y1, z);
  ctx.stroke();

  // LED accent strips (colour follows the lights) - additive
  ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  const strips = [
    [[x0, y0 + 0.05, z0, x1, y0 + 0.05, z0], 0], [[x0, y0 + 0.05, z0, x0, y0 + 0.05, z1], 1], [[x1, y0 + 0.05, z0, x1, y0 + 0.05, z1], 0],
    [[x0, y1 - 0.05, z0, x1, y1 - 0.05, z0], 3], [[x0, y1 - 0.05, z0, x0, y1 - 0.05, z1], 2], [[x1, y1 - 0.05, z0, x1, y1 - 0.05, z1], 4],
  ];
  for (const [s, li] of strips) {
    const c = ls[li].rgb, a = 0.30 * clamp(ls[li].lvl, 0.2, 1.2);
    ctx.strokeStyle = `rgba(${c[0]*255|0},${c[1]*255|0},${c[2]*255|0},${a})`; ctx.lineWidth = 9;
    ctx.beginPath(); line3(...s); ctx.stroke();
  }
  ctx.lineCap = 'butt';
}

/* ------------------------------------------------------------------ */
/*  Ball, beams, glints                                                */
/* ------------------------------------------------------------------ */
const glints = [];
function ballScreen() { proj(BALL.x, BALL.y, BALL.z); const cx = PX, cy = PY, z = PZ; return { cx, cy, r: BALL.r / z * FOCAL * 1.0, z }; }

function drawBeams(ls, bs) {
  ctx.globalCompositeOperation = 'lighter';
  for (let l = 0; l < NL; l++) {
    const L = LIGHTS[l]; if (!L.beam) continue;
    const st = ls[l];
    if (!proj(L.pos[0], L.pos[1], L.pos[2])) continue;
    const sx = PX, sy = PY, depth = PZ;
    const dx = bs.cx - sx, dy = bs.cy - sy, len = Math.hypot(dx, dy); if (len < 50) continue;
    const nx = -dy / len, ny = dx / len;
    const c = st.rgb, col = a => `rgba(${c[0]*255|0},${c[1]*255|0},${c[2]*255|0},${a})`;
    const wsrc = Math.max(10, 0.35 / depth * FOCAL * 0.5);
    const layers = [];
    for (let i = 0; i < 20; i++) layers.push([1.15 - i * 0.05, 0.02]);
    for (const [wm, al] of layers) {
      const wb = bs.r * wm, ws = wsrc * wm;
      const g = ctx.createLinearGradient(sx, sy, bs.cx, bs.cy);
      const lv = clamp(st.lvl, 0, 1.3) * al;
      g.addColorStop(0, col(lv * 1.6)); g.addColorStop(0.6, col(lv * 0.8)); g.addColorStop(1, col(lv * 0.4));
      ctx.fillStyle = g; ctx.beginPath();
      ctx.moveTo(sx + nx * ws, sy + ny * ws); ctx.lineTo(bs.cx + nx * wb, bs.cy + ny * wb);
      ctx.lineTo(bs.cx - nx * wb, bs.cy - ny * wb); ctx.lineTo(sx - nx * ws, sy - ny * ws); ctx.closePath(); ctx.fill();
    }
  }
  // fixtures (glow + flare)
  for (let l = 0; l < NL; l++) {
    const L = LIGHTS[l], st = ls[l];
    if (!proj(L.pos[0], L.pos[1], L.pos[2])) continue;
    if (PX < -600 || PX > W + 600 || PY < -600 || PY > H + 600) continue;
    const sz = clamp(0.9 / PZ * FOCAL, 60, 900);
    ctx.globalAlpha = clamp(st.lvl, 0, 1) * 0.9; ctx.drawImage(flareSprites[st.bucket], PX - sz, PY - sz, sz * 2, sz * 2);
  }
  ctx.globalAlpha = 1;
}

function drawBall(t, ls, bs) {
  const ori = oriM; orient(t, ori);
  const Cx = cam.x, Cy = cam.y, Cz = cam.z;
  glints.length = 0;
  // hanging rod / cap
  ctx.globalCompositeOperation = 'source-over';
  if (proj(BALL.x, BALL.y + BALL.r * 1.0, BALL.z)) {
    const top = [PX, PY];
    if (proj(BALL.x, BOX.y1, BALL.z)) {
      const g = ctx.createLinearGradient(0, PY, 0, top[1]);
      g.addColorStop(0, 'rgba(90,92,110,0.15)'); g.addColorStop(1, 'rgba(160,165,190,0.85)');
      ctx.strokeStyle = g; ctx.lineWidth = Math.max(4, 0.045 / PZ * FOCAL);
      ctx.beginPath(); ctx.moveTo(top[0], top[1]); ctx.lineTo(PX, PY); ctx.stroke();
    }
  }
  // backing sphere (dark grout)
  ctx.fillStyle = '#07070d'; ctx.beginPath(); ctx.arc(bs.cx, bs.cy, bs.r * 1.005, 0, TAU); ctx.fill();

  const cols = ls.map(s => s.rgb);
  const SHR = 0.93;
  for (let f = 0; f < F; f++) {
    const k = f * 3, fd = facetData[f];
    const nx = ori.n[k], ny = ori.n[k+1], nz = ori.n[k+2];
    const px = BALL.x + ori.p[k], py = BALL.y + ori.p[k+1], pz = BALL.z + ori.p[k+2];
    let Vx = Cx - px, Vy = Cy - py, Vz = Cz - pz; const dv = Math.hypot(Vx, Vy, Vz); Vx /= dv; Vy /= dv; Vz /= dv;
    const ndv = nx * Vx + ny * Vy + nz * Vz;
    if (ndv < 0.03) continue;
    const Rvx = 2 * ndv * nx - Vx, Rvy = 2 * ndv * ny - Vy, Rvz = 2 * ndv * nz - Vz;
    let r = 0.012, g = 0.014, b = 0.03;
    for (let l = 0; l < NL; l++) {
      const L = LIGHTS[l].pos, st = ls[l], c = cols[l];
      let Lx = L[0] - px, Ly = L[1] - py, Lz = L[2] - pz; const dl = Math.hypot(Lx, Ly, Lz); Lx /= dl; Ly /= dl; Lz /= dl;
      const ndl = nx * Lx + ny * Ly + nz * Lz;
      const cosang = Rvx * Lx + Rvy * Ly + Rvz * Lz;
      const lv = st.lvl;
      const sheen = Math.max(0, ndl) * 0.26 * lv * (0.25 + 1.2 * fd.rnd);
      const broad = Math.pow(Math.max(cosang, 0), 14) * 0.45 * lv;
      const gl = Math.exp(-2 * (1 - cosang) / (0.07 * 0.07)) * lv;         // mirror glint towards the camera
      const w = sheen + broad;
      r += c[0] * w + (c[0] * 0.4 + 0.6) * gl * 2.8;
      g += c[1] * w + (c[1] * 0.4 + 0.6) * gl * 2.8;
      b += c[2] * w + (c[2] * 0.4 + 0.6) * gl * 2.8;
      if (gl > 0.30) glints.push({ f, l, gl, px, py, pz });
    }
    // facets mirroring the coloured spots on the surrounding walls (slow twinkle)
    const tw = Math.pow(0.5 + 0.5 * Math.sin(TAU * fd.tk * t / DUR + fd.tp), 5);
    const lc = cols[f % NL], tl = ls[f % NL].lvl * tw * 0.55;
    r += lc[0] * tl; g += lc[1] * tl; b += lc[2] * tl;
    const rim = 0.45 + 0.55 * Math.pow(ndv, 0.55);
    r *= rim; g *= rim; b *= rim;
    r = 1 - Math.exp(-r * 1.25); g = 1 - Math.exp(-g * 1.25); b = 1 - Math.exp(-b * 1.25);
    // facet outline
    const t1x = ori.t1[k], t1y = ori.t1[k+1], t1z = ori.t1[k+2], t2x = ori.t2[k], t2y = ori.t2[k+1], t2z = ori.t2[k+2];
    const a1 = fd.h1 * SHR, a2 = fd.h2 * SHR;
    ctx.beginPath(); let okp = true;
    for (let c = 0; c < 4; c++) {
      const s1 = (c === 0 || c === 3) ? -1 : 1, s2 = c < 2 ? -1 : 1;
      if (!proj(px + s1 * a1 * t1x + s2 * a2 * t2x, py + s1 * a1 * t1y + s2 * a2 * t2y, pz + s1 * a1 * t1z + s2 * a2 * t2z)) { okp = false; break; }
      c ? ctx.lineTo(PX, PY) : ctx.moveTo(PX, PY);
    }
    if (!okp) continue;
    ctx.closePath();
    ctx.fillStyle = `rgb(${r * 255 | 0},${g * 255 | 0},${b * 255 | 0})`; ctx.fill();
  }
}

function drawGlints(ls) {
  ctx.globalCompositeOperation = 'lighter';
  for (const gl of glints) {
    if (!proj(gl.px, gl.py, gl.pz)) continue;
    const st = ls[gl.l], s = (180 + 420 * Math.min(1, gl.gl)) * (0.8 + 0.4 * hash(gl.f));
    ctx.globalAlpha = Math.min(1, gl.gl * 1.1);
    ctx.drawImage(flareSprites[st.bucket], PX - s, PY - s, s * 2, s * 2);
  }
  ctx.globalAlpha = 1;
}

function drawHalo(ls, bs) {
  ctx.globalCompositeOperation = 'lighter';
  const R = bs.r;
  const g = ctx.createRadialGradient(bs.cx, bs.cy, R * 0.9, bs.cx, bs.cy, R * 4.4);
  let r = 0, gg = 0, b = 0, tot = 0;
  ls.forEach(s => { const w = Math.max(s.lvl, 0); r += s.rgb[0] * w; gg += s.rgb[1] * w; b += s.rgb[2] * w; tot += w; });
  r /= tot; gg /= tot; b /= tot;
  const c = a => `rgba(${r*255|0},${gg*255|0},${b*255|0},${a})`;
  g.addColorStop(0, c(0.12)); g.addColorStop(0.25, c(0.05)); g.addColorStop(1, c(0));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

/* ------------------------------------------------------------------ */
/*  Dust motes / bokeh                                                 */
/* ------------------------------------------------------------------ */
const motes = [];
for (let i = 0; i < 150; i++) {
  motes.push({ x: (hash(i * 3.1) - .5) * 15, y: BOX.y0 + 0.8 + hash(i * 5.7) * 8.4, z: -8 + hash(i * 7.3) * 16.5,
    r: 0.02 + Math.pow(hash(i * 11.9), 3) * 0.20, k: 1 + Math.floor(hash(i * 2.3) * 2), p: hash(i * 13.3) * TAU,
    tk: 3 + Math.floor(hash(i * 17.7) * 6), sp: hash(i * 19.1) * TAU, c: i % 6, a: 0.05 + hash(i * 23.3) * 0.12 });
}
function drawMotes(t) {
  ctx.globalCompositeOperation = 'lighter';
  const a = TAU * t / DUR;
  for (const m of motes) {
    const x = m.x + 0.55 * Math.sin(a * m.k + m.p), y = m.y + 0.45 * Math.sin(a * m.k + m.p * 1.7), z = m.z + 0.55 * Math.cos(a * m.k + m.p * 0.6);
    if (!proj(x, y, z) || PZ < 0.9) continue;
    const s = Math.max(6, m.r / PZ * FOCAL);
    if (PX < -s || PX > W + s || PY < -s || PY > H + s) continue;
    const tw = 0.55 + 0.45 * Math.sin(TAU * m.tk * t / DUR + m.sp);
    ctx.globalAlpha = m.a * tw * (s > 50 ? 0.8 : 1.6);
    ctx.drawImage(bokehSprites[m.c], PX - s, PY - s, s * 2, s * 2);
  }
  ctx.globalAlpha = 1;
}

/* ------------------------------------------------------------------ */
/*  Post                                                               */
/* ------------------------------------------------------------------ */
function postFX(frame) {
  ctx.globalCompositeOperation = 'source-over';
  bA.filter = 'blur(5px)'; bA.globalCompositeOperation = 'copy'; bA.drawImage(canvas, 0, 0, 960, 540); bA.filter = 'none';
  bB.filter = 'blur(3px)'; bB.globalCompositeOperation = 'copy'; bB.drawImage(bloomA, 0, 0, 240, 135); bB.filter = 'none';
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.55; ctx.drawImage(bloomA, 0, 0, W, H);
  ctx.globalAlpha = 0.65; ctx.drawImage(bloomB, 0, 0, W, H);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);
  // film grain
  ctx.save();
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.07;
  ctx.translate(Math.floor(hash(frame * 1.37) * 512), Math.floor(hash(frame * 2.11) * 512));
  ctx.fillStyle = grainPattern; ctx.fillRect(-512, -512, W + 1024, H + 1024);
  ctx.restore();
}

/* ------------------------------------------------------------------ */
/*  Frame                                                              */
/* ------------------------------------------------------------------ */
const SHUTTER = 1 / 60;            // seconds of motion blur
function render(t) {
  t = ((t % DUR) + DUR) % DUR;
  const ls = lightState(t);
  // motion-blur endpoints
  computeSpots(t - SHUTTER / 2, oriA, spotsA);
  computeSpots(t + SHUTTER / 2, oriB, spotsB);
  setCamera(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawRoom(ls, t);
  const bs = ballScreen();
  drawSpots(ls, 0.95);
  drawBeams(ls, bs);
  drawBall(t, ls, bs);
  drawHalo(ls, bs);
  drawGlints(ls);
  drawMotes(t);
  postFX(Math.floor(t * 60));
}

window.DURATION = DUR;
window.renderAt = t => { render(t); };

/* ------------------------------------------------------------------ */
/*  Autoplay loop                                                      */
/* ------------------------------------------------------------------ */
const qs = new URLSearchParams(location.search);
if (qs.has('t')) {
  render(parseFloat(qs.get('t')) || 0);
} else {
  let start = null;
  const tick = now => {
    if (start === null) start = now;
    render(((now - start) / 1000) % DUR);
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
})();
</script>
</body>
</html>
