   Tuşlar (önizleme): Boşluk=durdur, ←/→ = ±5 sn (Shift ±30 sn)
   URL: ?t=120 (başlangıç saniyesi), &freeze (tek kare)
   ===================================================================== */
let READY = false;
function renderFrame(t) {
  resetFX();
  const c = ctx;
  c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  c.fillStyle = '#000'; c.fillRect(0, 0, W, H);
  const sh = t <= END_T ? shotAt(t) : null;
  if (sh) {
    const lt = t - sh.s, d = sh.e - sh.s, R = RN[sh.R];
    if (sh.p.g) grade(sh.p.g, 1); else if (R && R.g) grade(R.g, 1);
    if (R && R.fx) Object.assign(FX, R.fx);
    if (sh.p.fx) Object.assign(FX, sh.p.fx);
    const cam = camFor(sh, lt, d);
    applyEvents(t, cam);
    if (sh.p.shake) FX.shake = Math.max(FX.shake, typeof sh.p.shake === 'function' ? sh.p.shake(lt, d) : sh.p.shake);
    shakeCam(cam, t);
    c.save();
    if (R) {
      if (!R.ownCam) applyCam(c, cam);
      try { R.draw(c, lt, d, sh.p, cam, t); } catch (e) { console.error('render error', sh.R, sh.c, e); }
    }
    c.restore();
    c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over'; c.shadowBlur = 0;
  } else if (t > END_T) FX.fade = 1;
  drawCaptions(t);
  postRun(t);
}
let T0 = null, paused = false, tPause = 0, tOff = START_T;
function curT(ts) { return paused ? tPause : tOff + (ts - T0) / 1000; }
function loop(ts) {
  if (READY && !MANUAL) {
    if (T0 === null) T0 = ts;
    const t = FREEZE ? START_T : curT(ts);
    renderFrame(Math.min(t, END_T + 2));
  }
  requestAnimationFrame(loop);
}
addEventListener('keydown', e => {
  if (T0 === null) return;
  const nowTs = performance.now(); const t = curT(nowTs);
  if (e.code === 'Space') { if (paused) { paused = false; tOff = tPause; T0 = nowTs; } else { paused = true; tPause = t; } e.preventDefault(); }
  if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') {
    const d = (e.code === 'ArrowRight' ? 1 : -1) * (e.shiftKey ? 30 : 5); const nt = Math.max(0, t + d);
    if (paused) tPause = nt; else { tOff = nt; T0 = nowTs; }
  }
});
window.__render = t => renderFrame(t);
window.__isReady = () => READY;
window.__end = () => END_T;
window.__shots = () => SHOTS.map(s => [s.s, s.e, s.R, String(s.c)]);
fitStage();
(function boot() {
  const fl = ['400 80px XAnton', '900 80px XUnb', '700 80px XUnb', '500 80px XInter', '700 80px XInter', '900 80px XInter', '500 80px XMono', '800 80px XMono'];
  const go = () => { READY = true; };
  try { Promise.all(fl.map(f => document.fonts.load(f, 'AaĞğİıŞşÇçÖöÜü0123'))).then(go, go); } catch (e) { go(); }
  setTimeout(go, 2500);
  requestAnimationFrame(loop);
})();

</script>
