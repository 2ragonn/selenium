<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Falling Autumn Leaves — Dark Seamless Loop (3840x2160, 15s)</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #07080c;
  }
  #stage {
    position: absolute; left: 50%; top: 50%;
    width: 3840px; height: 2160px;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(1);
    overflow: hidden; background: #07080c;
  }
  canvas { display: block; width: 3840px; height: 2160px; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="3840" height="2160"></canvas></div>
<script>
(() => {
'use strict';
/* =====================================================================
   FALLING AUTUMN LEAVES ON DARK — 3840x2160 — 15 s perfect seamless loop
   Every motion is a periodic function of t with period T (or T/n), so the
   frame at t = 15 s is identical to the frame at t = 0 s.
   Deterministic seeded RNG => identical scene on every load / render.
   ===================================================================== */
const W = 3840, H = 2160, T = 15;
const TAU = Math.PI * 2;

const stage  = document.getElementById('stage');
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d', { alpha: false });

function fit() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  stage.style.transform = `translate(-50%,-50%) scale(${s})`;
}
window.addEventListener('resize', fit); fit();

/* ---------- seeded RNG (mulberry32) ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rnd = mulberry32(20241031);
const R  = (a, b) => a + (b - a) * rnd();
const RI = (a, b) => Math.floor(R(a, b + 1));
const pick = arr => arr[Math.floor(rnd() * arr.length)];

/* ---------- maple leaf outline (right half, y up, unit radius) ---------- */
const HALF = [
  [0.000, 1.000],
  [0.045, 0.870], [0.130, 0.905],
  [0.110, 0.740], [0.205, 0.770],
  [0.175, 0.600], [0.260, 0.605],
  [0.225, 0.400],                    // sinus top / upper lobe (deep)
  [0.380, 0.500], [0.400, 0.590],
  [0.540, 0.575], [0.575, 0.675],
  [0.740, 0.660],                    // upper lobe tip
  [0.705, 0.520], [0.805, 0.500],
  [0.725, 0.380], [0.830, 0.335],
  [0.700, 0.250],
  [0.500, 0.110],                    // sinus upper / lower lobe (deep)
  [0.690, 0.135], [0.735, 0.215],
  [0.860, 0.100], [0.890, 0.180],
  [0.960, 0.000],                    // lower lobe tip
  [0.850, -0.070], [0.930, -0.150],
  [0.790, -0.190], [0.830, -0.290],
  [0.670, -0.310],
  [0.520, -0.430], [0.400, -0.490],
  [0.260, -0.545], [0.120, -0.590],
  [0.040, -0.610],
];
function leafPoints(jit, rngj) {
  // build full outline, slightly perturbed per shape variant
  const right = HALF.map(([x, y]) => [x + (rngj() - 0.5) * jit, y + (rngj() - 0.5) * jit]);
  const left  = HALF.map(([x, y]) => [-x + (rngj() - 0.5) * jit, y + (rngj() - 0.5) * jit]).reverse();
  // keep tip exact and base closed
  right[0] = [0, 1];
  return right.concat(left.slice(0, -1));
}
function tracePath(g, pts, r) {
  g.beginPath();
  g.moveTo(pts[0][0] * r, -pts[0][1] * r);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0] * r, -pts[i][1] * r);
  g.closePath();
}

/* ---------- palettes: [light core, mid, deep edge] ---------- */
const PALETTES = [
  ['#ffd27a', '#ff8a2a', '#c8321a'],   // amber -> orange -> red
  ['#ffe27a', '#ffb02e', '#e0641c'],   // gold
  ['#ff9a5a', '#ff4e2a', '#9e1220'],   // scarlet
  ['#ff7c6a', '#d8262d', '#6e0c22'],   // crimson / burgundy
  ['#ffcf5c', '#f07a1e', '#8c3612'],   // russet
  ['#fff08a', '#f4c02a', '#d0741a'],   // bright yellow
  ['#ffb26b', '#ec5a24', '#7a1a1a'],   // ember
  ['#f9e37a', '#d9a02a', '#a8461a'],   // turning green-gold
];

/* ---------- sprite factory ---------- */
function hexToRgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgba(h, a) { const [r, g, b] = hexToRgb(h); return `rgba(${r},${g},${b},${a})`; }

function drawLeaf(g, r, pts, pal, back, gradAngle) {
  // base fill: radial glow from near-center + linear tint
  tracePath(g, pts, r);
  const rg = g.createRadialGradient(-0.05 * r, 0.05 * r, 0.05 * r, 0, 0, 1.15 * r);
  rg.addColorStop(0.00, pal[0]);
  rg.addColorStop(0.45, pal[1]);
  rg.addColorStop(1.00, pal[2]);
  g.fillStyle = rg;
  g.fill();

  // directional tint across leaf (gives each leaf a lit side)
  g.save();
  g.clip();
  const ca = Math.cos(gradAngle), sa = Math.sin(gradAngle);
  const lg = g.createLinearGradient(-ca * r, -sa * r, ca * r, sa * r);
  lg.addColorStop(0, 'rgba(255,255,255,0.20)');
  lg.addColorStop(0.5, 'rgba(255,255,255,0.0)');
  lg.addColorStop(1, 'rgba(60,0,20,0.28)');
  g.fillStyle = lg;
  g.fillRect(-1.3 * r, -1.3 * r, 2.6 * r, 2.6 * r);

  // subtle blotches (autumn speckle)
  g.globalCompositeOperation = 'multiply';
  for (let i = 0; i < 7; i++) {
    const bx = (rnd() * 1.4 - 0.7) * r, by = (rnd() * 1.2 - 0.5) * r, br = (0.08 + rnd() * 0.16) * r;
    const bg = g.createRadialGradient(bx, by, 0, bx, by, br);
    bg.addColorStop(0, 'rgba(120,40,20,0.35)');
    bg.addColorStop(1, 'rgba(120,40,20,0)');
    g.fillStyle = bg;
    g.fillRect(bx - br, by - br, br * 2, br * 2);
  }
  g.globalCompositeOperation = 'source-over';

  // veins
  const base = [0, 0.58 * r];
  const tips = [[0, -1 * r], [0.74 * r, -0.66 * r], [-0.74 * r, -0.66 * r], [0.96 * r, 0 * r], [-0.96 * r, 0 * r]];
  g.lineCap = 'round';
  g.strokeStyle = 'rgba(255,238,190,0.42)';
  for (const tip of tips) {
    g.lineWidth = 0.022 * r;
    g.beginPath(); g.moveTo(base[0], base[1]); g.lineTo(tip[0], tip[1]); g.stroke();
    // secondary veins
    const dx = tip[0] - base[0], dy = tip[1] - base[1];
    const len = Math.hypot(dx, dy), nx = -dy / len, ny = dx / len;
    g.lineWidth = 0.011 * r;
    for (let k = 0.32; k < 0.9; k += 0.17) {
      const px = base[0] + dx * k, py = base[1] + dy * k;
      const sl = 0.22 * r * (1 - k * 0.6);
      g.beginPath();
      g.moveTo(px, py); g.lineTo(px + nx * sl + dx / len * sl * 0.6, py + ny * sl + dy / len * sl * 0.6);
      g.moveTo(px, py); g.lineTo(px - nx * sl + dx / len * sl * 0.6, py - ny * sl + dy / len * sl * 0.6);
      g.stroke();
    }
  }
  // vein shadow (dark side)
  g.strokeStyle = 'rgba(80,10,10,0.18)';
  g.lineWidth = 0.032 * r;
  g.beginPath(); g.moveTo(base[0] + 0.012 * r, base[1]); g.lineTo(0.012 * r, -1 * r); g.stroke();

  if (back) {
    g.fillStyle = 'rgba(40,8,14,0.34)';
    g.fillRect(-1.3 * r, -1.3 * r, 2.6 * r, 2.6 * r);
  }
  g.restore();

  // edge line
  tracePath(g, pts, r);
  g.lineJoin = 'round';
  g.lineWidth = 0.018 * r;
  g.strokeStyle = rgba(pal[2], 0.75);
  g.stroke();

  // stem
  g.strokeStyle = back ? '#4a1c10' : '#6b2a12';
  g.lineCap = 'round';
  g.lineWidth = 0.05 * r;
  g.beginPath(); g.moveTo(0, 0.57 * r); g.lineTo(0.03 * r, 0.98 * r); g.stroke();
  g.lineWidth = 0.032 * r;
  g.strokeStyle = back ? '#7a3a1c' : '#9a4a20';
  g.beginPath(); g.moveTo(0.005 * r, 0.6 * r); g.lineTo(0.033 * r, 0.985 * r); g.stroke();
}

function makeSprite(size, blur, pts, pal, back, gradAngle, dim) {
  const r = size / 2;
  const pad = Math.ceil(blur * 3 + size * 0.12);
  const S = Math.ceil(size + pad * 2);
  // draw sharp at full res on temp
  const tmp = document.createElement('canvas'); tmp.width = tmp.height = S;
  const tg = tmp.getContext('2d');
  tg.translate(S / 2, S / 2);
  drawLeaf(tg, r, pts, pal, back, gradAngle);
  if (dim < 1) {
    tg.globalCompositeOperation = 'source-atop';
    tg.fillStyle = `rgba(6,8,14,${1 - dim})`;
    tg.fillRect(-S, -S, S * 2, S * 2);
  }
  if (blur <= 0.2) return tmp;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  g.filter = `blur(${blur}px)`;
  g.drawImage(tmp, 0, 0);
  return c;
}

/* ---------- shape variants ---------- */
const SHAPES = [];
for (let i = 0; i < 4; i++) { const rj = mulberry32(777 + i * 131); SHAPES.push(leafPoints(i === 0 ? 0 : 0.035, rj)); }

/* ---------- layers ---------- */
const LAYERS = [
  { name: 'far',  count: 110, size: [34, 80],   blur: [3.5, 5.5],  alpha: [0.55, 0.8], dim: 0.55, sway: [40, 120],  flutter: [6, 16],  spinMax: 1 },
  { name: 'mid',  count: 62,  size: [110, 230], blur: [0, 0.8],    alpha: [1, 1],      dim: 1.0,  sway: [90, 260],  flutter: [14, 34], spinMax: 2 },
  { name: 'near', count: 16,  size: [300, 560], blur: [9, 20],     alpha: [0.72, 0.9], dim: 0.9,  sway: [140, 320], flutter: [20, 44], spinMax: 2 },
];

const leaves = [];
const spriteCache = new Map();
function getSprite(key, mk) { if (!spriteCache.has(key)) spriteCache.set(key, mk()); return spriteCache.get(key); }

for (const L of LAYERS) {
  for (let i = 0; i < L.count; i++) {
    const size = R(L.size[0], L.size[1]);
    const blur = R(L.blur[0], L.blur[1]);
    const shapeIdx = RI(0, SHAPES.length - 1);
    const palIdx = RI(0, PALETTES.length - 1);
    const gradAngle = R(0, TAU);
    // quantise size so sprites are shared within layer buckets
    const bucket = Math.round(size / (L.name === 'far' ? 12 : L.name === 'mid' ? 30 : 70));
    const qsize = bucket * (L.name === 'far' ? 12 : L.name === 'mid' ? 30 : 70);
    const qblur = Math.round(blur * 2) / 2;
    const key = `${L.name}|${qsize}|${qblur}|${shapeIdx}|${palIdx}|${Math.round(gradAngle * 2)}`;
    const front = getSprite(key + '|f', () => makeSprite(qsize, qblur, SHAPES[shapeIdx], PALETTES[palIdx], false, gradAngle, L.dim));
    const back  = getSprite(key + '|b', () => makeSprite(qsize, qblur, SHAPES[shapeIdx], PALETTES[palIdx], true,  gradAngle, L.dim));

    const margin = front.width * 0.8;
    const Ly = H + margin * 2;
    // vertical loops per 15 s: 1 for most, 2 for a few near / mid leaves (faster, closer)
    const nY = (L.name === 'near' && rnd() < 0.35) || (L.name === 'mid' && rnd() < 0.12) ? 2 : 1;
    const kSway = RI(2, 4);                 // sway cycles per loop
    leaves.push({
      front, back, margin, Ly, nY,
      x0: R(-margin * 0.5, W + margin * 0.5),
      y0: R(0, Ly),
      a1: R(L.sway[0] * 0.8, L.sway[1] * 0.8), p1: R(0, TAU),        // slow drift, 1 cycle / loop
      a2: R(L.sway[0] * 0.35, L.sway[1] * 0.45), k2: kSway, p2: R(0, TAU), // rocking sway
      fl: R(L.flutter[0], L.flutter[1]), kf: kSway,                   // vertical flutter coupled to sway
      spin0: R(0, TAU),
      spinN: rnd() < 0.45 ? 0 : pick([-1, 1]) * RI(1, L.spinMax),     // full turns per loop
      rock: R(0.25, 0.7) * (rnd() < 0.5 ? -1 : 1),                    // rocking amplitude (rad)
      tilt: R(0, TAU),                                                // 3D flip axis
      flipN: RI(1, 3) * (rnd() < 0.5 ? -1 : 1), flipP: R(0, TAU),
      alpha: R(L.alpha[0], L.alpha[1]),
      scale: size / qsize,
      layer: L.name,
    });
  }
}

/* ---------- bokeh particles (never wrap; gentle periodic drift) ---------- */
const bokeh = [];
for (let i = 0; i < 70; i++) {
  bokeh.push({
    x: R(0, W), y: R(0, H),
    r: R(6, 46), ax: R(30, 140), ay: R(20, 90),
    kx: RI(1, 2), ky: RI(1, 3), px: R(0, TAU), py: R(0, TAU),
    tw: RI(1, 4), tp: R(0, TAU),
    a: R(0.05, 0.22),
    col: pick(['255,190,110', '255,150,80', '255,220,150', '255,120,90']),
  });
}
const bokehSprites = new Map();
function bokehSprite(r, col) {
  const key = Math.round(r) + col;
  if (bokehSprites.has(key)) return bokehSprites.get(key);
  const S = Math.ceil(r * 2.4);
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, r);
  gr.addColorStop(0, `rgba(${col},0.9)`);
  gr.addColorStop(0.7, `rgba(${col},0.55)`);
  gr.addColorStop(1, `rgba(${col},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, S, S);
  bokehSprites.set(key, c);
  return c;
}

/* ---------- cached background ---------- */
const bgCanvas = document.createElement('canvas'); bgCanvas.width = W; bgCanvas.height = H;
{
  const g = bgCanvas.getContext('2d');
  const base = g.createLinearGradient(0, 0, W * 0.3, H);
  base.addColorStop(0, '#0d0f18');
  base.addColorStop(0.5, '#0a0b12');
  base.addColorStop(1, '#0c0810');
  g.fillStyle = base; g.fillRect(0, 0, W, H);
  // deep warm glow (top-right) and cool glow (bottom-left)
  let gr = g.createRadialGradient(W * 0.82, H * 0.08, 0, W * 0.82, H * 0.08, W * 0.55);
  gr.addColorStop(0, 'rgba(120,70,30,0.32)'); gr.addColorStop(0.5, 'rgba(90,40,25,0.10)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  gr = g.createRadialGradient(W * 0.12, H * 0.95, 0, W * 0.12, H * 0.95, W * 0.5);
  gr.addColorStop(0, 'rgba(30,45,80,0.28)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  // vignette
  gr = g.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, W * 0.62);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.62)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
}

/* ---------- light rays ---------- */
const RAYS = [];
for (let i = 0; i < 7; i++) {
  RAYS.push({ ang: -0.35 - i * 0.12 + R(-0.03, 0.03), amp: R(0.015, 0.04), ph: R(0, TAU), ph2: R(0, TAU),
              k: RI(1, 2), a: R(0.025, 0.06), w0: R(30, 90), w1: R(180, 420) });
}

/* ---------- periodic helpers ---------- */
const wave = (k, t, p) => Math.sin(TAU * k * t / T + p);

/* ---------- frame ---------- */
function draw(t) {
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.drawImage(bgCanvas, 0, 0);

  // breathing ambient light (period 15 s)
  ctx.globalCompositeOperation = 'lighter';
  const breathe = 0.5 + 0.5 * wave(1, t, 0);
  let gr = ctx.createRadialGradient(W * 0.78 + 120 * wave(1, t, 1.2), H * 0.1, 0, W * 0.78, H * 0.1, W * 0.45);
  gr.addColorStop(0, `rgba(255,140,60,${0.06 + 0.05 * breathe})`);
  gr.addColorStop(1, 'rgba(255,140,60,0)');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);

  // soft volumetric light rays from the top-right (slow periodic sweep)
  ctx.save();
  ctx.translate(W * 0.86, -H * 0.15);
  for (let i = 0; i < RAYS.length; i++) {
    const ry = RAYS[i];
    const ang = ry.ang + ry.amp * wave(1, t, ry.ph);
    const al = ry.a * (0.55 + 0.45 * wave(ry.k, t, ry.ph2));
    ctx.save();
    ctx.rotate(ang);
    const lg = ctx.createLinearGradient(0, 0, 0, H * 2.2);
    lg.addColorStop(0, `rgba(255,170,90,${al})`);
    lg.addColorStop(0.55, `rgba(255,150,80,${al * 0.35})`);
    lg.addColorStop(1, 'rgba(255,150,80,0)');
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.moveTo(-ry.w0, 0); ctx.lineTo(ry.w0, 0); ctx.lineTo(ry.w1, H * 2.2); ctx.lineTo(-ry.w1, H * 2.2);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  // bokeh
  for (const b of bokeh) {
    const x = b.x + b.ax * wave(b.kx, t, b.px);
    const y = b.y + b.ay * wave(b.ky, t, b.py);
    const tw = 0.65 + 0.35 * wave(b.tw, t, b.tp);
    const s = bokehSprite(b.r, b.col);
    ctx.globalAlpha = b.a * tw;
    ctx.drawImage(s, x - s.width / 2, y - s.height / 2);
  }
  ctx.globalCompositeOperation = 'source-over';

  // global wind (coherent gust, periodic)
  const wind = 110 * wave(1, t, 0.6) + 45 * wave(2, t, 2.1) + 18 * wave(4, t, 0.3);

  for (const L of leaves) {
    // vertical position (wraps exactly nY times per loop) + flutter
    let y = (L.y0 + L.nY * L.Ly * t / T) % L.Ly;
    y = y - L.margin + L.fl * wave(L.kf, t, L.p2 + Math.PI / 2);
    // horizontal: slow drift + rocking sway + wind
    const sway = wave(L.k2, t, L.p2);
    const x = L.x0 + L.a1 * wave(1, t, L.p1) + L.a2 * sway + wind * (L.layer === 'near' ? 1.3 : L.layer === 'mid' ? 1 : 0.6);

    // rotation: continuous spin + rocking coupled to sway direction
    const spin = L.spin0 + TAU * L.spinN * t / T + L.rock * sway;
    // 3D tumble: flip around a tilted axis
    const flip = Math.cos(TAU * L.flipN * t / T + L.flipP);
    const sprite = flip >= 0 ? L.front : L.back;
    const sx = Math.max(Math.abs(flip), 0.06);
    // shading as the leaf turns edge-on
    const shade = 0.72 + 0.28 * Math.abs(flip);

    ctx.globalAlpha = L.alpha * shade;
    ctx.setTransform(1, 0, 0, 1, x, y);
    ctx.rotate(spin + L.tilt);
    ctx.scale(sx * L.scale, L.scale);
    ctx.rotate(-L.tilt);
    ctx.drawImage(sprite, -sprite.width / 2, -sprite.height / 2);
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
}

/* ---------- loop ---------- */
let t0 = null;
function frame(ts) {
  if (t0 === null) t0 = ts;
  const t = ((ts - t0) / 1000) % T;
  draw(t);
  requestAnimationFrame(frame);
}
draw(0);
requestAnimationFrame(frame);

// Deterministic seek for frame-by-frame renderers: window.seek(seconds)
window.seek = s => { draw(((s % T) + T) % T); };
window.LOOP_SECONDS = T;
})();
</script>
</body>
</html>
