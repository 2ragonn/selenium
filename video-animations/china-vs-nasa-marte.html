<script>
'use strict';
/* ==========================================================================

const W = 3840, H = 2160, CX = W / 2, CY = H / 2;
const cv = document.getElementById('c');
const c = cv.getContext('2d');

const NASA = '#3d8bff', NASA2 = '#7fe3ff', CN = '#ff2d46', GOLD = '#ffc53d', MARS = '#ff6a2b',

  mars:  { a: MARS,      b: MARS2,     n1: [1.0, .33, .12], n2: [.28, .06, .03], n3: [.025, .012, .01] },
  nasa:  { a: NASA,      b: NASA2,     n1: [.16, .45, 1.0], n2: [.03, .08, .26], n3: [.008, .012, .035] },
  china: { a: CN,        b: GOLD,      n1: [1.0, .16, .25], n2: [.25, .03, .05], n3: [.03, .008, .012] },
  space: { a: '#a08bff', b: MARS,      n1: [.42, .27, 1.0], n2: [.08, .05, .22], n3: [.012, .01, .03] },
  tech:  { a: '#2ef2ff', b: MARS,      n1: [.05, .75, .9],  n2: [.01, .14, .18], n3: [.006, .02, .028] },
  alert: { a: '#ff3b5c', b: GOLD,      n1: [1.0, .12, .26], n2: [.2, .015, .04], n3: [.03, .004, .01] },
  gold:  { a: GOLD,      b: MARS,      n1: [1.0, .62, .12], n2: [.24, .12, .02], n3: [.025, .016, .006] },
  vs:    { a: MARS,      b: GOLD,      n1: [1.0, .3, .2],   n2: [.06, .08, .3],  n3: [.02, .01, .02] },

/* ---------- math ---------- */
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const sg = (t, a, b) => clamp((t - a) / (b - a));
const E = {

  o3: t => 1 - Math.pow(1 - clamp(t), 3),
  o5: t => 1 - Math.pow(1 - clamp(t), 5),

const PI = Math.PI, TAU = PI * 2, D2R = PI / 180;
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

/* ---------- color ---------- */
const _hx = {};
function hx(h) { if (_hx[h]) return _hx[h]; const s = h.replace('#', ''); return (_hx[h] = [parseInt(s.substr(0, 2), 16), parseInt(s.substr(2, 2), 16), parseInt(s.substr(4, 2), 16)]); }
function A(h, a) { const v = hx(h); return 'rgba(' + v[0] + ',' + v[1] + ',' + v[2] + ',' + (+a).toFixed(3) + ')'; }
function mixc(h1, h2, t) { const a = hx(h1), b = hx(h2); return '#' + [0, 1, 2].map(i => Math.round(lerp(a[i], b[i], clamp(t))).toString(16).padStart(2, '0')).join(''); }

/* ---------- text ---------- */
function setF(o) {
  c.font = (o.w || '') + ' ' + (o.s || 100) + 'px ' + (o.f || FB);
  try { c.letterSpacing = (o.ls || 0) + 'px'; } catch (e) {}
}
function T(str, x, y, o) {
  o = o || {};
  c.save();
  setF(o);
  c.textAlign = o.a || 'left';
  c.textBaseline = o.b || 'alphabetic';
  if (o.al != null) c.globalAlpha *= clamp(o.al);
  if (o.g) { c.shadowColor = o.g; c.shadowBlur = o.gb || 40; }
  if (o.st) { c.lineWidth = o.sw || 4; c.strokeStyle = o.st; c.lineJoin = 'round'; c.strokeText(str, x, y); }
  if (o.c !== null) { c.fillStyle = o.c || WHITE; c.fillText(str, x, y); }
  c.restore();
}
function MW(str, o) { c.save(); setF(o); const w = c.measureText(str).width; c.restore(); return w; }
// fit font size so text width <= mw
function fit(str, o, mw) { const w = MW(str, o); return w > mw ? o.s * mw / w : o.s; }

/* Kinetic headline. lines: array of strings, *word* = highlight.
   o: s size, a align, lh, c, hc, st start, stg stagger, mw max width, hb highlight box, sk skew, f, ls */
function HL(lines, x, y, lt, o) {
  o = o || {};
  const f = o.f || FH;
  let s = o.s || 300;
  const mw = o.mw || W - 520;
  const base = { f, s, w: o.w, ls: o.ls || 0 };
  let maxw = 0;
  lines.forEach(ln => { const w = MW(ln.replace(/\*/g, ''), base); if (w > maxw) maxw = w; });
  if (maxw > mw) s = s * mw / maxw;
  const lh = s * (o.lh || 1.0);
  const sp = s * (o.sp || .22);
  let wi = 0;
  const st = o.st || 0, stg = o.stg != null ? o.stg : .06;
  c.save();
  setF({ f, s, w: o.w, ls: o.ls || 0 });
  c.textBaseline = 'alphabetic';
  const totalH = lh * lines.length;
  let y0 = o.vc ? y - totalH / 2 + s * .78 : y;
  lines.forEach((ln, li) => {
    const words = ln.split(' ').filter(w => w.length);
    const ws = words.map(w => { const hi = w.indexOf('*') >= 0; const t = w.replace(/\*/g, ''); return { t, hi, w: c.measureText(t).width }; });
    const tot = ws.reduce((a, b) => a + b.w, 0) + sp * (ws.length - 1);
    let cx = o.a === 'left' ? x : o.a === 'right' ? x - tot : x - tot / 2;
    const ly = y0 + li * lh;
    ws.forEach(w => {
      const t0 = st + wi * stg;
      const p = E.o5(sg(lt, t0, t0 + .5));
      if (p > 0) {
        c.save();
        c.beginPath(); c.rect(cx - s * .12, ly - s * 1.12, w.w + s * .24, s * 1.38); c.clip();
        const dy = (1 - p) * s * 1.15;
        if (w.hi && o.hb) {
          const bp = E.o5(sg(lt, t0 + .12, t0 + .5));
          c.fillStyle = o.hc || MARS;
          c.fillRect(cx - s * .08, ly - s * .9, (w.w + s * .16) * bp, s * 1.02);
          c.fillStyle = o.hbc || INK;

        if (w.hi && o.hg && !o.hb) { c.shadowColor = o.hc || MARS; c.shadowBlur = s * .25; }
        c.fillText(w.t, cx, ly + dy);
        c.restore();
      }
      cx += w.w + sp; wi++;
    });
  });

}
// typed mono label with bar
function KK(str, x, y, lt, col, o) {
  o = o || {};
  const d = o.d || .05;
  const p = sg(lt, d, d + (o.dur || .45));
  if (p <= 0) return;
  const n = Math.ceil(str.length * p);
  const s = o.s || 54;
  c.save();
  const align = o.a || 'left';
  if (align === 'left') {
    c.fillStyle = col; c.fillRect(x, y - s * .42, 80 * E.o3(p * 2), s * .16);
    T(str.slice(0, n) + (p < 1 && Math.floor(lt * 12) % 2 ? '▌' : ''), x + 110, y, { f: FM, w: 700, s, c: o.c || WHITE, ls: s * .18 });
  } else {
    const w = MW(str, { f: FM, w: 700, s, ls: s * .18 });
    T(str.slice(0, n), x - w / 2, y, { f: FM, w: 700, s, c: o.c || WHITE, ls: s * .18 });
    c.fillStyle = col; c.fillRect(x - w / 2 - 110, y - s * .42, 80 * E.o3(p * 2), s * .16);
    c.fillRect(x + w / 2 + 30, y - s * .42, 80 * E.o3(p * 2), s * .16);
  }
  c.restore();
}
function pill(str, x, y, col, o) {
  o = o || {};
  const s = o.s || 50;
  const w = MW(str, { f: FM, w: 800, s, ls: s * .14 }) + s * 1.3;
  const h = s * 1.7;
  const xx = o.a === 'center' ? x - w / 2 : o.a === 'right' ? x - w : x;
  c.save();
  if (o.al != null) c.globalAlpha *= o.al;
  rr(xx, y - h / 2, w, h, h / 2);
  if (o.fill) { c.fillStyle = col; c.fill(); }
  else { c.fillStyle = A(col, .14); c.fill(); c.lineWidth = 4; c.strokeStyle = col; c.stroke(); }
  T(str, xx + s * .65, y + s * .36, { f: FM, w: 800, s, c: o.fill ? INK : WHITE, ls: s * .14 });
  c.restore();
  return w;
}
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
// glass panel with corner ticks
function panel(x, y, w, h, col, o) {
  o = o || {};
  c.save();
  if (o.al != null) c.globalAlpha *= o.al;
  rr(x, y, w, h, o.r || 28);
  const g = c.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, A(o.bg || '#ffffff', o.ba != null ? o.ba : .07)); g.addColorStop(1, A(o.bg || '#ffffff', (o.ba != null ? o.ba : .07) * .3));
  c.fillStyle = g; c.fill();
  c.lineWidth = o.lw || 3; c.strokeStyle = A(col, o.sa != null ? o.sa : .55); c.stroke();
  const k = 50; c.lineWidth = 8; c.strokeStyle = col; c.lineCap = 'square';
  c.beginPath();
  c.moveTo(x, y + k); c.lineTo(x, y); c.lineTo(x + k, y);
  c.moveTo(x + w - k, y + h); c.lineTo(x + w, y + h); c.lineTo(x + w, y + h - k);
  c.stroke();
  c.restore();
}
// rotating dashed HUD ring
function ring(x, y, r, lt, col, o) {
  o = o || {};
  c.save();
  c.translate(x, y);
  c.globalAlpha *= o.al != null ? o.al : 1;
  c.rotate(lt * (o.sp || .25));
  c.strokeStyle = col; c.lineWidth = o.lw || 4;
  c.setLineDash(o.dash || [r * .06, r * .04]);
  c.beginPath(); c.arc(0, 0, r, 0, TAU * (o.p != null ? o.p : 1)); c.stroke();
  c.setLineDash([]);
  if (o.ticks) {
    for (let i = 0; i < 72; i++) {
      const a = i / 72 * TAU, l = i % 6 === 0 ? r * .06 : r * .025;
      c.globalAlpha = (o.al != null ? o.al : 1) * .7;
      c.beginPath(); c.moveTo(Math.cos(a) * (r + 18), Math.sin(a) * (r + 18)); c.lineTo(Math.cos(a) * (r + 18 + l), Math.sin(a) * (r + 18 + l)); c.stroke();
    }
  }

}
function glowDot(x, y, r, col, a) {
  c.save();
  c.globalCompositeOperation = 'lighter';
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, A(col, a != null ? a : 1)); g.addColorStop(.25, A(col, (a != null ? a : 1) * .45)); g.addColorStop(1, A(col, 0));

}
function line(x1, y1, x2, y2, col, lw, p) {
  p = p == null ? 1 : p;
  c.save(); c.strokeStyle = col; c.lineWidth = lw || 4; c.lineCap = 'round';
  c.beginPath(); c.moveTo(x1, y1); c.lineTo(lerp(x1, x2, p), lerp(y1, y2, p)); c.stroke(); c.restore();
}
// draws a path progressively (array of points)
function pathP(pts, p, col, lw, o) {
  o = o || {};
  if (p <= 0 || pts.length < 2) return null;
  let tot = 0; const L = [0];
  for (let i = 1; i < pts.length; i++) { tot += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); L.push(tot); }

  c.save(); c.strokeStyle = col; c.lineWidth = lw || 6; c.lineCap = 'round'; c.lineJoin = 'round';

  c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
  let end = pts[0];
  for (let i = 1; i < pts.length; i++) {
    if (L[i] <= tgt) { c.lineTo(pts[i][0], pts[i][1]); end = pts[i]; }
    else { const k = (tgt - L[i - 1]) / (L[i] - L[i - 1]); end = [lerp(pts[i - 1][0], pts[i][0], k), lerp(pts[i - 1][1], pts[i][1], k)]; c.lineTo(end[0], end[1]); break; }
  }

}
function bez(x1, y1, cx1, cy1, x2, y2, n) {
  const pts = []; n = n || 60;
  for (let i = 0; i <= n; i++) { const t = i / n, u = 1 - t; pts.push([u * u * x1 + 2 * u * t * cx1 + t * t * x2, u * u * y1 + 2 * u * t * cy1 + t * t * y2]); }
  return pts;
}
// speed lines radiating
function speedLines(lt, col, n, a, cx, cy) {
  c.save(); c.globalCompositeOperation = 'lighter';
  cx = cx == null ? CX : cx; cy = cy == null ? CY : cy;
  for (let i = 0; i < n; i++) {
    const ang = hash(i * 3.1) * TAU;
    const ph = (lt * (1.2 + hash(i) * 2) + hash(i * 7.7)) % 1;

  }

function grid(col, a, step, ox, oy) {
  c.save(); c.strokeStyle = A(col, a); c.lineWidth = 2;
  step = step || 160; ox = (ox || 0) % step; oy = (oy || 0) % step;
  c.beginPath();
  for (let x = ox; x < W; x += step) { c.moveTo(x, 0); c.lineTo(x, H); }
  for (let y = oy; y < H; y += step) { c.moveTo(0, y); c.lineTo(W, y); }
  c.stroke(); c.restore();

// big outlined echo word drifting behind
function echo(str, y, lt, col, o) {
  o = o || {};
  const s = o.s || 900;
  const w = MW(str, { f: FH, s }) + 200;
  const off = ((lt * (o.v || 260)) % w);
  c.save(); c.globalAlpha *= o.al || .12;
  for (let x = -off - w; x < W + w; x += w) T(str, x, y, { f: FH, s, c: null, st: col, sw: 5 });
  c.restore();

function fmtN(n, dec) { const s = (dec ? n.toFixed(dec) : Math.round(n).toString()); const [i, d] = s.split('.'); return i.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (d ? ',' + d : ''); }


/* ==========================================================================
   WebGL: planetas procedurales (Marte, Tierra con continentes reales, Luna,
   asteroide) + nebulosa de fondo. Se renderizan a un canvas oculto y se
   componen en el canvas 2D.
   ========================================================================== */
const GLS = 2048;
const gcv = document.createElement('canvas');
gcv.width = GLS; gcv.height = GLS;
let gl = null;
try { gl = gcv.getContext('webgl', { premultipliedAlpha: true, alpha: true, preserveDrawingBuffer: true, antialias: false }); } catch (e) { gl = null; }

const GLSL_NOISE = `
precision highp float;
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}

vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){

  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));

float fbm(vec3 p){float f=0.0,a=0.5;for(int i=0;i<6;i++){f+=a*snoise(p);p=p*2.03+vec3(1.7,9.2,3.1);a*=0.5;}return f;}

vec3 hash3(vec3 p){p=vec3(dot(p,vec3(127.1,311.7,74.7)),dot(p,vec3(269.5,183.3,246.1)),dot(p,vec3(113.5,271.9,124.6)));return fract(sin(p)*43758.5453);}
float crat(vec3 p,float dens){
  vec3 i=floor(p),f=fract(p); float res=0.0;
  for(int x=-1;x<=1;x++)for(int y=-1;y<=1;y++)for(int z=-1;z<=1;z++){

const KIND = { mars: 0, earth: 1, moon: 2, ast: 3 };
/* draw a planet centered at (x,y) radius R on the 2D canvas.
   o: rot, tilt, light [x,y,z], tint, tintA */
function planet(kind, x, y, R, o) {
  o = o || {};
  const k = KIND[kind];
  const glow = k <= 1 ? 1.32 : 1.04;            // room for atmosphere
  if (!gl) { planetFallback(kind, x, y, R, o); return; }
  const S = R * glow;
  // visible region in local coords (handles camera transforms)
  const m = c.getTransform();
  const sc = Math.hypot(m.a, m.b) || 1;
  const inv = m.inverse();
  const cs = [[0, 0], [W, 0], [0, H], [W, H]].map(([px, py]) => [inv.a * px + inv.c * py + inv.e, inv.b * px + inv.d * py + inv.f]);
  const vx0 = Math.min(...cs.map(q => q[0])), vx1 = Math.max(...cs.map(q => q[0]));
  const vy0 = Math.min(...cs.map(q => q[1])), vy1 = Math.max(...cs.map(q => q[1]));
  const x0 = Math.max(vx0, x - S), y0 = Math.max(vy0, y - S), x1 = Math.min(vx1, x + S), y1 = Math.min(vy1, y + S);
  if (x1 <= x0 || y1 <= y0) return;
  const rw = x1 - x0, rh = y1 - y0;

const STARS = [];

/* ---------------- VS split ---------------- */
TPL.vs = (lt, d, s, P) => {
  const p = E.o5(sg(lt, 0, .55));

  c.save();
  c.globalCompositeOperation = 'source-over';
  // left (NASA)
  c.beginPath(); c.moveTo(0, 0); c.lineTo(mid + sk - (1 - p) * W, 0); c.lineTo(mid - sk - (1 - p) * W, H); c.lineTo(0, H); c.closePath();
  let g = c.createLinearGradient(0, 0, mid, H); g.addColorStop(0, 'rgba(8,24,70,.92)'); g.addColorStop(1, 'rgba(30,90,255,.55)');
  c.fillStyle = g; c.fill();

/* ---------------- MARS globe ---------------- */
TPL.mars = (lt, d, s, P) => {
  const zin = s.zin ? lerp(.55, 1, E.o5(sg(lt, 0, 1.1))) : 1;
  const R = (s.R || 820) * (1 + lt * .03) * zin;
  const hasText = s.t || s.k;
  const px = s.px || (hasText ? 2500 : CX), py = s.py || CY + 40;
  const mk = s.mk ? MK[s.mk] : null;
  let rot, tilt;
  if (mk) {
    const r0 = s.from ? -(MK[s.from].lon * D2R) : -(mk.lon * D2R) + (s.r0 != null ? s.r0 : 1.1);
    rot = lerp(r0, -(mk.lon * D2R), E.io(sg(lt, 0, Math.min(d * .7, 1.8)))) + lt * .02;
    tilt = lerp(s.from ? MK[s.from].lat : mk.lat * .3, mk.lat, E.io(sg(lt, 0, 1.5))) * D2R * .85;
  } else { rot = (s.rot || 0) + lt * .2; tilt = s.tilt != null ? s.tilt : .3; }
  if (s.orb) orbiters(px, py, R, lt, 'back', s.orb);
  planet('mars', px, py, R, { rot, tilt, light: s.light || [-.6, .4, .7] });
  if (s.orb) orbiters(px, py, R, lt, 'front', s.orb);
  if (s.scan) {
    c.save(); c.beginPath(); c.arc(px, py, R, 0, TAU); c.clip();
    const sy = py - R + ((lt * .5) % 1) * 2 * R;
    const g = c.createLinearGradient(0, sy - 300, 0, sy);
    g.addColorStop(0, A(P.b, 0)); g.addColorStop(1, A(P.b, .35));
    c.fillStyle = g; c.fillRect(px - R, sy - 300, 2 * R, 300);
    c.strokeStyle = A(P.b, .9); c.lineWidth = 6; c.beginPath(); c.moveTo(px - R, sy); c.lineTo(px + R, sy); c.stroke();
    c.strokeStyle = A(P.b, .25); c.lineWidth = 2;
    for (let la = -60; la <= 60; la += 30) { c.beginPath(); let first = true; for (let lo = -180; lo <= 180; lo += 6) { const q = proj(la, lo, px, py, R, rot, tilt); if (q.z > 0) { if (first) { c.moveTo(q.x, q.y); first = false; } else c.lineTo(q.x, q.y); } else first = true; } c.stroke(); }
    for (let lo = -180; lo < 180; lo += 30) { c.beginPath(); let first = true; for (let la = -90; la <= 90; la += 6) { const q = proj(la, lo, px, py, R, rot, tilt); if (q.z > 0) { if (first) { c.moveTo(q.x, q.y); first = false; } else c.lineTo(q.x, q.y); } else first = true; } c.stroke(); }
    c.restore();
  }
  ring(px, py, R * 1.08, lt, P.a, { al: .3, ticks: true, sp: .08 });
  const keys = s.mks || (s.mk ? [s.mk] : []);
  keys.forEach((key, i) => {
    const m = MK[key];
    const q = proj(m.lat, m.lon, px, py, R, rot, tilt);
    if (q.z > .1) pin(q.x, q.y, m.col, lt - .45 - i * .25, s.nolab ? null : m.name, m.co, { dir: s.dir || (i % 2 ? -1 : 1) });
  });
  if (hasText) sideText(lt, s, P, { s: s.ts || 300, mw: px - R - 400 > 900 ? px - R - 400 : 1500 });
  if (s.big) {
    const p = E.back(sg(lt, .3, .8));
    T(s.big, px, py + R + 30, { f: FH, s: 260 * p, a: 'center', c: WHITE, g: P.a, gb: 60, al: clamp(p) });
  }
};

/* ---------------- ROVER on surface ---------------- */
TPL.rover = (lt, d, s, P) => {

  const enter = E.o5(sg(lt, 0, 1.1));
  const rx = sleep ? 2650 : lerp(4300, 2650, enter) + lt * 25;
  const ry = gy + 190;
  if (!sleep) {
    c.save();
    for (let i = 0; i < 26; i++) {
      const ph = (lt * 1.6 + hash(i)) % 1;
      const r = 40 + ph * 200;
      c.fillStyle = A('#d98a5a', .22 * (1 - ph));

  if (s.sub) subT(s.sub, 250, 1050, lt, { f: FM, w: 800, s: 74, ls: 12, c: s.subc || MARS2 });

/* ---------------- ORBIT diagram ---------------- */
TPL.orbit = (lt, d, s, P) => {
  const cx = s.cx || 2300, cy = CY + 120, ty = .42;
  const rE = 640, rM = 1000;
  glowDot(cx, cy, 700, '#ffb35a', .55); glowDot(cx, cy, 160, '#fff4d8', 1);
  c.save(); c.strokeStyle = A(NASA2, .35); c.lineWidth = 4; c.setLineDash([14, 14]);
  c.beginPath(); c.ellipse(cx, cy, rE, rE * ty, 0, 0, TAU); c.stroke();
  c.strokeStyle = A(MARS, .45); c.beginPath(); c.ellipse(cx, cy, rM, rM * ty, 0, 0, TAU); c.stroke(); c.setLineDash([]); c.restore();
  const tL = .35, tA = d * .85;
  const th0 = PI * .62;
  const wE = .5, wM = .27;
  const mode = s.mode || 'window';
  const missOff = mode === 'missed' ? 1.0 : 0;
  const thE = th0 + wE * (lt - tL);
  const thM = th0 + PI - wM * (tA - lt) + missOff;
  const P2 = (r, th) => [cx + Math.cos(th) * r, cy + Math.sin(th) * r * ty];
  const [ex, ey] = P2(rE, thE), [mx, my] = P2(rM, thM);
  // transfer arc
  const pts = [];
  for (let i = 0; i <= 80; i++) { const f = i / 80; const th = th0 + PI * f; const r = rE + (rM - rE) * (1 - Math.cos(PI * f)) / 2; pts.push(P2(r, th)); }
  const pp = E.io(sg(lt, tL, tA));
  if (mode !== 'static') {
    pathP(pts, 1, A(mode === 'missed' ? '#ff3b5c' : GOLD, .25), 6, { dash: [10, 18] });
    const end = pathP(pts, pp, mode === 'missed' ? '#ff3b5c' : GOLD, 10, { g: 30 });
    if (end) glowDot(end[0], end[1], 90, mode === 'missed' ? '#ff3b5c' : GOLD, 1);
    if (mode === 'missed' && pp >= 1) { const ep = pts[pts.length - 1]; c.save(); c.translate(ep[0], ep[1]); icon('x', 0, 0, 1.1, '#ff3b5c', lt); c.restore(); }
    if (mode === 'transfer' && end) { c.save(); capsule(end[0], end[1], .9, PI / 2 + .3); c.restore(); }
  }
  planet('earth', ex, ey, 92, { rot: lt * .5, time: lt });
  planet('mars', mx, my, 70, { rot: lt * .3 });
  T('TIERRA', ex, ey + 190, { f: FM, w: 800, s: 50, a: 'center', c: NASA2, ls: 10 });
  T('MARTE', mx, my + 170, { f: FM, w: 800, s: 50, a: 'center', c: MARS, ls: 10 });
  if (mode === 'window') {
    const a = sg(lt, tA - .2, tA + .2);
    if (a > 0) { line(ex, ey, mx, my, A(GOLD, .6 * a), 4); pill('VENTANA DE LANZAMIENTO', cx, cy - rM * ty - 160, GOLD, { a: 'center', s: 50, al: a }); }
  }
  if (mode === 'transfer') {
    const m = lerp(0, s.mo || 8, pp);
    panel(cx - 360, cy + rM * ty + 90, 720, 220, GOLD, { al: .9 });
    T(fmtN(m) + ' MESES', cx, cy + rM * ty + 240, { f: FH, s: 130, a: 'center', c: WHITE });
  }
  sideText(lt, s, P, { s: s.ts || 280, y: 520, mw: 1050 });
};

/* ---------------- TIMELINE ---------------- */

const SHOTS = [];
SCENES.forEach(([a, b, shots], si) => {
  const tw = shots.reduce((x, s) => x + (s.w || 1), 0);
  let t = a;
  shots.forEach((s, i) => {
    const d = (b - a) * (s.w || 1) / tw;
    SHOTS.push({ s, t0: t, d, scene: si + 1, i: SHOTS.length });
    t += d;
  });
});
const TOTAL = SCENES[SCENES.length - 1][1];

function shotAt(t) {
  let lo = 0, hi = SHOTS.length - 1;
  if (t <= SHOTS[0].t0) return 0;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (SHOTS[mid].t0 <= t) lo = mid; else hi = mid - 1; }
  return lo;
}
function chapterAt(t) { let n = CHAPTERS[0][1]; for (const c2 of CHAPTERS) if (t >= c2[0]) n = c2[1]; return n; }

// grain tile
const grainC = document.createElement('canvas'); grainC.width = grainC.height = 512;
(() => {
  const g = grainC.getContext('2d'), im = g.createImageData(512, 512);
  for (let i = 0; i < im.data.length; i += 4) { const v = Math.floor(hash(i * .37 + 1) * 255); im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }

})();
const grainPat = c.createPattern(grainC, 'repeat');

const errs = {};
function drawShot(sh, lt, t) {
  const s = sh.s;

  const fn = TPL[s.tp];
  if (!fn) return;
  try { fn(lt, sh.d, s, P); }
  catch (e) { if (!errs[s.tp]) { errs[s.tp] = 1; console.error('tpl ' + s.tp, e); } }
}

function transitionIn(sh, lt) {
  const type = sh.i === 0 ? 3 : Math.floor(hash(sh.i * 7.13) * 4);
  const P = PAL[sh.s.m || 'mars'];
  if (type === 0 && lt < .22) {           // flash
    c.fillStyle = 'rgba(255,248,240,' + (.75 * (1 - lt / .22)).toFixed(3) + ')'; c.fillRect(0, 0, W, H);
  } else if (type === 1 && lt < .32) {    // slanted panels leaving
    const p = E.i3(lt / .32);
    for (let k = 0; k < 5; k++) {
      const x = -600 + k * 960 + p * (W + 1600) * (1 + k * .08);
      c.fillStyle = k % 2 ? P.a : INK;
      c.beginPath(); c.moveTo(x, 0); c.lineTo(x + 900, 0); c.lineTo(x + 500, H); c.lineTo(x - 400, H); c.closePath(); c.fill();
    }
  } else if (type === 2 && lt < .28) {    // glitch slices
    const k = 1 - lt / .28;
    for (let i = 0; i < 10; i++) {
      const y = Math.floor(hash(i * 3.3 + Math.floor(lt * 60)) * H), h = 30 + hash(i * 7.7) * 160;
      const dx = (hash(i * 5.1 + Math.floor(lt * 60)) - .5) * 400 * k;
      c.drawImage(cv, 0, y, W, h, dx, y, W, h);
    }
    c.fillStyle = A(P.a, .15 * k); c.fillRect(0, 0, W, H);
  } else if (type === 3 && lt < .35) {    // iris from black
    const r = E.o3(lt / .35) * 2600;
    c.save(); c.fillStyle = '#000'; c.beginPath(); c.rect(0, 0, W, H); c.arc(CX, CY, Math.max(1, r), 0, TAU, true); c.fill(); c.restore();
  }
}
function transitionOut(sh, lt) {
  const next = SHOTS[sh.i + 1];
  if (!next) return;
  const rem = sh.d - lt;
  const type = Math.floor(hash(next.i * 7.13) * 4);
  const P = PAL[next.s.m || 'mars'];
  if (type === 1 && rem < .2) {           // panels entering
    const p = E.i3(1 - rem / .2);
    for (let k = 0; k < 5; k++) {
      const x = -600 + k * 960 - (1 - p) * (W + 1600) * (1 + k * .08);
      c.fillStyle = k % 2 ? P.a : INK;
      c.beginPath(); c.moveTo(x, 0); c.lineTo(x + 900, 0); c.lineTo(x + 500, H); c.lineTo(x - 400, H); c.closePath(); c.fill();
    }
  } else if (type === 0 && rem < .1) {
    c.fillStyle = 'rgba(255,248,240,' + (.6 * (1 - rem / .1)).toFixed(3) + ')'; c.fillRect(0, 0, W, H);
  }
}

function hud(t, sh) {
  c.save();
  const a = .85;
  // top-left
  c.fillStyle = A(MARS, a); c.beginPath(); c.arc(150, 136, 16, 0, TAU); c.fill();
  T('MARTE//2031', 190, 152, { f: FM, w: 800, s: 44, c: A(WHITE, a), ls: 10 });
  T('· ' + chapterAt(t), 210 + MW('MARTE//2031', { f: FM, w: 800, s: 44, ls: 10 }) + 30, 152, { f: FM, w: 700, s: 44, c: A(GOLD, a), ls: 10 });
  // top-right
  const rec = Math.floor(t * 2) % 2 === 0;
  if (rec) { c.fillStyle = '#ff3b5c'; c.beginPath(); c.arc(W - 520, 136, 14, 0, TAU); c.fill(); }
  const mm = Math.floor(t / 60), ss = Math.floor(t % 60), ff = Math.floor((t % 1) * 100);
  T('T+' + String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0') + '.' + String(ff).padStart(2, '0'), W - 140, 152, { f: FM, w: 700, s: 44, a: 'right', c: A(WHITE, a), ls: 6 });
  // corner brackets
  c.strokeStyle = A(WHITE, .35); c.lineWidth = 4;
  const m = 80, k = 70;
  c.beginPath();
  c.moveTo(m, m + k + 60); c.lineTo(m, m + 60); c.moveTo(W - m, H - m - k); c.lineTo(W - m, H - m); c.lineTo(W - m - k, H - m);
  c.moveTo(m, H - m - k); c.lineTo(m, H - m); c.lineTo(m + k, H - m);
  c.stroke();
  // progress
  const pw = W - 160;
  c.fillStyle = A(WHITE, .12); c.fillRect(80, H - 28, pw, 8);
  const g = c.createLinearGradient(80, 0, 80 + pw, 0); g.addColorStop(0, NASA); g.addColorStop(.5, MARS); g.addColorStop(1, CN);
  c.fillStyle = g; c.fillRect(80, H - 28, pw * clamp(t / TOTAL), 8);
  CHAPTERS.forEach(ch => { c.fillStyle = A(WHITE, .6); c.fillRect(80 + pw * ch[0] / TOTAL - 2, H - 40, 4, 32); });
  c.restore();
}

let lastMoodCol = null;
function render(t) {
  t = Math.max(0, Math.min(t, TOTAL - 1e-3));
  const si = shotAt(t), sh = SHOTS[si];
  const lt = t - sh.t0;
  const P = PAL[sh.s.m || 'mars'];
  const Pp = si > 0 ? PAL[SHOTS[si - 1].s.m || 'mars'] : P;
  const k = E.io(clamp(lt / .5));
  const mix3 = (a, b) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  c.fillStyle = '#000'; c.fillRect(0, 0, W, H);
  nebula(t, mix3(Pp.n1, P.n1), mix3(Pp.n2, P.n2), mix3(Pp.n3, P.n3), 1);
  const warp = lt < .3 ? (1 - lt / .3) * 1.2 : 0;
  stars(t, { warp, al: .9 });

  const punch = 1 + .14 * (1 - E.o5(clamp(lt / .45)));
  const push = 1 + .045 * (lt / sh.d);
  const rot = (hash(si * 3.7) - .5) * .02 * (lt / sh.d) + (1 - E.o5(clamp(lt / .45))) * (hash(si * 1.9) - .5) * .05;
  const dx = (hash(si * 9.1) - .5) * 60 * (lt / sh.d);
  c.save();
  c.translate(CX + dx, CY); c.rotate(rot); c.scale(punch * push, punch * push); c.translate(-CX, -CY);
  drawShot(sh, lt, t);
  c.restore();
  c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  if (sh.s.glitch && Math.floor(t * 12) % 3 === 0) {
    for (let i = 0; i < 6; i++) { const y = Math.floor(hash(i + Math.floor(t * 24)) * H), h = 20 + hash(i * 3) * 90; c.drawImage(cv, 0, y, W, h, (hash(i * 7 + Math.floor(t * 24)) - .5) * 120, y, W, h); }
  }
  transitionOut(sh, lt);
  transitionIn(sh, lt);
  // post: vignette + grain
  const vg = c.createRadialGradient(CX, CY, H * .45, CX, CY, W * .65);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)');
  c.fillStyle = vg; c.fillRect(0, 0, W, H);

  const fr = Math.floor(t * 30);
  c.translate(-(hash(fr) * 512), -(hash(fr + .5) * 512));

  c.restore();

}

  const st = document.getElementById('stage');
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  st.style.transform = s < 1 ? 'scale(' + s + ')' : 'none';
  st.style.left = s < 1 ? ((window.innerWidth - W * s) / 2) + 'px' : '0px';
  st.style.top = s < 1 ? ((window.innerHeight - H * s) / 2) + 'px' : '0px';
}
window.addEventListener('resize', fitStage); fitStage();

const params = new URLSearchParams(location.search);
const startOffset = parseFloat(params.get('t') || '0') || 0;
let manual = params.has('paused');
let t0 = null;
window.__renderAt = (t) => { manual = true; render(t); };
window.__duration = TOTAL;
function loop(now) {
  if (!manual) {
    if (t0 === null) t0 = now;
    const t = (now - t0) / 1000 + startOffset;
    render(Math.min(t, TOTAL - 1e-3));
  }
  requestAnimationFrame(loop);
}
render(startOffset);
requestAnimationFrame(loop);

</script>
</body>
